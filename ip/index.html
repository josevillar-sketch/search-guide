 class='ld' aria-hidden='true'><\/span><span class='pn'>10<\/span><\/span><span class='sb'>what it holds, when it comes, how to read it<\/span><\/button><\/li><li><button type='button' data-jump='17'><span class='rn'>3<\/span><span class='tt'><span class='tl'>A theme, then a question<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>14<\/span><\/span><span class='sb'>two texts, one link, your question<\/span><\/button><\/li><li><button type='button' data-jump='23'><span class='rn'>4<\/span><span class='tt'><span class='tl'>Research and the first checkpoint<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>19<\/span><\/span><span class='sb'>sources, the log, the talk<\/span><\/button><\/li><li><button type='button' data-jump='28'><span class='rn'>5<\/span><span class='tt'><span class='tl'>The outline and the second checkpoint<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>23<\/span><\/span><span class='sb'>argue, outline, explain it<\/span><\/button><\/li><\/ul><\/div><div class='num'>&middot; 1 &middot;<\/div><div class='shade'><\/div>", "label": "Contents"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Contents, continued<\/h3><div class='tochead'><span>FOLIO<\/span><span>PAGE<\/span><\/div><ul class='toc'><li><button type='button' data-jump='33'><span class='rn'>6<\/span><span class='tt'><span class='tl'>The written argument, row by row<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>27<\/span><\/span><span class='sb'>the rules, 48 points, Rows 1 to 4<\/span><\/button><\/li><li><button type='button' data-jump='40'><span class='rn'>7<\/span><span class='tt'><span class='tl'>Finish and submit the argument<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>33<\/span><\/span><span class='sb'>Rows 5 to 7, checks, final<\/span><\/button><\/li><li><button type='button' data-jump='46'><span class='rn'>8<\/span><span class='tt'><span class='tl'>Honest work<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>38<\/span><\/span><span class='sb'>credit, tools, what I sign<\/span><\/button><\/li><li><button type='button' data-jump='50'><span class='rn'>9<\/span><span class='tt'><span class='tl'>Your talk and two questions<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>41<\/span><\/span><span class='sb'>the rows, the defense, the day<\/span><\/button><\/li><li><button type='button' data-jump='55'><span class='rn'>10<\/span><span class='tt'><span class='tl'>When you get stuck<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>45<\/span><\/span><span class='sb'>the work, absences, your file<\/span><\/button><\/li><\/ul><div class='card2' style='margin-top:1.4cqw'><div class='k'>SIGNS IN THIS BOOK<\/div><div class='notes' style='margin-top:.6cqw'><div><svg class='ic sm' aria-hidden='true'><use href='#i-check'/><\/svg><p>strong, or allowed<\/p><\/div><div><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/><\/svg><p>weak, or not allowed<\/p><\/div><div><span class='marks'><i class='y'><\/i><i><\/i><\/span><p>a check passes, or does not<\/p><\/div><\/div><\/div><p class='small' style='margin-top:1cqw'>A dashed box: WAITING ON A ROOM 63 DECISION.<\/p><\/div><div class='num'>&middot; 2 &middot;<\/div><div class='shade'><\/div>", "label": "Contents"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h2>Your project in eight steps<\/h2><p class='small'>Do the steps in order. Tap a step to open its page.<\/p><div class='tochead'><span>STEP<\/span><span>PAGE<\/span><\/div><button type='button' class='gorow' data-jump='7'><span>1 Know the task, the rules, and the dates.<\/span><span class='gpn'>5<\/span><\/button><button type='button' class='gorow' data-jump='15'><span>2 Get the packet. Read it three times.<\/span><span class='gpn'>12<\/span><\/button><button type='button' class='gorow' data-jump='18'><span>3 Link two texts with one theme.<\/span><span class='gpn'>14<\/span><\/button><button type='button' class='gorow' data-jump='22'><span>4 Write one question of your own.<\/span><span class='gpn'>18<\/span><\/button><button type='button' class='gorow' data-jump='24'><span>5 Research. Log every source. Pass checkpoint 1.<\/span><span class='gpn'>19<\/span><\/button><button type='button' class='gorow' data-jump='30'><span>6 Outline your argument. Pass checkpoint 2.<\/span><span class='gpn'>24<\/span><\/button><button type='button' class='gorow' data-jump='34'><span>7 Write it row by row. Submit it as final.<\/span><span class='gpn'>27<\/span><\/button><button type='button' class='gorow' data-jump='51'><span>8 Present it. Answer two questions.<\/span><span class='gpn'>41<\/span><\/button><p class='small'>The examples in this book are made up. You find your own theme, question, and sources.<\/p><\/div><div class='num'>&middot; 3 &middot;<\/div><div class='shade'><\/div>", "label": "Start here"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Find it fast<\/h3><p class='small'>Tap your problem. The page opens.<\/p><div class='tochead'><span>I HAVE<\/span><span>PAGE<\/span><\/div><button type='button' class='gorow' data-jump='14'><span>A packet I have not seen yet.<\/span><span class='gpn'>11<\/span><\/button><button type='button' class='gorow' data-jump='15'><span>Seven texts and no idea where to start.<\/span><span class='gpn'>12<\/span><\/button><button type='button' class='gorow' data-jump='19'><span>Two texts that seem to share nothing.<\/span><span class='gpn'>15<\/span><\/button><button type='button' class='gorow' data-jump='22'><span>A question that is really two questions.<\/span><span class='gpn'>18<\/span><\/button><button type='button' class='gorow' data-jump='26'><span>A checkpoint this week.<\/span><span class='gpn'>21<\/span><\/button><button type='button' class='gorow' data-jump='29'><span>A draft that only summarizes.<\/span><span class='gpn'>23<\/span><\/button><button type='button' class='gorow' data-jump='36'><span>A packet text I mention only once.<\/span><span class='gpn'>29<\/span><\/button><button type='button' class='gorow' data-jump='44'><span>A paper ready to submit.<\/span><span class='gpn'>36<\/span><\/button><button type='button' class='gorow' data-jump='48'><span>A tool I want to use.<\/span><span class='gpn'>39<\/span><\/button><button type='button' class='gorow' data-jump='51'><span>A talk coming up.<\/span><span class='gpn'>41<\/span><\/button><button type='button' class='gorow' data-jump='57'><span>Days of school I will miss.<\/span><span class='gpn'>46<\/span><\/button><\/div><div class='num'>&middot; 4 &middot;<\/div><div class='shade'><\/div>", "label": "Find it fast"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>1<\/div><div class='ch-title'>The task, two runs<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-cal'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Say what the individual project asks, what is scored, when it is due, and what I can and cannot do.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>The individual project at a glance<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>5<\/span><\/li><li><span class='it'>What carries over from the team project<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>6<\/span><\/li><li><span class='it'>Practice run, real run<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>7<\/span><\/li><li><span class='it'>What I can do, and what I cannot<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>8<\/span><\/li><li><span class='it'>The dates<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>9<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-cal'/><\/svg>FOLIO 1<\/p><h2>The individual project at a glance<\/h2><p class='small'>This time you work alone. You find a theme that links two texts in a College Board packet, and ask your own question. Then you research, write, present, and defend.<\/p><table class='stages four tight'><thead><tr><th>PART<\/th><th>LENGTH<\/th><th>WHO SCORES IT<\/th><th>SCORE<\/th><\/tr><\/thead><tbody><tr><th>Individual Written Argument<\/th><td>2,000 words or fewer<\/td><td>the College Board<\/td><td>24.5 percent<\/td><\/tr><tr><th>Individual Multimedia Presentation<\/th><td>6 to 8 minutes<\/td><td>I do, for the College Board<\/td><td>7 percent<\/td><\/tr><tr><th>Oral Defense<\/th><td>two questions<\/td><td>I do, for the College Board<\/td><td>3.5 percent<\/td><\/tr><\/tbody><\/table><p class='small'>The task is 35 percent of your AP score. College Board rubrics call the parts the Individual Written Argument (IWA), the Individual Multimedia Presentation (IMP), and the Oral Defense (OD). Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 5 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>What carries over from the team project<\/h3><p class='small'>The Team Project still teaches these skills. This book adds what is new.<\/p><table class='stages checks tight'><thead><tr><th>SKILL<\/th><th>TEAM PROJECT<\/th><th>NEW IN THIS BOOK<\/th><\/tr><\/thead><tbody><tr><th>Perspectives<\/th><td>page 16<\/td><td>objections and limits: page <button type='button' class='pj' data-jump='38' aria-label='Go to page 31'>31<\/button><\/td><\/tr><tr><th>Checkpoint talk<\/th><td>pages 17 and 18<\/td><td>a second talk, on your outline: page <button type='button' class='pj' data-jump='31' aria-label='Go to page 25'>25<\/button><\/td><\/tr><tr><th>Citation<\/th><td>page 24<\/td><td>packet texts too: page <button type='button' class='pj' data-jump='34' aria-label='Go to page 27'>27<\/button><\/td><\/tr><tr><th>Submit as final<\/th><td>page 28<\/td><td>the Individual Written Argument: page <button type='button' class='pj' data-jump='45' aria-label='Go to page 37'>37<\/button><\/td><\/tr><\/tbody><\/table><div class='card2 good' style='margin-top:1.2cqw'><div class='k'>THE BIG CHANGE<\/div><p>Your report explained what experts say. Your written argument takes a position and defends it.<\/p><\/div><p class='small' style='margin-top:1cqw'>Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 6 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Practice run, real run<\/h3><table class='stages runs tight'><thead><tr><th><\/th><th>PRACTICE RUN<\/th><th>REAL RUN<\/th><\/tr><\/thead><tbody><tr><th>The packet<\/th><td>A past packet from AP Central.<\/td><td>The 2027 packet.<\/td><\/tr><tr><th>My help<\/th><td>See the dashed box.<\/td><td>Only what page <button type='button' class='pj' data-jump='10' aria-label='Go to page 8'>8<\/button> allows.<\/td><\/tr><tr><th>Where it goes<\/th><td>Google Classroom<\/td><td>The AP Digital Portfolio, as final<\/td><\/tr><\/tbody><\/table><p class='small'>The real run cannot start before January, when the College Board publishes the packet. Checked September 30, 2026.<\/p><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>NO REUSE<\/div><p>No practice text goes into your real paper. It has my help in it. Start a new Google Doc.<\/p><\/div><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>Whether we do a practice run, with which past packet, when, and how much I help: on Google Classroom.<\/p><\/div><\/div><div class='num'>&middot; 7 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>What I can do, and what I cannot<\/h3><table class='stages half tight'><thead><tr><th>I CAN<\/th><th>I CANNOT<\/th><\/tr><\/thead><tbody><tr><th>Tell you the dates and the rubrics.<\/th><td>Give you a question or sources.<\/td><\/tr><tr><th>Discuss the packet with the class.<\/th><td>Hand it out with no discussion.<\/td><\/tr><tr><th>Hold your checkpoints.<\/th><td>Tell you what to write or change.<\/td><\/tr><tr><th>Point to a rubric row.<\/th><td>Edit or proofread your paper.<\/td><\/tr><tr><th>Give you the defense questions list.<\/th><td>Tell you which two you will get.<\/td><\/tr><\/tbody><\/table><p class='small'>In the real run, the College Board sets these rules. This book is general help, not feedback on your work. Checked September 30, 2026.<\/p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP<\/div><p>In the real run, you ask me: &quot;Which two texts should I link?&quot; What can I say?<\/p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>I can talk about the packet with the whole class. I cannot choose your texts for you.<\/p><\/div><\/div><div class='num'>&middot; 8 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>The dates<\/h3><table class='stages dates tight'><thead><tr><th>WHEN<\/th><th>WHAT<\/th><\/tr><\/thead><tbody><tr><th>January 2027<\/th><td>The College Board releases the packet to teachers.<\/td><\/tr><tr><th>April 15, 2027<\/th><td>The College Board&#39;s recommended finish.<\/td><\/tr><tr><th>April 30, 2027<\/th><td>The last moment to submit your written argument as final: 11:59 in the evening, Eastern Time.<\/td><\/tr><tr><th>May 10, 2027<\/th><td>The last moment for me to enter talk scores and sign that your work is yours. The exam is the same day.<\/td><\/tr><\/tbody><\/table><p class='small'>Dates can move. The newest Google Classroom post wins. Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>The day you get the packet, your checkpoint dates, and my due date for your paper: on Google Classroom. Your own talk: March 17 to April 15, 2027.<\/p><\/div><p class='small' style='margin-top:1cqw'>Team project dates: The Team Project, page 8. The exam: The End-of-Course Exam.<\/p><\/div><div class='num'>&middot; 9 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 1"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>2<\/div><div class='ch-title'>The packet<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-book'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Say what the packet holds, when you get it, and how to read it for links.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>What the packet is<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>10<\/span><\/li><li><span class='it'>When it comes, and how you get it<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>11<\/span><\/li><li><span class='it'>Read it three times<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>12<\/span><\/li><li><span class='it'>This year&#39;s packet only<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>13<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-book'/><\/svg>FOLIO 2<\/p><h2>What the packet is<\/h2><p class='small'>Each year the College Board releases one set of texts on one theme, from many perspectives: the stimulus materials. In this book: the packet, and its stimulus texts.<\/p><table class='stages rules tight'><thead><tr><th>KIND<\/th><th>FOR EXAMPLE<\/th><\/tr><\/thead><tbody><tr><th>Many fields<\/th><td>science, social science, the arts, languages, history, literature<\/td><\/tr><tr><th>Pictures and data<\/th><td>a photograph, artwork, video, or music, and numbers<\/td><\/tr><\/tbody><\/table><p class='small'>No rule fixes how many texts. The 2024, 2025, and 2026 packets each held seven. In 2026: a study of coffee shops in city life, a Surgeon General chapter on social connection, a magazine article on roads, an essay by Haruki Murakami, a news story on the Berlin Wall, a column about a ballpark, and a study of satellite internet.<\/p><p class='small'>Chief Readers named the 2024 theme courage, and the 2025 theme memory and nostalgia. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 10 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>When it comes, and how you get it<\/h3><p class='small'>The College Board releases the packet to teachers in January. I choose the day you get it.<\/p><figure class='plate'><div class='pl'><span>PLATE I<\/span><span>Thirty school days, then the talks<\/span><\/div><svg class='fig' viewBox='0 0 320 72' role='img' aria-label='A bar read left to right. First, packet day, a dashed box: Room 63 picks it. Then at least 30 school days to research, write, and build your talk. Testing days, breaks, and holidays do not count. Then all work is collected. Then the talks.'><text x='31' y='15' font-family='Space Mono,Courier New,monospace' font-size='5.8' font-weight='700' fill='#9c3322' text-anchor='middle'>ROOM 63 PICKS<\/text><rect x='4' y='20' width='54' height='30' rx='3' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.2' stroke-dasharray='3 2'/><text x='31' y='33' font-family='Space Mono,Courier New,monospace' font-size='6.8' font-weight='700' fill='#9c3322' text-anchor='middle'>PACKET<\/text><text x='31' y='43' font-family='Space Mono,Courier New,monospace' font-size='6.8' font-weight='700' fill='#9c3322' text-anchor='middle'>DAY<\/text><rect x='62' y='20' width='150' height='30' rx='3' fill='#f6edd6' stroke='#1f3a5a' stroke-width='1.2'/><text x='137' y='32' font-family='Space Mono,Courier New,monospace' font-size='6.8' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AT LEAST 30 SCHOOL DAYS<\/text><text x='137' y='44' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>research, write, build your talk<\/text><rect x='216' y='20' width='46' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='239' y='33' font-family='Space Mono,Courier New,monospace' font-size='6.2' font-weight='700' fill='#1f3a5a' text-anchor='middle'>ALL WORK<\/text><text x='239' y='43' font-family='Space Mono,Courier New,monospace' font-size='6.2' font-weight='700' fill='#1f3a5a' text-anchor='middle'>COLLECTED<\/text><rect x='266' y='20' width='50' height='30' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.4'/><text x='291' y='33' font-family='Space Mono,Courier New,monospace' font-size='6.8' font-weight='700' fill='#e8c878' text-anchor='middle'>THE<\/text><text x='291' y='43' font-family='Space Mono,Courier New,monospace' font-size='6.8' font-weight='700' fill='#e8c878' text-anchor='middle'>TALKS<\/text><path d='M62 54 L62 58 L212 58 L212 54' fill='none' stroke='#9c3322' stroke-width='1'/><text x='137' y='68' font-family='Patrick Hand,cursive' font-size='10' font-weight='400' fill='#9c3322' text-anchor='middle'>no testing days, breaks, or holidays<\/text><\/svg><figcaption><b>COLLEGE BOARD RULES<\/b>At least 30 school days, then the talks.<\/figcaption><\/figure><p class='small'>We meet every other school day, so 30 school days is about 15 of our classes.<\/p><p class='small'>To get it: AP Digital Portfolio, Overview, under Individual Research-Based Essay and Presentation. Tap Download. Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>The day you get the packet: on Google Classroom.<\/p><\/div><\/div><div class='num'>&middot; 11 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Read it three times<\/h3><p class='small'>The College Board&#39;s first step: read the texts to find links between them, and questions worth asking. A Room 63 way to do it:<\/p><table class='stages narrow1 tight'><thead><tr><th>READ<\/th><th>ASK<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td>What does each text say? One line each, in your log.<\/td><\/tr><tr><th>2<\/th><td>What does it argue, and from what view? A view with its reason.<\/td><\/tr><tr><th>3<\/th><td>Which two texts talk to each other? About what?<\/td><\/tr><\/tbody><\/table><p class='small'>Log each text like any source (The Research Log, page 30). Cite each one like any other source (The Research Manual, page 67).<\/p><p class='small'>We discuss the packet in class first. The College Board asks that of me. Checked September 30, 2026.<\/p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP<\/div><p>One text is a photograph. Do you read it?<\/p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Yes. Ask what it shows, who made it, and when. It is a text like the others.<\/p><\/div><\/div><div class='num'>&middot; 12 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>This year&#39;s packet only<\/h3><p class='small'>Your paper must use this year&#39;s packet.<\/p><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>OLD PACKET<\/div><p>The 2025 scoring guidelines told readers to treat a paper that cites only an earlier packet as off-topic. An off-topic paper earns 0 points.<\/p><\/div><p class='small' style='margin-top:1cqw'>In 2025 the Chief Reader listed papers built on a previous year&#39;s packet as a weakness.<\/p><p class='small'>Past packets are good practice. <a href='https://apcentral.collegeboard.org/courses/ap-seminar/exam/past-exam-questions' target='_blank' rel='noopener'>AP Central<\/a> posts recent ones with their scoring guidelines.<\/p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP<\/div><p>Your friend&#39;s 2026 paper linked two strong texts. Can you use the same link?<\/p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>No. Your theme must link two texts from the 2027 packet.<\/p><\/div><p class='small' style='margin-top:1cqw'>Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 13 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 2"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>3<\/div><div class='ch-title'>A theme, then a question<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-link'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Find a theme that links two stimulus texts, and turn it into one question of your own.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>A theme, not a topic<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>14<\/span><\/li><li><span class='it'>Find the links<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>15<\/span><\/li><li><span class='it'>Strong link, weak link<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>16<\/span><\/li><li><span class='it'>Your question is yours<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>17<\/span><\/li><li><span class='it'>From a theme to a question<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>18<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 3"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-link'/><\/svg>FOLIO 3<\/p><h2>A theme, not a topic<\/h2><table class='stages rules tight'><thead><tr><th><\/th><th>IT IS<\/th><\/tr><\/thead><tbody><tr><th>Topic<\/th><td>What one text is about. Bus waits. A ballpark.<\/td><\/tr><tr><th>Theme<\/th><td>An idea two or more texts share. Who a public place is for.<\/td><\/tr><\/tbody><\/table><p class='small'>The College Board rule: your question must relate to a theme that connects at least two of the stimulus texts.<\/p><p class='small'>The packet has one big theme. You do not have to use it. In 2025, strong papers found themes rooted in two or more texts, even outside the packet&#39;s theme. Pick one you care about, rich enough for a real argument. Checked September 30, 2026.<\/p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; THEME<\/div><p><em lang='es' class='esw'>tema en com&uacute;n<\/em> &middot; An idea that two or more texts share.<\/p><\/div><\/div><div class='num'>&middot; 14 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 3"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Find the links<\/h3><p class='small'>Draw a line between any two texts. Name what they share in four words or fewer.<\/p><figure class='plate'><div class='pl'><span>PLATE II<\/span><span>One packet, many links<\/span><\/div><svg class='fig' viewBox='0 0 320 152' role='img' aria-label='A made-up packet of six texts. A, an essay: Ortiz, Who Is the Bench For? B, a photograph of a library with a CLOSED sign. C, a chart of park visits by hour. D, a poem about a grandmother&#39;s kitchen. E, a study of how long bus riders wait. F, a speech about a new highway. Three links: A and E, who public space is for. B and D, places that hold memory. C and F, who a city is built for.'><rect x='8' y='10' width='96' height='36' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='14' y='21' font-family='Space Mono,Courier New,monospace' font-size='6.4' font-weight='700' fill='#1f3a5a' text-anchor='start'>A &#183; ESSAY<\/text><text x='14' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>Ortiz,<\/text><text x='14' y='41' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>Who Is the Bench For?<\/text><rect x='112' y='10' width='96' height='36' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='118' y='21' font-family='Space Mono,Courier New,monospace' font-size='6.4' font-weight='700' fill='#1f3a5a' text-anchor='start'>B &#183; PHOTOGRAPH<\/text><text x='118' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>a library with a<\/text><text x='118' y='41' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>CLOSED sign<\/text><rect x='216' y='10' width='96' height='36' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='222' y='21' font-family='Space Mono,Courier New,monospace' font-size='6.4' font-weight='700' fill='#1f3a5a' text-anchor='start'>C &#183; CHART<\/text><text x='222' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>park visits<\/text><text x='222' y='41' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>by hour<\/text><rect x='8' y='112' width='96' height='36' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='14' y='123' font-family='Space Mono,Courier New,monospace' font-size='6.4' font-weight='700' fill='#1f3a5a' text-anchor='start'>E &#183; STUDY<\/text><text x='14' y='134' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>how long<\/text><text x='14' y='143' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>bus riders wait<\/text><rect x='112' y='112' width='96' height='36' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='118' y='123' font-family='Space Mono,Courier New,monospace' font-size='6.4' font-weight='700' fill='#1f3a5a' text-anchor='start'>D &#183; POEM<\/text><text x='118' y='134' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>a grandmother&#39;s<\/text><text x='118' y='143' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>kitchen<\/text><rect x='216' y='112' width='96' height='36' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='222' y='123' font-family='Space Mono,Courier New,monospace' font-size='6.4' font-weight='700' fill='#1f3a5a' text-anchor='start'>F &#183; SPEECH<\/text><text x='222' y='134' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>a new<\/text><text x='222' y='143' font-family='Cormorant Garamond,Georgia,serif' font-size='8.8' font-weight='600' fill='#4a3f31' text-anchor='start'>highway<\/text><path d='M56 46 L56 62' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M56 96 L56 112' fill='none' stroke='#9c3322' stroke-width='1.4'/><circle cx='56' cy='46' r='2.2' fill='#9c3322'/><circle cx='56' cy='112' r='2.2' fill='#9c3322'/><text x='56' y='76' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>who public<\/text><text x='56' y='89' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>space is for<\/text><path d='M160 46 L160 62' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M160 96 L160 112' fill='none' stroke='#9c3322' stroke-width='1.4'/><circle cx='160' cy='46' r='2.2' fill='#9c3322'/><circle cx='160' cy='112' r='2.2' fill='#9c3322'/><text x='160' y='76' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>places that<\/text><text x='160' y='89' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>hold memory<\/text><path d='M264 46 L264 62' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M264 96 L264 112' fill='none' stroke='#9c3322' stroke-width='1.4'/><circle cx='264' cy='46' r='2.2' fill='#9c3322'/><circle cx='264' cy='112' r='2.2' fill='#9c3322'/><text x='264' y='76' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>who a city<\/text><text x='264' y='89' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>is built for<\/text><\/svg><figcaption><b>A MADE-UP PACKET<\/b>Six texts, three links. Each line names what two texts share.<\/figcaption><\/figure><p class='small'>Start with the obvious link. Then look for one that is harder to see. A text can join more than one link. Checked September 30, 2026.<\/p><p class='small'>This made-up packet is off limits for your paper.<\/p><\/div><div class='num'>&middot; 15 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 3"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Strong link, weak link<\/h3><table class='stages wide1 tight'><thead><tr><th>WEAK IN 2025<\/th><th>WHAT GOES WRONG<\/th><\/tr><\/thead><tbody><tr><th>A topic only one text covers<\/th><td>No theme connects two texts.<\/td><\/tr><tr><th>A topic one text already argues<\/th><td>Your paper turns into a summary.<\/td><\/tr><\/tbody><\/table><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>WEAK, A MADE-UP CASE<\/div><p>&quot;Text E times bus waits. My question: how long do riders wait?&quot;<\/p><\/div><div class='card2 good' style='margin-top:.8cqw'><div class='k'>STRONG, A MADE-UP CASE<\/div><p>&quot;Texts A and E both ask who a public space serves. My question asks it about one county&#39;s bus stops.&quot;<\/p><\/div><p class='small' style='margin-top:1cqw'>Readers lean toward scoring. If they can find any link to a theme from two texts, they score the paper. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 16 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 3"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Your question is yours<\/h3><table class='stages rules tight'><thead><tr><th>RULE<\/th><th>WHAT IT SAYS<\/th><\/tr><\/thead><tbody><tr><th>College Board<\/th><td>&quot;Compose a research question of your own.&quot; I may not assign, give, or write one for you.<\/td><\/tr><tr><th>A tool that writes<\/th><td>Not acceptable: &quot;using AI to generate a research question,&quot; taken &quot;uncritically,&quot; &quot;without engaging with the actual research.&quot;<\/td><\/tr><tr><th>Room 63<\/th><td>No tool writes, rewrites, or narrows your question (The Field Guide, page 4).<\/td><\/tr><\/tbody><\/table><p class='small'>Everyone reads the same packet. The question you ask of it is yours.<\/p><p class='small'>The College Board bans reusing a paper, even one you wrote (page <button type='button' class='pj' data-jump='47' aria-label='Go to page 38'>38<\/button>). Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>Using your team project&#39;s issue, sources, or lens in this paper: my rule posts on Google Classroom.<\/p><\/div><\/div><div class='num'>&middot; 17 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 3"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>From a theme to a question<\/h3><p class='small'>Narrow the theme to one place and one time. A real example from the 2025 Chief Reader:<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>TOO BROAD<\/div><p>&quot;Why are memories important?&quot;<\/p><\/div><div class='card2 good' style='margin-top:.8cqw'><div class='k'>FOCUSED<\/div><p>&quot;How is nostalgia leveraged in the US to influence consumer behavior?&quot;<\/p><\/div><table class='stages wide1 tight' style='margin-top:1.2cqw'><thead><tr><th>BROKEN<\/th><th>THE REPAIR<\/th><\/tr><\/thead><tbody><tr><th>Two questions in one<\/th><td>Keep one.<\/td><\/tr><tr><th>No place or time<\/th><td>Add both.<\/td><\/tr><tr><th>Closed: a yes, or a fact<\/th><td>Ask how, or to what extent.<\/td><\/tr><tr><th>No one is affected<\/th><td>Say who is, and why now.<\/td><\/tr><\/tbody><\/table><p class='small'>A good question is open, relevant, debatable, and researchable. Test yours: The Field Guide, page 20. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 18 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 3"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>4<\/div><div class='ch-title'>Research and the first checkpoint<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-search'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Research beyond the packet, log every source, and pass the first checkpoint talk.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>Research beyond the packet<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>19<\/span><\/li><li><span class='it'>Your log, and a question that changes<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>20<\/span><\/li><li><span class='it'>Three checkpoints<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>21<\/span><\/li><li><span class='it'>The first checkpoint talk<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>22<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 4"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-search'/><\/svg>FOLIO 4<\/p><h2>Research beyond the packet<\/h2><p class='small'>Find more sources, from a range of perspectives. Include scholarly work. EBSCO and Turnitin come free through the AP Digital Portfolio.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>WEAK IN 2025<\/div><p>Mostly news, blogs, or encyclopedias. One or two sources for a whole paper. Sources read only to the abstract.<\/p><\/div><table class='stages wide1 tight' style='margin-top:1.2cqw'><thead><tr><th>TO DO THIS<\/th><th>GO TO<\/th><\/tr><\/thead><tbody><tr><th>Find the other views<\/th><td>The Research Manual, page 25<\/td><\/tr><tr><th>Check a source<\/th><td>The Research Manual, page 44<\/td><\/tr><tr><th>Scholarly or popular?<\/th><td>The Research Manual, page 46<\/td><\/tr><\/tbody><\/table><p class='small'>Same skill, first time: The Team Project, page 15. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 19 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 4"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Your log, and a question that changes<\/h3><p class='small'>For checkpoint 1, the College Board asks for a log of the sources you found and read, with notes and links. Your log is your Research Log. Every source goes in, even the ones you drop (The Research Log, page 33).<\/p><p class='small'>Your question will change. The College Board expects you to keep refining it. Each time, write a version line (The Research Log, page 46). Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>Before the talk, photograph your log pages into the Google Classroom assignment. The notebook stays with you.<\/p><\/div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP<\/div><p>Your question changed twice. What do you bring?<\/p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The log, with both version lines. They show your thinking.<\/p><\/div><\/div><div class='num'>&middot; 20 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 4"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Three checkpoints<\/h3><p class='small'>A checkpoint is a short talk with me that shows your thinking. The College Board requires them.<\/p><figure class='plate'><div class='pl'><span>PLATE III<\/span><span>Three checkpoints, one paper<\/span><\/div><svg class='fig' viewBox='0 0 320 102' role='img' aria-label='Three checkpoints on one line. 1, sources and process: while you research, your log, then a talk. Missed: 0. 2, argument outline: as you start writing, your outline, then a talk. Missed: 0. 3, final paper: after you submit, I read it, then sign. No signature: 0.'><path d='M14 20 L300 20' fill='none' stroke='#1f3a5a' stroke-width='1.2'/><path d='M302.0 17.4 L306.0 20.0 L302.0 22.6' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linejoin='round'/><path d='M300 20 L306 20' fill='none' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='56' cy='20' r='11' fill='#9c3322' stroke='#1f3a5a' stroke-width='1.4'/><text x='56' y='24' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fff8ea' text-anchor='middle'>1<\/text><text x='56' y='46' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SOURCES AND<\/text><text x='56' y='55' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='middle'>PROCESS<\/text><text x='56' y='69' font-family='Cormorant Garamond,Georgia,serif' font-size='9.4' font-weight='600' fill='#4a3f31' text-anchor='middle'>while you research<\/text><text x='56' y='81' font-family='Cormorant Garamond,Georgia,serif' font-size='9.4' font-weight='600' fill='#4a3f31' text-anchor='middle'>your log, then a talk<\/text><text x='56' y='97' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#9c3322' text-anchor='middle'>missed: 0<\/text><circle cx='160' cy='20' r='11' fill='#9c3322' stroke='#1f3a5a' stroke-width='1.4'/><text x='160' y='24' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fff8ea' text-anchor='middle'>2<\/text><text x='160' y='46' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='middle'>ARGUMENT<\/text><text x='160' y='55' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='middle'>OUTLINE<\/text><text x='160' y='69' font-family='Cormorant Garamond,Georgia,serif' font-size='9.4' font-weight='600' fill='#4a3f31' text-anchor='middle'>as you start writing<\/text><text x='160' y='81' font-family='Cormorant Garamond,Georgia,serif' font-size='9.4' font-weight='600' fill='#4a3f31' text-anchor='middle'>your outline, a talk<\/text><text x='160' y='97' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#9c3322' text-anchor='middle'>missed: 0<\/text><circle cx='264' cy='20' r='11' fill='#16294a' stroke='#b8903f' stroke-width='1.4'/><text x='264' y='24' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#e8c878' text-anchor='middle'>3<\/text><text x='264' y='46' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='middle'>FINAL<\/text><text x='264' y='55' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='middle'>PAPER<\/text><text x='264' y='69' font-family='Cormorant Garamond,Georgia,serif' font-size='9.4' font-weight='600' fill='#4a3f31' text-anchor='middle'>after you submit<\/text><text x='264' y='81' font-family='Cormorant Garamond,Georgia,serif' font-size='9.4' font-weight='600' fill='#4a3f31' text-anchor='middle'>I read it, then sign<\/text><text x='264' y='97' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#9c3322' text-anchor='middle'>no signature: 0<\/text><\/svg><figcaption><b>IN THE AP DIGITAL PORTFOLIO<\/b>Checkpoint 1, Sources and Process. Checkpoint 2, Argument Outline. Checkpoint 3, Final Review of Paper.<\/figcaption><\/figure><div class='card2 weak' style='margin-top:.4cqw'><div class='k'>REQUIRED<\/div><p>Miss a checkpoint, and your written argument scores 0. I must sign for checkpoints 1 and 2, or it gets no score.<\/p><\/div><p class='small' style='margin-top:1cqw'>Checkpoint dates post on Google Classroom ahead of time. They do not move for an absence. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 21 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 4"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>The first checkpoint talk<\/h3><p class='small'>A short talk with me, alone, while you research. You show your thinking and choices.<\/p><table class='stages wide2 tight'><thead><tr><th>I ASK ABOUT<\/th><th>FOR EXAMPLE<\/th><\/tr><\/thead><tbody><tr><th>Your process<\/th><td>How did you search?<\/td><\/tr><tr><th>Your question<\/th><td>How has it changed?<\/td><\/tr><tr><th>Your sources<\/th><td>Which helps most, and why?<\/td><\/tr><tr><th>Their perspectives<\/th><td>What does this one argue?<\/td><\/tr><\/tbody><\/table><div class='card2 good' style='margin-top:1.2cqw'><div class='k'>YOU PASS WHEN<\/div><p>You say more than the log says: a detail, a reason, a choice.<\/p><\/div><p class='small' style='margin-top:1cqw'>Not yet? You redo it, with a new log and a new talk. If I think a tool did your reading, we talk about that first.<\/p><p class='small'>The same talk as the team project: The Team Project, page 18. What it sounds like: The AI Manual, page 25. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 22 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 4"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>5<\/div><div class='ch-title'>The outline and the second checkpoint<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-steps'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Turn your research into an argument, outline it, and explain your choices in a talk of about two minutes.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>An argument, not a report<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>23<\/span><\/li><li><span class='it'>Build the outline<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>24<\/span><\/li><li><span class='it'>The outline talk<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>25<\/span><\/li><li><span class='it'>What the outline talk sounds like<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>26<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-steps'/><\/svg>FOLIO 5<\/p><h2>An argument, not a report<\/h2><p class='small'>Your report explained. Your written argument argues: it takes a position and defends it.<\/p><table class='stages narrow1 tight'><thead><tr><th>ROW<\/th><th>THE PAPER MUST<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td>Use at least one packet text inside the argument.<\/td><\/tr><tr><th>2<\/th><td>Show why your question matters, in a larger context.<\/td><\/tr><tr><th>3<\/th><td>Weigh other views: objections, limits, effects.<\/td><\/tr><tr><th>4<\/th><td>Link claims and evidence to a clear conclusion.<\/td><\/tr><tr><th>5<\/th><td>Use credible evidence, some of it scholarly.<\/td><\/tr><tr><th>6<\/th><td>Cite every source, packet texts too.<\/td><\/tr><tr><th>7<\/th><td>Write clearly, for an academic reader.<\/td><\/tr><\/tbody><\/table><p class='small'>A claim someone could dispute: Writing the Paper, page 10. The parts of an argument: Writing the Paper, page 11. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 23 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Build the outline<\/h3><p class='small'>I decide the outline&#39;s form: written, or drawn as a diagram. It shows how your ideas connect, why each section is there, and why you chose each piece of evidence and each view.<\/p><table class='stages narrow1 tight'><thead><tr><th><\/th><th>A MADE-UP OUTLINE<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td>Why it matters: the question, its place and time.<\/td><\/tr><tr><th>2<\/th><td>Claim A, its evidence, and a packet text.<\/td><\/tr><tr><th>3<\/th><td>Claim B and its evidence.<\/td><\/tr><tr><th>4<\/th><td>An objection, and your answer.<\/td><\/tr><tr><th>5<\/th><td>Your conclusion or solution, and its limit.<\/td><\/tr><\/tbody><\/table><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>NOT ALLOWED<\/div><p>A tool that writes your outline. A tool may give general tips on how essays are built.<\/p><\/div><p class='small' style='margin-top:1cqw'>Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>The outline&#39;s form in Room 63, and where it goes: on Google Classroom.<\/p><\/div><\/div><div class='num'>&middot; 24 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>The outline talk<\/h3><p class='small'>Checkpoint 2 is for the written argument only. You explain how your ideas connect, why these sections, and why this evidence.<\/p><figure class='plate'><div class='pl'><span>PLATE IV<\/span><span>Two minutes on your outline<\/span><\/div><svg class='fig' viewBox='0 0 320 90' role='img' aria-label='Four steps. 1, hand in your outline, on the day. 2, explain it, about 2 minutes, your choices. 3, answer my follow-up questions. 4, pass: you explain some choices. A dashed arrow loops from step 4 back to step 1: not yet? A new outline and a new talk.'><rect x='2' y='8' width='70' height='50' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><circle cx='13' cy='20' r='6' fill='#9c3322'/><text x='13' y='23.3' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='700' fill='#fff8ea' text-anchor='middle'>1<\/text><text x='22' y='23' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='start'>HAND IN<\/text><text x='37' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='middle'>your outline,<\/text><text x='37' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='middle'>on the day<\/text><rect x='84' y='8' width='70' height='50' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><circle cx='95' cy='20' r='6' fill='#9c3322'/><text x='95' y='23.3' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='700' fill='#fff8ea' text-anchor='middle'>2<\/text><text x='104' y='23' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='start'>EXPLAIN<\/text><text x='119' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='middle'>about 2 minutes:<\/text><text x='119' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='middle'>your choices<\/text><rect x='166' y='8' width='70' height='50' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><circle cx='177' cy='20' r='6' fill='#9c3322'/><text x='177' y='23.3' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='700' fill='#fff8ea' text-anchor='middle'>3<\/text><text x='186' y='23' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#1f3a5a' text-anchor='start'>ANSWER<\/text><text x='201' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='middle'>my follow-up<\/text><text x='201' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='middle'>questions<\/text><rect x='248' y='8' width='70' height='50' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.3'/><circle cx='259' cy='20' r='6' fill='#9c3322'/><text x='259' y='23.3' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='700' fill='#fff8ea' text-anchor='middle'>4<\/text><text x='268' y='23' font-family='Space Mono,Courier New,monospace' font-size='6.6' font-weight='700' fill='#e8c878' text-anchor='start'>PASS<\/text><text x='283' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#f3e3bd' text-anchor='middle'>you explain<\/text><text x='283' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#f3e3bd' text-anchor='middle'>some choices<\/text><path d='M73 33 L82 33' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M79.0 30.4 L83.0 33.0 L79.0 35.6' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linejoin='round'/><path d='M155 33 L164 33' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M161.0 30.4 L165.0 33.0 L161.0 35.6' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linejoin='round'/><path d='M237 33 L246 33' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M243.0 30.4 L247.0 33.0 L243.0 35.6' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linejoin='round'/><path d='M283 58 L283 70 L37 70 L37 61' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-dasharray='4 3'/><path d='M34.4 63.0 L37.0 59.0 L39.6 63.0' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linejoin='round'/><text x='160' y='84' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#9c3322' text-anchor='middle'>not yet? a new outline and a new talk<\/text><\/svg><figcaption><b>REQUIRED<\/b>Miss it, and your written argument scores 0.<\/figcaption><\/figure><p class='small'>You pass when you explain some of your choices about structure or content. If I think a tool made your outline, we talk about that before you redo it. Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>Your outline talk date: on Google Classroom.<\/p><\/div><\/div><div class='num'>&middot; 25 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>What the outline talk sounds like<\/h3><p class='small'>Say why, not only what. Name a choice and its reason.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>WEAK, A MADE-UP CASE<\/div><p>&quot;First I talk about benches. Then I talk about buses. Then I conclude.&quot;<\/p><\/div><div class='card2 good' style='margin-top:.8cqw'><div class='k'>STRONG, A MADE-UP CASE<\/div><p>&quot;I open with the wait-time study, because it shows who uses the stop. The objection comes after my strongest evidence, so I can answer it.&quot;<\/p><\/div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP<\/div><p>I ask: &quot;Why is this packet text in section 2?&quot; You say: &quot;We had to use one.&quot; Weak or strong?<\/p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Weak. Say what it does: it gives context, or it is evidence for a claim.<\/p><\/div><p class='small' style='margin-top:1cqw'>Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 26 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 5"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>6<\/div><div class='ch-title'>The written argument, row by row<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-pen'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Write an argument that follows the rules and earns the first four rows.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>The rules and the shape<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>27<\/span><\/li><li><span class='it'>Where the 48 points are<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>28<\/span><\/li><li><span class='it'>Row 1: a packet text, used<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>29<\/span><\/li><li><span class='it'>Row 2: why your question matters<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>30<\/span><\/li><li><span class='it'>Row 3: views in conversation<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>31<\/span><\/li><li><span class='it'>Row 4: your argument<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>32<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/><\/svg>FOLIO 6<\/p><h2>The rules and the shape<\/h2><table class='stages rules tight'><thead><tr><th>RULE<\/th><th>WHAT IT MEANS<\/th><\/tr><\/thead><tbody><tr><th>2,000 words or fewer<\/th><td>Titles, sub-headings, and citations in your sentences count. Your list of sources, footnote citations, and words in figures or tables do not.<\/td><\/tr><tr><th>No names<\/th><td>Take out your name, your school, and my name.<\/td><\/tr><tr><th>Every source cited<\/th><td>Packet texts too, in your sentences and in a list at the end.<\/td><\/tr><tr><th>One style<\/th><td>Any style, used the same way (The Research Manual, page 59).<\/td><\/tr><tr><th>A PDF<\/th><td>Google Docs: File, then Download, then PDF Document.<\/td><\/tr><\/tbody><\/table><p class='small'>A paper with no link to a theme from two packet texts is off-topic. It earns 0 points. Your report&#39;s rules: The Team Project, page 19. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 27 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Where the 48 points are<\/h3><p class='small'>Readers score each row on its own. Rows 1 and 2 are all or nothing: 0 or 5.<\/p><figure class='plate'><div class='pl'><span>PLATE V<\/span><span>Seven rows, 48 points<\/span><\/div><svg class='fig' viewBox='0 0 320 146' role='img' aria-label='Seven bars, one per row. Each bar is as long as the row&#39;s top score. The dark part is the 2025 national average. Row 1, packet text: 3.02 of 5. Row 2, context: 3.27 of 5. Row 3, perspective: 5.22 of 9. Row 4, argument: 7.09 of 12. Row 5, evidence: 5.52 of 9. Row 6, citation: 3.11 of 5. Row 7, grammar and style: 2.11 of 3. Overall 29.35 of 48. Rows 3 and 4 are the lowest for their size.'><text x='4' y='13' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#1f3a5a' text-anchor='start'>1 PACKET TEXT<\/text><rect x='92' y='4' width='65.0' height='12' rx=
