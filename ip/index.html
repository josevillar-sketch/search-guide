<\/text><rect x='92' y='76' width='117.0' height='12' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='93.2' y='77.2' width='70.6' height='9.6' rx='1.5' fill='#1f3a5a' stroke='none' stroke-width='0'/><text x='214.0' y='85' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#4a3f31' text-anchor='start'>5.52 of 9<\/text><text x='4' y='103' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#1f3a5a' text-anchor='start'>6 CITATION<\/text><rect x='92' y='94' width='65.0' height='12' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='93.2' y='95.2' width='39.2' height='9.6' rx='1.5' fill='#1f3a5a' stroke='none' stroke-width='0'/><text x='162.0' y='103' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#4a3f31' text-anchor='start'>3.11 of 5<\/text><text x='4' y='121' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#1f3a5a' text-anchor='start'>7 GRAMMAR, STYLE<\/text><rect x='92' y='112' width='39.0' height='12' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='93.2' y='113.2' width='26.2' height='9.6' rx='1.5' fill='#1f3a5a' stroke='none' stroke-width='0'/><text x='136.0' y='121' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#4a3f31' text-anchor='start'>2.11 of 3<\/text><path d='M290 42 C298 42 300 50 300 58 C300 66 298 74 290 74' fill='none' stroke='#9c3322' stroke-width='1.2'/><text x='316' y='140' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='end'>lowest for their size<\/text><path d='M300 60 L306 128' fill='none' stroke='#9c3322' stroke-width='1' stroke-dasharray='2 2'/><text x='4' y='140' font-family='Space Mono,Courier New,monospace' font-size='7' font-weight='700' fill='#9c3322' text-anchor='start'>OVERALL 29.35 OF 48<\/text><\/svg><figcaption><b>2025 NATIONAL AVERAGE<\/b>The dark part of each bar. The whole bar is the top score.<\/figcaption><\/figure><p class='small'>In 2025, Rows 3 and 4 had the lowest averages for their size.<\/p><p class='small'>From the <a href='https://apcentral.collegeboard.org/media/pdf/ap26-sg-seminar-pt2.pdf' target='_blank' rel='noopener'>2026 scoring guidelines<\/a>, the newest posted. The 2027 guidelines come out after the exam. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 28 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Row 1: a packet text, used<\/h3><p class='rowq'><span class='rown'>ROW 1<\/span>&quot;Understand and Analyze Context&quot; &middot; 0 or 5 points<\/p><p class='small'>Readers ask: does a packet text do work in your argument? One text, used well, is enough. It scores 0 if the text gets one sentence, or if you could delete it and lose nothing.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>WEAK, A MADE-UP CASE<\/div><p>&quot;As Ortiz once wrote, benches matter. Now, on to my topic.&quot;<\/p><\/div><div class='card2 good' style='margin-top:.8cqw'><div class='k'>STRONG, A MADE-UP CASE<\/div><p>&quot;Ortiz argues that a bench serves riders first. The wait-time study tests her claim: most riders at these stops wait only minutes.&quot;<\/p><\/div><p class='small' style='margin-top:1cqw'>Weak in 2025: a packet text as a forced jumping-off point, a quote out of context, or a fact any source could give. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 29 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Row 2: why your question matters<\/h3><p class='rowq'><span class='rown'>ROW 2<\/span>&quot;Understand and Analyze Context&quot; &middot; 0 or 5 points<\/p><p class='small'>A 5 explains why your question matters by placing it in a larger context. It is narrow enough to show how complex the problem is. The College Board&#39;s example: water pollution in India. It makes a specific case for why the question is urgent.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>WEAK, A MADE-UP CASE<\/div><p>&quot;Public space is important to everyone.&quot;<\/p><\/div><div class='card2 good' style='margin-top:.8cqw'><div class='k'>STRONG, A MADE-UP CASE<\/div><p>&quot;The county is choosing now which stops keep benches. Riders over 65 use those seats most. Who a stop serves is being decided this year.&quot;<\/p><\/div><p class='small' style='margin-top:1cqw'>Test it: finish &quot;so that readers understand ___&quot; (The Field Guide, page 22). Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 30 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Row 3: views in conversation<\/h3><p class='rowq'><span class='rown'>ROW 3<\/span>&quot;Understand and Analyze Perspective&quot; &middot; 0, 6, or 9 points<\/p><p class='small'>A 9 weighs several views and joins them: links between them, objections, effects, and limits. Tie each view to its source, every time. Readers need clear attribution to score high.<\/p><table class='stages wide2 tight'><thead><tr><th>CHECK<\/th><th>ASK<\/th><\/tr><\/thead><tbody><tr><th>Objection<\/th><td>Who disagrees, and why?<\/td><\/tr><tr><th>Limit<\/th><td>Where does this view stop being true?<\/td><\/tr><tr><th>Effect<\/th><td>If it is right, what follows?<\/td><\/tr><\/tbody><\/table><p class='small'>Boxes or dialogue: The Team Project, page 23. Checked September 30, 2026.<\/p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER<\/div><p>Your paper gives a view and a source that disagrees. What is missing for a 9?<\/p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Weigh them. Say where each is right, where it stops, and what follows.<\/p><\/div><\/div><div class='num'>&middot; 31 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Row 4: your argument<\/h3><p class='rowq'><span class='rown'>ROW 4<\/span>&quot;Establish Argument&quot; &middot; 0, 8, or 12 points<\/p><p class='small'>A 12 is a clear, convincing argument. It is logically organized, and it connects claims and evidence to a plausible conclusion that answers your question. It is driven by your own voice: your comments on the evidence. A paper that only summarizes earns 0.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>WEAK, A MADE-UP CASE<\/div><p>&quot;Ortiz says benches serve riders. The study says waits are short. The shelter group says people need rest.&quot;<\/p><\/div><div class='card2 good' style='margin-top:.8cqw'><div class='k'>STRONG, A MADE-UP CASE<\/div><p>&quot;Short waits weaken Ortiz&#39;s claim. If riders sit for minutes, one bench can serve riders and people who need rest. The county should keep its benches open.&quot;<\/p><\/div><p class='small' style='margin-top:1cqw'>Claim, reason, evidence: Writing the Paper, pages 11 and 12. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 32 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 6"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>7<\/div><div class='ch-title'>Finish and submit the argument<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-check'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Earn Rows 5 to 7, check your draft, and submit your written argument as final.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>Row 5: evidence you can trust<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>33<\/span><\/li><li><span class='it'>Rows 6 and 7: credit and clear writing<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>34<\/span><\/li><li><span class='it'>Score your own draft<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>35<\/span><\/li><li><span class='it'>Before you submit<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>36<\/span><\/li><li><span class='it'>Submit it as final<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>37<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-check'/><\/svg>FOLIO 7<\/p><h2>Row 5: evidence you can trust<\/h2><p class='rowq'><span class='rown'>ROW 5<\/span>&quot;Select and Use Evidence&quot; &middot; 0, 6, or 9 points<\/p><p class='small'>A 9 has relevant, credible, and enough evidence to support your argument. It scores 0 if no source beyond the packet is well vetted. Encyclopedias and dictionaries do not count.<\/p><p class='small'>For each key source, say why it is credible and why it fits (The Team Project, page 22).<\/p><table class='stages wide1 tight'><thead><tr><th>TO DO THIS<\/th><th>GO TO<\/th><\/tr><\/thead><tbody><tr><th>One number, four questions<\/th><td>The Research Manual, page 42<\/td><\/tr><tr><th>Scholarly or popular?<\/th><td>The Research Manual, page 46<\/td><\/tr><\/tbody><\/table><p class='small'>Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 33 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Rows 6 and 7: credit and clear writing<\/h3><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>ROW 6 &middot; &quot;APPLY CONVENTIONS&quot;: CITATION &middot; 0, 3, OR 5<\/div><p class='note2'>A 5 credits every source accurately, in your sentences or in footnotes. Your list uses one style throughout.<\/p><p class='note2'>No list, or citations missing from most of your sentences: 0.<\/p><p class='note2'>A tool may draft your list from sources you read. Check every entry (The Research Manual, page 63). Never cite a source you did not read.<\/p><\/div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>ROW 7 &middot; &quot;APPLY CONVENTIONS&quot;: GRAMMAR AND STYLE &middot; 0, 2, OR 3<\/div><p class='note2'>Readers score your sentences, not the ones you quote. A few errors are allowed. Clear beats fancy.<\/p><p class='note2'>Cut, then punctuate: Writing the Paper, page 20.<\/p><\/div><p class='small' style='margin-top:1cqw'>Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 34 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Score your own draft<\/h3><p class='small'>Before peer review, find each row&#39;s move.<\/p><div class='form' data-form='ipdraft'><div class='fhead'><span>MY DRAFT<\/span><span>TAP WHAT IS TRUE<\/span><\/div><p class='tierlab'>ROWS 1 TO 7<\/p><button type='button' class='tick' aria-pressed='false' aria-label='1 A packet text works inside my argument.'><span class='bx' aria-hidden='true'><\/span>1 A packet text works inside my argument.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='2 Why my question matters, and to whom.'><span class='bx' aria-hidden='true'><\/span>2 Why my question matters, and to whom.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='3 Views weighed, each tied to its source.'><span class='bx' aria-hidden='true'><\/span>3 Views weighed, each tied to its source.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='4 My claims lead to my conclusion.'><span class='bx' aria-hidden='true'><\/span>4 My claims lead to my conclusion.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='5 Scholarly sources beyond the packet.'><span class='bx' aria-hidden='true'><\/span>5 Scholarly sources beyond the packet.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='6 Every citation is on my list.'><span class='bx' aria-hidden='true'><\/span>6 Every citation is on my list.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='7 Every sentence clear.'><span class='bx' aria-hidden='true'><\/span>7 Every sentence clear.<\/button><svg class='passstamp' viewBox='0 0 150 50' aria-hidden='true'><rect x='3' y='3' width='144' height='44' rx='7' fill='none' stroke='#1f5c4a' stroke-width='3'/><rect x='8' y='8' width='134' height='34' rx='4' fill='none' stroke='#1f5c4a' stroke-width='1.4'/><text x='75' y='33' text-anchor='middle' font-family='Space Mono,monospace' font-weight='700' font-size='21' letter-spacing='4' fill='#1f5c4a'>CHECKED<\/text><\/svg><span class='live srt' aria-live='polite'><\/span><\/div><p class='small'>Peer review: The Team Project, page 26. The words stay yours. Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>Your peer readers: on Google Classroom.<\/p><\/div><\/div><div class='num'>&middot; 35 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Before you submit<\/h3><div class='form' data-form='ipsubmit'><div class='fhead'><span>MY PAPER<\/span><span>TAP WHAT IS TRUE<\/span><\/div><p class='tierlab'>SIX CHECKS<\/p><button type='button' class='tick' aria-pressed='false' aria-label='2,000 words or fewer, the list not counted.'><span class='bx' aria-hidden='true'><\/span>2,000 words or fewer, the list not counted.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='No name, school, or teacher, even in the header.'><span class='bx' aria-hidden='true'><\/span>No name, school, or teacher, even in the header.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='Every source is on my list, packet texts too.'><span class='bx' aria-hidden='true'><\/span>Every source is on my list, packet texts too.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='Closed-tools test: yes (The Research Log, page 60).'><span class='bx' aria-hidden='true'><\/span>Closed-tools test: yes (The Research Log, page 60).<\/button><button type='button' class='tick' aria-pressed='false' aria-label='Run Originality, View Originality, wording fixed.'><span class='bx' aria-hidden='true'><\/span>Run Originality, View Originality, wording fixed.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='Saved as a PDF file.'><span class='bx' aria-hidden='true'><\/span>Saved as a PDF file.<\/button><svg class='passstamp' viewBox='0 0 150 50' aria-hidden='true'><rect x='3' y='3' width='144' height='44' rx='7' fill='none' stroke='#1f5c4a' stroke-width='3'/><rect x='8' y='8' width='134' height='34' rx='4' fill='none' stroke='#1f5c4a' stroke-width='1.4'/><text x='75' y='33' text-anchor='middle' font-family='Space Mono,monospace' font-weight='700' font-size='21' letter-spacing='4' fill='#1f5c4a'>CHECKED<\/text><\/svg><span class='live srt' aria-live='polite'><\/span><\/div><p class='small'>I read your final paper next to your checkpoints and your usual writing. Turnitin gives me a tool-writing report you do not see.<\/p><p class='small'>Button names: College Board student guide, Summer 2026, not yet checked on a Room 63 iPad. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 36 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Submit it as final<\/h3><table class='stages narrow1 tight'><thead><tr><th>STEP<\/th><th>DO THIS<\/th><\/tr><\/thead><tbody><tr><th>1<\/th><td>Follow your report&#39;s steps: The Team Project, page 28. Choose Individual Written Argument.<\/td><\/tr><tr><th>2<\/th><td>Only your latest upload is sent. A draft is never scored.<\/td><\/tr><tr><th>3<\/th><td>Check that the status says Submitted.<\/td><\/tr><\/tbody><\/table><p class='small'>After final, it cannot change. Only I can send it back, and only for a wrong, broken, or unreadable file, never for quality. Then you submit it as final again.<\/p><p class='small'>Last moment: April 30, 2027, 11:59 in the evening, Eastern Time. Upload early. The last night is slow. Every paper and slide deck is collected before anyone presents. Never post your paper online. Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>My due date for your paper: on Google Classroom. It comes before the first talk.<\/p><\/div><\/div><div class='num'>&middot; 37 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 7"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>8<\/div><div class='ch-title'>Honest work<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-sign'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Credit every source, invent nothing, use tools only where the College Board allows, and know what I sign.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>Credit every source, invent nothing<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>38<\/span><\/li><li><span class='it'>Tools that write, stage by stage<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>39<\/span><\/li><li><span class='it'>Turnitin, and what I sign<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>40<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 8"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-sign'/><\/svg>FOLIO 8<\/p><h2>Credit every source, invent nothing<\/h2><table class='stages wide1 tight'><thead><tr><th>BROKEN RULE<\/th><th>WHAT IT COSTS<\/th><\/tr><\/thead><tbody><tr><th>A source with no credit<\/th><td>0 on that part of the task<\/td><\/tr><tr><th>Made-up evidence, data, sources, or authors<\/th><td>0 on that part of the task<\/td><\/tr><tr><th>A paper used again, even your own<\/th><td>Not allowed<\/td><\/tr><\/tbody><\/table><p class='small'>Your own voice should be clear. Other people&#39;s ideas are credited. Practice papers get uploaded by mistake: open your file before you submit.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>NEVER POST IT<\/div><p>Work posted online can be copied. If it is, both students are flagged for plagiarism.<\/p><\/div><p class='small' style='margin-top:1cqw'>The rules: <a href='https://apcentral.collegeboard.org/courses/resources/ap-capstone-policies' target='_blank' rel='noopener'>AP Capstone policies<\/a>. What a zero costs: The AI Manual, page 24. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 38 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 8"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Tools that write, stage by stage<\/h3><p class='small'>Tools are optional. Your paper must be your own work. Tools that write include chatbots and many writing helpers.<\/p><table class='stages checks tight'><thead><tr><th>STAGE<\/th><th>ALLOWED<\/th><th>NOT ALLOWED<\/th><\/tr><\/thead><tbody><tr><th>Explore<\/th><td>What people debate<\/td><td>Its question or thesis, used uncritically<\/td><\/tr><tr><th>Find sources<\/th><td>Names to find and read<\/td><td>Its list, unread<\/td><\/tr><tr><th>Read<\/th><td>Help with a hard passage<\/td><td>Its summary instead<\/td><\/tr><tr><th>Join sources<\/th><td>Nothing<\/td><td>Any comparing<\/td><\/tr><tr><th>Outline, draft<\/th><td>General tips on structure<\/td><td>Any outline or text<\/td><\/tr><tr><th>Revise<\/th><td>Grammar and tone tips<\/td><td>Its new sentences<\/td><\/tr><\/tbody><\/table><p class='small'>The policy names four uses (The AI Manual, page 6). Its stage table allows a little more. Room 63 adds: no tool writes, rewrites, or narrows your question (The Field Guide, page 4). Citations: page <button type='button' class='pj' data-jump='42' aria-label='Go to page 34'>34<\/button>. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 39 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 8"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Turnitin, and what I sign<\/h3><p class='small'>The College Board runs every final paper through Turnitin, for copying and for text a tool wrote. You may run Originality yourself first. You see the originality report. Only I see the tool-writing report.<\/p><p class='small'>Checkpoint 3: after you submit, I read your paper. Is it like your usual writing? Like what I saw at your checkpoints? Is its tool-writing score low? The College Board warns that this score may not be accurate, and should never be the only reason.<\/p><p class='small'>Then I sign that it is yours, by May 10, 2027. No signature: your written argument scores 0. Checked September 30, 2026.<\/p><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>IF I CANNOT SIGN<\/div><p>I file a report. The College Board may ask for your drafts and notes. Keep your log, your outline, and your Google Doc&#39;s version history.<\/p><\/div><\/div><div class='num'>&middot; 40 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 8"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>9<\/div><div class='ch-title'>Your talk and two questions<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-podium'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Turn your written argument into a 6 to 8 minute talk, and answer two questions with specific evidence.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>Your talk at a glance<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>41<\/span><\/li><li><span class='it'>What earns points in the talk<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>42<\/span><\/li><li><span class='it'>The defense: two questions<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>43<\/span><\/li><li><span class='it'>The day<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>44<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-podium'/><\/svg>FOLIO 9<\/p><h2>Your talk at a glance<\/h2><p class='small'>Your talk presents the argument and conclusions of your written argument, in 6 to 8 minutes, for educated people who are not experts.<\/p><p class='small'>Only the first 8 minutes are scored. The questions come after and do not count toward the 8. It is live, never recorded ahead. Nothing is uploaded for it.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>NO PAPER, NO SCORE<\/div><p>No written argument, no score for your talk or its questions.<\/p><\/div><p class='small' style='margin-top:1cqw'>The talk shows why your question matters, links your research to the packet, credits your evidence out loud or on a slide, and offers a conclusion or solution with its effects.<\/p><p class='small'>Build it: Presenting and Defending, Folios 2 to 6. Your own talk: six cards, about 7 minutes (Presenting and Defending, page 14). Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 41 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>What earns points in the talk<\/h3><table class='stages wide2 tight'><thead><tr><th>ROW<\/th><th>WHAT EARNS POINTS<\/th><\/tr><\/thead><tbody><tr><th>1 Context<\/th><td>Why your question matters, and its link to the packet.<\/td><\/tr><tr><th>2 Argument<\/th><td>An argument. A summary earns 2.<\/td><\/tr><tr><th>3 Evidence<\/th><td>Evidence from several perspectives, joined together.<\/td><\/tr><tr><th>4 Conclusion<\/th><td>A detailed, realistic conclusion or solution, with its limits and effects.<\/td><\/tr><tr><th>5 Design<\/th><td>Slides for the audience, not your essay pasted in.<\/td><\/tr><tr><th>6 Delivery<\/th><td>Eyes, voice, movement, and energy that carry the argument.<\/td><\/tr><\/tbody><\/table><p class='small'>36 points, each row 0, 2, 4, or 6. Above 2 on Row 1 needs a link to the packet. One conclusion or solution is enough.<\/p><p class='small'>Tools may give tips and first ideas. They may not make your key points, visuals, or order, or write a script. In plain words: Presenting and Defending, page 9. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 42 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>The defense: two questions<\/h3><p class='small'>Right after your talk, I ask two questions, one from each list. I may add a follow-up so you can explain more.<\/p><table class='stages wide2 tight'><thead><tr><th>LIST<\/th><th>FOR EXAMPLE<\/th><\/tr><\/thead><tbody><tr><th>1 Your process<\/th><td>How did your question change?<\/td><\/tr><tr><th>2 Your argument<\/th><td>What do your findings mean for your community?<\/td><\/tr><\/tbody><\/table><p class='small'>I can give you the whole list. I cannot tell you your two. Be ready for every one.<\/p><p class='small'>12 points: two rows, each 0, 2, 4, or 6. The top is a detailed answer with specific evidence. Only repeating your talk, or missing the question, is a 2. The defense does not change your talk score.<\/p><div class='card2 weak' style='margin-top:.8cqw'><div class='k'>NO TOOL<\/div><p>No tool may write answers for you to practice or memorize.<\/p><\/div><p class='small' style='margin-top:1cqw'>Every question: Presenting and Defending, page 35. A strong answer: Presenting and Defending, page 36. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 43 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>The day<\/h3><p class='small'>Every paper and slide deck is collected before anyone presents. You present that version.<\/p><p class='small'>I video record every talk and defense, and keep the video at least one school year.<\/p><p class='small'>I score your talk and your defense. I cannot tell you your scores. The College Board does not allow it. Checked September 30, 2026.<\/p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION<\/div><p>Your own talk: March 17 to April 15, 2027. Your day and time: on Google Classroom. Audience: your class, in Room 63. Absent on your day? The next open slot in the same week.<\/p><\/div><p class='small' style='margin-top:1cqw'>The day before: Presenting and Defending, page 43.<\/p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; ORAL DEFENSE<\/div><p><em lang='es' class='esw'>defensa oral<\/em> &middot; The two questions after your talk.<\/p><\/div><\/div><div class='num'>&middot; 44 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 9"}, {"cls": "board chapter", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO<\/div><div class='ch-num'>10<\/div><div class='ch-title'>When you get stuck<\/div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/><\/svg><svg class='ch-icon' aria-hidden='true'><use href='#i-tool'/><\/svg><div class='ch-target'><div class='k'>BY THE END<\/div><p>Get unstuck on the work, keep going through an absence, and fix a problem with your file or your score.<\/p><\/div><div class='ch-inside'><div class='k'>INSIDE<\/div><ul><li><span class='it'>Stuck on the work<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>45<\/span><\/li><li><span class='it'>Absent, sick, or behind<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>46<\/span><\/li><li><span class='it'>Your file and your score<\/span><span class='ld' aria-hidden='true'><\/span><span class='pn'>47<\/span><\/li><\/ul><\/div><\/div><\/div><div class='num ch-pn'>&middot; x &middot;<\/div><div class='shade'><\/div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-tool'/><\/svg>FOLIO 10<\/p><h2>Stuck on the work<\/h2><table class='stages wide2 tight'><thead><tr><th>I AM STUCK ON<\/th><th>TRY THIS<\/th><\/tr><\/thead><tbody><tr><th>No theme yet<\/th><td>Read the packet again. Draw lines between texts (page <button type='button' class='pj' data-jump='19' aria-label='Go to page 15'>15<\/button>).<\/td><\/tr><tr><th>A question too big<\/th><td>Add one place, one time, one group (page <button type='button' class='pj' data-jump='22' aria-label='Go to page 18'>18<\/button>).<\/td><\/tr><tr><th>Too few scholarly sources<\/th><td>Search EBSCO through the AP Digital Portfolio (page <button type='button' class='pj' data-jump='24' aria-label='Go to page 19'>19<\/button>).<\/td><\/tr><tr><th>A paper that only summarizes<\/th><td>Name your claim. Say what each source does for it (page <button type='button' class='pj' data-jump='29' aria-label='Go to page 23'>23<\/button>).<\/td><\/tr><tr><th>A tool I am not sure about<\/th><td>Ask me before, not after (page <button type='button' class='pj' data-jump='48' aria-label='Go to page 39'>39<\/button>).<\/td><\/tr><\/tbody><\/table><p class='small'>Still stuck? See me next class. I can ask questions and suggest places to look. I cannot give you a question, sources, or sentences. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 45 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Absent, sick, or behind<\/h3><p class='small'>We meet every other school day. One missed class is a long gap. Read Google Classroom the same day.<\/p><p class='small'>Missing a checkpoint? See me next class. The checkpoint must happen, or your paper scores 0.<\/p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>COLLEGE BOARD RULES<\/div><p class='note2'>A long absence: the school and I try to keep you in the task, with technology or other ways.<\/p><p class='note2'>School days lost to closures: the school can ask the College Board for more time, before March 12, 2027.<\/p><p class='note2'>A documented disability: accommodations are possible. The school&#39;s deadline to request them is January 22, 2027. See your school&#39;s accommodations coordinator well before.<\/p><\/div><p class='small' style='margin-top:1cqw'>Absent on your talk day: page <button type='button' class='pj' data-jump='54' aria-label='Go to page 44'>44<\/button>. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 46 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Your file and your score<\/h3><table class='stages wide1 tight'><thead><tr><th>IF<\/th><th>THEN<\/th><\/tr><\/thead><tbody><tr><th>My table does not say Registered for exam<\/th><td>Your work is not sent for scoring. Tell me or the AP coordinator now.<\/td><\/tr><tr><th>I submit my paper but miss the May exam<\/th><td>No AP Seminar score. The exam: The End-of-Course Exam.<\/td><\/tr><tr><th>I submitted the wrong file as final<\/th><td>See me the same day. I can return it. You submit it as final again by April 30.<\/td><\/tr><tr><th>I want to cancel one part<\/th><td>Canceling removes the whole AP Seminar score.<\/td><\/tr><tr><th>I hope for a rescore<\/th><td>Performance tasks are never rescored.<\/td><\/tr><\/tbody><\/table><p class='small'>Submitting anything as final means you get a score, unless you cancel it. Checked September 30, 2026.<\/p><\/div><div class='num'>&middot; 47 &middot;<\/div><div class='shade'><\/div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>The individual project, ready<\/h3><div class='form' data-form='ipready'><div class='fhead'><span>MY PROJECT<\/span><span>TAP WHAT IS TRUE<\/span><\/div><p class='tierlab'>FIRST STEP &middot; MY QUESTION<\/p><button type='button' class='tick' aria-pressed='false' aria-label='My theme links two texts I can name.'><span class='bx' aria-hidden='true'><\/span>My theme links two texts I can name.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='My question is one question, with a place and a time.'><span class='bx' aria-hidden='true'><\/span>My question is one question, with a place and a time.<\/button><button type='button' class='tick' aria-pressed='false' aria-label='Every source I read is in my log.'><sp ><\/div><div class='num'>&middot; 48 &middot;<\/div><div class='shade'><\/div>", "label": "Self-check"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Words that fool you<\/h3><p class='small'>Some English words look like Spanish words but mean something else.<\/p><table class='stages'><thead><tr><th>ENGLISH<\/th><th>IN SPANISH<\/th><th>NOT<\/th><\/tr><\/thead><tbody><tr><th>large<\/th><td><span lang='es'>grande, amplio<\/span><\/td><td><span lang='es'>largo<\/span>, long<\/td><\/tr><tr><th>to resume<\/th><td><span lang='es'>retomar, continuar<\/span><\/td><td><span lang='es'>resumir<\/span>, to summarize<\/td><\/tr><tr><th>eventually<\/th><td><span lang='es'>con el tiempo, al final<\/span><\/td><td><span lang='es'>eventualmente<\/span>, which usually means possibly<\/td><\/tr><tr><th>compromise<\/th><td><span lang='es'>acuerdo, t&eacute;rmino medio<\/span><\/td><td><span lang='es'>compromiso<\/span>, a promise or a duty<\/td><\/tr><tr><th>assignment<\/th><td><span lang='es'>tarea, trabajo<\/span><\/td><td><span lang='es'>asignatura<\/span>, a school subject<\/td><\/tr><\/tbody><\/table><p class='small'>Most task words match: <span lang='es'>tema, objeci&oacute;n, contexto, s&iacute;ntesis<\/span>.<\/p><\/div><div class='num'>&middot; 49 &middot;<\/div><div class='shade'><\/div>", "label": "Words that fool you"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h2>Words in this book<\/h2><p class='small'>Tap a page to go there.<\/p><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-pen'/><\/svg><strong>Argument<\/strong><em lang='es'>argumento<\/em><\/div><p>A position you defend with reasons and evidence.<\/p><button type='button' class='gtag' data-jump='39' aria-label='Go to page 32'>Page 32<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-sign'/><\/svg><strong>Authentic<\/strong><em lang='es'>aut&eacute;ntico<\/em><\/div><p>Your own work. I sign that it is.<\/p><button type='button' class='gtag' data-jump='49' aria-label='Go to page 40'>Page 40<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-check'/><\/svg><strong>Checkpoint<\/strong><em lang='es'>punto de control<\/em><\/div><p>A required talk with me. Missing one scores your paper 0.<\/p><button type='button' class='gtag' data-jump='26' aria-label='Go to page 21'>Page 21<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-compass'/><\/svg><strong>Context<\/strong><em lang='es'>contexto<\/em><\/div><p>Why your question matters, and the bigger picture it fits.<\/p><button type='button' class='gtag' data-jump='37' aria-label='Go to page 30'>Page 30<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-steps'/><\/svg><strong>Implication<\/strong><em lang='es'>implicaci&oacute;n<\/em><\/div><p>A possible future effect.<\/p><button type='button' class='gtag' data-jump='52' aria-label='Go to page 42'>Page 42<\/button><\/div><\/div><div class='num'>&middot; 50 &middot;<\/div><div class='shade'><\/div>", "label": "Words in this book"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Words in this book, continued<\/h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-link'/><\/svg><strong>Integrate<\/strong><em lang='es'>integrar<\/em><\/div><p>To use a source inside your argument, not only mention it.<\/p><button type='button' class='gtag' data-jump='36' aria-label='Go to page 29'>Page 29<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-cross'/><\/svg><strong>Limitation<\/strong><em lang='es'>limitaci&oacute;n<\/em><\/div><p>The point where an argument stops being true.<\/p><button type='button' class='gtag' data-jump='38' aria-label='Go to page 31'>Page 31<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-bubble'/><\/svg><strong>Objection<\/strong><em lang='es'>objeci&oacute;n<\/em><\/div><p>A reason someone gives against a view.<\/p><button type='button' class='gtag' data-jump='38' aria-label='Go to page 31'>Page 31<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-podium'/><\/svg><strong>Oral defense<\/strong><em lang='es'>defensa oral<\/em><\/div><p>The two questions after your talk.<\/p><button type='button' class='gtag' data-jump='53' aria-label='Go to page 43'>Page 43<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-steps'/><\/svg><strong>Outline<\/strong><em lang='es'>esquema<\/em><\/div><p>The plan of your argument, section by section.<\/p><button type='button' class='gtag' data-jump='30' aria-label='Go to page 24'>Page 24<\/button><\/div><\/div><div class='num'>&middot; 51 &middot;<\/div><div class='shade'><\/div>", "label": "Words in this book"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Words in this book, continued<\/h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-eye'/><\/svg><strong>Perspective<\/strong><em lang='es'>perspectiva<\/em><\/div><p>A point of view with its reason.<\/p><button type='button' class='gtag' data-jump='15' aria-label='Go to page 12'>Page 12<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-zero'/><\/svg><strong>Plagiarism<\/strong><em lang='es'>plagio<\/em><\/div><p>Words or ideas used with no credit.<\/p><button type='button' class='gtag' data-jump='47' aria-label='Go to page 38'>Page 38<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-compass'/><\/svg><strong>Research question<\/strong><em lang='es'>pregunta de investigaci&oacute;n<\/em><\/div><p>The one question your task answers. It is yours.<\/p><button type='button' class='gtag' data-jump='21' aria-label='Go to page 17'>Page 17<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/><\/svg><strong>Scholarly<\/strong><em lang='es'>acad&eacute;mico<\/em><\/div><p>Written by experts, often checked by other experts, like a journal article.<\/p><button type='button' class='gtag' data-jump='24' aria-label='Go to page 19'>Page 19<\/button><\/div><\/div><div class='num'>&middot; 52 &middot;<\/div><div class='shade'><\/div>", "label": "Words in this book"}, {"cls": "paper", "html": "<div class='grainlayer grain'><\/div><div class='pg'><div class='head'><span>THE INDIVIDUAL PROJECT<\/span><span>{{SHORT}}{{PHEAD}}<\/span><\/div><h3>Words in this book, continued<\/h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/><\/svg><strong>Stimulus text<\/strong><em lang='es'>texto de est&iacute;mulo<\/em><\/div><p>A source the College Board gives you for a task or the exam.<\/p><button type='button' class='gtag' data-jump='13' aria-label='Go to page 10'>Page 10<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-box'/><\/svg><strong>Submit as final<\/strong><em lang='es'>entregar como final<\/em><\/div><p>Send your paper to the College Board. After this it cannot change.<\/p><button type='button' class='gtag' data-jump='45' aria-label='Go to page 37'>Page 37<\/button><\/div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-history'/><\/svg><strong>Synthesis<\/strong><em lang
