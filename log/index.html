or='middle'>3</text><text x='26' y='125' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a'>Check understanding</text><rect x='8' y='131' width='170' height='19' rx='2' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='14' y='144.5' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#245e55'>after you read, ask if you got it</text><rect x='180' y='116' width='4' height='34' rx='0' fill='#9c3322'/><text x='190' y='132' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>the summary replaces</text><text x='190' y='145' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>the reading</text><circle cx='13' cy='167' r='7.5' fill='#9c3322'/><text x='13' y='170.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>4</text><text x='26' y='171' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a'>Grammar and tone</text><rect x='8' y='177' width='170' height='19' rx='2' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='14' y='190.5' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#245e55'>it points out errors</text><rect x='180' y='162' width='4' height='34' rx='0' fill='#9c3322'/><text x='190' y='178' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>it rewrites the</text><text x='190' y='191' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>sentence for you</text><text x='8' y='210' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>College Board policy on tools that write.</text><text x='8' y='222' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>SAME PLATE</b>The AI Manual draws the same four lanes.</figcaption></figure></div><div class='num'>&middot; 54 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Three things only you can do</h3><p>The same policy says three things must be yours.</p><div class='card2 ' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:#f6eedb'><use href='#i-eye'/></svg>1 \u00b7 READ THE SOURCES</div><p>Read the sources directly, not a summary of them.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:#f6eedb'><use href='#i-link'/></svg>2 \u00b7 ANALYZE AND CONNECT</div><p>Analyze the evidence and connect it yourself.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:#f6eedb'><use href='#i-pen'/></svg>3 \u00b7 CHOOSE YOUR WORDS</div><p>Choose how to say it, in writing and when you present.</p></div><p class='small fill'>Tools may never write the work for you. That is the College Board&#39;s line, and mine.</p></div><div class='num'>&middot; 55 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Prompts: support or shortcut?</h3><table class='stages'><thead><tr><th>SUPPORTS LEARNING</th><th>SKIPS LEARNING</th></tr></thead><tbody><tr><th>What are three angles on bench design?</th><td>Write my research question.</td></tr><tr><th>What search words find studies on bench design?</th><td>Give me five sources for my log.</td></tr><tr><th>I read this. Did I get its main claim right?</th><td>Summarize it so I do not have to read it.</td></tr><tr><th>Point out the grammar errors. Do not rewrite.</th><td>Make my paragraph sound better.</td></tr></tbody></table><p class='small fill'>The test: could you have typed this with every tool closed?</p></div><div class='num'>&middot; 56 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Before you open a tool</h3><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>ASK YOURSELF</div><p>1. Is this one of the four allowed uses?<br>2. Will I still read, think, and write it myself?<br>3. Could I explain every word of the result at a checkpoint?</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>REWORDING</div><p>Rewording a source in your own words is the work. A machine rewording your sentences is not allowed.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>TOOLS CAN BE WRONG</div><p>They invent sources, quotes, and numbers. Check everything against the original.</p></div><p class='small fill'>When in doubt, ask me before, not after.</p></div><div class='num'>&middot; 57 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>10</div><div class='ch-title'>How it is checked</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-scan'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Know what is checked, and how your log protects you.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>How it is checked</span><span class='ld' aria-hidden='true'></span><span class='pn'>58</span></li><li><span class='it'>The rule -family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>To pass a checkpoint or a meeting, say more than</text><text x='6' y='209' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>the line says: give your reasons.</text></svg></div><p class='small fill'>Your log starts every answer. Your reasons finish it.</p></div><div class='num'>&middot; 62 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Protect your work: five habits</h3><table class='stages'><thead><tr><th>HABIT</th><th>WHY IT HELPS</th></tr></thead><tbody><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-history'/></svg>Draft in one Google Doc.</th><td>Its version history shows your writing grow.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-cal'/></svg>Keep the log current.</th><td>Dates show when you found each source.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-quote'/></svg>Cite as you go.</th><td>No source gets lost between notes and draft.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-folder'/></svg>Keep notes and drafts.</th><td>They show the steps, not only the end.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-pen'/></svg>Paste nothing you did not write.</th><td>Words from anyone else need credit.</td></tr></tbody></table><p class='small fill'>Work that is yours is easy to show. These habits make it easy.</p></div><div class='num'>&middot; 63 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>11</div><div class='ch-title'>Notebook check 1</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-test'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Get your notebook ready for the first check.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Notebook check 1</span><span class='ld' aria-hidden='true'></span><span class='pn'>64</span></li><li><span class='it'>Before I come to your seat</span><span class='ld' aria-hidden='true'></span><span class='pn'>65</span></li><li><span class='it'>What I count</span><span class='ld' aria-hidden='true'></span><span class='pn'>66</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-test'/></svg>FOLIO 11</p><h2>Notebook check 1</h2><p class='box' style='margin:0 0 1.6cqw'><strong>{{CHECKDATE}}</strong></p><svg class='fig' viewBox='0 0 230 44' role='img' aria-label='Five tally marks: at least 5 entries.'><g stroke='#245e55' stroke-width='3.4' stroke-linecap='round'><line x1='12' y1='8' x2='12' y2='38'/><line x1='25' y1='8' x2='25' y2='38'/><line x1='38' y1='8' x2='38' y2='38'/><line x1='51' y1='8' x2='51' y2='38'/><line x1='6' y1='34' x2='64' y2='12'/></g><text x='80' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='15' font-weight='700' fill='#1f3a5a'>at least 5 entries</text></svg><ul><li>I come to your seat. Nothing is handed in.</li><li>I count the entries. I check the dates.</li><li>The floor is five: your Library Run sources.</li><li>The notebook stays with you.</li></ul><p class='small fill'>Dates as of September 23, 2026. If a date moves, I say so in class and on Classroom.</p></div><div class='num'>&middot; 64 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='h'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-test'/></svg>FOLIO 11</p><h2>Before I come to your seat</h2><ul class='checklist'><li class='rise d2'><span class='bx'></span>The log page is the first blank page, with a LOG tab.</li><li class='rise d2'><span class='bx'></span>MY LOG, your name, your period on top.</li><li class='rise d2'><span class='bx'></span>Entries numbered, and the numbers only go up.</li><li class='rise d2'><span class='bx'></span>Every entry dated, with all six lines.</li><li class='rise d2'><span class='bx'></span>At least five entries.</li><li class='rise d2'><span class='bx'></span>A version line each time your question changed.</li><li class='rise d2'><span class='bx'></span>Nothing torn out. Mistakes crossed out with one line.</li></ul><p class='small fill'>I count entries and check dates. The rest is how you make that count easy.</p></div><div class='num'>&middot; 65 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>What I count</h2><div class='card2 good' style='margin-top:1.4cqw'><div class='k'>COUNTED</div><p>Entries with all six lines. A date on every entry. Pen, in order. Five entries is the floor.</p></div><div class='card2 weak' style='margin-top:1.4cqw'><div class='k'>NOT GRADED</div><p>Neat handwriting. Decoration.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>HOW IT WORKS</div><p>I come to your seat with a checklist. It takes about a minute. You keep the notebook; nothing is handed in.</p></div><p class='small fill'>It is counted for whether it is there, not for how it looks.</p></div><div class='num'>&middot; 66 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><div class='form' data-form='nb1'><div class='fhead'><span>NOTEBOOK CHECK 1</span><span>SELF-CHECK</span></div><p class='small' style='margin:.8cqw 0 .2cqw'>Tap each box that is true.</p><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>Five entries or more</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>A date on every entry</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>All six lines in every entry</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>Written in pen</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>A LOG tab or a folded corner</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>My newest question version is written</button><svg class='passstamp' viewBox='0 0 150 50' aria-hidden='true'><rect x='3' y='3' width='144' height='44' rx='7' fill='none' stroke='#1f5c4a' stroke-width='3'/><rect x='8' y='8' width='134' height='34' rx='4' fill='none' stroke='#1f5c4a' stroke-width='1.4'/><text x='75' y='33' text-anchor='middle' font-family='Space Mono,monospace' font-weight='700' font-size='21' letter-spacing='4' fill='#1f5c4a'>READY</text></svg></div><p class='small fill'>Fix any box you cannot tap first. Then compare your notebook with pages 72 and 73.</p></div><div class='num'>&middot; 67 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>12</div><div class='ch-title'>Where the log goes</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-compass'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>See where your log leads, and what a log that passes looks like.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Where the log goes</span><span class='ld' aria-hidden='true'></span><span class='pn'>68</span></li><li><span class='it'><span class='S'>From log to your papers</span><span class='R'>From log to proposal</span><span class='P'>From log to your papers</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>69</span></li><li><span class='it'>A year in the log</span><span class='ld' aria-hidden='true'></span><span class='pn'>70</span></li><li><span class='it'>The year, drawn</span><span class='ld' aria-hidden='true'></span><span class='pn'>71</span></li><li><span class='it'>Not ready yet</span><span class='ld' aria-hidden='true'></span><span class='pn'>72</span></li><li><span class='it'>A log that passes</span><span class='ld' aria-hidden='true'></span><span class='pn'>73</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-compass'/></svg>FOLIO 12</p><h2>Where the log goes</h2><div class='S'><svg class='fig' viewBox='0 0 400 104' role='img' aria-label='A path: now, the log; fall to winter, the team project; spring, your essay.'><path class='draw' pathLength='1' d='M40 40 C120 10,160 70,200 40 S300 10,360 40' fill='none' stroke='#6d4f14' stroke-width .5' fill='#1d1812'>the log</text><circle class='pop d3' cx='200' cy='40' r='9' fill='#fbf7ec' stroke='#1d1812' stroke-width='2.2'/><text x='200' y='76' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#9c3322'>November 30</text><text x='200' y='96' text-anchor='middle' font-family='Cormorant Garamond,serif' font-weight='700' font-size='16.5' fill='#1d1812'>the proposal</text><circle class='pop d5' cx='360' cy='40' r='9' fill='#fbf7ec' stroke='#1d1812' stroke-width='2.2'/><text x='360' y='76' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#9c3322'>spring</text><text x='360' y='96' text-anchor='middle' font-family='Cormorant Garamond,serif' font-weight='700' font-size='16.5' fill='#1d1812'>the paper</text></svg><p>By November 30, your question goes on the Inquiry Proposal Form. It asks for three key studies and the gap your study fills. The log is where you find both.</p><p>In the spring it holds the sources for your academic paper.</p></div><div class='P'><svg class='fig' viewBox='0 0 400 104' role='img' aria-label='A path: now, the log; this year, your tasks; May, I sign.'><path d='M40 40 C120 10,160 70,200 40 S300 10,360 40' fill='none' stroke='#6d4f14' stroke-width='3'/><circle cx='40' cy='40' r='11' fill='#245e55' stroke='#1d1812' stroke-width='2.2'/><circle cx='200' cy='40' r='9' fill='#fbf6ea' stroke='#1d1812' stroke-width='2.2'/><circle cx='360' cy='40' r='9' fill='#fbf6ea' stroke='#1d1812' stroke-width='2.2'/><text x='40' y='76' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#9c3322' text-anchor='middle'>now</text><text x='40' y='96' font-family='Cormorant Garamond,Georgia,serif' font-size='16.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>the log</text><text x='200' y='76' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#9c3322' text-anchor='middle'>this year</text><text x='200' y='96' font-family='Cormorant Garamon r work. Miss one: the task scores 0.</p><button type='button' class='gtag' data-jump='68' aria-label='Open Folio 10'>Folio 10</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>Citation</strong><em lang='es'>referencia</em></div><p>The author, title, year, and publisher of a source.</p><button type='button' class='gtag' data-jump='45' aria-label='Open Folio 7'>Folio 7</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-bubble'/></svg><strong>Claim</strong><em lang='es'>afirmaci&oacute;n</em></div><p>A statement someone could argue against.</p><button type='button' class='gtag' data-jump='26' aria-label='Open Folio 4'>Folio 4</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-chart'/></svg><strong>Evidence</strong><em lang='es'>evidencia</em></div><p>What holds a claim up: numbers, experts, examples, stories.</p><button type='button' class='gtag' data-jump='26' aria-label='Open Folio 4'>Folio 4</button></div></div><div class='num'>&middot; 74 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-gap'/></svg><strong>Gap</strong><em lang='es'>vac&iacute;o</em></div><p>What studies have not looked at yet. A new study can start there.</p><button type='button' class='gtag' data-jump='18' aria-label='Open Folio 3'>Folio 3</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-search'/></svg><strong>Lateral reading</strong><em lang='es'>lectura lateral</em></div><p>Leaving a page to check it in new tabs.</p><button type='button' class='gtag' data-jump='45' aria-label='Open Folio 7'>Folio 7</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-lens'/></svg><strong>Lens</strong><em lang='es'>lente</em></div><p>The filter an issue is seen through: ethical, economic, political.</p><button type='button' class='gtag' data-jump='40' aria-label='Open Folio 6'>Folio 6</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-pen'/></svg><strong>Log entry</strong><em lang='es'>entrada del registro</em></div><p>Six lines about one source, written the day you read it.</p><button type='button' class='gtag' data-jump='18' aria-label='Open Folio 3'>Folio 3</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-steps'/></svg><strong>Method</strong><em lang='es'>m&eacute;todo</em></div><p>The steps a study took to find out.</p><button type='button' class='gtag' data-jump='40' aria-label='Open Folio 6'>Folio 6</button></div></div><div class='num'>&middot; 75 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/></svg><strong>Peer-reviewed</strong><em lang='es'>revisado por pares</em></div><p>Checked by other experts first.</p><button type='button' class='gtag' data-jump='45' aria-label='Open Folio 7'>Folio 7</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-view'/></svg><strong>Perspective</strong><em lang='es'>perspectiva</em></div><p>A point of view with its reason.</p><button type='button' class='gtag' data-jump='40' aria-label='Open Folio 6'>Folio 6</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-cross'/></svg><strong>Plagiarism</strong><em lang=
