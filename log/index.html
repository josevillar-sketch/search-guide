r='middle'>4</text></g><text x='26' y='104.5' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>4. The claim, in one sentence.</text><g transform='translate(11 117.0)'><circle cx='0' cy='0' r='7' fill='#9c3322'/><text x='0' y='3.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>5</text></g><text x='26' y='121' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>5. Perspective (AP Seminar) or method</text><text x='26' y='137.5' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>   (AP Research).</text><g transform='translate(11 150.0)'><circle cx='0' cy='0' r='7' fill='#9c3322'/><text x='0' y='3.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>6</text></g><text x='26' y='154' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>6. Yes or no, and why.</text></svg><figcaption><b>MODEL</b>Pick your period inside the cover to see a filled entry for your course.</figcaption></figure></div><div class='notes' style='font-size:.84em'><div><span class='callout'>1</span><p>the full date, the same day</p></div><div><span class='callout'>2</span><p>author, title, year, where</p></div><div><span class='callout'>3</span><p>exact words and the site</p></div><div><span class='callout'>4</span><p>a claim, not a topic</p></div><div><span class='callout'>5</span><p><span class='S'>a view with its reason</span><span class='R'>what they did, with how many</span><span class='P'>a perspective or a method</span></p></div><div><span class='callout'>6</span><p>yes or no, and why</p></div></div></div><div class='num'>&middot; 23 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Line four: a claim, not a topic</h3><p>A topic names what a source is about. A claim says something about it that someone could argue against.</p><div class='ladder'><div class='rise d1'><span class='dot'></span><strong>Topic.</strong> <em>It is about hostile architecture.</em></div><div class='rise d2'><span class='dot'></span><strong>Claim.</strong> <em class='S'>Bench bars do not solve homelessness.</em><em class='R'>Some streets have more bench dividers than others.</em><em class='P'>A sentence someone could argue against.</em></div><div class='rise d3'><span class='dot ok'></span><strong>Claim with its evidence.</strong> <em class='S'>Bench bars move people to other blocks without reducing the need for shelter, citing outreach counts from three cities.</em><em class='R'>Dividers on 38 of 100 shopping-street benches, 9 of 100 on home streets.</em><em class='P'>The claim, and what backs it.</em> This is line four.</div></div><div class='R'><p class='small'>For a study: the finding, with its number.</p></div><div class='S'><p class='small'>No claim? Reread the first and last paragraphs.</p></div><div class='card2 try' style='margin-top:1cqw'><div class='k'>TRY IT: TOPIC OR CLAIM?</div><p>1. Benches are found in most parks.<br>2. Benches should be built so anyone can lie down.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>Only 2 is a claim. 1 is a fact.</p></div><p class='small fill'>Test: could a reasonable person disagree with your line four? If not, it is still a topic.</p></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bubble'/></svg>FOLIO 4</p><h2>Reading a graph</h2><p>Many sources give their evidence as a chart. Read it in three steps before you write line four.</p><svg class='fig' viewBox='0 0 320 158' role='img' aria-label='A bar chart titled benches with dividers, out of every 100. Shopping streets: 38, a solid bar. Home streets: 9, a light bar. 200 benches on each kind of street. Source: Chen and Diaz, 2020, a made-up study.'><text x='8' y='12' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a'>Benches with dividers, out of every 100</text><line x1='40' y1='90.0' x2='300' y2='90.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='93' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>10</text><line x1='40' y1='70.0' x2='300' y2='70.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='73' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>20</text><line x1='40' y1='50.0' x2='300' y2='50.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='53' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>30</text><line x1='40' y1='30.0' x2='300' y2='30.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='33' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>40</text><line x1='40' y1='110' x2='300' y2='110' stroke='#1f3a5a' stroke-width='1.3'/><rect x='80' y='34' width='62' height='76' rx='0' fill='#1f3a5a' stroke='#1f3a5a' stroke-width='1.2'/><rect x='190' y='92' width='62' height='18' rx='0' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2'/><text x='111' y='29' font-family='Space Mono,Courier New,monospace' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>38</text><text x='221' y='87' font-family='Space Mono,Courier New,monospace' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>9</text><text x='111' y='124' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>shopping streets</text><text x='221' y='124' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>home streets</text><text x='8' y='140' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>200 benches on each kind of street.</text><text x='8' y='154' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Chen and Diaz, 2020. A made-up study.</text></svg><ol><li><strong>What is counted?</strong> Benches with dividers, out of every 100.</li><li><strong>Compare the bars.</strong> 38 against 9: about four times as many.</li><li><strong>Say it in one sentence.</strong> That sentence is line four.</li></ol><p class='small fill'>Made-up data from the made-up Chen and Diaz study.</p></div><div class='num'>&middot; 25 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","label":"Folio 4","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Reading a graph, step by step</h2><figure class='plate'><div class='pl'><span>PLATE IV</span><span>Three steps</span></div><svg class='fig' viewBox='0 0 320 206' role='img' aria-label='A bar chart of made-up data from the made-up Chen and Diaz study, in three numbered steps. 1, what is counted: benches with dividers, out of every 100. Shopping streets 38, a solid bar; home streets 9, a light bar. 2, compare the bars: 38 against 9, about 4 times. 3, say it in one sentence. Line 4: Shopping-street benches have dividers about four times as often as home-street benches.'><g class='pop d1'><circle cx='14' cy='11' r='7.5' fill='#9c3322'/><text x='14' y='14.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='26' y='15' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a'>Benches with dividers, out of every 100</text></g><line x1='40' y1='109.0' x2='300' y2='109.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='112' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>10</text><line x1='40' y1='86.0' x2='300' y2='86.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='89' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>20</text><line x1='40' y1='63.0' x2='300' y2='63.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='66' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>30</text><line x1='40' y1='40.0' x2='300' y2='40.0' stroke='#b7ab91' stroke-width='.6'/><text x='35' y='43' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>40</text><line x1='40' y1='132' x2='300' y2='132' stroke='#1f3a5a' stroke-width='1.3'/><g class='pop d2'><rect x='80' y='44.6' width='62' height='87.4' rx='0' fill='#1f3a5a' stroke='#1f3a5a' stroke-width='1.2'/></g><g class='pop d3'><rect x='190' y='111.3' width='62' height='20.7' rx='0' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2'/></g><g class='pop d4'><text x='111' y='39.6' font-family='Space Mono,Courier New,monospace' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>38</text><text x='221' y='106.3' font-family='Space Mono,Courier New,monospace' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>9</text></g><text x='111' y='146' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>shopping streets</text><text x='221' y='146' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>home streets</text><g class='pop d5'><path d='M146 46.60000000000001 H164 V113.3 H186' fill='none' stroke='#9c3322' stroke-width='1.4'/><text x='170' y='70' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#9c3322'>about</text><text x='170' y='84' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#9c3322'>4 times</text><circle cx='232' cy='66' r='7.5' fill='#9c3322'/><text x='232' y='69.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text></g><g class='pop d6'><circle cx='14' cy='166' r='7.5' fill='#9c3322'/><text x='14' y='169.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='26' y='170' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>Line 4: Shopping-street benches have dividers</text><text x='26' y='185' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>about four times as often as home-street benches.</text></g><text x='312' y='202' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>Made-up data: the made-up Chen and Diaz study.</text></svg><figcaption><b>1</b>what is counted <b>2</b>compare the bars <b>3</b>say it in one sentence. Made-up data from the made-up Chen and Diaz study.</figcaption></figure></div><div class='num'>&middot; 26 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Four kinds of evidence</h3><p>Line four names the claim. What holds it up?</p><div class='evrow rise d1'><svg class='ic' aria-hidden='true'><use href='#i-chart'/></svg><div><strong>Numbers and data</strong><span>counts, surveys, measurements</span></div><svg viewBox='0 0 62 12' style='width:15cqw;height:auto;flex:none' role='img' aria-label='a bar, 4 of 4: how far one piece usually goes alone'><rect x='1' y='1' width='60' height='10' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='1' y='1' width='60' height='10' rx='1.5' fill='#245e55' stroke='#1f3a5a' stroke-width='1'/><line x1='16' y1='1' x2='16' y2='11' stroke='#fbf6ea' stroke-width='.8'/><line x1='31' y1='1' x2='31' y2='11' stroke='#fbf6ea' stroke-width='.8'/><line x1='46' y1='1' x2='46' y2='11' stroke='#fbf6ea' stroke-width='.8'/></svg></div><div class='evrow rise d2'><svg class='ic' aria-hidden='true'><use href='#i-book'/></svg><div><strong>Expert testimony</strong><span>what someone trained in the field says</span></div><svg viewBox='0 0 62 12' style='width:15cqw;height:auto;flex:none' role='img' aria-label='a bar, 3 of 4: how far one piece usually goes alone'><rect x='1' y='1' width='60' height='10' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='1' y='1' width='45' height='10' rx='1.5' fill='#245e55' stroke='#1f3a5a' stroke-width='1'/><line x1='16' y1='1' x2='16' y2='11' stroke='#fbf6ea' stroke-width='.8'/><line x1='31' y1='1' x2='31' y2='11' stroke='#fbf6ea' stroke-width='.8'/><line x1='46' y1='1' x2='46' y2='11' stroke='#1f3a5a' stroke-width='.8'/></svg></div><div class='evrow rise d3'><svg class='ic' aria-hidden='true'><use href='#i-eye'/></svg><div><strong>An example</strong><span>one case that shows the claim</span></div><svg viewBox='0 0 62 12' style='width:15cqw;height:auto;flex:none' role='img' aria-label='a bar, 2 of 4: how far one piece usually goes alone'><rect x='1' y='1' width='60' height='10' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='1' y='1' width='30' height='10' rx='1.5' fill='#245e55' stroke='#1f3a5a' stroke-width='1'/><line x1='16' y1='1' x2='16' y2='11' stroke='#fbf6ea' stroke-width='.8'/><line x1='31' y1='1' x2='31' y2='11' stroke='#1f3a5a' stroke-width='.8'/><line x1='46' y1='1' x2='46' y2='11' stroke='#1f3a5a' stroke-width='.8'/></svg></div><div class='evrow rise d4'><svg class='ic' aria-hidden='true'><use href='#i-chat'/></svg><div><strong>A personal account</strong><span>one person&#39;s story</span></div><svg viewBox='0 0 62 12' style='width:15cqw;height:auto;flex:none' role='img' aria-label='a bar, 1 of 4: how far one piece usually goes alone'><rect x='1' y='1' width='60' height='10' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><rect x='1' y='1' width='15' height='10' rx='1.5' fill='#245e55' stroke='#1f3a5a' stroke-width='1'/><line x1='16' y1='1' x2='16' y2='11' stroke='#1f3a5a' stroke-width='.8'/><line x1='31' y1='1' x2='31' y2='11' stroke='#1f3a5a' stroke-width='.8'/><line x1='46' y1='1' x2='46' y2='11' stroke='#1f3a5a' stroke-width='.8'/></svg></div><p class='small' style='margin-top:1.4cqw'>Bars: how far one piece usually goes alone. A story still matters; it needs company.</p><div class='S'><p class='box fill' style='margin-bottom:0'>Ortiz leans on outreach counts from three cities: numbers. That is why her claim is strong enough to answer.</p></div><div class='R'><p class='box fill' style='margin-bottom:0'>Chen and Diaz counted 400 benches: numbers from their own method. That makes their study primary.</p></div><div class='P'><p class='small fill'>Pick your period inside the cover to see your course&#39;s version.</p></div></div><div class='num'>&middot; 27 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Numbers need their context</h2><p>A number on its own proves little. Before a number goes in line four, find four things.</p><table class='stages'><thead><tr><th>ASK</th><th>IN THE BENCH STUDY</th></tr></thead><tbody><tr><th>What was counted?</th><td>Benches with bars or dividers.</td></tr><tr><th>Where?</th><td>Shopping streets and home streets.</td></tr><tr><th>When?</th><td>One year, 2020.</td></tr><tr><th>Compared to what?</th><td>38 of 100 on shopping streets, 9 of 100 on home streets.</td></tr></tbody></table><p style='margin-top:1.4cqw'>Now the number means something: dividers were four times as common where shops are.</p><p class='small fill'>A number with no comparison is a fact. A number with a comparison can support a claim.</p></div><div class='num'>&middot; 28 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Claim or topic, round two</h3><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>1. Benches in Miami.<br>2. Bench bars cost the city less than shelters.<br>3. Most parks have benches.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>Only 2 is a claim: someone could argue that shelters cost less over time. 1 is a topic. 3 is a fact.</p></div><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>Turn this topic into a claim: <em>school start times</em>.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>One answer: Starting high school after 8:30 raises attendance. Any sentence someone could argue against works.</p></div><p class='small fill'>Test every line four the same way: could a reasonable person disagree?</p></div><div class='num'>&middot; 29 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>5</div><div class='ch-title'>Every source, same day</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-cal'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Log every source on the day you read it, and keep every entry.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Every source, the day you find it</span><span class='ld' aria-hidden='true'></span><span class='pn'>30</span></li><li><span class='it'>A week of the log</span><span class='ld' aria-hidden='true'></span><span class='pn'>31</span></li><li><span class='it'>Where the sources are</span><span class='ld' aria-hidden='true'></span><span class='pn'>32</span></li><li><span class='it'>Log it, even if you drop it</span><span class='ld' aria-hidden='true'></span><span class='pn'>33</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='h'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-cal'/></svg>FOLIO 5</p><h2>Every source, the day you find it</h2><ul><li>One entry for every source you open and read, the same day.</li><li>Dates never change. A late entry gets today&#39;s date.</li><li>A source you drop keeps its entry. Line six says no, and why. That is part of the record.</li><li>Your five Library Run sources are entries 1 to 5.</li><li>After that: one entry per new source, all year. Numbers only go up.</li></ul><svg class='fig fill' viewBox='0 0 400 74' role='img' aria-label='Five entries in a row, entry 1 to entry 5: your five Library Run sources.'><g class='pop d1' fill='none' stroke='#245e55' stroke-width='2.2'><rect x='8' y='6' width='66' height='46' rx='3'/><line x1='16' y1='20' x2='66' y2='20'/><line x1='16' y1='30' x2='66' y2='30'/><line x1='16' y1='40' x2='52' y2='40'/></g><text x='41' y='68' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#4a3f31'>entry 1</text><g class='pop d2' fill='none' stroke='#4a3f31' stroke-width='2.2'><rect x='86' y='6' width='66' height='46' rx='3'/><line x1='94' y1='20' x2='144' y2='20'/><line x1='94' y1='30' x2='144' y2='30'/><line x1='94' y1='40' x2='130' y2='40'/></g><text x='119' y='68' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#4a3f31'>entry 2</text><g class='pop d3' fill='none' stroke='#4a3f31' stroke-width='2.2'><rect x='164' y='6' width='66' height='46' rx='3'/><line x1='172' y1='20' x2='222' y2='20'/><line x1='172' y1='30' x2='222' y2='30'/><line x1='172' y1='40' x2='208' y2='40'/></g><text x='197' y='68' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#4a3f31'>entry 3</text><g class='pop d4' fill='none' stroke='#4a3f31' stroke-width='2.2'><rect x='242' y='6' width='66' height='46' rx='3'/><line x1='250' y1='20' x2='300' y2='20'/><line x1='250' y1='30' x2='300' y2='30'/><line x1='250' y1='40' x2='286' y2='40'/></g><text x='275' y='68' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#4a3f31'>entry 4</text><g class='pop d5' fill='none' stroke='#4a3f31' stroke-width='2.2'><rect x='320' y='6' width='66' height='46' rx='3'/><line x1='328' y1='20' x2='378' y2='20'/><line x1='328' y1='30' x2='378' y2='30'/><line x1='328' y1='40' x2='364' y2='40'/></g><text x='353' y='68' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#4a3f31'>entry 5</text></svg></div><div class='num'>&middot; 30 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A week of the log</h3><svg class='fig' viewBox='0 0 320 80' role='img' aria-label='A made-up case: one week of the log, each day a short mark on a line. Monday: 2 sources read, entries 6 and 7. Wednesday: 1 source read, entry 8. Thursday: none read, no entry. Friday: 1 source read and dropped, entry 9, line 6 says no.'><line x1='14' y1='24' x2='306' y2='24' stroke='#1f3a5a' stroke-width='1.6'/><g class='pop d1'><line x1='44' y1='18.0' x2='44' y2='30.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='44' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>MONDAY</text><text x='44' y='45' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>2 sources</text><text x='44' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>entries 6, 7</text></g><g class='pop d2'><line x1='122' y1='18.0' x2='122' y2='30.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='122' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>WEDNESDAY</text><text x='122' y='45' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>1 source</text><text x='122' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>entry 8</text></g><g class='pop d3'><line x1='200' y1='18.0' x2='200' y2='30.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='200' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>THURSDAY</text><text x='200' y='45' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>none read</text><text x='200' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>no entry</text></g><g class='pop d4'><line x1='278' y1='18.0' x2='278' y2='30.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='278' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>FRIDAY</text><text x='278' y='45' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>1 source</text><text x='278' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>entry 9</text><text x='278' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle'>line 6: no</text></g><text x='6' y='75' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>A made-up case.</text></svg><p class='small' style='margin:-.6cqw 0 1.4cqw'>Each entry is dated the day it happened.</p><h3 style='margin-top:1cqw'>What counts as a source</h3><div class='twocol'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>COUNTS</div><p>A book, article, study, report, video, interview, or data set that you opened and read or watched.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>DOES NOT</div><p>A page of search results. A summary in place of the source. An answer from a tool that writes: it is never the source.</p></div></div><p class='small fill' style='margin-top:2cqw'>Where to look: the Miami-Dade library databases, Google Scholar, and your Library Run site.</p></div><div class='num'>&middot; 31 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Where the sources are</h2><p>Start in places built for research. Their sources are easier to check.</p><table class='stages'><thead><tr><th>PLACE</th><th>BEST FOR</th></tr></thead><tbody><tr><th>Miami-Dade library (Gale)</th><td>Articles you can read in full, with citations ready.</td></tr><tr><th>Google Scholar</th><td>Studies and academic articles.</td></tr><tr><th>JSTOR, CORE, Semantic Scholar</th><td>More academic articles, many free to read.</td></tr><tr><th>Open Library</th><td>Books you can borrow online.</td></tr><tr><th>Library Run site</th><td>The sources and steps from our first unit.</td></tr></tbody></table><p class='small fill'>Found nothing? Change the words and try again.</p></div><div class='num'>&middot; 32 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Log it, even if you drop it</h3><p>Some sources will not help. Log them anyway. Line six is where you say no, and why.</p><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>WHY A NO ENTRY COUNTS</div><p>It shows the path your research took. It stops you from finding the same dead end twice. At a checkpoint, it shows that you judged your sources.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>THE THREE-MINUTE ROUTINE</div><svg class='fig' viewBox='0 0 320 113' role='img' aria-label='The three-minute routine, a loop of three steps. 1, read: the source. 2, write: the six lines, before you close the tab. 3, open: the next one. Then again, for every source.'><g class='pop d1'><rect x='4' y='4' width='96' height='68' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='16' cy='17' r='7' fill='#9c3322'/><text x='16' y='20.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='28' y='21.5' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a'>READ</text><text x='12' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#4a3f31'>the source</text><path d='M101 38 L110 38' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M106.5 40 L110 38 L106.5 36' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></g><g class='pop d2'><rect x='112' y='4' width='96' height='68' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='124' cy='17' r='7' fill='#9c3322'/><text x='124' y='20.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='136' y='21.5' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a'>WRITE</text><text x='120' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#4a3f31'>the six lines,</text><text x='120' y='52.5' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#4a3f31'>before you close</text><text x='120' y='66' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#4a3f31'>the tab</text><path d='M209 38 L218 38' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M214.5 40 L218 38 L214.5 36' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></g><g class='pop d3'><rect x='220' y='4' width='96' height='68' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='232' cy='17' r='7' fill='#9c3322'/><text x='232' y='20.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='244' y='21.5' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a'>OPEN</text><text x='228' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#4a3f31'>the next one</text></g><g class='pop d4'><path d='M268 73 C268 96 52 96 52 74' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M48 79 L52 74 L56 79' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='160' y='107' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>then again, for every source</text></g></svg></div><p class='small fill'>Ten honest entries, some of them no, beat three perfect ones.</p></div><div class='num'>&middot; 33 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>6</div><div class='ch-title'>Line five, up close</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-scale'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p class='S'>Name the view a source argues, and its reason.</p><p class='R'>Name the method a study used, and its limit.</p><p class='P'>Name the view a source argues, and its reason.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'><span class='S'>Four words that are not the same</span><span class='R'>Five kinds of method</span><span class='P'>Line five, up close</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>34</span></li><li><span class='it'><span class='S'>Finding the perspective in a source</span><span class='R'>Finding the method in a source</span><span class='P'>Up close</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>35</span></li><li><span class='it'><span class='S'>Perspective in your own words</span><span class='R'>Method in your own words</span><span class='P'>Line five in your own words</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>36</span></li><li><span class='it'><span class='S'>Why line five matters later</span><span class='R'>Why line five matters later</span><span class='P'>Why line five matters later</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>37</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='2'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-scale'/></svg>FOLIO 6</p><div class='S'><h2>Four words that are not the same</h2><figure class='plate'><div class='pl'><span>PLATE IV B</span><span>Four words</span></div><svg class='fig' viewBox='0 0 320 238' role='img' aria-label='Four boxes, top to bottom, a made-up case. Topic, what it is about: benches in public space. Stakeholder, who has something at stake: people who sleep outside, shop owners, bus riders, the county. Lens, the filter it is seen through: ethical, is it fair? economic, who pays? political, who decides? Three of eight. Perspective, a view with its reason: shelter comes first, so a bar only moves the problem. It carries a check sign and the words line five. Only the last one goes on line five.'><rect x='4' y='2' width='312' height='39' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='12' y='18' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a'>TOPIC</text><text x='57' y='18' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>what it is about</text><text x='12' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>benches in public space</text><rect x='4' y='46' width='312' height='54' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='12' y='62' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a'>STAKEHOLDER</text><text x='101.4' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>who has something at stake</text><text x='12' y='78' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>people who sleep outside, shop owners,</text><text x='12' y='93' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>bus riders, the county</text><rect x='4' y='105' width='312' height='54' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='12' y='121' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a'>LENS</text><text x='49.6' y='121' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>the filter it is seen through</text><text x='12' y='137' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>ethical: is it fair? economic: who pays?</text><text x='12' y='152' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>political: who decides? Three of eight.</text><rect x='4' y='164' width='312' height='54' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.4'/><text x='12' y='180' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#245e55'>PERSPECTIVE</text><text x='101.4' y='180' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>a view with its reason</text><text x='12' y='196' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>shelter comes first, so a bar only</text><text x='12' y='211' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='600' fill='#1f3a5a' font-style='italic'>moves the problem</text><path d='M284 176.5 L287.8 180 L294 172' fill='none' stroke='#245e55' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><text x='308' y='211' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#245e55' text-anchor='end'>line five</text><text x='4' y='233' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322'>Only the last one goes on line five. A made-up case.</text></svg><figcaption><b>SHARED</b>The Field Guide and other books point here for these four words.</figcaption></figure></div><div class='R'><h2>Five kinds of method</h2><div class='icl'><div class='rise d1'><svg class='ic' aria-hidden='true'><use href='#i-count'/></svg><p><strong>Count:</strong> tally benches with bars on 40 blocks.</p></div><div class='rise d2'><svg class='ic' aria-hidden='true'><use href='#i-question'/></svg><p><strong>Ask:</strong> survey 200 bus riders about where they sit.</p></div><div class='rise d3'><svg class='ic' aria-hidden='true'><use href='#i-eye'/></svg><p><strong>Watch:</strong> observe one bus shelter for five mornings.</p></div><div class='rise d4'><svg class='ic' aria-hidden='true'><use href='#i-clock'/></svg><p><strong>Measure:</strong> time how long people stay on each bench design.</p></div><div class='rise d5'><svg class='ic' aria-hidden='true'><use href='#i-box'/></svg><p><strong>Use data:</strong> the county&#39;s list of benches it installed.</p></div></div><p class='small'>Each is a set of steps another person could repeat. That is what makes it a method.</p><svg class='fig' viewBox='0 0 320 88' role='img' aria-label='Which method fits your question? How common: count. What people think: ask. What people do: watch.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>YOUR QUESTION ASKS</text><text x='206' y='11' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#245e55'>SO YOU</text><rect x='4' y='16' width='180' height='20' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='10' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>&quot;How common&quot;</text><path d='M184 26 L204 26' fill='none' stroke='#245e55' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M200.5 28 L204 26 L200.5 24' fill='none' stroke='#245e55' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='206' y='16' width='110' height='20' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='212' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>count</text><rect x='4' y='40' width='180' height='20' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='10' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>&quot;What people think&quot;</text><path d='M184 50 L204 50' fill='none' stroke='#245e55' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M200.5 52 L204 50 L200.5 48' fill='none' stroke='#245e55' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='206' y='40' width='110' height='20' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='212' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>ask</text><rect x='4' y='64' width='180' height='20' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='10' y='78' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>&quot;What people do&quot;</text><path d='M184 74 L204 74' fill='none' stroke='#245e55' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M200.5 76 L204 74 L200.5 72' fill='none' stroke='#245e55' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='206' y='64' width='110' height='20' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='212' y='78' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>watch</text></svg><p class='small' style='margin-top:1.6cqw'>Every method has a limit. Counting benches tells you how many, not why. Name the limit in your log.</p></div><div class='P'><h2>Line five, up close</h2><svg class='fig' viewBox='0 0 260 70' role='img' aria-label='Two boxes. AP Seminar: find a view and its reason; signal words so, because, should. AP Research: find the method it used; signal words we surveyed, sample.'><rect x='2' y='2' width='124' height='66' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='9' y='17' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a'>AP SEMINAR</text><text x='9' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>a view and</text><text x='9' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>its reason</text><text x='9' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>so, because, should</text><rect x='134' y='2' width='124' height='66' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='141' y='17' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a'>AP RESEARCH</text><text x='141' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>the method</text><text x='141' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>it used</text><text x='141' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>we surveyed, sample</text></svg><p>Pick your period inside the cover to see your course&#39;s version.</p></div></div><div class='num'>&middot; 34 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><div class='S'><h3>Finding the perspective in a source</h3><svg class='fig' viewBox='0 0 400 150' role='img' aria-label='One bench with a bar in the middle, and three views of it. Open to all, so no sleeping. Shelter first, so a bar moves it. Short visits, so shops survive.'><g fill='none' stroke='#1d1812' stroke-width='3' stroke-linecap='round'><rect x='110' y='104' width='180' height='14' rx='3'/><rect x='110' y='84' width='180' height='14' rx='3'/><line x1='130' y1='118' x2='130' y2='144'/><line x1='270' y1='118' x2='270' y2='144'/></g><line class='draw d1' pathLength='1' x1='200' y1='90' x2='200' y2='118' stroke='#9c3322' stroke-width='7' stroke-linecap='round'/><g class='pop d2'><g fill='#fbf7ec' stroke='#245e55' stroke-width='2.2'><rect x='4' y='6' width='124' height='50' rx='12'/><rect x='138' y='2' width='124' height='50' rx='12'/><rect x='272' y='6' width='124' height='50' rx='12'/></g><g fill='none' stroke='#245e55' stroke-width='2.2'><path d='M60 56 l12 18 l10 -18'/><path d='M196 52 l4 22 l10 -22'/><path d='M330 56 l-12 18 l-8 -18'/></g><g font-family='Cormorant Garamond,serif' font-size='14.5' fill='#1d1812' text-anchor='middle'><text x='66' y='26' font-weight='700'>Open to all</text><text x='66' y='44'>so no sleeping</text><text x='200' y='22' font-weight='700'>Shelter first</text><text x='200' y='40'>so a bar moves it</text><text x='334' y='26' font-weight='700'>Short visits</text><text x='334' y='44'>so shops survive</text></g></g></svg><p>Look for the claim and the word that carries its reason: <strong>so, because, therefore, should</strong>. Write the view and its reason.</p><p class='small'>&quot;The city&quot; is a stakeholder, not a perspective. &quot;Benches&quot; is a topic.</p><div class='card2 try'><div class='k'>TRY IT</div><p><em>&quot;Because bus riders need rest, the county should keep its benches open to everyone.&quot;</em></p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>View: benches should serve riders. Reason: riders need rest.</p></div></div><div class='R'><h3>Finding the method in a source</h3><svg class='fig' viewBox='0 0 400 150' role='img' aria-label='A study page: the abstract at the top, then a Methods box: we surveyed 400 benches on 40 blocks, coded for dividers.'><g fill='#fbf7ec' stroke='#1d1812' stroke-width='2'><rect x='90' y='4' width='220' height='142' rx='3'/></g><g stroke='#8a7a5c' stroke-width='3' stroke-linecap='round'><line x1='110' y1='22' x2='290' y2='22'/><line x1='110' y1='34' x2='250' y2='34'/></g><text x='110' y='56' font-family='Space Mono,monospace' font-size='13' fill='#9c3322'>ABSTRACT</text><g stroke='#b9a987' stroke-width='2.4'><line x1='110' y1='66' x2='290' y2='66'/><line x1='110' y1='76' x2='270' y2='76'/></g><rect class='pop d2' x='104' y='86' width='192' height='50' rx='3' fill='rgba(36,94,85,.12)' stroke='#245e55' stroke-width='2'/><text x='110' y='100' font-family='Space Mono,monospace' font-size='13' fill='#245e55'>METHODS</text><text x='112' y='116' font-family='Cormorant Garamond,serif' font-size='13' fill='#1d1812'>We surveyed 400 benches</text><text x='112' y='130' font-family='Cormorant Garamond,serif' font-size='13' fill='#1d1812'>on 40 blocks, coded for dividers.</text></svg><p>Read the abstract, then look for a Methods section. Signal words: <strong>we surveyed, we observed, participants, sample, data from</strong>.</p><p class='small'>No method anywhere? Write &quot;none stated.&quot; That is a finding: an opinion piece, not a study.</p><div class='card2 try'><div class='k'>TRY IT</div><p><em>&quot;We interviewed 30 shop owners on Flagler Street in May 2024.&quot;</em></p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Method: interviews; 30 owners; one street; one month.</p></div></div><div class='P'><h3>Up close</h3><svg class='fig' viewBox='0 0 260 70' role='img' aria-label='Two boxes. AP Seminar: find a view and its reason; signal words so, because, should. AP Research: find the method it used; signal words we surveyed, sample.'><rect x='2' y='2' width='124' height='66' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='9' y='17' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a'>AP SEMINAR</text><text x='9' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>a view and</text><text x='9' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>its reason</text><text x='9' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>so, because, should</text><rect x='134' y='2' width='124' height='66' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='141' y='17' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a'>AP RESEARCH</text><text x='141' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>the method</text><text x='141' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31'>it used</text><text x='141' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>we surveyed, sample</text></svg><p>Pick your period inside the cover to see your course&#39;s version.</p></div></div><div class='num'>&middot; 35 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><div class='S'><h2>Perspective in your own words</h2><p>A perspective is a point of view with its reason. Name both.</p><svg class='fig' viewBox='0 0 320 90' role='img' aria-label='The pattern with its blanks filled, a made-up case: It takes the view that, blank one, the view: shelter comes first; because, blank two, the reason: a bar only moves the problem.'><text x='4' y='16' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>It takes the view that</text><rect x='132' y='2' width='184' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='137' y='16.5' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>shelter comes first</text><text x='135' y='33' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>THE VIEW</text><text x='4' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>, because</text><rect x='58' y='42' width='258' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='63' y='56.5' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>a bar only moves the problem</text><text x='61' y='73' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>THE REASON</text><text x='316' y='86' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case.</text></svg><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>An op-ed says: \"Our parks belong to everyone, so no one should be moved along.\" What is its perspective?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>Open access comes first, because public space belongs to everyone.</p></div></div><div class='R'><h2>Method in your own words</h2><p>A method is the steps someone took to find out. Name what they did, to whom or what, where, and when.</p><svg class='fig' viewBox='0 0 320 90' role='img' aria-label='The pattern with its blanks filled, a made-up case: The researchers, blank one, did what: coded; blank two, to whom or what: 400 benches; in, blank three, where: 40 blocks, two kinds of street; blank four, when: 2020.'><text x='4' y='16' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>The researchers</text><rect x='92' y='2' width='70' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='97' y='16.5' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>coded</text><text x='95' y='33' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>DID WHAT</text><rect x='168' y='2' width='148' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='173' y='16.5' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>400 benches</text><text x='171' y='33' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>TO WHOM OR WHAT</text><text x='4' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>in</text><rect x='20' y='42' width='214' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='25' y='56.5' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>40 blocks, two kinds of street</text><text x='23' y='73' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>WHERE</text><rect x='240' y='42' width='76' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='245' y='56.5' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>2020</text><text x='243' y='73' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>WHEN</text><text x='316' y='86' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case.</text></svg><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>A study says: \"We interviewed 40 bus riders at four stops in March.\" What is its method?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>Interviews with 40 bus riders at four stops, in March.</p></div></div><div class='P'><h2>Line five in your own words</h2><svg class='fig' viewBox='0 0 320 162' role='img' aria-label='Two patterns with empty blanks. AP Seminar: It takes the view that, blank, the view; because, blank, the reason. AP Research: The researchers, blank, did what; blank, to whom or what; in, blank, where; blank, when.'><text x='4' y='16' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>It takes the view that</text><rect x='132' y='2' width='184' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='135' y='33' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>THE VIEW</text><text x='4' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>, because</text><rect x='58' y='42' width='258' height='20' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='61' y='73' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>THE REASON</text><g transform='translate(0 84)'><text x='4' y='16' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>The researchers</text><rect x='92' y='2' width='70' height= 0 26 l40 -14'/><path class='draw d3' pathLength='1' d='M280 46 l40 0'/><path class='draw d4' pathLength='1' d='M280 66 l40 14'/></g><g class='pop d5' fill='none' stroke='#245e55' stroke-width='3.2'><rect x='324' y='2' width='54' height='22' rx='3'/><rect x='324' y='35' width='54' height='22' rx='3'/><rect x='324' y='68' width='54' height='22' rx='3'/></g><text x='65' y='122' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#4a3f31'>down: stay on it</text><text x='290' y='112' text-anchor='middle' font-family='Space Mono,monospace' font-size='13' fill='#245e55'>across: leave the page</text></svg><p>The page says what it wants you to think. What others say about it tells you whether to trust it.</p><p class='small fill'>Search: the author in quotes; the publisher plus &quot;about&quot;; the title in quotes.</p></div><div class='num'>&middot; 38 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","label":"Folio 7","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Down or across</h2><p>The page says what it wants you to think. Other pages tell you whether to trust it.</p><figure class='plate'><div class='pl'><span>PLATE V</span><span>Four moves, one source</span></div><svg class='fig' viewBox='0 0 320 240' role='img' aria-label='A worked example of four moves on a made-up source, with made-up findings; a simple drawing, not the real screen. 1, stop: who made this? The source page: Who Is the Bench For? Maya Ortiz. City Design Review, 2021. 2, leave: new tabs. 3, search, one new tab each. Typed, Maya Ortiz in quotation marks: a city planner who writes about public space. Typed, City Design Review about: a magazine about city design, since 1998. Typed, Who Is the Bench For? in quotation marks: two other articles cite it. 4, decide: keep it, drop it, or check more. Here: keep it. Other pages say who made it.'><g class='pop d1' f6' stroke='#1f3a5a' stroke-width='1'/><text x='10' y='102' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#1f3a5a'>typed: &quot;Maya Ortiz&quot;</text><text x='10' y='115' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>a city planner who writes about public space</text><rect x='4' y='124' width='312' height='30' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='10' y='136' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#1f3a5a'>typed: City Design Review about</text><text x='10' y='149' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>a magazine about city design, since 1998</text><rect x='4' y='158' width='312' height='30' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><text x='10' y='170' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#1f3a5a'>typed: &quot;Who Is the Bench For?&quot;</text><text x='10' y='183' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>two other articles cite it</text></g><g class='pop d4'><rect x='4' y='192' width='312' height='32' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.4'/><circle cx='14' cy='208' r='7.5' fill='#9c3322'/><text x='14' y='211.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>4</text><path d='M26 203.9 L29.4 207.1 L35 199.9' fill='none' stroke='#245e55' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><text x='40' y='205' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>DECIDE: keep it, drop it, or check more.</text><text x='40' y='219' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Here: keep it. Other pages say who made it.</text></g><text x='4' y='236' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='700' fill='#4a3f31'>A made-up source and findings. A simple drawing, not the real screen.</text></svg><figcaption><b>ACROSS WINS</b>Search the author in quotes, the publisher plus \"about\", and the title in quotes.</figcaption></figure></div><div class='num'>&middot; 39 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Fixing a citation</h3><svg class='fig' viewBox='0 0 320 122' role='img' aria-label='A made-up source, fixed in pen. Line 2 as first written: Chen, D. Counting Benches. 2021. It is crossed out with one line and still readable, note 1. Under it, note 2: Fixed October 2, 2026, from the journal page. Then note 3, the citation copied from the real publication: Chen, David, and Rosa Diaz. Counting Hostile Design. Street Design Quarterly, 2020. One line through the old one. Never erased.'><rect x='2' y='2' width='316' height='104' rx='2' fill='#fffdf6' stroke='#b9ad93' stroke-width='1'/><line x1='2' y1='22' x2='318' y2='22' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='38' x2='318' y2='38' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='54' x2='318' y2='54' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='70' x2='318' y2='70' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='86' x2='318' y2='86' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='102' x2='318' y2='102' stroke='#b7cbe0' stroke-width='.7'/><line x1='22' y1='2' x2='22' y2='106' stroke='#d7776b' stroke-width='1'/><text x='28' y='18' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>2. Chen, D. Counting Benches. 2021.</text><line x1='26' y1='14' x2='206' y2='14' stroke='#1f2a5a' stroke-width='1.3'/><circle cx='222' cy='14' r='7.5' fill='#9c3322'/><text x='222' y='17.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='28' y='38' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#9c3322'>Fixed October 2, 2026, from the journal page:</text><circle cx='292' cy='34' r='7.5' fill='#9c3322'/><text x='292' y='37.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='28' y='56' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>Chen, David, and Rosa Diaz. &quot;Counting Hostile</text><text x='28' y='72' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>Design.&quot; Street Design Quarterly, 2020.</text><circle cx='262' cy='68' r='7.5' fill='#9c3322'/><text x='262' y='71.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='28' y='96' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>One line through the old one. Never erased.</text><text x='314' y='118' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up source.</text></svg><p><b>1</b> one line through the mistake. <b>2</b> the date of the fix. <b>3</b> the title, author, and year exactly as the real publication shows them. Not from your own page, not from a list someone gave you.</p><p>Different? Write the correction. Not there at all? Write exactly that, and drop the source.</p><p class='small fill'>A made-up source. On Verify One this is part A2.</p></div><div class='num'>&middot; 40 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-search'/></svg>FOLIO 7</p><h2>How far to trust it</h2><div class='moves' style='grid-template-columns:repeat(2,1fr)'><div class='rise d1'><strong>Who wrote it?</strong><span>their training, their job, their record</span></div><div class='rise d2'><strong>What kind is it?</strong><span>study, report, news, opinion, advocacy</span></div><div class='rise d3'><strong>When?</strong><span>current enough for your question?</span></div><div class='rise d4'><strong>Why was it made?</strong><span>to inform, to persuade, to sell</span></div></div><svg class='fig' viewBox='0 0 400 128' role='img' aria-label='Three levels of trust, top to bottom: peer-reviewed, credible popular, needs heavy checking.'><g class='pop d1'><rect x='8' y='6' width='384' height='34' rx='4' fill='#fbf7ec' stroke='#245e55' stroke-width='2.4'/><text x='20' y='28' font-family='Fraunces,serif' font-weight='700' font-size='15' fill='#245e55'>Peer-reviewed</text></g><g class='pop d2'><rect x='22' y='46' width='356' height='34' rx='4' fill='#fbf7ec' stroke='#6d4f14' stroke-width='2.4'/><text x='34' y='68' font-family='Fraunces,serif' font-weight='700' font-size='15' fill='#6d4f14'>Credible popular</text></g><g class='pop d3'><rect x='36' y='86' width='328' height='34' rx='4' fill='#fbf7ec' stroke='#9c3322' stroke-width='2.4'/><text x='48' y='108' font-family='Fraunces,serif' font-weight='700' font-size='15' fill='#9c3322'>Needs heavy checking</text></g></svg><p class='small'>Peer-reviewed: checked by other experts. Credible popular: known publishers and agencies. The last row needs the most checking.</p><p class='small fill'>Every source has a point of view. Bias means you check it against others, not that you throw it out.</p></div><div class='num'>&middot; 41 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","label":"Folio 7","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>The trust ladder</h2><figure class='plate'><div class='pl'><span>PLATE VI</span><span>How far to trust it</span></div><svg class='fig' viewBox='0 0 320 226' role='img' aria-label='A ladder with three levels. Peer-reviewed: checked by other experts. Credible popular: known publishers and agencies. Needs heavy checking: the most checking. Under it, four questions. Who: training, job, record. What kind: study, news, opinion. When: current enough? Why: inform, persuade, sell.'><path d='M110.0 8 H210.0 L220.0 46 H100.0 Z' fill='#245e55' opacity='.92'/><text x='160' y='25' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3ead6' text-anchor='middle'>PEER-REVIEWED</text><text x='160' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#f3ead6' text-anchor='middle'>checked by other experts</text><path d='M75.0 54 H245.0 L255.0 92 H65.0 Z' fill='#1f3a5a' opacity='.92'/><text x='160' y='71' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3ead6' text-anchor='middle'>CREDIBLE POPULAR</text><text x='160' y='85' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#f3ead6' text-anchor='middle'>known publishers and agencies</text><path d='M40.0 100 H280.0 L290.0 138 H30.0 Z' fill='#9c3322' opacity='.92'/><text x='160' y='117' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3ead6' text-anchor='middle'>NEEDS HEAVY CHECKING</text><text x='160' y='131' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#f3ead6' text-anchor='middle'>the most checking</text><rect x='8' y='150' width='150' height='32' rx='3' fill='#fbf6ea' stroke='#b8903f' stroke-width='1'/><text x='16' y='162' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WHO</text><text x='16' y='176' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#1d1812'>training, job, record</text><rect x='162' y='150' width='150' height='32' rx='3' fill='#fbf6ea' stroke='#b8903f' stroke-width='1'/><text x='170' y='162' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WHAT KIND</text><text x='170' y='176' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#1d1812'>study, news, opinion</text><rect x='8' y='186' width='150' height='32' rx='3' fill='#fbf6ea' stroke='#b8903f' stroke-width='1'/><text x='16' y='198' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WHEN</text><text x='16' y='212' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#1d1812'>current enough?</text><rect x='162' y='186' width='150' height='32' rx='3' fill='#fbf6ea' stroke='#b8903f' stroke-width='1'/><text x='170' y='198' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WHY</text><text x='170' y='212' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#1d1812'>inform, persuade, sell</text></svg><figcaption><b>BIAS</b>Every source has a point of view. Bias means you check it against others, not that you throw it out.</figcaption></figure><p class='small fill'>Ask the four questions of every source, whatever its level.</p></div><div class='num'>&middot; 42 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Primary or secondary?</h3><div class='twocol'><div class='card2 good rise d1'><div class='k'>PRIMARY</div><p>An original source: a study, an artifact, a data set, an interview.</p></div><div class='card2 rise d2'><div class='k'>SECONDARY</div><p>Writing about primary sources: it explains or judges them.</p></div></div><div class='notes'><div><svg class='ic sm' aria-hidden='true'><use href='#i-box'/></svg><p>Chen and Diaz&#39;s count of 400 benches: <strong>primary</strong>. Their own data.</p></div><div><svg class='ic sm' aria-hidden='true'><use href='#i-link'/></svg><p>Ortiz&#39;s article arguing about benches: <strong>secondary</strong>.</p></div><div><svg class='ic sm' aria-hidden='true'><use href='#i-box'/></svg><p>Your own count of benches: <strong>primary research</strong>.</p></div></div><div class='card2 try' style='margin-top:1.6cqw'><div class='k'>TRY IT</div><p>The county&#39;s own survey of 200 bus riders, and a magazine column about it: which is which?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Survey: primary. Column: secondary.</p></div><div class='R'><p class='box fill' style='margin-bottom:0'>Asking or watching people? I review your plan for ethics before you collect anything.</p></div><div class='S'><p class='box fill' style='margin-bottom:0'>Label it on line 2: (primary) or (secondary).</p></div><div class='P'><p class='small fill'>Pick your period inside the cover to see your course&#39;s version.</p></div></div><div class='num'>&middot; 43 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Red flags</h2><p>One flag is a reason to check harder. Two or more: find a better source.</p><ul class=''><li>No author, or no date.</li><li>The site sells something the article praises.</li><li>Quotes or numbers with no source.</li><li>The only place that makes the claim.</li><li>A headline stronger than the article under it.</li><li>A citation you cannot find anywhere, a sign it may be invented.</li></ul><svg class='fig' viewBox='0 0 320 62' role='img' aria-label='A gauge with three steps that rise in height. 0 flags: check as usual. 1 flag: check harder. 2 or more flags: find a better source.'><rect x='4' y='26' width='102' height='14' rx='2' fill='#fbf6ea' stroke='#245e55' stroke-width='1.4'/><text x='10' y='38' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#245e55'>0 flags</text><text x='10' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#245e55'>check as usual</text><rect x='111' y='16' width='102' height='24' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.4'/><text x='117' y='28' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>1 flag</text><text x='117' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>check harder</text><rect x='218' y='6' width='102' height='34' rx='2' fill='#f6e4df' stroke='#9c3322' stroke-width='1.4'/><text x='224' y='18' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#9c3322'>2 or more</text><text x='224' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#9c3322'>find a better source</text></svg><p class='small fill'>Check a flag by leaving the page: read laterally, in new tabs.</p></div><div class='num'>&middot; 44 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A source a chatbot gave you</h3><p>Chatbots can invent sources that look real. A made-up source in your work scores 0.</p><figure class='plate'><div class='pl'><span>PLATE VI B</span><span>Source, quote, or number</span></div><svg class='fig' viewBox='0 0 320 204' role='img' aria-label='A decision tree. Start: a tool gives you a source. Step 1: search the exact title, in quotation marks, in Google Scholar or a library database. Found it? No: it stays out; it does not exist for iable, a comparison, a scope, and doable this year.</p></div></div><div class='P'><p>Pick your period inside the cover to see your course&#39;s version.</p></div><p class='small fill'>Dots 1 to 7 are the seven checks on page 46. Filled means it passes.</p></div><div class='num'>&middot; 47 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Why questions change</h2><p>A question that changes is research that is working. It changes for a reason.</p><table class='stages'><thead><tr><th>WHAT HAPPENED</th><th>WHAT TO CHANGE</th></tr></thead><tbody><tr><th>The answer is yes or no.</th><td>Ask how, why, or to what extent.</td></tr><tr><th>It is too big.</th><td>Add a place, a group, or a time.</td></tr><tr><th>The answer is already known.</th><td>Move to the part no one has studied.</td></tr><tr><th>There are no sources.</th><td>Widen it, or change the words you search.</td></tr><tr><th>A source surprised you.</th><td>Follow the surprise.</td></tr></tbody></table><p class='small fill'>Every change gets a version line. That line is proof of your thinking.</p></div><div class='num'>&middot; 48 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","label":"Folio 8","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>How a question narrows</h2><div class='S'><figure class='plate'><div class='pl'><span>PLATE VII</span><span>One question, three versions</span></div><svg class='fig' viewBox='0 0 320 275.5' role='img' aria-label='Three versions of one research question, AP Seminar, a made-up case, top to bottom. Version 1: Are anti-homeless benches bad? It passes 1 of 7 checks: check 2. Then the version line: added a place: Miami. Version 2: Are bench bars in Miami bad? It passes 2 of 7 checks: ch  5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-tool'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Tell an allowed use of a tool that writes from one that is not allowed.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Tools that write: the College Board&#39;s rule</span><span class='ld' aria-hidden='true'></span><span class='pn'>51</span></li><li><span class='it'>Stage by stage</span><span class='ld' aria-hidden='true'></span><span class='pn'>52</span></li><li><span class='it'>The line, stage by stage</span><span class='ld' aria-hidden='true'></span><span class='pn'>53</span></li><li><span class='it'>The four allowed uses</span><span class='ld' aria-hidden='true'></span><span class='pn'>54</span></li><li><span class='it'>Three things only you can do</span><span class='ld' aria-hidden='true'></span><span class='pn'>55</span></li><li><span class='it'>Prompts: support or shortcut?</span><span class='ld' aria-hidden='true'></span><span class='pn'>56</span></li><li><span class='it'>Before you open a tool</span><span class='ld' aria-hidden='true'></span><span class='pn'>57</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-tool'/></svg>FOLIO 9</p><h2>Tools that write: the College Board&#39;s rule</h2><p>Tools that write are allowed in AP Capstone only to support your learning, never to skip it. Using one is optional. You never need one.</p><p>Three things are always yours:</p><div class='tiles'><div class='rise d1'><svg class='ic big' aria-hidden='true'><use href='#i-eye'/></svg><strong>Reading</strong><span>the sources, the originals</span></div><div class='rise d2'><svg class='ic big' aria-hidden='true'><use href='#i-link'/></svg><strong>Thinking</strong><span>what they mean together</span></div><div class='rise d3'><svg class='ic big' aria-hidden='true'><use href='#i-pen'/></svg><strong>Words</strong><span>on the page and out loud</span></div></div><p>In a checkpoint I may ask you to explain any sentence you wrote. That is easy when the words are yours.</p><p class='small fill'>From the College Board&#39;s rules for tools that write, in the AP Seminar and AP Research course descriptions. Checked September 25, 2026.</p></div><div class='num'>&middot; 51 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Stage by stage</h3><table class='stages'><thead><tr><th>When you are</th><th>Allowed</th><th>Not allowed</th></tr></thead><tbody><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-compass'/></svg>Exploring a topic</th><td>See what people debate</td><td>Have it write your question</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-search'/></svg>Finding sources</th><td>Get names to look up, then read them</td><td>Cite what you did not read</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-book'/></svg>Reading a hard text</th><td>Check you understood it</td><td>Let it compare or combine sources</td></tr><tr class='R'><th><svg class='ic sm' aria-hidden='true'><use href='#i-steps'/></svg>Choosing a method</th><td>Pros and cons of common methods</td><td>Let it design your study</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-pen'/></svg>Writing</th><td>Grammar and tone</td><td>Write or rewrite your sentences</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-podium'/></svg>Presenting</th><td>First ideas and their order</td><td>A script to read or memorize; answers to the questions you are asked</td></tr></tbody></table><div class='S'><p class='small' style='margin-top:1.6cqw'>In the team project, the rule covers every member: one member&#39;s misuse can cost the whole team its score.</p></div><p class='small fill' style='margin:1.2cqw 0 0'><strong>Not sure a use is allowed?</strong> Ask me before, not after.</p></div><div class='num'>&middot; 52 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","label":"Folio 9","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>The line, stage by stage</h2><div class='S'><figure class='plate'><div class='pl'><span>PLATE VIII</span><span>Each stage, both sides</span></div><svg class='fig' viewBox='0 0 320 235' role='img' aria-label='A grid of research stages for AP Seminar. For each stage, what a tool may do and what it may not do. Explore: allowed: see the debate; not allowed: write your question. Find: allowed: names to look up, then you read them; not allowed: a source list you did not open. Read: allowed: check you understood; not allowed: a summary in place of reading. Connect: no allowed use; not allowed: compare or combine sources. Write: allowed: grammar and tone; not allowed: write or rewrite your sentences. Present: allowed: first ideas and their order; not allowed: a script to read or memorize. Defend: no allowed use; not allowed: answers to practice questions. Source: the College Board table, checked September 25, 2026.'><path d='M82 8.4 L85 11.2 L90 4.8' fill='none' stroke='#245e55' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='95' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>ALLOWED</text><path d='M204 4 L211 11 M211 4 L204 11' fill='none' stroke='#9c3322' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='216' y='12' font-family='Sp
