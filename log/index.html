.ttab.left{background:linear-gradient(270deg,#3a0b10 0,#6d1b22 34%,#7c232a 70%,#5a141a 100%);box-shadow:inset 0 0 0 2px #4a1016,inset 0 0 0 3px rgba(236,208,138,.45),-2px 2px 5px -2px rgba(0,0,0,.6)}
.ttab:hover{color:#fbe9b4}
.ttab.here,.ttab.left.here{background:linear-gradient(90deg,#b48a3f,#f1d58e 55%,#c79c4c);color:#4a1016;border-color:#f1d58e;box-shadow:inset 0 0 0 2px rgba(74,16,22,.35),2px 2px 5px -2px rgba(0,0,0,.6)}
.ttab.here:hover{color:#2a070a}
.ttab:focus-visible{outline:3px solid #fbe9b4;outline-offset:2px}
.panel:has(.pick){top:5.5%;bottom:5.5%;padding:5cqw 6.5cqw;font-size:4.2cqw;line-height:1.28}
.panel:has(.pick) .kept{margin-bottom:1.4cqw}
.panel:has(.pick) .who{font-size:clamp(5.2cqw,calc(9.5cqw - var(--nl,10) * .14cqw),7.6cqw);line-height:1.06;margin-bottom:1.6cqw;text-wrap:balance}
.panel:has(.pick) .meta{margin-bottom:2.4cqw}
.panel:has(.pick) .box{font-size:4cqw;line-height:1.28;padding:1.8cqw 2.6cqw;margin:0 0 2cqw}
.panel:has(.pick) p.small{font-size:max(11px,3.5cqw);line-height:1.3}
.panel .pick{width:100%;margin:0 0 3cqw}
.panel .drawers{grid-template-columns:repeat(4,1fr);gap:1.6cqw;padding:0;background:none;border:0;box-shadow:none}
.panel .drw{min-height:9.5cqw!important;display:grid;place-items:center;background:linear-gradient(180deg,#fbf6e8,#efe3c6);border:1.5px solid #b8903f;border-radius:3px;padding:1.1cqw .6cqw;box-shadow:0 .5cqw 0 -.1cqw rgba(110,80,30,.3)}
.panel .drw .holder{background:none;border:0;padding:.3cqw 0;color:#4a1016;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:3.8cqw}
.panel .drw .pull{display:none}
.panel .drw:hover{border-color:#6d1b22}
.panel .drw[aria-pressed=true]{background:linear-gradient(180deg,#7c232a,#5a141a);border-color:#b48a3f;transform:translateY(-.8cqw);box-shadow:inset 0 0 0 .45cqw #4a1016,inset 0 0 0 .65cqw rgba(236,208,138,.6),0 1.4cqw 1.2cqw -.8cqw rgba(0,0,0,.45)}
.panel .drw[aria-pressed=true] .holder{background:none;color:#ecd08a}
.panel .drw:focus-visible{outline:3px solid #6d1b22;outline-offset:2px}
.panel:has(.pick) .meta{font-size:3.1cqw;letter-spacing:.04em;text-wrap:balance}
.pg .sidewrap{display:flow-root}.pg .sidewrap>p:last-child{margin-bottom:0}
.pg svg.spot.side{float:right!important;width:17cqw!important;margin:.2cqw 0 .6cqw 2.4cqw!important}
.pj{all:unset;display:inline-block;cursor:pointer;font:inherit;font-weight:700;color:#8a2d1e;text-decoration:underline;text-underline-offset:2px;padding:0 .2em;text-align:center}
.pj:focus-visible{outline:3px solid #1b4d45;outline-offset:2px}
.pb-B .panel .drw,.pb-C .panel .drw,.pb-D .panel .drw{--pbh:max(9.5cqw,min(calc(var(--tap,44px) * 1.05),15.4cqw))}
.pb-B .stage.narrow:not(.single) .panel .drw,.pb-C .stage.narrow:not(.single) .panel .drw,.pb-D .stage.narrow:not(.single) .panel .drw{--pbh:12cqw}
.pb-B .panel:has(.pick) .meta,.pb-C .panel:has(.pick) .meta,.pb-D .panel:has(.pick) .meta{letter-spacing:.03em;text-wrap:balance}
.pb-B .panel .holder::first-letter,.pb-C .panel .holder::first-letter,.pb-D .panel .holder::first-letter{font-size:.6em}
.pb-B .panel .pick{width:auto;margin:0 -2.4cqw 3cqw}
.pb-B .panel .drawers{grid-template-columns:5.2cqw repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:1.5cqw 1.3cqw!important;padding:0!important;background:none!important;border:0!important;box-shadow:none!important}
.pb-B .panel .drawers::before,.pb-B .panel .drawers::after{grid-column:1;display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-weight:700;font-size:max(10px,2.6cqw);letter-spacing:.1em;line-height:1;color:#ecd08a;background:linear-gradient(90deg,#3a0b10 0,#6d1b22 34%,#7c232a 70%,#5a141a 100%);border:1px solid #b48a3f;border-radius:.8cqw;box-shadow:inset 0 0 0 .3cqw #4a1016,inset 0 0 0 .45cqw rgba(236,208,138,.5)}
.pb-B .panel .drawers::before{content:"A DAY";grid-row:1}
.pb-B .panel .drawers::after{content:"B DAY";grid-row:2}
.pb-B .panel .drw{min-height:var(--pbh)!important;grid-template-rows:auto auto;align-content:center;row-gap:.5cqw;padding:.6cqw .3cqw!important;border-radius:.8cqw;background:linear-gradient(180deg,#fdf9ee,#efe3c6);border:1.5px solid #b8903f;box-shadow:inset 0 0 0 .35cqw #fdf9ee,inset 0 0 0 .5cqw rgba(184,144,63,.45),0 .5cqw 0 -.1cqw rgba(110,80,30,.3)}
.pb-B .panel .drw .holder{font-size:5.2cqw;line-height:1;padding:0;color:#4a1016}
.pb-B .panel .drw::after{content:attr(data-c);font-family:var(--body);font-style:italic;font-weight:700;font-size:max(11px,3.3cqw);line-height:1;color:#5b3a1e}
.pb-B .panel .drw:hover{border-color:#6d1b22}
.pb-B .panel .drw[aria-pressed=true]{transform:translateY(-.6cqw);background:linear-gradient(180deg,#7c232a,#5a141a);border-color:#b48a3f;box-shadow:inset 0 0 0 .4cqw #4a1016,inset 0 0 0 .6cqw rgba(236,208,138,.6),0 1.4cqw 1.2cqw -.8cqw rgba(0,0,0,.45)}
.pb-B .panel .drw[aria-pressed=true] .holder{color:#ecd08a}
.pb-B .panel .drw[aria-pressed=true]::after{color:#f6e3b4}
</style>

 in Room 63, five cases</span></button></li><li><button type='button' data-jump='75'><span class='rn'>11</span><span class='tt'><span class='tl'>Notebook check 1</span><span class='ld' aria-hidden='true'></span><span class='pn'></span></span><span class='sb'>the date, and a self-check</span></button></li><li><button type='button' data-jump='80'><span class='rn'>12</span><span class='tt'><span class='tl'>Where the log goes</span><span class='ld' aria-hidden='true'></span><span class='pn'></span></span><span class='sb'>this year, step by step, a log that passes</span></button></li></ul><div class='card2' style='margin-top:2.2cqw'><div class='k'>SIGNS IN THIS BOOK</div><svg class='fig' viewBox='0 0 320 73' role='img' aria-label='Signs in this book. A check: strong, or allowed. A cross: weak, or not allowed. A filled or empty dot: a check passes, or does not. A red number in a circle: a numbered note, read in order. A dashed box: waiting on a Room 63 decision. A flag: a College Board date, checked. Handwriting, such as Entry 8: words a student writes. A clipboard: run the checks on your work. The tag A made-up case: invented to show the idea; never for your own work.'><use href='#i-check' x='3' y='1.5' width='13' height='13' style='color:#245e55'/><text x='21' y='12' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>strong, or allowed</text><use href='#i-cross' x='163' y='1.5' width='13' height='13' style='color:#9c3322'/><text x='181' y='12' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>weak, or not allowed</text><circle cx='8' cy='22.5' r='4.5' fill='#245e55' stroke='#245e55' stroke-width='1.3'/><circle cx='19' cy='22.5' r='4.5' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/><text x='29' y='26' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>a check passes, or does not</text><circle cx='170' cy='22.5' r='6' fill='#9c3322'/>< proposal, permissions, and adviser log.</p></div><div class='P'><p>Pick your period inside the cover to see your course&#39;s version.</p></div><p class='small fill'>It is not graded for how it looks. It is counted for whether it is there.</p></div><div class='num'>&middot; 3 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","label":"Folio 1","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>The chain of proof</h2><p>Your work travels from a source to my signature in May. The log holds every link.</p><figure class='plate'><div class='pl'><span>PLATE I</span><span>Five links</span></div><svg class='fig' viewBox='0 0 320 196' role='img' aria-label='A chain of five boxes, top to bottom, joined by arrows. Source: you read it. Log entry: dated, in pen. Draft: your own words. Checkpoint: you explain it. Signature: May. On the left, dated all year. On the right, the log holds it.'><g class='pop d1'><rect x='70' y='6' width='180' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='160' y='19' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SOURCE</text><text x='160' y='31' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>you read it</text><path d='M160.0 37.0 L160.0 45.0' fill='none' stroke='#9c3322' stroke-width='1.4'/><path d='M158.3 41.4 L160.0 45.0 L161.7 41.4' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linejoin='round'/></g><g class='pop d2'><rect x='70' y='46' width='180' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='160' y='59' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>LOG ENTRY</text><text x='160' y='71' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5 /g><path d='M262 21 C300 60 300 150 262 181' fill='none' stroke='#4a3f31' stroke-width='1'/><text x='292' y='104' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>the log</text><text x='292' y='118' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>holds it</text><path d='M58 21 C20 60 20 150 58 181' fill='none' stroke='#4a3f31' stroke-width='1'/><text x='28' y='104' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>dated</text><text x='28' y='118' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>all year</text></svg><figcaption><b>WHY</b>Each link is dated and in your handwriting. When a checkpoint asks where an idea came from, the log answers.</figcaption></figure></div><div class='num'>&middot; 4 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-sign'/></svg>FOLIO 1</p><h2>What the log is, and is not</h2><div class='twocol'><div class='card2 good rise d1'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>THE LOG IS</div><ul class='checklist' style='margin:0'><li>a dated record of every source you read</li><li>in your handwriting, in pen</li><li>where every version of your question lives</li><li>yours, all year, in your bag</li></ul></div><div class='card2 weak rise d2'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>THE LOG IS NOT</div><ul class='checklist' style='margin:0'><li>a diary about your day</li><li>a copy of the article</li><li>typed, printed, or pasted in</li><li>handed in: the notebook stays with you</li></ul></div></div><div class='S'><div class='card2 wait' style='margin-top:1.6cqw;border:1.5px dashed #9c3322'><div class='k' style='color:#9c3322'>WAITING ON A ROOM 63 DECISION</div><p class='small' style='margin:0'>First checkpoint: the course asks for your source log. Post photos of your log pages on Google Classroom; bring the notebook to the talk.</p></div></div><div class='R'><p style='margin-top:2cqw'>Think of it as a lab notebook: what you did, written the day you did it, so anyone can follow the work later.</p></div><div class='P' style='color:inherit'><p style='margin-top:2cqw'>Think of it as a lab notebook: what you did, written the day you did it, so anyone can follow the work later.</p></div></div><div class='num'>&middot; 5 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What you need</h3><svg class='fig' viewBox='0 0 400 150' role='img' aria-label='What you need: a composition book, a pen, and sticky notes.'><g class='pop'><rect x='24' y='8' width='98' height='118' rx='3' fill='#111'/><rect x='24' y='8' width='98' height='118' rx='3' filter='url(#f-marble)'/><rect x='24' y='8' width='15.7' height='118' rx='2' fill='#141414'/><line x1='39.7' y1='8' x2='39.7' y2='126' stroke='#2c2c2c' stroke-width='1'/><rect x='51.4' y='31.6' width='60.8' height='35.4' rx='8.8' fill='#fbf7ec' stroke='#111' stroke-width='1.6'/><line x1='58.7' y1='46.5' x2='104.9' y2='46.5' stroke='#111' stroke-width='1.6'/><line x1='58.7' y1='57.1' x2='104.9' y2='57.1' stroke='#8a8172' stroke-width='1.2'/><rect x='24' y='8' width='98' height='118' rx='3' fill='none' stroke='#1d1812' stroke-width='1.8'/></g><g fill='none' stroke='#1d1812' stroke-width='2.4'><path class='draw d2' pathLength='1' d='M160 110 L230 30 l10 8 L170 118 Z'/><path class='draw d2' pathLength='1' d='M160 110 l-6 16 l16 -8'/></g><g class='pop d3'><rect x='280' y='24' width='46' height='46' fill='#f4d35e' stroke='#c9a92c' stroke-width='1.5' transform='rotate(-6 303 47)'/><rect x='300' y='44' width='46' height='46' fill='#f7df7a' stroke='#c9a92c' stroke-width='1.5' transform='rotate(5 323 67)'/></g><g font-family='Space Mono,monospace' font-size='13' fill='#4a3f31' text-anchor='middle'><text x='73' y='146'>composition book</text><text x='200' y='146'>a pen</text><text x='320' y='146'>sticky notes</text></g></svg><ul><li><strong>A composition notebook.</strong> Its pages are sewn, so every page stays in order. The log starts on its first blank page.</li><li><strong>A pen.</strong> Ink cannot be erased, and that is the point. Cross out a mistake with one line.</li><li><strong>Sticky notes</strong> for the LOG tab, so you find the log page in one second.</li></ul><p class='small fill'>The notebook comes to every class, like your laptop. It never lives in your locker.</p></div><div class='num'>&middot; 6 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>What the College Board checks</h2><p>Every AP Capstone course ends with a signature. The College Board asks me to confirm that the work you submit is yours. If I cannot confirm it, that part scores 0.</p><div class='S'><div class='card2' style='margin-top:1.4cqw'><div class='k'>AP SEMINAR: I SIGN AT THREE POINTS</div><p>1. Your sources and process, while you research.<br>2. Your argument outline, for the written argument.<br>3. Your final paper.</p></div></div><div class='R'><div class='card2' style='margin-top:1.4cqw'><div class='k'>AP RESEARCH: I SIGN FOR YOUR PORTFOLIO</div><p>Your Process and Reflection Portfolio records your year: sources, proposal, permissions, advisers, reflections. I sign that your paper grew out of it.</p></div></div><div class='P'><div class='card2' style='margin-top:1.4cqw'><div class='k'>PICK YOUR PERIOD</div><p>Seminar and Research sign at different points. Pick your period inside the cover to see yours.</p></div></div><p style='margin-top:1.6cqw'><strong>Checkpoints</strong> are short required conversations with me about your work. A missing checkpoint scores the task 0.</p><p><strong>Someone else&#39;s words</strong> with no credit are plagiarism: 0. <strong>A tool&#39;s words</strong> never go in, cited or not.</p><p class='small fill'>Your log is how I can sign: dated, handwritten, every source, every version of your question.</p></div><div class='num'>&middot; 7 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A log that did its job</h3><p class='small'>A made-up case. It shows what the log is for.</p><svg class='fig' viewBox='0 0 320 64' role='img' aria-label='A made-up case, drawn as a timeline. September: entry 1. October: entry 12. November: version 3. January: a question about her draft, drawn as a red diamond.'><line x1='14' y1='26' x2='306' y2='26' stroke='#1f3a5a' stroke-width='1.6'/><g class='pop d1'><line x1='44' y1='20.0' x2='44' y2='32.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='44' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SEPTEMBER</text><text x='44' y='47' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31' text-anchor='middle'>entry 1</text></g><g class='pop d2'><line x1='122' y1='20.0' x2='122' y2='32.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='122' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>OCTOBER</text><text x='122' y='47' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31' text-anchor='middle'>entry 12</text></g><g class='pop d3'><line x1='200' y1='20.0' x2='200' y2='32.0' stroke='#16294a' stroke-width='2.4' stroke-linecap='round'/><text x='200' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>NOVEMBER</text><text x='200' y='47' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#4a3f31' text-anchor='middle'>version 3</text></g><g class='pop d4'><path d='M278 18 L286 26 L278 34 L270 26 Z' fill='#9c3322' stroke='#1f3a5a' stroke-width='1.2'/><text x='278' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>JANUARY</text><text x='278' y='47' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle'>a question</text></g><text x='316' y='61' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case.</text></svg><p>In January, a paragraph in Maya&#39;s draft read like a published article. Her teacher asked where it came from.</p><p>Maya opened her log. Entry 12, dated in October, held the source and her line five in her own words. Version 3 of her question, dated in November, showed why she needed it.</p><p>She added the missing citation that day. Her teacher signed.</p><div class='card2' style='margin-top:1.4cqw'><div class='k'>WHAT SAVED HER WORK</div><p>A date on every entry. The source, written the day she read it. The version line each time her question changed.</p></div></div><div class='num'>&middot; 8 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>2</div><div class='ch-title'>Set up the log page</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-folder'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Set up your log page the same way as everyone, with no mistakes.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Set up the log page</span><span class='ld' aria-hidden='true'></span><span class='pn'>9</span></li><li><span class='it'>The page to copy</span><span class='ld' aria-hidden='true'></span><span class='pn'>10</span></li><li><span class='it'>The log page, annotated</span><span class='ld' aria-hidden='true'></span><span class='pn'>11</span></li><li><span class='it'>Four setup mistakes</span><span class='ld' aria-hidden='true'></span><span class='pn'>12</span></li><li><span class='it'>Make it yours</span><span class='ld' aria-hidden='true'></span><span class='pn'>13</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-folder'/></svg>FOLIO 2</p><h2>Set up the log page</h2><ol><li>Open the composition notebook to the first blank page. Not the inside cover.</li><li>Top line: <strong>MY LOG</strong>. Then your name and period.</li><li>Copy the six lines on the next page, word for word.</li><li>A sticky note on the edge of that page, poking out, with <strong>LOG</strong> on it. None yet? Fold the corner.</li><li>Your first entry goes on the next page.</li></ol><svg class='fig fill' viewBox='0 0 400 188' role='img' aria-label='An open notebook. On the left, the first blank page, headed MY LOG, holds the six lines, with a LOG tab on its edge. On the right, the next page: Entry 1.' style='width:76%'><rect x='54' y='7' width='292' height='138' rx='4' fill='#111'/><rect x='54' y='7' width='292' height='138' rx='4' filter='url(#f-marble)'/><g fill='#f7f3e8' stroke='#1d1812' stroke-width='1.8'><rect x='60' y='12' width='140' height='128' rx='2'/><rect x='200' y='12' width='140' height='128' rx='2'/></g><g stroke='#8fb0d2' stroke-width='1.3'><line x1='64' y1='34' x2='196' y2='34'/><line x1='204' y1='34' x2='336' y2='34'/><line x1='64' y1='50' x2='196' y2='50'/><line x1='204' y1='50' x2='336' y2='50'/><line x1='64' y1='66' x2='196' y2='66'/><line x1='204' y1='66' x2='336' y2='66'/><line x1='64' y1='82' x2='196' y2='82'/><line x1='204' y1='82' x2='336' y2='82'/><line x1='64' y1='98' x2='196' y2='98'/><line x1='204' y1='98' x2='336' y2='98'/><line x1='64' y1='114' x2='196' y2='114'/><line x1='204' y1='114' x2='336' y2='114'/><line x1='64' y1='130' x2='196' y2='130'/><line x1='204' y1='130' x2='336' y2='130'/></g><g stroke='#cf5b4c' stroke-width='1.5'><line x1='80' y1='14' x2='80' y2='138'/><line x1='220' y1='14' x2='220' y2='138'/></g><rect x='196' y='12' width='8' height='128' fill='#141414'/><line x1='200' y1='16' x2='200' y2='136' stroke='#e8dcc0' stroke-width='1.2'/><text x='86' y='33' font-family='Patrick Hand,cursive' font-size='21' fill='#1f2a5a' font-weight='700'>MY LOG</text><path d='M88 48 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M88 64 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M88 80 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M88 96 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M88 112 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M88 128 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M228 48 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M228 64 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M228 80 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><path d='M228 96 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0' fill='none' stroke='#1f2a5a' stroke-width='1.6' stroke-linecap='round'/><text x='226' y='33' font-family='Patrick Hand,cursive' font-size='19' fill='#1f2a5a' font-weight='700'>Entry 1</text><g class='pop d2'><rect x='186' y='22' width='30' height='20' rx='2' fill='#f4d35e' stroke='#c9a92c' stroke-width='1.5' transform='rotate(-6 200 32)'/><text x='187' y='38' font-family='Patrick Hand,cursive' font-size='15' fill='#3b3000' transform='rotate(-6 200 32)'>LOG</text></g><text x='130' y='164' font-family='Space Mono,Courier New,monospace' font-size='15' font-weight='400' fill='#4a3f31' text-anchor='middle'>MY LOG page:</text><text x='130' y='182' font-family='Space Mono,Courier New,monospace' font-size='15' font-weight='400' fill='#4a3f31' text-anchor='middle'>the six lines</text><text x='270' y='164' font-family='Space Mono,Courier New,monospace' font-size='15' font-weight='400' fill='#4a3f31' text-anchor='middle'>next page:</text><text x='270' y='182' font-family='Space Mono,Courier New,monospace' font-size='15' font-weight='400' fill='#4a3f31' text-anchor='middle'>Entry 1</text></svg></div><div class='num'>&middot; 9 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='1'><div class='hea rd, the same for everyone.</p></div></div><div class='pair rise d3'><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>MISTAKE</div><p>No name or period</p></div><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>FIX</div><p>MY LOG, your name, your period.</p></div></div><div class='pair rise d4'><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>MISTAKE</div><p>No tab</p></div><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>FIX</div><p>A LOG sticky note, or a folded corner.</p></div></div><p class='small fill'>Found one in your notebook? Fix it today. Nothing is lost.</p></div><div class='num'>&middot; 12 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2><span class='hl'>Make it yours</span></h2><p>Decorate the notebook if you like. The six lines never change.</p><div class='scrap'><span class='tape t1' aria-hidden='true'></span><span class='tape t2' aria-hidden='true'></span><div class='k'><svg class='ic sm' aria-hidden='true' style='color:#f6eedb'><use href='#i-check'/></svg>WELCOME IN THE NOTEBOOK</div><ul class='ticks'><li>Colored pens, highlighters, washi tape</li><li>Small drawings, diagrams, arrows</li><li>Sticky notes and tabs</li><li>A cover you designed</li></ul></div><div class='scrap no'><span class='clip' aria-hidden='true'></span><div class='k'><svg class='ic sm' aria-hidden='true' style='color:#f6eedb'><use href='#i-cross'/></svg>NOT ON A LOG PAGE</div><ul class='ticks'><li>New wording for the six lines</li><li>Articles printed and taped in</li><li>Pencil for an entry</li><li>Torn-out pages</li></ul></div><p class='small fill'>Write the entry first, in pen. Decorate after.</p></div><div class='num'>&middot; 13 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><div class='form' data-form='setup'><div class='fhead'><span>SETUP INSPECTION</span><span>FORM 2</span></div><div class='frow'><span class='fk'>OWNER</span><span class='fv'>{{NAMEPLAIN}}</span><span class='fk'>PERIOD</span><span class='fv'>{{P}}</span></div><p class='small' style='margin:1.4cqw 0 .6cqw'>A neighbor checks your notebook. Tap each box as it passes.</p><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>Log starts on the first blank page</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>MY LOG, name, and period on the top line</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>Six lines copied word for word</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>A LOG tab, or a folded corner</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>Entry 1 on the next page</button><button type='button' class='tick' aria-pressed='false'><span class='bx' aria-hidden='true'></span>Written in pen</button><div class='frow' style='margin-top:1.4cqw'><span class='fk'>CHECKED BY</span><span class='fv line'></span></div><svg class='passstamp' viewBox='0 0 150 50' aria-hidden='true'><rect x='3' y='3' width='144' height='44' rx='7' fill='none' stroke='#1f5c4a' stroke-width='3'/><rect x='8' y='8' width='134' height='34' rx='4' fill='none' stroke='#1f5c4a' stroke-width='1.4'/><text x='75' y='33' text-anchor='middle' font-family='Space Mono,monospace' font-weight='700' font-size='21' letter-spacing='4' fill='#1f5c4a'>PASSED</text></svg></div><p class='small fill'>A box that does not pass: fix it now. Nothing is lost.</p></div><div class='num'>&middot; 14 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>3</div><div class='ch-title'>The six lines</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-pen'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Write each of the six lines well, and fix a weak one.</p><p style='font-style:normal;font-size:calc(3.4cqw*var(--g,1));margin-top:2cqw;color:#efe3c6'><svg class='ic sm' aria-hidden='true' style='color:#efe3c6'><use href='#i-view'/></svg>a perspective &nbsp; <svg class='ic sm' aria-hidden='true' style='color:#efe3c6'><use href='#i-gap'/></svg>a gap</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>The six lines</span><span class='ld' aria-hidden='true'></span><span class='pn'>15</span></li><li><span class='it'>Lines 1 to 3</span><span class='ld' aria-hidden='true'></span><span class='pn'>16</span></li><li><span class='it'>Lines 4 to 6, strong and weak</span><span class='ld' aria-hidden='true'></span><span class='pn'>17</span></li><li><span class='it'>Sentence starters</span><span class='ld' aria-hidden='true'></span><span class='pn'>18</span></li><li><span class='it'>Going further</span><span class='ld' aria-hidden='true'></span><span class='pn'>19</span></li><li><span class='it'>Ask yourself, line by line</span><span class='ld' aria-hidden='true'></span><span class='pn'>20</span></li><li><span class='it'>Fix a weak entry</span><span class='ld' aria-hidden='true'></span><span class='pn'>21</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='h'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 3</p><h2>The six lines</h2><div class='icl'><div class='rise d1'><svg class='ic' aria-hidden='true'><use href='#i-cal'/></svg><p><strong>1 Date:</strong> the day you found it. Never a later day.</p></div><div class='rise d1'><svg class='ic' aria-hidden='true'><use href='#i-book'/></svg><p><strong>2 Source:</strong> author, title, year, and where you found it.</p></div><div class='rise d2'><svg class='ic' aria-hidden='true'><use href='#i-search'/></svg><p><strong>3 How I found it:</strong> the exact words you typed, and the site, so you can find it again.</p></div><div class='rise d2'><svg class='ic' aria-hidden='true'><use href='#i-bubble'/></svg><p><strong>4 What it argues:</strong> one sentence. A claim, not a topic.<span class='R'> A study? What it found.</span></p></div><div class='S rise d3'><svg class='ic' aria-hidden='true'><use href='#i-view'/></svg><p><strong>5 Perspective:</strong> the point of view it argues, and its reason.</p></div><div class='R rise d3'><svg class='ic' aria-hidden='true'><use href='#i-steps'/></svg><p><strong>5 Method:</strong> the steps it took to find out. None stated? Write that.</p></div><div class='P rise d3'><svg class='ic' aria-hidden='true'><use href='#i-view'/></svg><p><strong>5</strong> depends on your course. Pick your period inside the cover.</p></div><div class='rise d4'><svg class='ic' aria-hidden='true'><use href='#i-test'/></svg><p><strong>6 Still serves my question?</strong> Yes or no, and one reason.</p></div></div><p class='small fill'>Next: each line done well and done weakly, on one example, a bench with a bar in the middle.</p></div><div class='num'>&middot; 15 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='2'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 3</p><h2>Lines 1 to 3</h2><div class='rise d1'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-cal'/></svg>1 Date</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p>September 22, 2026</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>last week</p></div></div></div><div class='rise d2'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-book'/></svg>2 Source</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p><span class='S'>Ortiz, Maya. &quot;Who Is the Bench For?&quot; City Design Review, 2021. Gale.</span><span class='R'>Chen, David, and Rosa Diaz. &quot;Counting Hostile Design.&quot; Street Design Quarterly, 2020. Google Scholar.</span><span class='P'>Author, title, year, publisher, and the database.</span></p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>an article about benches</p></div></div></div><div class='rise d3'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-search'/></svg>3 How I found it</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p>Typed: &quot;hostile architecture&quot; benches. Site: <span class='S'>Gale</span><span class='R'>Google Scholar</span><span class='P'>Gale</span>.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>Google</p></div></div></div><p class='small fill'>A made-up source.</p></div><div class='num'>&middot; 16 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='2'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Lines 4 to 6, strong and weak</h3><div class='rise d1'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-bubble'/></svg>4 What it argues</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p><span class='S'>Argues that bench bars move people who sleep outside to other blocks without reducing the need for shelter.</span><span class='R'>Found that 38 of 100 benches on shopping streets had dividers, against 9 of 100 on home streets.</span><span class='P'>One sentence with a claim.</span></p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>It is about benches.</p></div></div></div><div class='S'><div class='rise d2'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-view'/></svg>5 Perspective</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p>Shelter comes first, so public design should not push the most vulnerable away.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>The homeless. (A group, not a view.)</p></div></div></div></div><div class='R'><div class='rise d2'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-steps'/></svg>5 Method</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p>Walked 40 blocks, photographed every bench, coded each for dividers or spikes.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>They did research.</p></div></div></div></div><div class='P'><div class='rise d2'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-view'/></svg>5 Line five</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p>A view with its reason (Seminar), or the steps taken (Research).</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>One word.</p></div></div></div></div><div class='rise d3'><p class='linehead'><svg class='ic' aria-hidden='true'><use href='#i-test'/></svg>6 Still serves?</p><div class='pair'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-check'/></svg>STRONG</div><p><span class='S'>Yes: it argues the side I disagree with, so I have to answer it.</span><span class='R'>Yes: my study would count the same features in Hialeah.</span><span class='P'>Yes or no, with a reason.</span></p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>Yes.</p></div></div></div></div><div class='num'>&middot; 17 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg' data-d='h'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 3</p><h2>Sentence starters</h2><p class='small'>Stuck? Borrow the start. Finish it in your own words.</p><div class='nb' style='font-size:4.3cqw;line-height:1.5'><div><b>2.</b> Last name, first name. Title. Publisher, year. Found on ___.</div><div><b>3.</b> Typed: ___. Site: ___.</div><div><b>4.</b> <span class='S'>This source argues that ___, because ___.</span><span class='R'>This study found that ___ when ___.</span><span class='P'>This source argues that ___, because ___.</span></div><div><b>5.</b> <span class='S'>It takes the view that ___, because ___.</span><span class='R'>The researchers ___ (counted, asked, watched) ___ in ___ (where, when).</span><span class='P'>Perspective or method, by course.</span></div><div><b>6.</b> Yes: it helps me ___. &nbsp;/&nbsp; No: it is about ___, not ___.</div><div><b>v.</b> I changed ___ to ___ because ___.</div></div><p style='margin-top:1.6cqw'>A starter is a ramp, not a crutch. Once a line comes easily, write it your own way.</p><p class='small fill'>Heritage-language dictionary allowed on these pages.</p></div><div class='num'>&middot; 18 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Going further</h3><p class='small'>Optional. None of this is required, and all of it shows in a checkpoint.</p><div class='icl'><div class='rise d1'><svg class='ic' aria-hidden='true'><use href='#i-quote'/></svg><p><strong>Line 7:</strong> the strongest thing a critic would say about this source.</p></div><div class='S rise d2'><svg class='ic' aria-hidden='true'><use href='#i-link'/></svg><p><strong>Answer it:</strong> find the source that argues back, and log it next.</p></div><div class='R rise d2'><svg class='ic' aria-hidden='true'><use href='#i-gap'/></svg><p><strong>What it did not study:</strong> a place, a group, a time, a method. That is where a gap begins.</p></div><div class='P rise d2'><svg class='ic' aria-hidden='true'><use href='#i-link'/></svg><p><strong>One more line</strong> appears when you pick your period.</p></div><div class='rise d3'><svg class='ic' aria-hidden='true'><use href='#i-scale'/></svg><p><strong>Two entries, side by side:</strong> where do they agree, and where do they split?</p></div><div class='rise d4'><span aria-hidden='true' style='width:6.6cqw;flex:none'></span><p><strong>A star in the margin</strong> for the one source doing the most work for your question.</p></div></div><div class='nb fill' style='font-size:4.5cqw;line-height:1.5'><div class='ttl'>Entry 1, going further</div><div>7. <span class='S'>A critic would say: bars cost less than shelter beds, and the county&#39;s money is limited.</span><span class='R'>It did not study: home streets at night, or who sleeps on the benches.</span><span class='P'>The line depends on your course.</span></div></div></div><div class='num'>&middot; 19 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Ask yourself, line by line</h2><p>Before you close the tab, ask one question per line.</p><table class='stages'><thead><tr><th>LINE</th><th>ASK YOURSELF</th><th>DONE WHEN</th></tr></thead><tbody><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-cal'/></svg>1 Date</th><td>Did I write it the day I found it?</td><td>The full date is there.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-book'/></svg>2 Source</th><td>Could someone find it from my line?</td><td>Author, title, year, where.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-search'/></svg>3 How I found it</th><td>Could I find it again tomorrow?</td><td>Search words and the site.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-bubble'/></svg>4 What it argues</th><td>Could a reasonable person disagree?</td><td>One sentence with a claim.</td></tr><tr><th><span class='S'><svg class='ic sm' aria-hidden='true'><use href='#i-view'/></svg></span><span class='R'><svg class='ic sm' aria-hidden='true'><use href='#i-steps'/></svg></span><span class='P'><svg class='ic sm' aria-hidden='true'><use href='#i-view'/></svg></span>5 <span class='S'>Perspective</span><span class='R'>Method</span><span class='P'>Perspective or method</span></th><td><span class='S'>Whose view is this, and why?</span><span class='R'>What did they do to find out?</span><span class='P'>Whose view, or what did they do?</span></td><td>One sentence.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-test'/></svg>6 Still serves?</th><td>Does it help my question today?</td><td>Yes or no, and why.</td></tr></tbody></table></div><div class='num'>&middot; 20 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH LOG</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Fix a weak entry</h3><p>A student wrote this entry. It is fast, and it is almost useless in May.</p><svg class='fig' viewBox='0 0 320 110' role='img' aria-label='A weak entry in handwriting, a made-up case, marked with a cross and the word weak: 1. last week. 2. article about benches. 3. google. 4. It is about benches. 5. no idea. 6. yes.'><rect x='2' y='2' width='316' height='106' rx='2' fill='#fffdf6' stroke='#b9ad93' stroke-width='1'/><line x1='2' y1='20' x2='318' y2='20' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='36' x2='318' y2='36' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='52' x2='318' y2='52' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='68' x2='318' y2='68' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='84' x2='318' y2='84' stroke='#b7cbe0' stroke-width='.7'/><line x1='2' y1='100' x2='318' y2='100' stroke='#b7cbe0' stroke-width='.7'/><line x1='22' y1='2' x2='22' y2='108' stroke='#d7776b' stroke-width='1'/><text x='28' y='16' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>1. last week</text><text x='28' y='32' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>2. article about benches</text><text x='28' y='48' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>3. google</text><text x='28' y='64' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>4. It is about benches.</text><text x='28' y='80' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>5. no idea</text><text x='28' y='96' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>6. yes</text><path d='M290 8 L298 16 M298 8 L290 16' fill='none' stroke='#9c3322' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='310' y='30' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322' text-anchor='end'>WEAK</text><text x='314' y='102' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case.</text></svg><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>Which lines fail, and why?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>All six. 1 needs the full date. 2 needs author, title, year, and publisher. 3 needs the search words and the site. 4 names a topic, not a claim. 5 says nothing. 6 needs a reason.</p></div><p class='small fill'>A weak entry is not a lost entry. Rewrite it under the old one, with the date you rewrite it.</p></div><div class='num'>&middot; 21 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>4</div><div class='ch-title'>A filled entry</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-bubble'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Fill a whole entry, and find a source&#39;s claim and its
