ight'><thead><tr><th>TASK</th><th>TALK</th><th>QUESTIONS</th></tr></thead><tbody><tr><th>Team Multimedia Presentation (TMP)</th><td>8 to 10 minutes, as a team</td><td>one each</td></tr><tr><th>Individual Multimedia Presentation (IMP) and oral defense</th><td>6 to 8 minutes</td><td>two</td></tr><tr><th>Presentation and Oral Defense (POD)</th><td>15 to 20 minutes, with the questions</td><td>three or four, from a panel</td></tr></tbody></table><div class='S'><p class='small'>Yours: the first two rows. Share of your AP score: 10 percent for the team talk; 10.5 percent for your own talk and its questions.</p></div><div class='R'><p class='small'>Yours: the last row. It is 25 percent of your AP score.</p></div><p class='small'>I score all three with the College Board rubric, after its scoring training. All scores go to the College Board by May 10, 2027. Your day: page <button type='button' class='pj' data-jump='53' aria-label='Go to page 43'>43</button>. Checked September 24, 2026.</p></div><div class='num'>&middot; 5 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What it is, and is not</h3><table class='stages half tight'><thead><tr><th>IT IS</th><th>IT IS NOT</th></tr></thead><tbody><tr><th>An argument: claims, evidence, a conclusion.</th><td>A summary of your research.</td></tr><tr><th>For educated people who are not experts.</th><td>Your paper read aloud.</td></tr><tr><th>Built from your finished work.</th><td>A script from a tool (page 41).</td></tr><tr><th>Timed, recorded, and scored once, live.</th><td>A second try at your paper.</td></tr></tbody></table><div class='S'><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>NO PAPER, NO SCORE</div><p>No report, no team talk score. No written argument, no score for your own talk or its questions.</p></div></div><div class='R'><div c ast the limit, and those minutes earn nothing. No rule punishes a short talk, but a short talk has less to score. Room 63 advice, not a rule: aim to finish a minute early.</p><div class='S'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Your team talk runs 11 minutes. What is not scored?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The last minute, and anything in it, like your close.</p></div></div><div class='R'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Your talk runs 18 minutes. How long is left for questions?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Two minutes. The panel may not reach all three questions.</p></div></div></div><div class='num'>&middot; 7 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your rubric, part 1</h3><div class='S'><table class='stages wide2 tight'><thead><tr><th>TEAM TALK, 24 POINTS</th><th>THE TOP LEVEL, IN PLAIN WORDS</th></tr></thead><tbody><tr><th>Establish Argument, 6</th><td>A convincing argument for the team&#39;s solution, with evidence chosen with care</td></tr><tr><th>Evaluate Solutions, 4</th><td>Pros and cons of other options, and the limits or implications of yours</td></tr><tr><th>Engage Audience, performance, 6</th><td>Every presenter engages the audience most of the time</td></tr><tr><th>Engage Audience, design, 4</th><td>The design guides the audience through the argument</td></tr><tr><th>Collaborate, Reflect, 4</th><td>Detailed answers about this project and your teammates&#39; work, with about equal parts from all of you</td></tr></tbody></table><p class='small'>The team tal ut 7 minutes.</p></div><div class='R'><p class='small'>Your talk: eight cards, a little under two minutes a card, about 14 minutes. That leaves time for the questions.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Your paper has nine claims. Your talk has room for four. How do you choose?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Keep the claims your conclusion needs most. Cut the rest.</p></div></div><div class='num'>&middot; 14 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The first minute and the last</h3><figure class='plate'><div class='pl'><span>PLATE VII</span><span>The shape of a talk</span></div><svg class='fig' viewBox='0 0 320 131' role='img' aria-label='A 10-minute talk drawn to scale, one tick a minute from 0 to 10. 1 First minute, one tenth of the bar: a hook: a fact, a short story, or a question. Then your question, and why it matters. 2 All through: signposts, drawn as link marks at minutes 3, 5, and 7, say where you are: First... Next... Here is the problem with that option. 3 Last minute, one tenth of the bar: your conclusion again, tied to your hook. End on your limits or next step. No new evidence. An arrow from the end back to the start: tie the end to your hook. Talks run 6 to 15 minutes (time limits: page 7; 2026 scoring guidelines; checked September 25, 2026).'><text x='4' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>A 10-MINUTE TALK</text><path d='M296.8 24 C 296.8 13, 23.2 13, 23.2 22' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M19.7 18 L23.2 23 L26.7 18' fill='none' stroke='#9c3322' stroke-width='1.4' st  y='95' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>are: First... Next...</text><text x='316' y='95' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='end'>on your limits or next</text><text x='4' y='105.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>and why it matters.</text><text x='160' y='105.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>Here is the problem...</text><text x='316' y='105.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='end'>step. No new evidence.</text><text x='4' y='117' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>Talks run 6 to 15 minutes (time limits: page 7; 2026 scoring</text><text x='4' y='128' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>guidelines; checked September 25, 2026).</text></svg><figcaption><b>SIGNPOSTS</b>Each link mark is a line that says where you are.</figcaption></figure><p class='small'>Starters: &quot;I wanted to find out ___.&quot; &quot;This matters because ___.&quot; &quot;Here is what I found: ___.&quot;</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Which opening is stronger? A: &quot;Hi, our topic is sleep.&quot; B: &quot;In a made-up survey, four of every ten students sleep under seven hours. We asked why.&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>B. A fact and a question in the first seconds.</p></div></div><div class='num'>&middot; 15 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"board chapter","label":"Folio 3","html":"<div class='chap'>{{ ='9' font-weight='600' fill='#4a3f31'>Signs from the 2026 AP Seminar design row. Checked September 25, 2026.</text></svg><figcaption><b>THE TEST</b>Read only the headings, in order.</figcaption></figure><p class='small'>A slide that needs minutes to explain? Split it.</p><div class='S'><p class='small'>Team talk: one team, one design. The rubric checks the whole team&#39;s slides.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>A slide has 70 words and three pictures. What do you do first?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Find its one idea. Move the rest to your cards or to another slide.</p></div></div><div class='num'>&middot; 17 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Charts, pictures, and tools</h3><figure class='plate'><div class='pl'><span>PLATE X</span><span>A chart, read out loud</span></div><svg class='fig' viewBox='0 0 320 96' role='img' aria-label='A made-up case: a slide chart. 1 The axis label: benches with dividers, of every 100. Two bars on one scale: home streets, 9; shopping streets, 38. 2 Under the chart: Source: Chen and Diaz. 3 A speech bubble: say it out loud: This bar is about four times as tall. That is the gap. Notes: 1 Label the axes. 2 The source, under it. 3 One pattern, said. The benches, the counts, and Chen and Diaz are made up.'><rect x='4' y='4' width='184' height='88' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='14' cy='14' r='6.5' fill='#9c3322'/><text x='14' y='17.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='24' y='17.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>benches with dividers, of every 100</text><line x1='34' y1='26' x2='34' y2='66' stroke='#1f3a5a' stroke-width='1.1'/><line x1='34' y1='66' x2='180' y2='66' stroke='#1f3a5a' stroke-width='1.1'/><rect x='54' y='59.2' width='32' height='6.8' rx='0' fill='#1f3a5a'/><text x='70' y='55.2' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>9</text><text x='70' y='77' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>home streets</text><rect x='120' y='37.5' width='32' height='28.5' rx='0' fill='#1f3a5a'/><text x='136' y='33.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>38</text><text x='136' y='77' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>shopping streets</text><circle cx='14' cy='84.5' r='6.5' fill='#9c3322'/><text x='14' y='87.8' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='24' y='88' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>Source: Chen and Diaz.</text><text x='184' y='88' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up case</text><rect x='198' y='4' width='118' height='58' rx='8' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.2'/><path d='M198 36 L188 44 L198 46' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='208' cy='15' r='6.5' fill='#9c3322'/><text x='208' y='18.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='218' y='18.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>Say it out loud:</text><text x='204' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' font-style='italic'>This bar is about four</text><text x='204' y='44' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' font-style='italic'>times as tall. That is</text><text x='204' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' font-style='italic'>the gap.</text><text x='200' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>1 Label the axes.</text><text x='200' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>2 The source, under it.</text><text x='200' y='92' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>3 One pattern, said.</text></svg><figcaption><b>ONE PATTERN</b>A chart shows one pattern. Say it.</figcaption></figure><p class='small'>More: Writing the Paper, page 14. Read the label first: The Research Manual, page 40. Use your own pictures, or credit the owner on the slide.</p><div class='R'><p class='small'>A tool may turn data you collected into a chart. Check every number against your records. A tool may never make data.</p></div><p class='small'>A tool may give you first ideas for visuals. You choose them, and you check them.</p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>No picture made by a tool on a scored slide.</p></div></div><div class='num'>&middot; 18 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Easy to read from the back row</h3><table class='stages rules tight'><thead><tr><th>CHECK</th><th>PASSES WHEN</th></tr></thead><tbody><tr><th>Back row</th><td>You stand at the back of Room 63 and read every word.</td></tr><tr><th>Contrast</th><td>Dark on light, or light on dark. Never words over a busy photo.</td></tr><tr><th>Size</th><td>Headings about 36 point. Other words 24 point or more.</td></tr><tr><th>Style</th><td>Two fonts at most. The same colors on every slide.</td></tr><tr><th>Color</th><td>Never the only signal. Add a label.</td></tr></tbody></table><p class='small'>The web accessibility standard asks for contrast of at least 4.5 to 1, or 3 to 1 for large words.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Yellow words on a white slide. Pass or fail?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Fail. The contrast is too low.</p></div></div><div class='num'>&middot; 19 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Name every source</h3><p class='small'>Say or show the source of all evidence (The Research Manual, page 67). Out loud, fill three slots:</p><figure class='plate'><div class='pl'><span>PLATE XI</span><span>Say who said it</span></div><svg class='fig' viewBox='0 0 320 56' role='img' aria-label='A sentence frame in three numbered slots, a made-up source. 1 who: according to Chen and Diaz. 2 kind of expert: researchers who counted 400 benches. 3 what they found: dividers were on 38 of every 100 benches.'><g transform='translate(0 3)'><text x='6' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>1 WHO</text><rect x='4' y='13' width='70' height='28' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='10' y='25' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f2a5a'>According to</text><text x='10' y='37' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f2a5a'>Chen and Diaz,</text><text x='82' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>2 KIND OF EXPERT</text><rect x='80' y='13' width='118' height='28' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='86' y='25' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f2a5a'>researchers who</text><text x='86' y='37' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f2a5a'>counted 400 benches,</text><text x='206' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>3 WHAT THEY FOUND</text><rect x='204' y='13' width='112' height='28' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='210' y='25' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f2a5a'>dividers were on 38 of</text><text x='210' y='37' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f2a5a'>every 100 benches.</text><text x='316' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up source</text></g></svg><figcaption><b><svg class='gi' style='width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;margin:0 .35em 0 0;color:inherit' aria-hidden='true'><use href='#i-zero'/></svg>ZERO</b>A missing credit scores 0 on that part<span class='S'>, and on the team talk, 0 for the whole team</span>. Made-up evidence scores 0.</figcaption></figure><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>On a slide: a short credit under the evidence. On the last slide: your full list, in the style your paper uses.</p></div><div class='S'><p class='small'>Stimulus texts are sources too.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>You name a study out loud, but not on the slide. Enough?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Yes. Out loud or on the slide both count.</p></div></div><div class='num'>&middot; 20 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"board chapter","label":"Folio 4","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>4</div><div class='ch-title'>Make it on a school iPad</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-picture'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Build, save, and show your slides on a school iPad, with a backup ready.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Build it on a school iPad</span><span class='ld' aria-hidden='true'></span><span class='pn'>21</span></li><li><span class='it'>Notes, cue cards, and a backup</span><span class='ld' aria-hidden='true'></span><span class='pn'>22</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-picture'/></svg>FOLIO 4</p><h2>Build it on a school iPad</h2><div class='card2 wait' style='margin-top:0'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>Google Slides, signed in to your school Google account. Keynote is the backup. Both wait on one check on a Room 63 iPad.</p></div><p class='small'>A cart iPad goes to someone else next: never keep your only copy on it (The Research Manual, page 71).</p><p class='small'>The design is part of your score, so I do not give you one.</p><div class='S'><p class='small'>Slides are collected before anyone presents. You present that version.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>You built slides on a cart iPad without signing in. Tomorrow you get another. What happens?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Your slides may be gone. Always sign in to your school account.</p></div></div><div class='num'>&middot; 21 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Notes, cue cards, and a backup</h3><p class='small'>Speak from cue cards: key words, not sentences. Number the cards.</p><div class='S'><p class='small'>Your task directions say to prepare notecards or an outline you can check quickly.</p></div><p class='small'>Keep a backup, like a PDF copy in your school Drive. Your cue cards are the backup that needs no internet.</p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>The screen fails? Keep talking from your cards, and describe the chart in words. I decide whether to pause.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Your slides freeze on slide 4. What do you do?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Keep going from card 4. Describe the chart in words.</p></div></div><div class='num'>&middot; 22 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"board chapter","label":"Folio 5","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>5</div><div class='ch-title'>Deliver it</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-podium'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Use the four techniques the rubric names so your delivery helps your argument.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>The four techniques</span><span class='ld' aria-hidden='true'></span><span class='pn'>23</span></li><li><span class='it'>Eyes up</span><span class='ld' aria-hidden='true'></span><span class='pn'>24</span></li><li><span class='it'>Your voice: pace, pause, stress</span><span class='ld' aria-hidden='true'></span><span class='pn'>25</span></li><li><span class='it'>Hands, feet, and posture</span><span class='ld' aria-hidden='true'></span><span class='pn'>26</span></li><li><span class='it'>When you are nervous</span><span class='ld' aria-hidden='true'></span><span class='pn'>27</span></li><li><span class='it'><span class='S'>Presenting as a team</span><span class='R'>Presenting to a panel</span><span class='P'>A team, or a panel</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>28</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-podium'/></svg>FOLIO 5</p><h2>The four techniques</h2><figure class='plate'><div class='pl'><span>PLATE XII</span><span>The speaker</span></div><svg class='fig' viewBox='0 0 320 104' role='img' aria-label='A speaker beside a screen marked SCREEN, with five notes: 1 eyes, one person per sentence. 2 voice, change speed; pause. 3 hands, gesture on the key word. 4 feet, still; step to a new point. 5 energy, show that you care.'><rect x='232' y='8' width='82' height='70' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.4'/><text x='273' y='47' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>SCREEN</text><circle cx='205' cy='24' r='9' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.6'/><line x1='205' y1='33' x2='205' y2='68' stroke='#1f3a5a' stroke-width='2.2'/><line x1='205' y1='43' x2='192' y2='58' stroke='#1f3a5a' stroke-width='2'/><line x1='205' y1='43' x2='224' y2='36' stroke='#1f3a5a' stroke-width='2'/><line x1='205' y1='68' x2='196' y2='94' stroke='#1f3a5a' stroke-width='2.2'/><line x1='205' y1='68' x2='214' y2='94' stroke='#1f3a5a' stroke-width='2.2'/><circle cx='9' cy='12.5' r='6.5' fill='#9c3322'/><text x='9' y='15.8' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='19' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>EYES</text><text x='66' y='16' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>one person per sentence</text><line x1='171' y1='12.5' x2='200' y2='23' stroke='#9c3322' stroke-width='0.9'/><circle cx='9' cy='32.5' r='6.5' fill='#9c3322'/><text x='9' y='35.8' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='19' y='36' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>VOICE</text><text x='66' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>change speed; pause</text><line x1='155.6' y1='32.5' x2='202' y2='29' stroke='#9c3322' stroke-width='0.9'/><circle cx='9' cy='52.5' r='6.5' fill='#9c3322'/><text x='9' y='55.8' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='19' y='56' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>HANDS</text><text x='66' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>gesture on the key word</text><line x1='169.2' y1='52.5' x2='192' y2='57' stroke='#9c3322' stroke-width='0.9'/><circle cx='9' cy='72.5' r='6.5' fill='#9c3322'/><text x='9' y='75.8' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>4</text><text x='19' y='76' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>FEET</text><text x='66' y='76' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>still; step to a new point</text><line x1='171' y1='72.5' x2='196' y2='91' stroke='#9c3322' stroke-width='0.9'/><circle cx='9' cy='92.5' r='6.5' fill='#9c3322'/><text x='9' y='95.8' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>5</text><text x='19' y='96' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>ENERGY</text><text x='66' y='96' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>show that you care</text></svg><figcaption><b>NOTE</b>Stand beside the screen, never in front of it.</figcaption></figure><p class='small'>The rubrics name eye contact, vocal variety, gestures, and movement. At the top level, they strongly support your argument. They are not a show.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Which one does the rubric never ask for: eye contact, jokes, or vocal variety?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Jokes. Humor is fine if it fits, but the rubric does not name it.</p></div></div><div class='num'>&middot; 23 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Eyes up</h3><p class='small'>Weak signs, in the rubric: staring at slides, at note cards, into space, or at the floor. The strong sign: eye contact all through, like talking to a person.</p><figure class='plate'><div class='pl'><span>PLATE XIII</span><span>Glance, look, say</span></div><svg class='fig' viewBox='0 0 320 102' role='img' aria-label='Three frames of one speaker. 1 Glance down at cue card 4, which shows three key words: dividers, one block over, 38 of 100. Take the key word. 2 Look up at one person, the center listener. 3 Say the sentence to that person; an arrow points to the next listener. Next sentence, next person: left, center, right. A made-up cue card.'><rect x='2' y='2' width='102' height='58' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><circle cx='11' cy='11' r='6.5' fill='#9c3322'/><text x='11' y='14.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><rect x='108' y='2' width='102' height='58' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><circle cx='117' cy='11' r='6.5' fill='#9c3322'/><text x='117' y='14.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><rect x='214' y='2' width='102' height='58' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><circle cx='223' cy='11' r='6.5' fill='#9c3322'/><text x='223' y='14.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><circle cx='26' cy='14' r='6.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><line x1='26' y1='19' x2='26' y2='36' stroke='#1f3a5a' stroke-width='2'/><line x1='26' y1='36' x2='20' y2='47' stroke='#1f3a5a' stroke-width='2'/><line x1='26' y1='36' x2='32' y2='47' stroke='#1f3a5a' stroke-width='2'/><line x1='26' y1='24' x2='37' y2='29' stroke='#1f3a5a' stroke-width='1.8'/><line x1='26' y1='24' x2='18' y2='32' stroke='#1f3a5a' stroke-width='1.8'/><rect x='41' y='6' width='61' height='51' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><text x='45' y='17' font-family='Patrick Hand,cursive' font-size='9.5' font-weight='400' fill='#1f2a5a'>4</text><text x='45' y='28' font-family='Patrick Hand,cursive' font-size='9.5' font-weight='400' fill='#1f2a5a'>dividers</text><text x='45' y='39' font-family='Patrick Hand,cursive' font-size='9.5' font-weight='400' fill='#1f2a5a'>one block over</text><text x='45' y='50' font-family='Patrick Hand,cursive' font-size='9.5' font-weight='400' fill='#1f2a5a'>38 of 100</text><line x1='30' y1='17' x2='40' y2='26' stroke='#4a3f31' stroke-width='1'/><circle cx='130' cy='12' r='6.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><line x1='130' y1='19' x2='130' y2='36' stroke='#1f3a5a' stroke-width='2'/><line x1='130' y1='36' x2='124' y2='47' stroke='#1f3a5a' stroke-width='2'/><line x1='130' y1='36' x2='136' y2='47' stroke='#1f3a5a' stroke-width='2'/><line x1='130' y1='24' x2='123' y2='34' stroke='#1f3a5a' stroke-width='1.8'/><line x1='130' y1='24' x2='137' y2='34' stroke='#1f3a5a' stroke-width='1.8'/><circle cx='196' cy='12' r='5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><circle cx='196' cy='27' r='5' fill='#f3e3bd' stroke='#9c3322' stroke-width='1.8'/><circle cx='196' cy='42' r='5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><line x1='137' y1='12' x2='190' y2='27' stroke='#4a3f31' stroke-width='1'/><circle cx='236' cy='12' r='6.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><line x1='236' y1='19' x2='236' y2='36' stroke='#1f3a5a' stroke-width='2'/><line x1='236' y1='36' x2='230' y2='47' stroke='#1f3a5a' stroke-width='2'/><line x1='236' y1='36' x2='242' y2='47' stroke='#1f3a5a' stroke-width='2'/><line x1='236' y1='24' x2='229' y2='34' stroke='#1f3a5a' stroke-width='1.8'/><line x1='236' y1='24' x2='243' y2='34' stroke='#1f3a5a' stroke-width='1.8'/><circle cx='302' cy='12' r='5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><circle cx='302' cy='27' r='5' fill='#f3e3bd' stroke='#9c3322' stroke-width='1.8'/><circle cx='302' cy='42' r='5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><path d='M249 8 Q253 14 249 20' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/><path d='M253 8 Q257 14 253 20' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/><path d='M257 8 Q261 14 257 20' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/><path d='M308 30 C315 33, 315 38, 308 41' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M309 36.5 L308 41 L313 42.5' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><text x='5' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>1 Glance down.</text><text x='5' y='84' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>Take the key word.</text><text x='111' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>2 Look up at</text><text x='111' y='84' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>one person.</text><text x='217' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>3 Say the sentence</text><text x='217' y='84' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>to that person.</text><text x='3' y='98' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>Next sentence, next person: left, center, right.</text><text x='316' y='98' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up cue card</text></svg><figcaption><b>ONE PERSON</b>Say each sentence to one person.</figcaption></figure><p class='small'>Point to the screen, then turn back. Never talk to it.</p><div class='R'><p class='small'>Look at all three panel members.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>When do you look at your card?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Between sentences. Never while you speak.</p></div></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your voice: pace, pause, stress</h3><table class='stages rules tight'><thead><tr><th>MOVE</th><th>DO THIS</th></tr></thead><tbody><tr><th>Pace</th><td>Record one minute and count the words. Microsoft Speaker Coach suggests 100 to 165 words a minute.</td></tr><tr><th>Slow down</th><td>For numbers, names, and your key claim.</td></tr><tr><th>Pause</th><td>Two seconds after your most important sentence.</td></tr><tr><th>Stress</th><td>Lift your voice on the word that matters.</td></tr><tr><th>Fillers</th><td>Um, ah, like: the rubric&#39;s 2-point level names them.</td></tr></tbody></table><figure class='plate'><div class='pl'><span>PLATE XIV</span><span>Mark one sentence</span></div><svg class='fig' viewBox='0 0 320 62' role='img' aria-label='A handwritten cue card, a made-up card: dividers moved sleepers one block over. Chen and Diaz found them on 38 of every 100 benches. A slash after over: pause two seconds. A line under one block: stress these words. A wavy line under 38 of every 100: say it slowly. The key names the three marks: a slash, pause two seconds; a line under, stress these words; a wavy line, say it slowly.'><rect x='4' y='4' width='312' height='38' rx='2' fill='#fffdf6' stroke='#b9ad94' stroke-width='1'/><line x1='16' y1='4' x2='16' y2='42' stroke='#d7776b' stroke-width='1'/><text x='22' y='18' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>Dividers moved sleepers one block over.</text><text x='22' y='35' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>Chen and Diaz found them on 38 of every 100 benches.</text><text x='312' y='14' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up card</text><line x1='132.1' y1='21' x2='173.5' y2='21' stroke='#9c3322' stroke-width='1.8'/><line x1='206.8' y1='21' x2='212.8' y2='7' stroke='#9c3322' stroke-width='2'/><path d='M150.3 38.5 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><line x1='8' y1='58' x2='13' y2='48' stroke='#9c3322' stroke-width='2'/><text x='18' y='57' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>pause two seconds</text><line x1='112' y1='56' x2='130' y2='56' stroke='#9c3322' stroke-width='1.8'/><text x='135' y='57' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>stress these words</text><path d='M222 55 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0 q2 2.5 4 0 q2 -2.5 4 0' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='247' y='57' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>say it slowly</text></svg><figcaption><b>MARKS</b>One key sentence on a card, never a script.</figcaption></figure><p class='small'>Your accent is not a rubric row. Clear speech is. Slow down, and you will be clear. Speaker Coach checked September 25, 2026.</p></div><div class='num'>&middot; 25 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Hands, feet, and posture</h3><table class='stages half tight'><thead><tr><th>HELPS</th><th>DISTRACTS</th></tr></thead><tbody><tr><th>Feet planted, shoulders open</th><td>Fidgeting, swaying, slumping</td></tr><tr><th>A gesture on the key word</th><td>Hands that move with no purpose</td></tr><tr><th>Hands relaxed at your sides</th><td>Arms crossed, hands hidden</td></tr><tr><th>A step when you change points</th><td>No movement at all</td></tr></tbody></table><figure class='plate'><div class='pl'><span>PLATE XV</span><span>Stand, not sway</span></div><svg class='fig' viewBox='0 0 320 86' role='img' aria-label='Two figures. Helps: a speaker beside the screen, feet planted, shoulders open, one hand points at the screen. Distracts: a speaker who sways in front of the screen, arms crossed; curved lines show the swaying.'><path d='M6 8 L9.4 11.1 L15 3.9' fill='none' stroke='#245e55' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/><text x='19' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>HELPS</text><path d='M166 3 L174 11 M174 3 L166 11' fill='none' stroke='#9c3322' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='178' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>DISTRACTS</text><rect x='76' y='16' width='78' height='32' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='115' y='36' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='middle'>SCREEN</text><circle cx='52' cy='22' r='6' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><line x1='52' y1='28' x2='52' y2='46' stroke='#1f3a5a' stroke-width='2'/><line x1='52' y1='46' x2='45' y2='56' stroke='#1f3a5a' stroke-width='2'/><line x1='52' y1='46' x2='59' y2='56' stroke='#1f3a5a' stroke-width='2'/><line x1='52' y1='34' x2='45' y2='43' stroke='#1f3a5a' stroke-width='1.8'/><line x1='52' y1='34' x2='72' y2='28' stroke='#1f3a5a' stroke-width='1.8'/><line x1='41' y1='57' x2='63' y2='57' stroke='#1f3a5a' stroke-width='1'/><rect x='200' y='16' width='90' height='32' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='205' y='26' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31'>SCREEN</text><circle cx='262' cy='22' r='6' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><line x1='262' y1='28' x2='264' y2='46' stroke='#1f3a5a' stroke-width='2'/><line x1='264' y1='46' x2='259' y2='56' stroke='#1f3a5a' stroke-width='2'/><line x1='264' y1='46' x2='269' y2='56' stroke='#1f3a5a' stroke-width='2'/><line x1='255' y1='34' x2='270' y2='38' stroke='#1f3a5a' stroke-width='1.8'/><line x1='270' y1='34' x2='256' y2='38' stroke='#1f3a5a' stroke-width='1.8'/><path d='M250 28 q-5 7 0 14' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M276 28 q5 7 0 14' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M245 28 q-5 7 0 14' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M281 28 q5 7 0 14' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='6' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>beside the screen, feet</text><text x='6' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>planted, one hand points</text><text x='166' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>sways in front of the</text><text x='166' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>screen, arms crossed</text></svg><figcaption><b>SCREEN</b>Stand to the side of the screen. Never block it.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>You sway while you talk. One fix?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Plant both feet. Move only when you change points.</p></div></div><div class='num'>&middot; 26 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>When you are nervous</h3><p class='small'>Almost everyone is nervous. It does not mean you are not ready.</p><table class='stages rules tight'><thead><tr><th>WHEN</th><th>DO THIS</th></tr></thead><tbody><tr><th>Before</th><td>Breathe in slowly. Let a long breath out. Roll your shoulders.</td></tr><tr><th>Remember</th><td>You know this work better than anyone in the room.</td></tr><tr><th>Lost your place</th><td>Look at your card. Say, &quot;Let me go back.&quot; Keep going.</td></tr><tr><th>The cure</th><td>Every timed run makes the real one smaller (page 29).</td></tr></tbody></table><p class='small'>Ask yourself: is this worst case likely, or really that bad?</p><p class='small'>An individualized education program or a 504 plan? See me next class about your presentation.</p></div><div class='num'>&middot; 27 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><span class='S'>Presenting as a team</span><span class='R'>Presenting to a panel</span><span class='P'>A team, or a panel</span></h3><div class='S'><table class='stages rules tight'><thead><tr><th>RULE</th><th>WHAT IT MEANS</th></tr></thead><tbody><tr><th>Everyone</th><td>All of you engage the audience, most of the time.</td></tr><tr><th>Roles</th><td>Plan each person&#39;s part in the design and the delivery.</td></tr><tr><th>Hand-offs</th><td>End your part with a line that leads to the next speaker.</td></tr><tr><th>Listening</th><td>Not speaking? Look at the speaker.</td></tr><tr><th>Know it all</th><td>Teach each other your research before the day.</td></tr></tbody></table><p class='small'>Team roles and your team&#39;s argument: The Team Project.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>The question is about your teammate&#39;s research on cost. What do you do?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Answer it. You learned your teammate&#39;s research before the day.</p></div></div><div class='R'><p class='small'>Your panel: me and two other adults I choose.</p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>The two adults: Mater staff, the same pair for a whole day. Your expert adviser may join.</p></div><p class='small'>They may not know your field. Say field words in plain words. Look at all three. Speak to them, not to the camera.</p><p class='small'>Made a product, a performance, or an exhibit? The panel must see it before your presentation. Tell me early.</p></div><div class='P'><p class='small'>Pick your period inside the cover to see your course.</p></div></div><div class='num'>&middot; 28 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"board chapter","label":"Folio 6","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>6</div><div class='ch-title'>Rehearse</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-clock'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Rehearse with a timer, watch yourself once, and get feedback from a peer panel.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Three runs, one timer</span><span class='ld' aria-hidden='true'></span><span class='pn'>29</span></li><li><span class='it'>Three runs, in order</span><span class='ld' aria-hidden='true'></span><span class='pn'>30</span></li><li><span class='it'>Record it, watch it once</span><span class='ld' aria-hidden='true'></span><span class='pn'>31</span></li><li><span class='it'>The peer panel</span><span class='ld' aria-hidden='true'></span><span class='pn'>32</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-clock'/></svg>FOLIO 6</p><h2>Three runs, one timer</h2><div class='tmr' role='group' aria-label='Rehearsal timer'><div class='tpre'><div class='S'><button type='button' data-preset='480,600' data-lab='Team talk' aria-pressed='false'>Team talk, 8 to 10</button><button type='button' data-preset='360,480' data-lab='Your own talk' aria-pressed='false'>Your own talk, 6 to ts</span></div><svg class='fig' viewBox='0 0 320 84' role='img' aria-label='A handwritten tally, a made-up case. Where did I look? At the screen: four marks, 4. Where did my voice go flat? Two marks, 2. Where did I say um? Five marks, 5. Next to each count, name the rubric row it costs you.'><rect x='4' y='4' width='312' height='62' rx='2' fill='#fffdf6' stroke='#b9ad94' stroke-width='1'/><line x1='16' y1='4' x2='16' y2='66' stroke='#d7776b' stroke-width='1'/><text x='312' y='13' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up case</text><text x='22' y='29' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>Where did I look? At the screen.</text><line x1='236' y1='19' x2='236' y2='30' stroke='#1f2a5a' stroke-width='1.5'/><line x1='241' y1='19' x2='241' y2='30' stroke='#1f2a5a' stroke-width='1.5'/><line x1='246' y1='19' x2='246' y2='30' stroke='#1f2a5a' stroke-width='1.5'/><line x1='251' y1='19' x2='251' y2='30' stroke='#1f2a5a' stroke-width='1.5'/><text x='262' y='29' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>4</text><text x='22' y='44' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>Where did my voice go flat?</text><line x1='236' y1='34' x2='236' y2='45' stroke='#1f2a5a' stroke-width='1.5'/><line x1='241' y1='34' x2='241' y2='45' stroke='#1f2a5a' stroke-width='1.5'/><text x='262' y='44' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>2</text><text x='22' y='59' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>Where did I say um?</text><line x1='236' y1='49' x2='236' y2='60' stroke='#1f2a5a' stroke-width='1.5'/><line x1='241' y1='49' x2='241' y2='60' stroke='#1f2a5a' stroke-width='1.5'/><line x1='246' y1='49' x2='246' y2='60' stroke='#1f2a5a' stroke-width='1.5'/><line x1='251' y1='49' x2='251' y2='60' stroke='#1f2a5a' stroke-width='1.5'/><line x1='233' y1='57' x2='254' y2='51' stroke='#1f2a5a' stroke-width='1.5'/><text x='262' y='59' font-family='Patrick Hand,cursive' font-size='11.5' font-weight='400' fill='#1f2a5a'>5</text><text x='4' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>Next to each count, name the rubric row it costs you.</text></svg><figcaption><b>WATCH ONCE</b>No rewinding, the way I score.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>You looked at the screen for most of it. Which row does that hurt?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The performance row: engaging the audience.</p></div></div><div class='num'>&middot; 31 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The peer panel</h3><table class='stages rules tight'><thead><tr><th>ROLE</th><th>JOB</th></tr></thead><tbody><tr><th>Speaker</th><td>Gives the talk.</td></tr><tr><th>Timer</th><td>Runs the clock and calls time.</td></tr><tr><th>Two listeners</th><td>Each asks one question from Folio 7.</td></tr><tr><th>Note-taker</th><td>Writes the feedback.</td></tr></tbody></table><p class='small'>Listeners ask: Does the design help me follow? Is the question clear, and why it matters? Can I follow the method or the solution? Are the limits there?</p><figure class='plate'><div class='pl'><span>PLATE XVIII</span><span>A feedback slip</span></div><svg class='fig' viewBox='0 0 320 58' role='img' aria-label='A handwritten feedback slip, a made-up case, in three lines. Row: design. What I saw: slide 3 has about 70 words. One fix: split it into two slides.'><rect x='4' y='4' width='312' height='50' rx='2' fill='#fffdf6' E ANSWER</text><rect x='174.7' y='68' width='141.3' height='20' rx='3' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1'/><text x='181' y='81.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>LATER: NOT SCORED</text><line x1='4' y1='96' x2='316' y2='96' stroke='#9c3322' stroke-width='2.2'/><text x='4' y='108' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>All scoring stops at minute 20. An off-topic answer scores 0 on its row.</text><text x='4' y='121' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>AP Research course description, page 52; 2026 scoring guidelines.</text><text x='4' y='132' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>LISTS</b>Pages 34 and 35 hold every question.</figcaption></figure></div><div class='P'><figure class='plate'><div class='pl'><span>PLATE XIX</span><span>Questions and rows</span></div><svg class='fig' viewBox='0 0 320 87' role='img' aria-label='AP Seminar: team talk, one question each; your own talk, two questions. AP Research: three questions from a panel; a fourth may clarify one. Pick your period inside the cover to see your rows and points. Course descriptions; 2026 scoring guidelines. Checked September 25, 2026.'><rect x='4' y='4' width='154' height='52' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='10' y='18' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>AP SEMINAR</text><text x='10' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>team talk: one question each</text><text x='10' y='44' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>your own talk: two questions</text><rect x='162' y='4' width='154' height='52' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='168' y='18' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>AP RESEARCH</text><text x='168' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>three questions from a panel</text><text x='168' y='44' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a fourth may clarify one</text><text x='4' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>Pick your period inside the cover to see your rows and points.</text><text x='4' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>Course descriptions; 2026 scoring guidelines. Checked September 25, 2026.</text></svg><figcaption><b>LISTS</b>Pages 34 and 35 hold every question.</figcaption></figure></div><div class='card2 good' style='margin-top:1.2cqw'><div class='k'>BE READY FOR EVERY ONE</div><p>I cannot tell you which questions you will get. The lists are on the next pages.</p></div></div><div class='num'>&middot; 33 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The questions, part 1</h3><div class='S'><p class='small'>Team talk: examples of the one question each of you may get.</p><table class='stages narrow1 tight'><thead><tr><th></th><th>IN PLAIN WORDS</th></tr></thead><tbody><tr><th>1</th><td>How did your team decide to use a teammate&#39;s lens or findings?</td></tr><tr><th>2</th><td>Give one way a teammate&#39;s findings changed your thinking.</td></tr><tr><th>3</th><td>Whose work changed your view of the problem most?</td></tr><tr><th>4</th><td>What strong argument from a teammate&#39;s report did you leave out, and why?</td></tr><tr><th>5</th><td>How does your team&#39;s solution change how you see your own research?</td></tr><tr><th>6</th><td>What argument in a teammate&#39;s report changed your team&#39;s solution?</td></tr><tr><th>7</th><td>With one more teammate, what view or limit would they research?</td></tr></tbody></table><p class='small'>Exact words: <a href='https://apcentral.collegeboard.org/media/pdf/ap-seminar-course-and-exam-description.pdf' target='_blank' rel='noopener'>AP Seminar course and exam description</a>, page 58.</p></div><div class='R'><table class='stages narrow1 tight'><thead><tr><th></th><th>YOUR PROCESS: THE CHOICES YOU MADE</th></tr></thead><tbody><tr><th>1</th><td>How did your first look at what scholars say lead to your final question?</td></tr><tr><th>2</th><td>How did other scholars&#39; methods help you choose yours?</td></tr><tr><th>3</th><td>How did your choices in running your method affect your research?</td></tr><tr><th>4</th><td>How did you decide which results mattered most?</td></tr></tbody></table><table class='stages narrow1 tight'><thead><tr><th></th><th>DEPTH: YOUR RESULTS AND WHAT THEY MEAN</th></tr></thead><tbody><tr><th>1</th><td>How does your new understanding fill a gap?</td></tr><tr><th>2</th><td>How did your limits shape your new understanding?</td></tr><tr><th>3</th><td>What do your findings mean in the real world?</td></tr><tr><th>4</th><td>How do your findings point to future research?</td></tr></tbody></table><p class='small'>Exact words: <a href='https://apcentral.collegeboard.org/media/pdf/ap-research-course-and-exam-description.pdf' target='_blank' rel='noopener'>AP Research course and exam description</a>, page 53.</p></div><div class='P'><p class='small'>Pick your period inside the cover to see your course.</p></div></div><div class='num'>&middot; 34 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The questions, part 2</h3><div class='S'><table class='stages narrow1 tight'><thead><tr><th></th><th>YOUR OWN TALK: YOUR RESEARCH PROCESS</th></tr></thead><tbody><tr><th>1</th><td>How did early information shape your research?</td></tr><tr><th>2</th><td>What evidence did you leave out, and why?</td></tr><tr><th>3</th><td>How did your question change?</td></tr><tr><th>4</th><td>Did your research go somewhere you did not expect?</td></tr><tr><th>5</th><td>What did you need but could not find?</td></tr><tr><th>6</th><td>How did you bring different views together?</td></tr></tbody></table><table class='stages narrow1 tight'><thead><tr><th></th><th>PUSHING YOUR ARGUMENT</th></tr></thead><tbody><tr><th>1</th><td>What new questions came out, and why?</td></tr><tr><th>2</th><td>What do your findings mean for your community?</td></tr><tr><th>3</th><td>How does your conclusion connect to other research?</td></tr><tr><th>4</th><td>How did others&#39; conclusions move your research forward?</td></tr></tbody></table><p class='small'>Exact words: page 65 of the course description.</p></div><div class='R'><table class='stages narrow1 tight'><thead><tr><th></th><th>YOUR REFLECTION: HOW YOU GREW</th></tr></thead><tbody><tr><th>1</th><td>What else are you curious about now? How did this year prepare you to explore it?</td></tr><tr><th>2</th><td>How did you handle uncertainty, not knowing what would happen?</td></tr><tr><th>3</th><td>What would you do differently, and why?</td></tr><tr><th>4</th><td>What was your most important new research skill? Where will you use it?</td></tr><tr><th>5</th><td>How did your expert adviser help you understand research? Asked only if you had an adviser.</td></tr></tbody></table><p class='small'>This question draws on your Process and Reflection Portfolio, pages 40 and 41. Exact words: page 53 of the course description.</p></div><div class='P'><p class='small'>Pick your period inside the cover to see your course.</p></div><p class='small'>Checked September 24, 2026.</p></div><div class='num'>&middot; 35 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A strong answer</h3><figure class='plate'><div class='pl'><span>PLATE XX</span><span>Four blocks</span></div><svg class='fig' viewBox='0 0 320 70' role='img' aria-label='Four blocks in order: 1 claim, answer it; 2 reason, because; 3 evidence, from your work; 4 reflection, what you learned. About one minute an answer.'><rect x='4' y='6' width='71' height='42' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.3'/><circle cx='13' cy='14' r='6.5' fill='#9c3322'/><text x='13' y='17.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='39.5' y='30' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>CLAIM</text><text x='39.5' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>answer it</text><path d='M76 27 L84 27' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M81 28.8 L84 27 L81 25.2' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='85' y='6' width='71' height='42' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.3'/><circle cx='94' cy='14' r='6.5' fill='#9c3322'/><text x='94' y='17.3' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='120.5' y='30' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>REASON</text><text x='120.5' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size= ></svg><figcaption><b>EVIDENCE</b>A named source, a number from your data, a date from your log, or a teammate&#39;s finding.</figcaption></figure><p class='small'>Answer the question they asked, not the one you practiced.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>A made-up case. Order these: &quot;So next time I would test it first.&quot; &quot;I chose a sleep diary.&quot; &quot;Students misremember sleep.&quot; &quot;Three of five studies in my review used diaries.&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Claim: I chose a sleep diary. Reason: students misremember sleep. Evidence: three of five studies used diaries. Reflection: next time I would test it first.</p></div></div><div class='num'>&middot; 36 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Three answers to one question</h3><div class='S'><p class='small'>A made-up case: &quot;What evidence did you leave out, and why?&quot;</p><table class='stages rules tight'><thead><tr><th>LEVEL</th><th>THE ANSWER</th></tr></thead><tbody><tr><th>Low</th><td>&quot;We did not have time for everything.&quot; Too short, and it fits any project.</td></tr><tr><th>Medium</th><td>&quot;I left out a phone ban study because it did not fit.&quot; Evidence, but no reason.</td></tr></tbody></table><figure class='plate'><div class='pl'><span>PLATE XXI</span><span>The high answer, found</span></div><svg class='fig' viewBox='0 0 320 96' role='img' aria-label='A made-up high answer to the question what evidence did you leave out, and why, with four numbered blocks: 1 claim, I left out a 2019 study on phone bans; 2 reason, My question was about attendance; 3 evidence, It measured test scores, not attendance; 4 refl sed? (The Research Log, page 60.) You never need a tool.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Is it allowed to ask a tool, &quot;What makes a good presentation?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Yes. General tips on good presentations are allowed.</p></div></div><div class='num'>&middot; 41 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Allowed or not?</h3><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Lucia asks a tool for eye contact tips. Dana has a tool write her talk. Which is allowed?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Lucia. General tips are allowed. A script from a tool is not.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Marco gets slide ideas from a tool, then picks and orders them. A team uses a tool&#39;s outline as its slides. Which is allowed?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Marco. He judged the ideas. The team let the tool choose.</p></div><div class='S'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>Ana lets a design app write her slide text. Sam asks a tool what I will ask him. Allowed?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Neither. The words must be hers, and no tool may help with the defense.</p></div></div><div class='R'><div class='card2 try' style='margin-top:1.2cqw'><div s='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Recorded, kept, and when things go wrong</h3><p class='small'>Every scored presentation is recorded on video. I keep it for at least one school year. The College Board may ask to see it, to check scoring or to train scorers. Checked September 24, 2026.</p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>Only I keep the video, in a school account. It is never posted. Absent on your day? The next open slot in the same week. A team presents with the members who are there.</p></div><p class='small'>Absent on your day? See me next class. The screen fails? Keep going from your cards (page 22).</p><div class='R'><p class='small'>You present again only if disruptions keep going, like several announcements or a drill.</p></div><div class='S'><p class='small'>A teammate with a long absence may leave a team without hurting the others&#39; scores.</p></div></div><div class='num'>&middot; 46 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>My talk, checked</h3><div class='form' data-form='talk'><div class='fhead'><span>MY TALK</span><span>TAP WHAT IS TRUE</span></div><p class='tierlab'>FIRST STEP</p><button type='button' class='tick' aria-pressed='false' aria-label='I know my time limit and my questions.'><span class='bx' aria-hidden='true'></span>I know my time limit and my questions.</button><button type='button' class='tick' aria-pressed='false' aria-label='My spine is on cards.'><span class='bx' aria-hidden='true'></span>My spine is on cards.</button><button type='button' class='tick' aria-pressed='false' aria-label='Every slide names its source.'><span class='bx' aria-hidden='true'></span>Every slide names its source.</button><p class='tierlab'>NEXT STE n></div><h3>Words that fool you</h3><p class='small'>Some English words look like Spanish words but mean something else.</p><table class='stages'><thead><tr><th>ENGLISH</th><th>LOOKS LIKE</th><th>IT MEANS</th></tr></thead><tbody><tr><th>argument</th><td><span lang='es'>argumento</span>, often the plot</td><td>a claim with reasons and evidence: <span lang='es'>argumentaci&oacute;n</span></td></tr><tr><th>actually</th><td><span lang='es'>actualmente</span>, now</td><td>in fact: <span lang='es'>en realidad</span></td></tr><tr><th>support</th><td><span lang='es'>soportar</span>, to put up with</td><td><span lang='es'>respaldar, apoyar</span></td></tr><tr><th>realize</th><td><span lang='es'>realizar</span>, to carry out</td><td>to notice: <span lang='es'>darse cuenta</span></td></tr><tr><th>assist</th><td><span lang='es'>asistir</span>, to attend</td><td><span lang='es'>ayudar</span></td></tr></tbody></table><p class='small'>Most words match: <span lang='es'>presentaci&oacute;n, evidencia, perspectiva, conclusi&oacute;n</span>.</p></div><div class='num'>&middot; 48 &middot;</div><div class='shade'></div>","label":"Words that fool you"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>PRESENT AND DEFEND</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Words in this book</h2><p class='small'>Tap a page to go there.</p><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>Attribution</strong><em lang='es'>atribuci&oacute;n</em></div><p>Saying who a fact or idea came from.</p><button type='button' class='gtag' data-jump='24' aria-label='Go to page 20'>Page 20</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-people'/></svg><strong>Audience</strong><em lang='es'>p&uacute;blico</em></div><p>The people you speak to.</p><button type='button' class='gtag' data-jump='15' aria-label='Go to page 12'>Page 12</button></div><div class='wrow'>
