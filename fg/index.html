o search words yet.</span><span class='gpn'>The Research Manual, page 20</span></div><button type='button' class='gorow' data-jump='38'><span><svg class='ic sm' aria-hidden='true'><use href='#i-cal'/></svg>A date I need.</span><span class='gpn'>30</span></button><p class='small fill'>No question in any Room 63 book can be your question. Page <button type='button' class='pj' data-jump='6' aria-label='Go to page 4'>4</button> says why.</p></div><div class='num'>&middot; 3 &middot;</div><div class='shade'></div>", "label": "Start here"}, {"cls": "board chapter", "label": "Folio 1", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>1</div><div class='ch-title'>Your question, your words</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-bulb'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Say why no one can hand you a question, and tell a topic from a question.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Your question is yours</span><span class='ld' aria-hidden='true'></span><span class='pn'>4</span></li><li><span class='it'>From topic to question</span><span class='ld' aria-hidden='true'></span><span class='pn'>5</span></li><li><span class='it'><span class='S'>An issue, not a study</span><span class='R'>Research, or research?</span><span class='P'>What your course asks</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>6</span></li><li><span class='it'>Six words, exactly</span><span class='ld' aria-hidden='true'></span><span class='pn'>7</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bulb'/></svg>FOLIO 1</p><h2>Your question is yours</h2><table class='stages rules'><thead><tr><th>RULE</th><th>WHAT IT SAYS</th></tr></thead><tbody><tr><th>College Board</th><td>Teachers may not &quot;assign, provide, distribute, or generate research questions&quot; for students.</td></tr><tr><th>A tool that writes</th><td>The College Board lists &quot;using AI to generate a research question&quot; as not acceptable.</td></tr><tr><th>Room 63</th><td>No tool writes, rewrites, or narrows your question. No question in any Room 63 book can be your question.</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Allowed? A: I name the parts of a made-up question for the class. B: I write one for you.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>A. I can ask about your question all year. I cannot give you one.</p></div><p class='small'>Rules checked September 25, 2026.</p></div><div class='num'>&middot; 4 &middot;</div><div class='shade'></div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>From topic to question</h3><div class='S'><p>A topic is a subject. In AP Seminar, a question climbs four stages.</p><figure class='plate'><div class='pl'><span>PLATE I</span><span>The stages</span></div><svg class='fig' viewBox='0 0 320 165' role='img' aria-label='Four stages, each narrower than the one above, with a made-up bench case: one, topic, a subject: benches in Miami; two, issue, where people disagree: shelter first, or shops?; three, question, needs more than one lens: to what extent should...?; four, significance, a larger context: who public space is for. The last stage is t div><div class='num'>&middot; 5 &middot;</div><div class='shade'></div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><span class='S'>An issue, not a study</span><span class='R'>Research, or research?</span><span class='P'>What your course asks</span></h3><div class='S'><p>In AP Seminar you do not run a study. You find an issue people disagree about. You read the best writers on each side. Then you argue your own view, with evidence. Page <button type='button' class='pj' data-jump='38' aria-label='Go to page 30'>30</button> has the dates.</p><figure class='plate'><div class='pl'><span>PLATE I B</span><span>Three tasks, three jobs</span></div><svg class='fig' viewBox='0 0 320 121' role='img' aria-label='Three tasks, three question jobs. Team project: one team question, seen from many perspectives. Written argument: your own question, on a theme in at least two packet texts. Exam: no question to write; find the theme that links four sources, and use at least two. Source: the AP Seminar course and exam description, checked September 25, 2026.'><rect x='4' y='3' width='312' height='29' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><use href='#i-people' x='10' y='5.5' width='13' height='13' color='#1f3a5a'/><text x='29' y='15' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>TEAM PROJECT</text><text x='29' y='27.5' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>one team question, seen from many perspectives</text><rect x='4' y='34.5' width='312' height='29' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><use href='#i-pen' x='10' y='37' width='13' height='13' color='#1f3a5a'/><text x='29' y='46.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WRITTEN ARGUMENT</text><text f' stroke='#9c3322' stroke-width='1.2'/><path d='M12 9 L19 16 M19 9 L12 16' fill='none' stroke='#9c3322' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/><text x='26' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>SMALL R</text><text x='80' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='15' font-weight='700' fill='#1f3a5a' text-anchor='middle'>research</text><text x='80' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31' text-anchor='middle'>looks up what people know</text><text x='80' y='64' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#9c3322' text-anchor='middle'>SCORES 1 AND 2 BEGIN</text><text x='80' y='76' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a' text-anchor='middle'>&quot;Report on Existing Knowledge&quot;</text><rect x='164' y='4' width='152' height='78' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><path d='M172 12.4 L175 15.2 L180 8.8' fill='none' stroke='#245e55' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='186' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>CAPITAL R</text><text x='240' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='15' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Research</text><text x='240' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31' text-anchor='middle'>adds something new</text><text x='240' y='64' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#245e55' text-anchor='middle'>SCORES 3 TO 5 ALL NAME</text><text x='240' y='76' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a' text-anchor='middle'>&quot;a new understanding&quot;</text><text x='4' y='96' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Score titles: 2026 AP Research scoring guidelines.</text><text x='4' y='108' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>THE STEP UP</b>Your paper must add something new.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; PROJECT GOAL</div><p><em lang='es' class='esw'>objetivo del proyecto</em> &middot; What a create project sets out to make, like a design or a poem. The proposal form starts: &quot;State your research question and/or project goal.&quot;</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>A paper collects what five websites say about sleep. Which score title fits?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Report on Existing Knowledge. Nothing new was found.</p></div></div><div class='P'><figure class='plate'><div class='pl'><span>PLATE I B</span><span>What your course asks</span></div><svg class='fig' viewBox='0 0 320 77' role='img' aria-label='Two courses. AP Seminar: an issue people disagree about; you argue your view. AP Research: a study that adds something new. Pick your period to see your course.'><rect x='4' y='4' width='152' height='54' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><rect x='4' y='4' width='152' height='17' rx='3' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1'/><text x='80' y='16.3' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AP SEMINAR</text><text x='12' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>an issue people disagree</text><text x='12' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>about; you argue your view</text><rect x='164' y='4' width='152' height='54' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><rect x='164' y='4' width='152' height='17' rx='3' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1'/><text x='240' y='16.3' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AP RESEARCH</text><text x='172' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>a study that adds</text><text x='172' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>something new</text><text x='160' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>Pick your period to see your course.</text></svg><figcaption><b>TWO COURSES</b>Each course gives a question a different job.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see the page for your course. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div></div><div class='num'>&middot; 6 &middot;</div><div class='shade'></div>", "label": "Folio 1"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Six words, exactly</h3><div class='S'><p>The scoring uses these six words. Know each one in plain words.</p><table class='stages'><thead><tr><th>WORD</th><th>IN PLAIN WORDS</th></tr></thead><tbody><tr><th>issue</th><td>a problem people debate</td></tr><tr><th>lens</th><td>a filter you look through, like economics</td></tr><tr><th>perspective</th><td>a point of view, with its reason</td></tr><tr><th>argument</th><td>a claim with reasons and evidence</td></tr><tr><th>counterargument</th><td>an opposing view, with evidence</td></tr><tr><th>complex issue</th><td>an issue with many sides you must understand first</td></tr></tbody></table><p class='small'>The College Board&#39;s exact words: pages <button type='button' class='pj' data-jump='44' aria-label='Go to page 36'>36</button> to <button type='button' class='pj' data-jump='46' aria-label='Go to page 38'>38</button>.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>&quot;Parents.&quot; Is that a perspective?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>No. Parents are a group. A perspective is a view with its reason. The Research Log, page 34.</p></div></div><div class='R'><p>The scoring uses these six words. Know each one in plain words.</p><table class='stages'><thead><tr><th>WORD</th><th>IN PLAIN WORDS</th></tr></thead><tbody><tr><th>topic of inquiry</th><td>the subject you study</td></tr><tr><th>variable</th><td>something you count, measure, code, or compare</td></tr><tr><th>scope</th><td>which people, which place, which years</td></tr><tr><th>method</th><td>how you collect your evidence</td></tr><tr><th>feasible</th><td>you can do it with what you have</td></tr><tr><th>community of practice</th><td>the people who work on your topic and would use your answer</td></tr></tbody></table><p class='small'>The College Board&#39;s meaning of feasible: page <button type='button' class='pj' data-jump='45' aria-label='Go to page 37'>37</button>.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Does feasible mean interesting?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>No. It means you can do it with the time, resources, and processes you have.</p></div></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s six words. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div></div><div class='num'>&middot; 7 &middot;</div><div class='shade'></div>", "label": "Folio 1"}, {"cls": "board chapter", "label": "Folio 2", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>2</div><div class='ch-title'>Where questions come from</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-compass'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Start a question from your own curiosity and your own sources.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Nothing yet? Start here</span><span class='ld' aria-hidden='true'></span><span class='pn'>8</span></li><li><span class='it'>The question burst</span><span class='ld' aria-hidden='true'></span><span class='pn'>9</span></li><li><span class='it'>Start from your log</span><span class='ld' aria-hidden='true'></span><span class='pn'>10</span></li><li><span class='it'>Build your own gallery</span><span class='ld' aria-hidden='true'></span><span class='pn'>11</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-compass'/></svg>FOLIO 2</p><h2>Nothing yet? Start here</h2><div class='S'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>FINISH TWO STARTERS</div><p class='note2'>1 People argue about ___, but no one has read about it.</p><p class='note2'>2 My neighborhood handles ___ differently. Who is right?</p><p class='note2'>3 Everyone has an opinion on ___. Who has evidence?</p></div></div><div class='R'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>FINISH TWO STARTERS</div><p class='note2'>1 I have always wondered why ___.</p><p class='note2'>2 In ___ class, I want to know more about ___.</p><p class='note2'>3 I do not understand how ___ works.</p><p class='note2'>4 I want to help fix ___.</p></div></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your starters. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div><div class='notes' style='margin-top:.6cqw'><div style='margin-bottom:.4cqw'><svg class='ic sm' aria-hidden='true' style='color:#245e55'><use href='#i-check'/></svg><p class='small'>Keep the one where you do not know the answer yet. Write it in your log, with the date.</p></div><div style='margin-bottom:0'><svg class='ic sm' aria-hidden='true' style='color:#9c3322'><use href='#i-cross'/></svg><p class='small'>Know the answer already? Drop it: it is a report.</p></div></div><p class='small'>A tool may show you what people debate. It may not choose for you: The AI Manual, page 7.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>&quot;Teens and social media.&quot; Topic or question?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>A topic. Run the question burst on page <button type='button' class='pj' data-jump='12' aria-label='Go to page 9'>9</button>.</p></div></div><div class='num'>&middot; 8 &middot;</div><div class='shade'></div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The question burst</h3><p class='small'>Its College Board name: the question formulation technique. Take your best question to page <button type='button' class='pj' data-jump='20' aria-label='Go to page 15'>15</button>.</p><figure class='plate'><div class='pl'><span>PLATE I C</span><span>A burst, done</span></div><svg class='fig' viewBox='0 0 320 99' role='img' aria-label='A notebook page after a question burst. A clock says 4 minutes. Callout 1: set a four-minute timer and write every question your topic raises; do not answer them. Seven question lines are scribbles that end in question marks. Callout 2: each has O for open or C for closed in the margin, and two C lines have arrows to new O lines: two closed ones rewritten as open. Callout 3: three lines are circled, the three you most want answered. An arrow takes the best circled line to page 15. The drawing holds no question words: yours go here.'><rect x='2' y='2' width='316' height='95' rx='2' fill='#fffdf6' stroke='#b8903f' stroke-width='1'/><line x1='36' y1='2' x2='36' y2='97' stroke='#b8903f' stroke-width='0.9'/><use href='#i-clock' x='44' y='3' width='12' height='12' color='#1f3a5a'/><text x='60' y='13' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f3a5a'>4 minutes</text><circle cx='116' cy='9' r='6.5' fill='#9c3322'/><text x='116' y='12.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>1</text><text x='312' y='12' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='end'>YOUR LOG</text><text x='26' y='30.4' font-family='Patrick Hand,cursive' font-size='10.5' font-weight='400' fill='#1f3a5a' text-anchor='middle'>O</text><path d='M44 27 Q46.5 28.5 49 27 Q51.5 25.5 54 27 Q56.5 28.5 59 27 Q61.5 25.5 64 27 Q66.5 28.5 69 27 Q71.5 25.5 74 27 Q76.5 28.5 79 27 Q81.5 25.5 84 27 Q86.5 28.5 89 27 Q91.5 25.5 94 27 Q96.5 28.5 99 27 Q101. ><path d='M227 79.5 L250 80.5' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M246.9 82.1 L250 80.5 L247 78.6' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><rect x='252' y='72.5' width='60' height='15' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='282' y='83.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>PAGE 15</text></svg><figcaption><b>THREE STEPS</b>1 Write. 2 Mark O or C. 3 Circle three.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; OPEN QUESTION</div><p><em lang='es' class='esw'>pregunta abierta</em> &middot; It needs an argument or a study to answer. A closed one takes yes, no, or one fact.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Open or closed? &quot;Do Miami benches have bars?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Closed. Yes or no answers it.</p></div></div><div class='num'>&middot; 9 &middot;</div><div class='shade'></div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Start from your log</h3><p>Your first sources are already in your log. Use them.</p><div class='S'><svg class='fig' style='margin-top:.4cqw!important' viewBox='0 0 320 119' role='img' aria-label='Three steps. One: read line 6 of every entry: does it still serve your question? Two: find two entries that disagree. Entry 1 counts blank as evidence; entry 2 counts blank as evidence. The two meet at a balance: they disagree about blank because each counts blank as evidence. Three: write that sentence under your newest version line.'><circle cx=' rs instead of shelter beds?&quot; Which two lenses?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Ethical (fair) and economic (pay).</p></div><p class='small fill'>A made-up case. It shows the move. It cannot be your question.</p></div><div class='R'><p class='small'>Every field counts something. Here are five of many.</p><svg class='fig' style='margin-top:.4cqw!important' viewBox='0 0 320 164' role='img' aria-label='Five fields, each with a small picture of what you count or code. Psychology: experiment; you count: scores, two conditions. The picture: two bars, one for each condition. Public health: content analysis; you code: what ads say. The picture: two sets of texts, each marked with tally marks. Economics: someone else&#39;s data; you count: numbers, read a new way. The picture: a table of numbers, with an arrow over it. History: archival; you code: old newspapers. The picture: a newspaper, with tally marks. Literature: textual analysis; you code: two texts, one named method. The picture: two open pages.'><path d='M8 26 L52 26' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><rect x='14' y='17' width='12' height='9' rx='1' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><rect x='34' y='8' width='12' height='18' rx='1' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='64' y='14.5' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>psychology: experiment</text><text x='64' y='28.5' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31'>you count: scores, two conditions</text><path d='M4 32.5 L316 32.5' fill='none' stroke='#b8903f' stroke-width='0.7' stroke-linecap='round' stroke-linejoin='round'/><rect x='13' y='44' width='13' height='17' rx='0.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><rect x='10.5' y='41.5' width='13' he one else&#39;s data</text><text x='64' y='94.5' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31'>you count: numbers, read a new way</text><path d='M4 98.5 L316 98.5' fill='none' stroke='#b8903f' stroke-width='0.7' stroke-linecap='round' stroke-linejoin='round'/><rect x='10' y='105' width='30' height='21' rx='0.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><path d='M13 109.5 L37 109.5' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M13 114 L23 114 M13 118 L23 118 M27 114 L37 114 M27 118 L37 118' fill='none' stroke='#1f3a5a' stroke-width='0.9' stroke-linecap='round' stroke-linejoin='round'/><path d='M44 109 L44 121 M47.5 109 L47.5 121 M51 109 L51 121' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='64' y='113.5' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>history: archival</text><text x='64' y='127.5' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31'>you code: old newspapers</text><path d='M4 131.5 L316 131.5' fill='none' stroke='#b8903f' stroke-width='0.7' stroke-linecap='round' stroke-linejoin='round'/><rect x='8' y='139' width='19' height='20' rx='0.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><path d='M11 144 L24 144 M11 148.5 L24 148.5 M11 153 L20 153' fill='none' stroke='#1f3a5a' stroke-width='0.9' stroke-linecap='round' stroke-linejoin='round'/><rect x='31' y='139' width='19' height='20' rx='0.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><path d='M34 144 L47 144 M34 148.5 L47 148.5 M34 153 L43 153' fill='none' stroke='#1f3a5a' stroke-width='0.9' stroke-linecap='round' stroke-linejoin='round'/><text x='64' y='146.5' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>literature: textual analysis</text><text x='64' y='160.5' font-family <table class='stages wide1'><thead><tr><th>YOUR QUESTION ASKS</th><th>A METHOD THAT COULD FIT</th></tr></thead><tbody><tr><th>Does X cause Y?</th><td>experiment</td></tr><tr><th>What do posts, ads, or films show?</th><td>content analysis</td></tr><tr><th>What does a work mean?</th><td>textual analysis</td></tr><tr><th>What happened here before?</th><td>archival</td></tr><tr><th>What do the numbers show, read a new way?</th><td>someone else&#39;s data</td></tr></tbody></table><p class='small'>Someone else&#39;s data can be your study&#39;s data, if you analyze it in a new way. Repeating their numbers is not a study. See me next class first.</p><div class='notes' style='margin-top:.8cqw'><div><svg class='ic sm' aria-hidden='true' style='color:#9c3322'><use href='#i-warn'/></svg><p class='small'>Surveys are allowed, but the 2025 Chief Reader Report says most students who used one could not defend it.</p></div></div><p class='small'>Studying people? I review your plan first. Above minimal risk cannot be approved. Choose and defend your method: The Proposal, Folio 3.</p></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see the page for your course. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div></div><div class='num'>&middot; 14 &middot;</div><div class='shade'></div>", "label": "Folio 3"}, {"cls": "board chapter", "label": "Folio 4", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>4</div><div class='ch-title'>Shapes that work</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-question'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Give your question a shape that promis 'card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>Start: &quot;I like parks.&quot; Ask &quot;What about it?&quot; twice.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Any narrower line, like &quot;benches in parks,&quot; then &quot;who uses them at night.&quot;</p></div></div><div class='num'>&middot; 17 &middot;</div><div class='shade'></div>", "label": "Folio 4"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><span class='S'>The two dials</span><span class='R'>The problem statement</span><span class='P'>Dials, or the problem</span></h3><div class='S'><figure class='plate'><div class='pl'><span>PLATE V B</span><span>Two dials, four corners</span></div><svg class='fig' viewBox='0 0 320 132' role='img' aria-label='A grid of two dials. Across: specific, from too big to who, where, when, which. Up: debatable, from everyone agrees to people disagree. Can you write the answer you would hate to reach? Low and low: a topic. Specific but agreed: a fact to look up. Debated but too big: a debate too big to study. Specific and debated: a question you can argue, the goal.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>DEBATABLE</text><text x='67' y='11' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Can you write the answer you would hate to reach?</text><path d='M62 108 L62 17' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M64 20.5 L62 17 L60 20.5' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><text x='56' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor __</text><text x='18' y='42' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#4a3f31'>Date ______</text><circle cx='130' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='130' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>1</text><circle cx='157' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='157' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>2</text><circle cx='184' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='184' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>3</text><circle cx='211' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='211' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>4</text><circle cx='238' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='238' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>5</text><circle cx='265' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='265' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>6</text><circle cx='292' cy='36' r='7' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.5'/><text x='292' y='22' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>7</text><text x='160' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31' text-anchor='middle'>Seven empty dots: seven checks to run.</text><text x='160' y='84' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31' text-anchor='middle'>Pick your period to see your course&#39;s seven checks.</text></svg><figcaption><b>A DOT PER CHECK</b>Draw the seven dots under each version line in your log.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s seven checks. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div><p class='small fill'>The labels match The Research Log, page 46.</p></div><div class='num'>&middot; 20 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Checks 1 to 4, up close</h3><div class='S'><table class='stages checks'><thead><tr><th>CHECK</th><th>ASK YOURSELF</th><th>IT FAILS WHEN</th></tr></thead><tbody><tr><th>1 Open</th><td>A question mark, a verb, a judgment word?</td><td>Yes or no answers it.</td></tr><tr><th>2 Debatable</th><td>Would informed people answer it differently? Name two.</td><td>You cannot name two. It is a report.</td></tr><tr><th>3 Two lenses</th><td>Does a good answer need two lenses from page <button type='button' class='pj' data-jump='16' aria-label='Go to page 12'>12</button>?</td><td>One lens: a summary of one field.</td></tr><tr><th>4 Specific</th><td>Who, where, when?</td><td>Two of the three are missing. It is still a topic.</td></tr></tbody></table></div><div class='R'><table class='stages checks'><thead><tr><th>CHECK</th><th>ASK YOURSELF</th><th>IT FAILS WHEN</th></tr></thead><tbody><tr><th>1 Focused</th><td>A narrow subject, and a verb?</td><td>It is only a subject, like &quot;teen sleep.&quot;</td></tr><tr><th>2 Purpose</th><td>Explore, explain, or create? Does a row on page <button type='button' class='pj' data-jump='18' aria-label='Go to page 14'>14</button> fit?</td><td>No method could answer it.</td></tr><tr><th>3 Something to measure</th><td>Something to count, measure, code, or compare? Making something? Name the features you will judge it by.</td><td>There is nothing to find.</td></tr><tr><th>4 Who, where, when</th><td>Which people, which place, which time?</td><td>Two of the three are missing. It is still a topic.</td></tr></tbody></table></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s checks. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div><p class='small'>Tap a page number to go there.</p></div><div class='num'>&middot; 21 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Checks 5 to 7, up close</h3><div class='S'><table class='stages checks'><thead><tr><th>CHECK</th><th>ASK YOURSELF</th><th>IT FAILS WHEN</th></tr></thead><tbody><tr><th>5 Unsettled</th><td>Do credible sources disagree?</td><td>Every good source agrees. A fact is evidence, not a question.</td></tr><tr><th>6 A source on the other side</th><td>Can you name one source that argues against your view? Will you read it?</td><td>Only one side has sources.</td></tr><tr><th>7 Someone needs the answer</th><td>Who needs it, and what would they do with it?</td><td>You cannot say.</td></tr></tbody></table><p class='small'>The written argument asks you to explain your question&#39;s significance &quot;by situating it within a larger context.&quot; Test it: fill &quot;so that readers understand ___.&quot; Writing the Paper, page 4.</p></div><div class='R'><table class='stages checks'><thead><tr><th>CHECK</th><th>ASK YOURSELF</th><th>IT FAILS WHEN</th></tr></thead><tbody><tr><th>5 Someone needs it</th><td>Who needs the answer? What changes for them? That is your community of practice.</td><td>You cannot name them.</td></tr><tr><th>6 Doable this year</th><td>The time, tools, places, people, and permissions you really have?</td><td>It needs a lab, a grant, or ten years.</td></tr><tr><th>7 Either way</th><td>Could the result go either way? Would you report it either way, even the answer you did not want?</td><td>Only one answer is allowed. That is a belief.</td></tr></tbody></table><p class='small'>Test check 5: fill &quot;so that readers understand ___.&quot; Writing the Paper, page 4. Check 7 in real life: a paper scored 5 even though its results went against the student&#39;s own guess (AP Summer Institute notes, 2023).</p></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s checks. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div></div><div class='num'>&middot; 22 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Circle it, then argue with it</h3><p>Do this in your log, under the seven dots.</p><table class='stages narrow1'><thead><tr><th>STEP</th><th>DO THIS</th></tr></thead><tbody><tr><th>1</th><td>Copy your newest version. Circle the who, the where, the when, and <span class='S'>the judgment word.</span><span class='R'>the verb and the variable.</span><span class='P'>the key words.</span> What you cannot circle is missing.</td></tr><tr><th>2</th><td>Write the answer you expect. Then write the answer you would hate to reach.</td></tr></tbody></table><div class='S'><svg class='fig' viewBox='0 0 320 70' role='img' aria-label='Step 3, a frame to fill in your log. Side one would say blank. Their evidence: blank. Side two would say blank. Their evidence: blank. olor='#f3e3bd'/><text x='90' y='61.5' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#f3e3bd'>They really disagree about ___.</text></svg></div><div class='R'><svg class='fig' viewBox='0 0 320 65' role='img' aria-label='Step 3. Two boxes from step 2: the answer you expect, blank, and the answer you would hate to reach, blank. Both can happen? Then check 7, either way, passes.'><circle cx='9' cy='11' r='6.5' fill='#9c3322'/><text x='9' y='14.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text><rect x='22' y='2' width='146' height='32' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='28' y='14.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>The answer you expect</text><text x='28' y='29' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>_______________</text><rect x='172' y='2' width='146' height='32' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='178' y='14.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>The answer you would hate to reach</text><text x='178' y='29' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>_______________</text><path d='M95 34 L120 41.5' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M116.9 42.2 L120 41.5 L117.8 39.2' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M245 34 L220 41.5' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M222.2 39.2 L220 41.5 L223.1 42.2' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='22' y='55.5' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>Both can happen?</text><rect x='112' y='42' width='206' height='21' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.2'/><path d='M120 53 L123.4 56.1 L129 48.9' fill='none' stroke='#e8c878' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/><text x='135' y='56.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#f3e3bd'>Then check 7, either way, passes.</text></svg></div><div class='P'><svg class='fig' viewBox='0 0 320 67' role='img' aria-label='Step 3 is not the same in the two courses. AP Seminar: two sides, and what they disagree about. AP Research: two answers: can both happen? Pick your period to see step 3.'><circle cx='9' cy='11' r='6.5' fill='#9c3322'/><text x='9' y='14.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text><rect x='22' y='2' width='146' height='47' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><rect x='22' y='2' width='146' height='17' rx='3' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1'/><text x='95' y='14.3' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AP SEMINAR</text><text x='30' y='31' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>two sides, and what</text><text x='30' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>they disagree about</text><rect x='172' y='2' width='146' height='47' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><rect x='172' y='2' width='146' height='17' rx='3' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1'/><text x='245' y='14.3' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AP RESEARCH</text><text x='180' y='31' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>two answers: can</text><text x='180' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>both happen?</text><text x='170' y='63' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>Pick your period to see step 3.</text></svg></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>You can write the answer you expect, but not the one you would hate. What does that tell you?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The question is not open yet.<span class='S'> Check 2, debatable, fails.</span><span class='R'> Check 7, either way, fails.</span><span class='P'></span></p></div></div><div class='num'>&middot; 23 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Run the checks</h3><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Is it open? &quot;Are bench bars bad?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>No. Yes or no answers it. Check 1 fails.</p></div><div class='S'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Run checks 1, 4, and 5 on &quot;Are bench bars in Miami bad?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>1 fails: yes or no. 4 fails: a where, but no who and no when. 5 depends on your sources: do credible ones disagree?</p></div></div><div class='R'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Run checks 3, 4, and 6 on &quot;How does hostile architecture affect people in Hialeah?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>3 fails: nothing to count. 4 fails: a where, but no clear who and no when. 6 cannot pass until 3 and 4 do.</p></div></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s next step. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>Run all seven on your own newest version. Which dots stay empty?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Only you can answer this one. Bring your log to your next checkpoint.</p></div><p class='small fill'>Every question on this page is a made-up case from The Research Log, page 47.</p></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "label": "Folio 5", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>One version, checked</h3><p>Page 24, done once on a made-up version 2. Then do the same on your own.</p><div class='S'><figure class='plate'><div class='pl'><span>PLATE VI B</span><span>One version, checked</span></div><svg class='fig' viewBox='0 0 320 194' role='img' aria-label='A made-up case: version 2 from The Research Log, copied into your log: Are bench bars in Miami bad? Step 1: Miami is circled, the where. Thin outlines mark what is missing: who?, when?, judgment word? Step 2: seven dots under it. Dot 1 fails. Dot 4 fails. Dot 5 has a question mark: it depends on your sources. Dots 2, 3, 6, and 7 stay empty: the ejoin='round'/><text x='236' y='14' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Each empty dot</text><text x='236' y='27' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>has one repair.</text><text x='236' y='40' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Pick your period</text><text x='236' y='53' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>to see yours.</text></svg><figcaption><b>ONE AT A TIME</b>The numbers match the checks on Plate VI.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s repairs. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:#f6eedb'><use href='#i-loop'/></svg>A NEW VERSION</div><p>A repair makes a new version. Write the version line: The Research Log, page 46.</p></div></div><div class='num'>&middot; 27 &middot;</div><div class='shade'></div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Repairs for your course</h3><figure class='plate'><div class='pl'><span>PLATE VII B</span><span>Where the answer can land</span></div><svg class='fig' viewBox='0 0 320 55' role='img' aria-label='A closed question has two answers, yes and no, with nothing between. An open question has a line from not at all to completely. A mark in the middle says: your evidence decides where.'><text x='4' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>CLOSED</text><rect x='74' y='4' width='62' height='17' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='105' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>YES</text><rect x='254' y='4' width='62' height='17' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='285' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>NO</text><text x='195' y='16.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>nothing between</text><text x='4' y='40' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>OPEN</text><path d='M74 36 L316 36 M74 32 L74 40 M316 32 L316 40' fill='none' stroke='#1f3a5a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='74' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>not at all</text><text x='316' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='end'>completely</text><path d='M191 27 L201 27 L196 34.5 Z' fill='#9c3322' stroke='#9c3322' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='196' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322' text-anchor='middle'>your evidence decides where</text></svg><figcaption><b>OPEN IT</b>To what extent, or how much, opens a range.</figcaption></figure><div class='S'><table class='stages'><thead><tr><th>PROBLEM</th><th>REPAIR</th></tr></thead><tbody><tr><th>&quot;Is X good or bad?&quot;</th><td>Add: for whom, measured how, compared with what.</td></tr><tr><th>Only one side has sources.</th><td>Search the other side&#39;s words: The Research Manual, page 25.</td></tr><tr><th>A group stands in for a view.</th><td>Find the arguments people in that group make. Name those.</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>&quot;Is the new bench design good or bad?&quot; The repair?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Add for whom, measured how, and compared with what.</p></div></div><div class='R'><table class='stages'><thead><tr><th>PROBLEM</th><th>REPAIR</th></tr></thead><tbody><tr><th>No verb: &quot;It is about...&quot;</th><td>Start with how, which, to what extent, or does.</td></tr><tr><th>Yes or no.</th><td>Ask &quot;to what extent&quot; or &quot;how much,&quot; and name the variable.</td></tr><tr><th>It asks what should happen.</th><td>Ask what evidence can show. Or plan to weigh published evidence from several sides.</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>&quot;It is about school start times.&quot; The repair?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Add a verb. Start with how, which, to what extent, or does.</p></div></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s repairs. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div></div><div class='num'>&middot; 28 &middot;</div><div class='shade'></div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE FIELD GUIDE</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Fix it</h3><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Name the broken shape: &quot;When did the city add bars to its benches?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The lookup. One source answers it.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Repair it: &quot;Is hostile architecture good or bad?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Add for whom, measured how, and compared with what. Any repair that passes checks 1 and 4 works.</p></div><div class='S'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>Which check fails? &quot;To what extent do bench bars cost less than shelter beds?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Check 3. Only the economic lens. Add a second lens, like ethical: is the cheaper choice fair?</p></div></div><div class='R'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>Which check fails? The plan, in parts: one school, ninth graders, a new start time this semester, then sleep compared.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Check 6. You cannot change a school&#39;s start time this year. Repair: study a school that already changed. See me next class first.</p></div></div><div class='P'><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period on the first page inside the book to see your course&#39;s last case. <button type='button' class='pj' data-jump='1'>Go to that page</button></p></div></div><p class='small fill'>All made-up cases.</p></div><div class='num'>&middot; 29 &middot;</div><div class='shade'></div>", "label": "Folio 6"}, {"cls": "board chapter", "label": "Folio 7", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>F
