' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M300 80.4 L303 83.2 L308 76.8' fill='none' stroke='#245e55' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='290' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#245e55' text-anchor='end'>in April, only your paper</text>\n<path d='M150 66 L150 97' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='143' y='75' width='14' height='14' rx='2' fill='#fbf6ea'/>\n<path d='M145.5 77.5 L154.5 86.5 M154.5 77.5 L145.5 86.5' fill='none' stroke='#9c3322' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='139' y='86' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322' text-anchor='end'>never</text>\n<text x='8' y='146' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Rule: AP Research course description, page 50, checked September 25, 2026.</text></svg><figcaption><b>EVERY MEETING</b>Bring all three homes to every meeting with me.</figcaption></figure><p class='small'>Never copy a log entry into your portfolio. Point to it: &quot;Log, entry 12.&quot;</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>You read a new study today. Where does it go first?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Your log, today, all six lines. Its annotation comes later, in your portfolio.</p></div></div><div class='num'>&middot; 6 &middot;</div><div class='shade'></div>", "label": "Folio 1"}, {"cls": "board chapter", "label": "Folio 2", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>2</div><div class='ch-title'>What goes inside</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-doc'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Name the ten parts your portfolio must hold by April, and when each one starts.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Two kinds of pages</span><span class='ld' aria-hidden='true'></span><span class='pn'>7</span></li><li><span class='it'>Parts 1 to 3</span><span class='ld' aria-hidden='true'></span><span class='pn'>8</span></li><li><span class='it'>Parts 4 to 6</span><span class='ld' aria-hidden='true'></span><span class='pn'>9</span></li><li><span class='it'>Parts 7 to 10</span><span class='ld' aria-hidden='true'></span><span class='pn'>10</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-doc'/></svg>FOLIO 2</p><h2>Two kinds of pages</h2><p class='small'>Entries: all year. The ten parts: by April, in this order.</p><table class='stages wide1 tight'><thead><tr><th>PART</th><th>ABOUT WHEN</th></tr></thead><tbody><tr><th>1 Annotated bibliography</th><td>September</td></tr><tr><th>2 Approved proposal form</th><td>November</td></tr><tr><th>3 Permissions, if needed</th><td>November</td></tr><tr><th>4 Adviser log, if any</th><td>when you have one</td></tr><tr><th>5 Feedback table</th><td>September</td></tr><tr><th>6 Pictures and charts</th><td>December</td></tr><tr><th>7 Draft sections</th><td>January</td></tr><tr><th>8 Showcase pieces</th><td>March</td></tr><tr><th>9 Defense notes</th><td>April</td></tr><tr><th>10 Signed affirmation</th><td>April</td></tr></tbody></table><p class='small'>Start months are my estimate from the College Board&#39;s sample year.</p></div><div class='num'>&middot; 7 &middot;</div><div class='shade'></div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Parts 1 to 3</h3><table class='stages rules'><thead><tr><th>PART</th><th>WHAT IT IS</th></tr></thead><tbody><tr><th>1 Annotated bibliography</th><td>Every source important to your work, each with a short paragraph in your own words. How: The Research Manual, page 64.</td></tr><tr><th>2 Approved proposal form</th><td>The College Board&#39;s Inquiry Proposal Form, with my approval. <svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-flag'/></svg>College Board date: November 30, 2026.</td></tr><tr><th>3 Permissions, if needed</th><td>For a study with people: &quot;Permission on file,&quot; and the date. No names. Signed pages stay in Room 63.</td></tr></tbody></table><p class='small'>You collect nothing from people before I approve your plan. Checked September 25, 2026.</p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; INSTITUTIONAL REVIEW BOARD</div><p><em lang='es' class='esw'>comit&eacute; de &eacute;tica institucional</em> &middot; A group that reviews research with people. You need one only to publish, present in public, or compete.</p></div></div><div class='num'>&middot; 8 &middot;</div><div class='shade'></div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Parts 4 to 6</h3><table class='stages rules'><thead><tr><th>PART</th><th>WHAT IT IS</th></tr></thead><tbody><tr><th>4 Adviser log</th><td>Each talk with an expert, and what it added to your learning. No adviser? Write &quot;No adviser.&quot; Page <button type='button' class='pj' data-jump='31' aria-label='Go to page 24'>24</button>.</td></tr><tr><th>5 Feedback table</th><td>Feedback from classmates and adults, what you decided, and why. Page <button type='button' class='pj' data-jump='29' aria-label='Go to page 22'>22</button>.</td></tr><tr><th>6 Pictures and charts</th><td>Photos, charts, spreadsheets, or video links from your own research.</td></tr></tbody></table><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>TWO SAFETY RULES</div><p>No faces, and no names of the people in your study. Call a person &quot;Person A.&quot;</p></div><figure class='plate'><div class='pl'><span>PLATE III</span><span>Safe to show</span></div><svg class='fig' viewBox='0 0 320 72' role='img' aria-label='Two made-up data rows, side by side, under the heads who and waited. Not this: a row that starts with a real name, drawn as a scribble, then 12 minutes. This: the same row, starting Person A, then 12 minutes. No faces. No names. A made-up case.'><rect x='6' y='2' width='150' height='18' rx='2' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/>\n<path d='M13.5 6.5 L22 15 M22 6.5 L13.5 15' fill='none' stroke='#9c3322' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='28' y='15' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>NOT THIS</text>\n<rect x='6' y='20' width='150' height='36' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<text x='14' y='31' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>WHO</text>\n<text x='100' y='31' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>WAITED</text>\n<path d='M10 35 L152 35' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M14 45.5 Q17.0 43.1 20 45.5 Q23.0 47.9 26 45.5 Q29.0 43.1 32 45.5 Q35.0 47.9 38 45.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='42' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>a real name</text>\n<text x='100' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>12 minutes</text>\n<rect x='164' y='2' width='150' height='18' rx='2' fill='#fbf6ea' stroke='#245e55' stroke-width='1.3'/>\n<path d='M171 11.4 L174.4 14.6 L180 7.4' fill='none' stroke='#245e55' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='186' y='15' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>THIS</text>\n<rect x='164' y='20' width='150' height='36' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<text x='172' y='31' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>WHO</text>\n<text x='258' y='31' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>WAITED</text>\n<path d='M168 35 L310 35' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='172' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>Person A</text>\n<text x='258' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>12 minutes</text>\n<text x='6' y='68' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>No faces. No names.</text>\n<text x='314' y='68' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text></svg><figcaption><b>PERSON A</b>A letter, never a name.</figcaption></figure></div><div class='num'>&middot; 9 &middot;</div><div class='shade'></div>", "label": "Folio 2"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Parts 7 to 10</h3><table class='stages rules'><thead><tr><th>PART</th><th>WHAT IT IS</th></tr></thead><tbody><tr><th>7 Draft sections</th><td>Dated copies of some sections of your paper.</td></tr><tr><th>8 Showcase pieces</th><td>Your best work, each with one line on why you chose it.</td></tr><tr><th>9 Defense notes</th><td>Page <button type='button' class='pj' data-jump='52' aria-label='Go to page 41'>41</button>.</td></tr><tr><th>10 Signed affirmation</th><td>One sentence you sign. Page <button type='button' class='pj' data-jump='53' aria-label='Go to page 42'>42</button>.</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Which go in? A: your approved proposal. B: a chatbot&#39;s summary of an article. C: a photo of your own bar chart.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>A and C. B is not your work.</p></div></div><div class='num'>&middot; 10 &middot;</div><div class='shade'></div>", "label": "Folio 2"}, {"cls": "board chapter", "label": "Folio 3", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>3</div><div class='ch-title'>Set it up</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-pen'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Set up your portfolio the same way as everyone, so anyone can find any part.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Set up your portfolio</span><span class='ld' aria-hidden='true'></span><span class='pn'>11</span></li><li><span class='it'>The portfolio, opened</span><span class='ld' aria-hidden='true'></span><span class='pn'>12</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 3</p><h2>Set up your portfolio</h2><table class='stages narrow1'><thead><tr><th>STEP</th><th>DO THIS</th></tr></thead><tbody><tr><th>1</th><td>Turn your notebook over. Open the last page, not the inside cover.</td></tr><tr><th>2</th><td>Top line: MY PORTFOLIO, your name, your period. Add a sticky note tab: PORTFOLIO.</td></tr><tr><th>3</th><td>Entries start there and move toward the middle. The log keeps the front.</td></tr><tr><th>4</th><td>Make one Google Doc for your portfolio. Name it the way I show in class.</td></tr><tr><th>5</th><td>Type the ten part names from page <button type='button' class='pj' data-jump='10' aria-label='Go to page 7'>7</button> as headings. Top line: &quot;My entries are in my notebook, from the back.&quot;</td></tr><tr><th>6</th><td>Share it with me the way I show in class. Never make a second one.</td></tr></tbody></table></div><div class='num'>&middot; 11 &middot;</div><div class='shade'></div>", "label": "Folio 3"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The portfolio, opened</h3><figure class='plate'><div class='pl'><span>PLATE IV</span><span>The portfolio, opened</span></div><svg class='fig' viewBox='0 0 320 194' role='img' aria-label='A made-up student&#39;s portfolio, with six numbered marks that match the six setup steps on page 11. Top left, the notebook, from the side: the log grows from the front toward the middle, and the portfolio grows from the back toward the middle. Mark 3: entries start at the back and move toward the middle. Below, the last page of the notebook. Mark 1: the la ;</td><td>&quot;I expected more bars downtown. I found more near schools, so I may add a street type.&quot;</td></tr><tr><th>4 Next</th><td>&quot;Keep going.&quot;</td><td>&quot;Log one study about benches near schools.&quot;</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Which lines fail? &quot;last Tuesday / Research. / It was good. / Finish.&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>All four: no real date, no action, no reason, no step.</p></div><p class='small'>A weak entry is not lost. Write a better one today, with today&#39;s date.</p></div><div class='num'>&middot; 16 &middot;</div><div class='shade'></div>", "label": "Folio 4"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Sentence starters</h3><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>BORROW THE START</div><p class='note2'>Did: Today I ___ (read, counted, asked, wrote, fixed) ___.</p><p class='note2'>Changed: I used to think ___. Now I think ___, because ___.</p><p class='note2'>Changed: I was stuck on ___. I tried ___.</p><p class='note2'>Next: Next class I will ___. / I still wonder ___.</p></div><p class='small'><svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-mic'/></svg>You may write an entry in Spanish. Write line 4 in English too, so you can say it at your defense.</p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>YOUR LEVEL</div><p><strong>First step:</strong> the four lines, with starters. <strong>Next step:</strong> no starters, plus the tag. <strong>Going further:</strong> add line 5, Evidence: where someone can see it.</p></div></div><div class='num'>&middot; 17 &middot;</div><div class='shade'></div>", "label": "Folio 4"}, {"cls": "paper", "html": "<di  font-size='10' font-weight='700' fill='#9c3322'>No Evaluate entry yet. Pick one: page 20.</text></svg></div><div class='card2 try' style='margin-top:.7cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>&quot;A classmate said my survey question leads people, so I rewrote it.&quot; Which tag?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Team. It came from feedback.</p></div></div><div class='num'>&middot; 18 &middot;</div><div class='shade'></div>", "label": "Folio 4"}, {"cls": "board chapter", "label": "Folio 5", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>5</div><div class='ch-title'>What to reflect on</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-question'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Pick a prompt when you do not know what to write, and cover the seven things the College Board names.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Seven things to cover</span><span class='ld' aria-hidden='true'></span><span class='pn'>19</span></li><li><span class='it'>Prompts, fall</span><span class='ld' aria-hidden='true'></span><span class='pn'>20</span></li><li><span class='it'>Prompts, winter and spring</span><span class='ld' aria-hidden='true'></span><span class='pn'>21</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-question'/></svg>FOLIO 5</p><h2>Seven things to cover</h2><p class='small'>Over the year, your entries cover these seven things.</p><table class='stages narrow1 tight'><thead><tr><th></th><th>COVER</th></tr></thead><tbody><tr><th>1</th><td>Why you chose your question</td></tr><tr><th>2</th><td>Where the research led you, and what changed</td></tr><tr><th>3</th><td>Your method, and what you used</td></tr><tr><th>4</th><td>Gathering your evidence, and making sense of it</td></tr><tr><th>5</th><td>Working alone, and with others</td></tr><tr><th>6</th><td>Problems, and how you solved them</td></tr><tr><th>7</th><td>Proof that your work is your own</td></tr></tbody></table><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>YOUR FIRST TWO ENTRIES</div><p>Entry 1: Why this question? Entry 2: What do I expect to find, and why? That guess is your first assumption. In April, compare it with your results.</p></div></div><div class='num'>&middot; 19 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Prompts, fall</h3><div style='margin:.4cqw 0 1cqw'><svg class='fig' viewBox='0 0 320 24' role='img' aria-label='Nine months, September to May, one box each. This page is for the first four, shaded: September to December. January to May: page 21.'><rect x='2' y='2' width='316' height='20' rx='0' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='0.8'/>\n<rect x='2' y='2' width='140.4' height='20' rx='0' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2'/>\n<path d='M37.1 2 L37.1 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M72.2 2 L72.2 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M107.3 2 L107.3 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M142.4 2 L142.4 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M177.6 2 L177.6 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M212.7 2 L212.7 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M247.8 2 L247.8 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M282.9 2 L282.9 22' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='5' y='5' width='134.4' height='14' rx='0' fill='#f3e3bd'/>\n<text x='72.2' y='15.8' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SEPTEMBER TO DECEMBER</text>\n<rect x='145.4' y='5' width='169.6' height='14' rx='0' fill='#fbf6ea'/>\n<text x='230.2' y='16' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>January to May: page 21</text></svg></div><p class='small'>Stuck? Pick one. Every prompt is general, never about your topic.</p><table class='stages rules2'><thead><tr><th>PROMPT</th><th>TAG</th></tr></thead><tbody><tr><th>What first made me curious about this?</th><td>Question</td></tr><tr><th>What do I expect to find? Why?</th><td>Question</td></tr><tr><th>Which source changed my question?</th><td>Understand</td></tr><tr><th>Who would disagree with my plan, and why?</th><td>Evaluate</td></tr><tr><th>What can each method in my log not show?</th><td>Understand</td></tr><tr><th>What worries me about this study?</th><td>Question</td></tr></tbody></table></div><div class='num'>&middot; 20 &middot;</div><div class='shade'></div>", "label": "Folio 5"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Prompts, winter and spring</h3><div style='margin ='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<rect x='6' y='32' width='308' height='126' rx='0' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/>\n<path d='M82 32 L82 158 M160 32 L160 158' fill='none' stroke='#1f3a5a' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M160 74 L314 74 M160 116 L314 116' fill='none' stroke='#1f3a5a' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='12' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>October 20,</text>\n<text x='12' y='61' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>a classmate</text>\n<text x='88' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#1f3a5a'>&quot;Your survey</text>\n<text x='88' y='61' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#1f3a5a'>has 30</text>\n<text x='88' y='74' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#1f3a5a'>questions.</text>\n<text x='88' y='87' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#1f3a5a'>People will</text>\n<text x='88' y='100' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#1f3a5a'>quit.&quot;</text>\n<text x='166' y='45' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>TAKE IT</text>\n<text x='166' y='58' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>Cut to 12, because my test</text>\n<text x='166' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>run took 20 minutes.</text>\n<text x='166' y='87' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>CHANGE IT</text>\n<text x='166' y='100' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>Kept 20, put hard ones last,</text>\n<text x='166' y='112' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>because people stop at them.</text>\n<text x='166' y='129' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>TURN IT DOWN</text>\n<text x='166' y='142' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>Kept 30, because each one</text>\n<text x='166' y='154' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>matches a variable in my plan.</text>\n<circle cx='13' cy='169.5' r='6' fill='#9c3322'/><text x='13' y='172.9' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>1</text>\n<text x='23' y='173' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>a role, not a name</text>\n<circle cx='13' cy='183.5' r='6' fill='#9c3322'/><text x='13' y='186.9' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>2</text>\n<text x='23' y='187' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>their words, short</text>\n<circle cx='166' cy='169.5' r='6' fill='#9c3322'/><text x='166' y='172.9' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<text x='176' y='173' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>your decision, with because</text>\n<text x='314' y='187' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text></svg><figcaption><b>ONE ROW</b>Your table gets one row for each piece of feedback, with one decision.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Which row is complete? A: &quot;Too long. Fine.&quot; B: &quot;October 20, a classmate: too long. I cut to 12, because my test took 20 minutes.&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>B. A has no date, no who, no reason.</p></div></div><div class='num'>&middot; 23 &middot;</div><div class='shade'></div>", "label": "Folio 6"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your adviser log</h3><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; EXPERT ADVISER</div><p><em lang='es' class='esw'>asesor experto</em> &middot; An expert who answers your questions. Optional: many projects have none.</p></div><div class='twocol' style='margin-top:1cqw'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true' style='width:1.25em;height:1.25em;margin:0 .35em 0 0;color:inherit;vertical-align:-.25em'><use href='#i-check'/></svg>AN ADVISER MAY</div><p>Ask guiding questions. Give general feedback. Suggest resources. Help with the steps of research.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true' style='width:1.25em;height:1.25em;margin:0 .35em 0 0;color:inherit;vertical-align:-.25em'><use href='#i-cross'/></svg>AN ADVISER MAY NOT</div><p>Give you a question. Write or fix your work. Tell you what to do. Give you sources. Tell you your defense questions.</p></div></div><div style='margin:1.2cqw 0 .4cqw'><svg class='fig' viewBox='0 0 320 67' role='img' aria-label='An outside adviser, step by step. In a dashed box, waiting on a Room 63 decision: 1 ask first: I approve the adviser. 2 email: school email, me copied. 3 meet: at school, or by school video. Then 4, log it: date, how, what you asked, what you decided.'><rect x='3' y='2' width='225' height='63' rx='3' fill='#fbf1dd' stroke='#9a6b12' stroke-width='1.4' stroke-dasharray='5 3'/>\n<text x='115.5' y='60' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#7a5208' text-anchor='middle'>WAITING ON A ROOM 63 DECISION</text>\n<rect x='9' y='9' width='64' height='39' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/>\n<text x='41' y='22' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>ASK FIRST</text>\n<text x='41' y='33' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>I approve</text>\n<text x='41' y='43.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>the adviser.</text>\n<circle cx='11' cy='9' r='5.5' fill='#9c3322'/><text x='11' y='12.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>1</text>\n<path d='M74.5 28.5 L80.5 28.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M77.5 30.2 L80.5 28.5 L77.5 26.8' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='82' y='9' width='64' height='39' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/>\n<text x='114' y='22' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>EMAIL</text>\n<text x='114' y='33' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>school email,</text>\n<text x='114' y='43.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>me copied</text>\n<circle cx='84' cy='9' r='5.5' fill='#9c3322'/><text x='84' y='12.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>2</text>\n<path d='M147.5 28.5 L153.5 28.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M150.5 30.2 L153.5 28.5 L150.5 26.8' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='155' y='9' width='64' height='39' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/>\n<text x='187' y='22' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>MEET</text>\n<text x='187' y='33' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>at school, or</text>\n<text x='187' y='43.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>school video</text>\n<circle cx='157' cy='9' r='5.5' fill='#9c3322'/><text x='157' y='12.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<path d='M220.5 28.5 L234.5 28.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M231.5 30.2 L234.5 28.5 L231.5 26.8' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='236' y='9' width='78' height='50' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.3'/>\n<text x='275' y='22' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>LOG IT</text>\n<text x='275' y='33' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>date, how,</text>\n<text x='275' y='43.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>what you asked,</text>\n<text x='275' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>what you decided</text>\n<circle cx='238' cy='9' r='5.5' fill='#9c3322'/><text x='238' y='12.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>4</text></svg></div><p class='small'>You start every talk, and you log each one.</p></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>", "label": "Folio 6"}, {"cls": "board chapter", "label": "Folio 7", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>7</div><div class='ch-title'>Meetings with me</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-chat'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Come to a work-in-progress meeting ready, and write what you decided after it.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>What a meeting is</span><span class='ld' aria-hidden='true'></span><span class='pn'>25</span></li><li><span class='it'>What I may and may not do</span><span class='ld' aria-hidden='true'></span><span class='pn'>26</span></li><li><span class='it'>Bring three questions</span><span class='ld' aria-hidden='true'></span><span class='pn'>27</span></li><li><span class='it'>What I ask in AP Research</span><span class='ld' aria-hidden='true'></span><span class='pn'>28</span></li><li><span class='it'>After the meeting</span><span class='ld' aria-hidden='true'></span><span class='pn'>29</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-chat'/></svg>FOLIO 7</p><h2>What a meeting is</h2><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; WORK-IN-PROGRESS MEETING</div><p><em lang='es' class='esw'>reuni&oacute;n de avance</em> &middot; A short talk with me about your work. It is a College Board checkpoint.</p></div><p>Bring your notebook and your portfolio Doc, open. It is a conversation, not a test. You explain your choices.</p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>We meet about every two weeks, for about five minutes, from October through April. The list posts on Google Classroom.</p></div><p class='small'>Missed yours? See me next class.</p></div><div class='num'>&middot; 25 &middot;</div><div class='shade'></div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What I may and may not do</h3><div class='twocol' style='margin-top:1cqw'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true' style='width:1.25em;height:1.25em;margin:0 .35em 0 0;color:inherit;vertical-align:-.25em'><use href='#i-check'/></svg>I MAY</div><p>Look at your portfolio and ask questions. Talk about your next steps. Point to a rubric row. Suggest places to look. Make sure you know the dates.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true' style='width:1.25em;height:1.25em;margin:0 .35em 0 0;color:inherit;vertical-align:-.25em'><use href='#i-cross'/></svg>I MAY NOT</div><p>Tell you what to write or do. Write, fix, or proofread your work. Give you sources. Give you a question. Tell you your defense questions.</p></div></div><p class='small'>When I answer your question with a question, the rule is working. Checked September 24, 2026.</p></div><div class='num'>&middot; 26 &middot;</div><div class='shade'></div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Bring three questions</h3><p class='small'>Bring at least three questions of your own to every meeting.</p><table class='stages rules'><thead><tr><th>ABOUT</th><th>FOR EXAMPLE</th></tr></thead><tbody><tr><th>The work</th><td>&quot;Which student samples could I look at?&quot;</td></tr><tr><th>The process</th><td>&quot;Does my timeline fit the dates? Which parts are still empty?&quot;</td></tr><tr><th>Next steps</th><td>&quot;What problems do students often hit at this stage?&quot;</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Which can I answer? A: Can you write my gap sentence? B: Which rubric row should I read again? C: Can you give me three sources?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>B. A and C ask me to do your work.</p></div></div><div class='num'>&middot; 27 &middot;</div><div class='shade'></div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What I ask in AP Research</h3><p class='small'>The College Board says these meetings check that you did the thinking yourself. I ask questions like these.</p><table class='stages rules'><thead><tr><th>ABOUT</th><th>I MAY ASK</th></tr></thead><tbody><tr><th>Sources</th><td>&quot;How do these two studies talk to each other?&quot;</td></tr><tr><th>Method</th><td>&quot;Why this method, and not another?&quot;</td></tr><tr><th>Data</th><td>&quot;What does this result mean, in your words?&quot;</td></tr><tr><th>Structure</th><td>&quot;Why is your paper in this order?&quot;</td></tr><tr><th>Your portfolio</th><td>&quot;Show me the entry where this changed.&quot;</td></tr></tbody></table><p class='small'>Your entries answer most of these before I ask.</p></div><div class='num'>&middot; 28 &middot;</div><div class='shade'></div>", "label": "Folio 7"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>After the meeting</h3><figure class='plate'><div class='pl'><span>PLATE IX</span><span>A meeting, start to finish</span></div><svg class='fig' viewBox='0 0 320 145' role='img' aria-label='A meeting, start to finish, in four numbered steps. 1 Before: write your questions. 2 The meeting: show, explain, ask. 3 The same day: write the meeting entry. 4 Next class: do the step. Step 3 opens into the meeting entry, four lines: 1 date, the day of the meeting; 2 brought, what I showed; 3 talked about, the questions; 4 I decided, what I will do, and why. An arrow from the entry to the feedback table: what I said goes there too, page 22.'><rect x='9.5' y='8' width='70' height='42' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='44.5' y='23' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>BEFORE</text>\n<text x='44.5' y='35' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>write your</text>\n<text x='44.5' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>questions</text>\n<circle cx='11.5' cy='8' r='6' fill='#9c3322'/><text x='11.5' y='11.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>1</text>\n<path d='M81 29 L87 29' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M84 30.8 L87 29 L84 27.2' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='88.5' y='8' width='70' height='42' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='123.5' y='23' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>MEETING</text>\n<text x='123.5' y='35' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>show, explain,</text>\n<text x='123.5' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>ask</text>\n<circle cx='90.5' cy='8' r='6' fill='#9c3322'/><text x='90.5' y='11.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>2</text>\n<path d='M160 29 L166 29' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M163 30.8 L166 29 L163 27.2' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='167.5' y='8' width='70' height='42' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='202.5' y='23' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SAME DAY</text>\n<text x='202.5' y='35' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>write the</text>\n<text x='202.5' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>meeting entry</text>\n<circle cx='169.5' cy='8' r='6' fill='#9c3322'/><text x='169.5' y='11.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<path d='M239 29 L245 29' fill='none' stro ght='600' fill='#4a3f31'>what I showed</text>\n<text x='14' y='121' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>3 Talked about</text>\n<text x='92' y='121' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>the questions</text>\n<text x='14' y='134.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>4 I decided</text>\n<text x='92' y='134.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>what I will do, and why</text>\n<path d='M220 108 L236 108' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M226 108 L237 108' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M233.5 110 L237 108 L233.5 106' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='238' y='83' width='76' height='52' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/>\n<text x='276' y='97' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>FEEDBACK</text>\n<text x='276' y='108' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>TABLE</text>\n<text x='276' y='120' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>what I said,</text>\n<text x='276' y='130' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>page 22</text></svg><figcaption><b>BEFORE AND AFTER</b>The meeting itself is short. The work is before and after.</figcaption></figure></div><div class='num'>&middot; 29 &middot;</div><div class='shade'></div>", "label": "Folio 7"}, {"cls": "board chapter", "label": "Folio 8", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>8</div><div class='ch-title'>Tools and your portfolio</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-tool'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Keep every word of your portfolio yours, and record any tool you used.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Every word is yours</span><span class='ld' aria-hidden='true'></span><span class='pn'>30</span></li><li><span class='it'>Allowed or not?</span><span class='ld' aria-hidden='true'></span><span class='pn'>31</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-tool'/></svg>FOLIO 8</p><h2>Every word is yours</h2><p class='small'>In April you sign that your portfolio is your own work. No tool writes an entry, a feedback decision, or your defense notes.</p><div class='twocol' style='margin-top:1cqw'><div class='card2 good'><div class='k'><svg class='ic sm' aria-hidden='true' style='width:1.25em;height:1.25em;margin:0 .35em 0 0;color:inherit;vertical-align:-.25em'><use href='#i-check'/></svg>A TOOL MAY</div><p>Check grammar without rewriting. Make a chart from data you collected. Draft a citation that you then check.</p></div><div class='card2 weak'><div class='k'><svg class='ic sm' aria-hidden='true' style='width:1.25em;height:1.25em;margin:0 .35em 0 0;color:inherit;vertical-align:-.25em'><use href='#i-cross'/></svg>NOT ALLOWED</div><p>Put your sources together. Make or explain your data. Prepare answers for your defense.</p></div></div><p class='small'>Used a tool? Add one line: which tool, what you asked, what you kept.</p><div class='notes' style='margin-top:.8cqw'><div><svg class='ic sm' aria-hidden='true'><use href='#i-tool'/></svg><p><strong>The test: could you have written this with every tool closed?</strong> The Research Log, page 60.</p></div></div></div><div class='num'>&middot; 30 &middot;</div><div class='shade'></div>", "label": "Folio 8"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Allowed or not?</h3><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>You ask a tool what to say if the panel asks about uncertainty.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Not allowed. No tool may help you prepare for the defense.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>A tool summarizes your results for your discussion section.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Not allowed. Your data is yours to explain.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>A tool rewrites your reflection so it sounds better.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Not allowed. That is rewriting, and the words are no longer yours.</p></div></div><div class='num'>&middot; 31 &middot;</div><div class='shade'></div>", "label": "Folio 8"}, {"cls": "board chapter", "label": "Folio 9", "html": "<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>9</div><div class='ch-title'>Your week, your year</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-cal'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Run your portfolio routine every week on your own, and see what each month adds.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Your week</span><span class='ld' aria-hidden='true'></span><span class='pn'>32</span></li><li><span class='it'>The week, drawn</span><span class='ld' aria-hidden='true'></span><span class='pn'>33</span></li><li><span class='it'>Behind? Catch up</span><span class='ld' aria-hidden='true'></span><span class='pn'>34</span></li><li><span class='it'>Your year, fall</span><span class='ld' aria-hidden='true'></span><span class='pn'>35</span></li><li><span class='it'>Your year, spring</span><span class='ld' aria-hidden='true'></span><span class='pn'>36</span></li><li><span class='it'>The year, drawn</span><span class='ld' aria-hidden='true'></span><span class='pn'>37</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-cal'/></svg>FOLIO 9</p><h2>Your week</h2><table class='stages rules'><thead><tr><th>WHEN</th><th>DO THIS</th></tr></thead><tbody><tr><th>Each class</th><td>Before you pack up, write one entry. About four minutes.</td></tr><tr><th>A two-class week</th><td>Write a third entry at home, before the next class.</td></tr><tr><th>Friday</th><td>Check: entries dated? New feedback in the table? New sources in the log, not here?</td></tr><tr><th>A meeting week</th><td>Write your three questions the class before.</td></tr></tbody></table><p class='small'>I count entries at your seat. I never grade what an entry says.</p></div><div class='num'>&middot; 32 &middot;</div><div class='shade'></div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The week, drawn</h3><figure class='plate'><div class='pl'><span>PLATE X</span><span>Two kinds of week</span></div><svg class='fig' viewBox='0 0 320 110' role='img' aria-label='Two weeks. A three-class week: one entry at each class, then the Friday check. A two-class week: one entry at each class, one entry at home, then the Friday check'><text x='8' y='18' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='start'>THREE CLASSES</text><rect x='8' y='24' width='66' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='41' y='37' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>class</text><text x='41' y='50' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>one entry</text><rect x='84' y='24' width='66' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='117' y='37' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>class</text><text x='117' y='50' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>one entry</text><rect x='160' y='24' width='66' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='193' y='37' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>class</text><text x='193' y='50' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>one entry</text><rect x='238' y='24' width='74' height='30' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.4'/><text x='275' y='37' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>FRIDAY</text><text x='275' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' text-anchor='middle'>the check</text><text x='8' y='74' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='start'>TWO CLASSES</text><rect x='8' y='80' width='66' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='41' y='93' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>class</text><text x='41' y='106' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>one entry</text><rect x='84' y='80' width='66' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='117' y='93' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>class</text><text x='117' y='106' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>one entry</text><rect x='160' y='80' width='66' height='30' rx='3' fill='#fff8ea' stroke='#4a3f31' stroke-width='1'/><text x='193' y='93' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>home</text><text x='193' y='106' font-family='Patrick Hand,cursive' font-size='11' font-weight='400' fill='#9c3322' text-anchor='middle'>one entry</text><rect x='238' y='80' width='74' height='30' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.4'/><text x='275' y='93' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>FRIDAY</text><text x='275' y='105' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' text-anchor='middle'>the check</text></svg><figcaption><b>NOTES</b>Write before you pack up. The home entry comes before the next class.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Your week has two classes. How many entries?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Three: one at each class, and one at home.</p></div></div><div class='num'>&middot; 33 &middot;</div><div class='shade'></div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Behind? Catch up</h3><table class='stages rules'><thead><tr><th>IF</th><th>DO THIS</th></tr></thead><tbody><tr><th>You missed a class</th><td>Write an entry today, with today&#39;s date. Say which day it is about.</td></tr><tr><th>You missed a meeting</th><td>See me next class.</td></tr><tr><th>You lost your notebook</th><td>Tell me that day. Photos of your pages in your portfolio Doc mean nothing is lost.</td></tr><tr><th>Three weeks are empty</th><td>Start today.</td></tr></tbody></table><figure class='plate'><div class='pl'><span>PLATE XI</span><span>A late entry</span></div><svg class='fig' viewBox='0 0 320 75' role='img' aria-label='Two made-up entry tops. Not this: October 6, but written on October 9, a changed date. This: October 9. About class on October 6. A made-up case.'><rect x='6' y='2' width='150' height='18' rx='2' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/>\n<path d='M13.5 6.5 L22 15 M22 6.5 L13.5 15' fill='none' stroke='#9c3322' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='28' y='15' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>NOT THIS</text>\n<rect x='6' y='20' width='150' height='40' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<rect x='164' y='2' width='150' height='18' rx='2' fill='#fbf6ea' stroke='#245e55' stroke-width='1.3'/>\n<path d='M171 11.4 L174.4 14.6 L180 7.4' fill='none' stroke='#245e55' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='186' y='15' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>THIS</text>\n<rect x='164' y='20' width='150' height='40' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<text x='14' y='36' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f3a5a'>October 6</text>\n<text x='14' y='52' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>but written on October 9</text>\n<text x='172' y='36' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f3a5a'>October 9.</text>\n<text x='172' y='53' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f3a5a'>About class on October 6.</text>\n<text x='314' y='71' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text></svg><figcaption><b>TODAY</b>Today&#39;s date, and the day it is about.</figcaption></figure><p class='small'>Never change a date. Never fill old pages to look on time. Honest late entries beat perfect ones that are not true.</p></div><div class='num'>&middot; 34 &middot;</div><div class='shade'></div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your year, fall</h3><table class='stages rules'><thead><tr><th>MONTH</th><th>ADD TO YOUR PORTFOLIO</th></tr></thead><tbody><tr><th>September</th><td>Set up. Entries 1 and 2. The annotated bibliography starts.</td></tr><tr><th>October</th><td>Entries every week. The feedback table grows. Quarter 2 starts October 19.</td></tr><tr><th>November</th><td>Proposal drafts and feedback. The approved form goes in; <svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-flag'/></svg>College Board date November 30, 2026. No class November 23 to 27.</td></tr><tr><th>December</th><td>Data only after approval. Pictures and charts start. No class December 21 to January 1.</td></tr></tbody></table><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>Meetings with me: the first in October, then about every two weeks through April.</p></div><p class='small'>Our class dates post on Google Classroom. Checked September 24, 2026.</p></div><div class='num'>&middot; 35 &middot;</div><div class='shade'></div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your year, spring</h3><table class='stages rules'><thead><tr><th>MONTH</th><th>ADD TO YOUR PORTFOLIO</th></tr></thead><tbody><tr><th>January</th><td>Analysis entries. Draft sections start.</td></tr><tr><th>February</th><td>Peer review feedback, and your decisions.</td></tr><tr><th>March</th><td>Full draft. Pick your showcase pieces. No class March 22 to 26.</td></tr><tr><th>April</th><td>Defense notes. Your defense. Sign the affirmation. <svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-flag'/></svg>Paper final by April 30, 2027, 11:59 in the evening, Eastern Time.</td></tr><tr><th>May</th><td><svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-flag'/></svg>I affirm by May 10, 2027. Your last entry: what this year changed.</td></tr></tbody></table><p class='small'>Checked September 24, 2026.</p></div><div class='num'>&middot; 36 &middot;</div><div class='shade'></div>", "label": "Folio 9"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The year, drawn</h3><figure class='plate'><div class='pl'><span>PLATE XII</span><span>Ten parts, one year</span></div><svg class='fig' viewBox='0 0 320 207.5' role='img' aria-label='A year chart from September to May, one column per month: September, October, November, December, January, February, March, April, May. Top row: entries, every class, all year. Then the ten parts, each bar from its start month to April 30: from September, 1 Annotated bibliography and 5 Feedback table. From November, 2 Approved proposal form and 3 Permissions, if needed. From December, 6 Pictures and charts. From January, 7 Draft sections. From March, 8 Showcase pieces. In April, 9 Defense notes and 10 Signed affirmation. 4 Adviser log, when you have one: an outlined bar with no start month. In a dashed box from October to April, waiting on a Room 63 decision: meetings about every two weeks, the first in October. College Board dates, each with a flag: November 30, proposal approved; April 30, paper final; May 10, I affirm. Start months are my estimate from the College Board sample year. College Board dates: AP Research course description, checked September 25, 2026.'><text x='24.9' y='13' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>September</text>\n<text x='58.7' y='24' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>October</text>\n<text x='92.4' y='13' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>November</text>\n<text x='126.2' y='24' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>December</text>\n<text x='160' y='13' font-family='Corm n class='it'>Three kinds of questions</span><span class='ld' aria-hidden='true'></span><span class='pn'>38</span></li><li><span class='it'>The five reflection questions</span><span class='ld' aria-hidden='true'></span><span class='pn'>39</span></li><li><span class='it'>Where your answers live</span><span class='ld' aria-hidden='true'></span><span class='pn'>40</span></li><li><span class='it'>Defense notes</span><span class='ld' aria-hidden='true'></span><span class='pn'>41</span></li><li><span class='it'>Final check and signature</span><span class='ld' aria-hidden='true'></span><span class='pn'>42</span></li><li><span class='it'>Keep it</span><span class='ld' aria-hidden='true'></span><span class='pn'>43</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-sign'/></svg>FOLIO 10</p><h2>Three kinds of questions</h2><figure class='plate'><div class='pl'><span>PLATE XIII</span><span>Three doors</span></div><svg class='fig' viewBox='0 0 320 104' role='img' aria-label='Three doors, one for each kind of defense question. Door 1, process: 4 questions on the College Board list. Answers live in your proposal, method entries, feedback table. Door 2, depth: 4 questions. Results entries, draft sections, your limits. Door 3, reflection: 5 questions, the fifth only if you had an adviser. Entries all year, meeting entries, adviser log. Counts: the College Board list, course description page 53, checked September 25, 2026.'><path d='M14 50 L14 20 A44 16 0 0 1 102 20 L102 50 Z' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/>\n<text x='58' y='30' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>PROCESS</text>\n<text x='58' y='44' font e'>2</text>\n<path d='M218 50 L218 20 A44 16 0 0 1 306 20 L306 50 Z' fill='#16294a' stroke='#b8903f' stroke-width='1.4'/>\n<text x='262' y='30' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>REFLECTION</text>\n<text x='262' y='44' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#f3e3bd' text-anchor='middle'>5 questions</text>\n<circle cx='299' cy='40' r='2' fill='#b8903f'/>\n<text x='262' y='63' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>entries all year</text>\n<text x='262' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>meeting entries</text>\n<text x='262' y='87' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>adviser log</text>\n<circle cx='226' cy='12' r='6.5' fill='#9c3322'/><text x='226' y='15.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<text x='8' y='100' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>Counts: the College Board list, course description page 53, checked September 25, 2026.</text></svg><figcaption><b>ONE QUESTION PER DOOR</b>This book prepares the reflection door. Prepare for all three.</figcaption></figure><p class='small'>After your presentation, the panel asks three questions from the College Board&#39;s list, one per door. All of it takes 15 to 20 minutes.</p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; PANEL</div><p><em lang='es' class='esw'>jurado</em> &middot; Me and two other adults who ask your defense questions. I may not tell you which ones you will get.</p></div></div><div class='num'>&middot; 38 &middot;</div><div class='shade'></div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The five reflection questions</h3><p class='small'>In plain words. The panel may reword a question to fit your project.</p><table class='stages narrow1'><thead><tr><th></th><th>THE QUESTION ASKS</th></tr></thead><tbody><tr><th>1</th><td>What else are you curious about now? How did this year prepare you to explore it?</td></tr><tr><th>2</th><td>How did you handle uncertainty, not knowing what would happen?</td></tr><tr><th>3</th><td>What would you do differently, and why?</td></tr><tr><th>4</th><td>What was your most important new research skill? Where will you use it?</td></tr><tr><th>5</th><td>How did your expert adviser help you understand research? Asked only if you had an adviser.</td></tr></tbody></table><p class='small'>The exact wording: the AP Research Course and Exam Description, page 53. Checked September 24, 2026. How to answer, and the time bar: Presenting and Defending, Folio 7 and page 7.</p></div><div class='num'>&middot; 39 &middot;</div><div class='shade'></div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Where your answers live</h3><figure class='plate'><div class='pl'><span>PLATE XIV</span><span>Star three entries</span></div><svg class='fig' viewBox='0 0 320 163' role='img' aria-label='Where your answers live: the question, where to look in your portfolio, and three empty stars on each row to star 3 entries. Question 1, curiosity: entries 1 and 2, and your last entries. Question 2, not knowing: your Changed lines, problem entries, feedback table. Question 3, differently: problem entries, meeting entries. Question 4, skill: entries across the year, showcase pieces. Question 5, adviser: your adviser log, only if you had an adviser; ont-size='9.5' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text></svg><figcaption><b>EVERY QUESTION</b>Make one card like this for each question on the College Board list.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>Which entry helps with reflection question 2, not knowing?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>One whose Changed line says a plan failed, and what you did next.</p></div></div><div class='num'>&middot; 41 &middot;</div><div class='shade'></div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Final check and signature</h3><p class='small'>Final check: ten parts, in order. Every entry dated. Nothing torn out. A tool line wherever you used a tool.</p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>SIGN THIS SENTENCE, IN APRIL</div><p>&quot;I hereby affirm that the work contained in this Process and Reflection Portfolio is my own and that I have read and understand the AP Capstone&trade; Policy on Plagiarism and Falsification or Fabrication of Information&quot;</p></div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; AFFIRMATION</div><p><em lang='es' class='esw'>declaraci&oacute;n firmada</em> &middot; The sentence you sign: all of it is your own work, and you know the rules on credit and on invented information.</p></div><p class='small'>Sign it by hand in your notebook, with the date. Put a photo of it in your portfolio Doc.</p></div><div class='num'>&middot; 42 &middot;</div><div class='shade'></div>", "label": "Folio 10"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Keep it</h3><table class='stages rules'><thead><tr><th>WHEN</th><th>WHAT HAPPENS</th></tr></thead><tbody><tr><th>By May 10, 2027</th><td><svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-flag'/></svg>I affirm to the College Board that you completed your portfolio and your meetings.</td></tr><tr><th>Your last entry</th><td>&quot;What did this year change in how I think?&quot;</td></tr><tr><th>After the course</th><td>Keep it. It shows counselors and colleges the research you did.</td></tr></tbody></table><p class='small'>Before you show it to anyone, check that it holds no one&#39;s private information. Checked September 24, 2026.</p><figure class='plate'><div class='pl'><span>PLATE XVI</span><span>Before you show it</span></div><svg class='fig' viewBox='0 0 320 101' role='img' aria-label='Check three things. An eye and a cross: no faces of people in your study. A signature and a cross: no names, only Person A. A shield: signed permission pages stay in Room 63. Your portfolio shows: permission on file, and the date.'><text x='8' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>CHECK THREE THINGS</text>\n<rect x='6' y='18' width='308' height='20.5' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/>\n<g transform='translate(11 20.25) scale(0.667)' fill='none' stroke='#1f3a5a' stroke-width='1.80' stroke-linecap='round' stroke-linejoin='round'><path d='M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z'/><circle cx='12' cy='12' r='3'/></g>\n<g transform='translate(29 20.25) scale(0.667)' fill='none' stroke='#9c3322' stroke-width='1.80' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='8.5'/><path d='M8.8 8.8l6.4 6.4M15.2 8.8l-6.4 6.4'/></g>\n<text x='50' y='32.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>No faces of people in your study.</text>\n<rect x='6' y='41.5' width='308' height= ou cannot tap is your next step: page <button type='button' class='pj' data-jump='4' aria-label='Go to page 3'>3</button>.</p></div><div class='num'>&middot; 44 &middot;</div><div class='shade'></div>", "label": "Self-check"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words that fool you</h3><p class='small'>Some English words look like Spanish words but mean something else.</p><table class='stages'><thead><tr><th>ENGLISH</th><th>IN SPANISH</th><th>NOT</th></tr></thead><tbody><tr><th>affirmation</th><td><span lang='es'>declaraci&oacute;n firmada</span></td><td><span lang='es'>afirmaci&oacute;n</span>, which in The Research Log means a claim</td></tr><tr><th>record</th><td><span lang='es'>registro</span></td><td><span lang='es'>recordar</span>, to remember</td></tr><tr><th>actual</th><td><span lang='es'>real, verdadero</span></td><td><span lang='es'>actual</span>, which means now</td></tr><tr><th>assist</th><td><span lang='es'>ayudar</span></td><td><span lang='es'>asistir</span>, to attend a class</td></tr></tbody></table><p class='small'><svg class='ic sm' aria-hidden='true' style='color:var(--oxide)'><use href='#i-upload'/></svg>And: the AP Digital Portfolio is a College Board website. Your portfolio is yours, page <button type='button' class='pj' data-jump='6' aria-label='Go to page 4'>4</button>.</p></div><div class='num'>&middot; 45 &middot;</div><div class='shade'></div>", "label": "Words that fool you"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Words in this book</h2><p class='small'>Tap a page to go there.</p><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-sign'/></svg><strong>Affirmation</strong><em lang='es'>declaraci&oacute;n firmada</em></div><p>The sentence you sign saying your portfolio is your own work.</p><button type='button' class='gtag' data-jump='53' aria-label='Go to page 42'>Page 42</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>Annotated bibliography</strong><em lang='es'>bibliograf&iacute;a comentada</em></div><p>Your sources, each with a short paragraph: summary, evaluation, connection.</p><button type='button' class='gtag' data-jump='11' aria-label='Go to page 8'>Page 8</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-bulb'/></svg><strong>Assumption</strong><em lang='es'>suposici&oacute;n</em></div><p>What you believe before you check it.</p><button type='button' class='gtag' data-jump='25' aria-label='Go to page 19'>Page 19</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-compass'/></svg><strong>Big idea</strong><em lang='es'>gran idea</em></div><p>One of the five areas of skill in the course.</p><button type='button' class='gtag' data-jump='23' aria-label='Go to page 18'>Page 18</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-chat'/></svg><strong>Checkpoint</strong><em lang='es'>punto de control</em></div><p>A step the College Board requires. In AP Research: meetings and portfolio work.</p><button type='button' class='gtag' data-jump='7' aria-label='Go to page 5'>Page 5</button></div></div><div class='num'>&middot; 46 &middot;</div><div class='shade'></div>", "label": "Words in this book"}, {"cls": "paper", "html": "<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PORTFOLIO</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-mic'/></svg><strong>Defense</strong><em lang='es'>defensa</em></div><p>The questions the panel asks after your presentation.</p><button type='button' cl
