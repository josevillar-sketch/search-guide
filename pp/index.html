div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Item 12: why it matters</h3><p class='itemq'><span class='itn'>ITEM 12</span>&quot;Discuss the anticipated value and/or broader implications of your research project.&quot;</p><p class='small'>Name who needs your answer, your community of practice, and what they could do with it. Keep it modest: &quot;may help,&quot; not &quot;will prove.&quot; Which verb: Writing the Paper, page 16.</p><p>Frame: This study may help ___ decide ___, because ___.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Which is better? A: &quot;This study will change how cities build benches.&quot; B: &quot;This study may help one transit office see where divider benches cluster.&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>B. It names who, and it claims no more than one study can show.</p></div></div><div class='num'>&middot; 13 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"board chapter","label":"Folio 3","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>3</div><div class='ch-title'>Item 4: the method</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-steps'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Choose a method that fits your question, and defend it against another method.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Four families</span><span class='ld' aria-hidden='true'></span><span class='pn'>14</span></li><li><span class='it'>Question to method</span><span class='ld' aria-hidden='true'></span><span class='pn'>15</span></li><li><span class='it'>Borrow a method from your studies</span><span class='ld' aria-hidden='true'></span><span class='pn'>16</span></li><li><span class='it'>Defend it</span><span class='ld' aria-hidden='true'></span><span class='pn'>17</span></li><li><span class='it'>Steps others can repeat</span><span class='ld' aria-hidden='true'></span><span class='pn'>18</span></li><li><span class='it'>Before you choose a survey</span><span class='ld' aria-hidden='true'></span><span class='pn'>19</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-steps'/></svg>FOLIO 3</p><h2>Four families</h2><figure class='plate'><div class='pl'><span>PLATE VII</span><span>Four families</span></div><svg class='fig' viewBox='0 0 320 100' role='img' aria-label='Four doors, one for each family of method. Quantitative: count, measure, use data. Qualitative: ask, watch, read closely. Mixed: both doors open. Arts-based: make, test, refine'><path d='M3 96 L3 28 A38.5 20 0 0 1 80 28 L80 96 Z' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/><text x='41.5' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Quantitative</text><text x='41.5' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#9c3322' text-anchor='middle' font-style='italic'>count</text><text x='41.5' y='73' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#9c3322' text-anchor='middle' font-style='italic'>measure</text><text x='41.5' y='86' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#9c3322' text-anchor='middle' font-style='italic'>use data</text><path d='M82 96 L82 28 A38.5 20 0 ily='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#9c3322' text-anchor='middle' font-style='italic'>refine</text></svg><figcaption><b>NOTE</b>The verbs are the ones in your log, line 5.</figcaption></figure><p class='small'>Quantitative: numbers. Qualitative: words, images, meanings. Mixed: both. Arts-based: you make something and defend each choice. In April the AP Digital Portfolio asks you to pick one of these four, or Other. It does not change your score. Checked September 25, 2026.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>A made-up case counts benches on 40 blocks. Which family?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Quantitative. It counts.</p></div></div><div class='num'>&middot; 14 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Question to method</h3><figure class='plate'><div class='pl'><span>PLATE VIII</span><span>Question to method</span></div><svg class='fig' viewBox='0 0 320 237.5' role='img' aria-label='A decision tree. Start with the words in your question. How many? How common? leads to observation, a counting plan, first; survey, only if four gates pass: page 19; someone else&#39;s data, a trusted data set. What is it like? Why? leads to interviews, permission, a guide, notes; observation, notes of what happens. Does one thing change another? leads to experiment, a comparison group, trials and a safety check. How does a text or image make meaning? leads to textual analysis, a named way of reading; content analysis, a code list, set first. How did something change over time? leads to archives, an archive and its rules; content analysis, one set for each year. Can I make something that works? leads to arts-ba  y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>what good could it do?</text><text x='160' y='120' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>CHOICE</text><text x='160' y='133' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>a free, clear yes?</text><text x='62' y='67' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>PRIVACY</text><text x='62' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>who can tell who said it?</text><path d='M160 33 L160 21' fill='transparent' stroke='#b8903f' stroke-width='1.3' stroke-linecap='round'/><path d='M193 66 L205 66' fill='transparent' stroke='#b8903f' stroke-width='1.3' stroke-linecap='round'/><path d='M160 99 L160 111' fill='transparent' stroke='#b8903f' stroke-width='1.3' stroke-linecap='round'/><path d='M127 66 L115 66' fill='transparent' stroke='#b8903f' stroke-width='1.3' stroke-linecap='round'/><path d='M4 144 L316 144' fill='transparent' stroke='#d9ccb0' stroke-width='0.8' stroke-linecap='round'/><rect x='4' y='150' width='151' height='30' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><rect x='161' y='150' width='155' height='30' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><path d='M10 159.4 L13 162.2 L18 155.8' fill='none' stroke='#245e55' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='23' y='162' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Minimal risk</text><text x='10' y='174' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>no more than daily life</text><path d='M167 155 L175 163 M175 155 L167 163' fill='none' stroke='#9c3322' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='180' y='162' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>More than minimal</text><text x='167' y='174' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>cannot be approved</text><path d='M158 147 L158 183' fill='transparent' stroke='#9c3322' stroke-width='2.4' stroke-linecap='round'/><text x='4' y='194' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>LESS RISK</text><text x='158' y='194' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>THE LINE</text><text x='316' y='194' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>MORE RISK</text><text x='4' y='207' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>&quot;Proposals that pose more than minimal risk to participants</text><text x='4' y='218.5' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>cannot be approved.&quot; Course description, page 46. Checked September 25, 2026.</text></svg><figcaption><b>NOTE</b>All four, every time. Then the line.</figcaption></figure><p class='small'>I review every proposal, and every survey and interview question, before you collect.</p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; MINIMAL RISK</div><p><em lang='es' class='esw'>riesgo m&iacute;nimo</em> &middot; No more harm or discomfort than daily life, or a routine test at school.</p></div></div><div class='num'>&middot; 25 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Topics that need extra care</h3><figure class='plate'><div class='pl'><span>PLATE XVII</span><span>The safer lane</span></div><svg class='fig' viewBox='0 0 320 40' role='img' aria-label='Two lanes for a hard topic. Left, ask people: it can hurt them. Some answers make an adult at school report it. Right, with a thicker frame, read public texts: news, public posts, reports. No one is asked. The safer lane.'><rect x='3' y='2' width='154' height='35' rx='3' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/><text x='9' y='13' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>ASK PEOPLE</text><text x='9' y='23.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>It can hurt them. Some answers</text><text x='9' y='33.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>make an adult at school report it.</text><rect x='163' y='2' width='154' height='35' rx='3' fill='#fbf6ea' stroke='#245e55' stroke-width='2'/><text x='169' y='13' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>READ PUBLIC TEXTS</text><text x='169' y='23.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>News, public posts, reports.</text><text x='169' y='33.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>No one is asked. The safer lane.</text></svg><figcaption><b>NOTE</b>Often the topic can stay and the method changes. Some topics cannot: see the dashed box.</figcaption></figure><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>Not approvable in Room 63: self-harm or suicide, abuse, sexual behavior, illegal acts or drug use, immigration status. Extra review: mental health, religion, politics, family income, family conflict.</p></div><div class='card2 try' style='margin-top:1.2cqw'> morant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>the form</text><circle cx='5' cy='68' r='6.6' fill='#9c3322'/><text x='5' y='71.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>4</text><path d='M100 88 L111 88' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M108 89.8 L111 88 L108 86.2' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='112' y='68' width='96' height='40' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='160' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Permission</text><text x='160' y='94' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>every yes on file</text><circle cx='114' cy='68' r='6.6' fill='#9c3322'/><text x='114' y='71.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>5</text><path d='M209 88 L220 88' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M217 89.8 L220 88 L217 86.2' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='221' y='68' width='96' height='40' rx='3' fill='#16294a' stroke='#b8903f' stroke-width='1.3'/><text x='269' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#e8c878' text-anchor='middle'>Collect</text><text x='269' y='94' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' text-anchor='middle'>only then</text><circle cx='223' cy='68' r='6.6' fill='#9c3322'/><text x='223' y='71.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>6</text><path d='M269 49 L269 57 L51 57 L51 66' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M48 62 L51 67 L54 62' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><text x='3' y='122' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>Publish, present in public, or compete? Page 32 first.</text><text x='3' y='135' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Steps 1, 2, 4, 5, 6: course description, pages 46, 48, and 59.</text><text x='3' y='146.5' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>WAITING ON A ROOM 63 DECISION</b>Step 3 is the default until the permission process is decided.</figcaption></figure><p class='small'>Changed your question, your people, or your method after my signature? Stop. Bring a revised form.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>After my signature, you add ten survey questions. What now?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Stop. Bring a revised form before you use them.</p></div></div><div class='num'>&middot; 30 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Who signs what</h3><figure class='plate'><div class='pl'><span>PLATE XXIII</span><span>Who signs what</span></div><svg class='fig' viewBox='0 0 320 203' role='img' aria-label='Who signs what. The College Board rule: me, I review your form and questions, then sign. Each person: a free yes, knowing what they agree to. A data owner: a signed agreement for private data. A review board: only if you publish, present in public, or compete. Then a dashed box, waiting on a Room 63 decision: a parent, a Room 63 permission page, if under 18. A staff member: a second read of your ethics. Another teacher: a written okay to survey their class. An administrator: a written okay for a school-wide survey. No recruiting people under 18 outside school. At the end, with a folder icon: every yes comes before you collect. Each one goes in your portfolio. Course description, pages 46 to 48 and 60. Checked September 25, 2026.'><text x='4' y='12.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>THE COLLEGE BOARD RULE</text><use href='#i-sign' x='4' y='17' width='12' height='12' color='#1f3a5a'/><text x='22' y='27' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Me</text><text x='116' y='27' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>I review your form and questions, then sign.</text><path d='M4 31 L316 31' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><use href='#i-people' x='4' y='30.5' width='12' height='12' color='#1f3a5a'/><text x='22' y='40.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Each person</text><text x='116' y='40.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a free yes, knowing what they agree to</text><path d='M4 44.5 L316 44.5' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><use href='#i-doc' x='4' y='44' width='12' height='12' color='#1f3a5a'/><text x='22' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>A data owner</text><text x='116' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a signed agreement for private data</text><path d='M4 58 L316 58' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><use href='#i-shield' x='4' y='57.5' width='12' height='12' color='#1f3a5a'/><text x='22' y='67.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>A review board</text><text x='116' y='67.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>only if you publish, present in public, or compete</text><path d='M4 71.5 L316 71.5' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><rect x='2' y='83' width='316' height='87' rx='3' fill='#f9f0d9' stroke='#9a6b12' stroke-width='1.4' stroke-dasharray='5 3'/><text x='8' y='94.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#7a5208'>WAITING ON A ROOM 63 DECISION</text><use href='#i-sign' x='4' y='99' width='12' height='12' color='#1f3a5a'/><text x='22' y='109' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>A parent</text><text x='116' y='109' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a Room 63 permission page, if under 18</text><use href='#i-shield' x='4' y='112.5' width='12' height='12' color='#1f3a5a'/><text x='22' y='122.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>A staff member</text><text x='116' y='122.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a second read of your ethics</text><use href='#i-sign' x='4' y='126' width='12' height='12' color='#1f3a5a'/><text x='22' y='136' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Another teacher</text><text x='116' y='136' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a written okay to survey their class</text><use href='#i-sign' x='4' y='139.5' width='12' height='12' color='#1f3a5a'/><text x='22' y='149.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>An administrator</text><text x='116' y='149.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>a written okay for a school-wide survey</text><text x='22' y='163' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>No recruiting people under 18 outside school.</text><use href='#i-folder' x='4' y='175' width='12' height='12' color='#1f3a5a'/><text x='22' y='185' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>Every yes comes before you collect. Each one goes in your portfolio.</text><text x='4' y='198' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Course description, pages 46 to 48 and 60. Checked September 25, 2026.</text></svg><figcaption><b>BEFORE DAY ONE</b>No yes, no data.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>A restaurant owner lets you count customers for a week. What do you need?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The owner&#39;s written, dated permission, in your portfolio, before day one.</p></div></div><div class='num'>&middot; 31 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Publishing, presenting, competing</h3><figure class='plate'><div class='pl'><span>PLATE XXIV</span><span>Going public?</span></div><svg class='fig' viewBox='0 0 320 104' role='img' aria-label='A fork from one question: will findings about people be published, presented in public, or entered in a competition? No: my approval is enough. You still need it first. Yes: a federally registered review board reviews the study first. Some schools and colleges have one. Course description, page 47. Checked September 25, 2026.'><rect x='40' y='2' width='240' height='30' rx='8' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='160' y='14' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Will findings about people be published, presented</text><text x='160' y='26' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>in public, or entered in a competition?</text><path d='M110 33 L80 45' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M82.5 41.9 L80 45 L84 45.6' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M210 33 L240 45' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M236 45.6 L240 45 L237.5 41.9' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='84' y='41' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a' text-anchor='end'>NO</text><text x='236' y='41' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#1f3a5a'>YES</text><rect x='3' y='47' width='150' height='40' rx='3' fill='#fbf6ea' stroke='#245e55' stroke-width='1.3'/><text x='12' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>My approval is enough.</text><text x='12' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>You still need it first.</text><rect x='160' y='47' width='157' height='40' rx='3' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/><text x='167' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>A federally registered review</text><text x='167' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>board reviews the study first.</text><text x='167' y='83.5' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Some schools and colleges have one.</text><text x='3' y='99' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Course description, page 47. Checked September 25, 2026.</text></svg><figcaption><b>WHERE</b>Science fairs and hospitals may have one too.</figcaption></figure><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>Tell me by Friday, October 30 if you plan to publish, present outside our class, or compete. A review board takes weeks.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; GOING FURTHER</div><p>You want to post classmates&#39; survey answers online. Is my approval enough?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>No. Posting in public is publishing: a review board first.</p></div></div><div class='num'>&middot; 32 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"board chapter","label":"Folio 8","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>8</div><div class='ch-title'>Your questions, tested</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-question'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Write survey and interview questions that measure your question, and test them before they count.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>One question, one idea</span><span class='ld' aria-hidden='true'></span><span class='pn'>33</span></li><li><span class='it'>Answer choices</span><span class='ld' aria-hidden='true'></span><span class='pn'>34</span></li><li><span class='it'>Interview guides and borrowed questions</span><span class='ld' aria-hidden='true'></span><span class='pn'>35</span></li><li><span class='it'>A practice run</span><span class='ld' aria-hidden='true'></span><span class='pn'>36</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-question'/></svg>FOLIO 8</p><h2>One question, one idea</h2><figure class='plate'><div class='pl'><span>PLATE XXV</span><span>Three traps, struck through</span></div><svg class='fig' viewBox='0 0 320 137' role='img' aria-label='Three weak questions, each with its trap words struck through, beside its fixed version. A made-up case. Leading: &quot;Don&#39;t you agree bench bars are unfair?&quot; with &quot;don&#39;t you agree&quot; struck; fixed: &quot;How fair or unfair are bench bars?&quot; Two in one: &quot;Is the stop clean and safe?&quot; with &quot;and&quot; struck; fixed: two questions, &quot;Is the stop clean?&quot; and &quot;Is the stop safe?&quot; Vague: &quot;Do you often sit?&quot; with &quot;often&quot; struck; fixed: &quot;How many days last week did you sit?&quot;'><path d='M6 3 L13 10 M13 3 L6 10' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='17' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>WEAK</text><path d='M174 6.9 L176.7 9.3 L181 3.7' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='185' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>FIXED</text><text x='316' y='10' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up case.</text><rect x='3' y='16' width='156' height='36' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1'/><text x='9' y='27' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>LEADING</text><text x='9' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;<tspan fill='#9c3322' text-decoration='line-through' style='text-decoration:line-through;text-decoration-thickness:1.6px'>Don&#39;t you agree</tspan> bench bars</text><text x='9' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>are unfair?&quot;</text><path d='M160 34 L170 34' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M167 35.8 L170 34 L167 32.2' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><rect x='172' y='16' width='145' height='36' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='178' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;How fair or unfair</text><text x='178' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>are bench bars?&quot;</text><rect x='3' y='57' width='156' height='36' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1'/><text x='9' y='68' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>TWO IN ONE</text><text x='9' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;Is the stop clean <tspan fill='#9c3322' text-decoration='line-through' style='text-decoration:line-through;text-decoration-thickness:1.6px'>and</tspan> safe?&quot;</text><path d='M160 75 L170 75' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M167 76.8 L170 75 L167 73.2' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><rect x='172' y='57' width='145' height='36' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='178' y='71' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;Is the stop clean?&quot;</text><text x='178' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;Is the stop safe?&quot;</text><rect x='3' y='98' width='156' height='36' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1'/><text x='9' y='109' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>VAGUE</text><text x='9' y='121' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;Do you <tspan fill='#9c3322' text-decoration='line-through' style='text-decoration:line-through;text-decoration-thickness:1.6px'>often</tspan> sit?&quot;</text><path d='M160 116 L170 116' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M167 117.8 L170 116 L167 114.2' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><rect x='172' y='98' width='145' height='36' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1'/><text x='178' y='112' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>&quot;How many days last week</text><text x='178' y='124' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>did you sit?&quot;</text></svg><figcaption><b>NOTE</b>The struck words are the trap.</figcaption></figure><p class='small'>Cannot say what you will do with an answer? Cut the question.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>&quot;Is the new bus schedule fast and fair?&quot; What trap?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Two in one. Ask each one separately.</p></div></div><div class='num'>&middot; 33 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Answer choices</h3><figure class='plate'><div class='pl'><span>PLATE XXVI</span><span>A scale, labeled</span></div><svg class='fig' viewBox='0 0 320 107.5' role='img' aria-label='A made-up survey item: how fair or unfair are bench bars? A five-point scale with every point labeled: very unfair, unfair, neither, fair, very fair. A separate box, set apart: prefer not to answer. Three numbered rules on the drawing. 1: label every point, or at least both ends. 2: the middle is your decision; keep it or cut it. 3: give a way to skip: prefer not to answer.'><text x='4' y='11' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>&quot;How fair or unfair are bench bars?&quot;</text><text x='316' y='11' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='end'>A made-up case.</text><path d='M26 25 L210 25' fill='transparent' stroke='#1f3a5a' stroke-width='1' stroke-linecap='round'/><circle cx='26' cy='25' r='5.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='26' y='42' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>VERY</text><text x='26' y='52.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>UNFAIR</text><circle cx='72' cy='25' r='5.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='72' y='42' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>UNFAIR</text><circle cx='118' cy='25' r='5.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='118' y='42' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>NEITHER</text><circle cx='164' cy='25' r='5.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='164' y='42' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>FAIR</text><circle cx='210' cy='25' r='5.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='210' y='42' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>VERY</text><text x='210' y='52.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>FAIR</text><rect x='246' y='17' width='70' height='30' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='281' y='29' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>PREFER NOT</text><text x='281' y='40' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>TO ANSWER</text><circle cx='233' cy='44' r='6.6' fill='#9c3322'/><text x='233' y='47.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><circle cx='118' cy='58' r='6.6' fill='#9c3322'/><text x='118' y='61.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><circle cx='281' cy='55' r='6.6' fill='#9c3322'/><text x='281' y='58.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><circle cx='10' cy='72.4' r='6.6' fill='#9c3322'/><text x='10' y='75.6' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='21' y='76' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>Label every point, or at least both ends.</text><circle cx='10' cy='84.9' r='6.6' fill='#9c3322'/><text x='10' y='88.1' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='21' y='88.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>The middle is your decision. Keep it or cut it.</text><circle cx='10' cy='97.4' r='6.6' fill='#9c3322'/><text x='10' y='100.6' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='21' y='101' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>Give a way to skip: prefer not to answer.</text></svg><figcaption><b>RULES 1 TO 3</b>Rules 4 and 5 are in the table.</figcaption></figure><table class='stages narrow1 tight'><thead><tr><th></th><th>RULE</th></tr></thead><tbody><tr><th>4</th><td>Choices must not overlap.</td></tr><tr><th>5</th><td>Tell people how to answer.</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Choices: &quot;0 to 2 hours, 2 to 4 hours, 4 or more.&quot; What is wrong?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>They overlap at 2 and 4. Use 0 to 1, 2 to 3, 4 or more.</p></div></div><div class='num'>&middot; 34 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Interview guides and borrowed questions</h3><figure class='plate'><div class='pl'><span>PLATE XXVII</span><span>An interview guide, drawn</span></div><svg class='fig' viewBox='0 0 320 91' role='img' aria-label='A made-up case: an interview guide, version 2, written by hand. 1: Tell me about the stop where you wait. Follow-up: Can you say more? 2: What do you do while you wait there? Follow-up: What happened next? And so on, to 5 or 8. Labels on the right: open, how, what, tell me; follow-up, short, neutral; 5 to 8.'><rect x='2' y='2' width='250' height='86' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><path d='M8 33 L246 33' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><path d='M8 46 L246 46' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><path d='M8 59 L246 59' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><path d='M8 72 L246 72' fill='transparent' stroke='#d9ccb0' stroke-width='0.7' stroke-linecap='round'/><text x='10' y='16' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>Interview guide, version 2</text><text x='246' y='15' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='end'>A made-up case.</text><circle cx='14' cy='27' r='6.6' fill='#9c3322'/><text x='14' y='30.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='26' y='31' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>Tell me about the stop where you wait.</text><text x='40' y='44' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>Can you say more?</text><circle cx='14' cy='53' r='6.6' fill='#9c3322'/><text x='14' y='56.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='26' y='57' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>What do you do while you wait there?</text><text x='40' y='70' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>What happened next?</text><text x='26' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>and so on, to 5 or 8</text><text x='255' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>OPEN</text><text x='255' y='27' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>how, what,</text><text x='255' y='37' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>tell me</text><text x='255' y='52' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>FOLLOW-UP</text><text x='255' y='63' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>short, neutral</text><text x='255' y='78' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>5 TO 8</text></svg><figcaption><b>OPEN</b>No question a person can answer with yes or no.</figcaption></figure><p class='small'>Recording? First read the dashed box on page <button type='button' class='pj' data-jump='35' aria-label='Go to page 28'>28</button>.</p><p class='small'>Borrow tested questions when you can. Readers point to questions &quot;used in published works or have been used by reputable survey companies such as Gallup, Pew.&quot; Your key studies may print theirs. Cite them.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Make it open and neutral: &quot;You like the shaded bench better, right?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>One good form: &quot;Which bench do you choose at this stop, and why?&quot;</p></div></div><div class='num'>&middot; 35 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A practice run</h3><figure class='plate'><div class='pl'><span>PLATE XXVIII</span><span>The practice loop</span></div><svg class='fig' viewBox='0 0 320 141' role='img' aria-label='Four steps and a loop. 1, draft: your questions. 2, try: on two or three classmates, not in your sample. 3, fix: what they misread. 4, log: a version line, what changed. A loop goes from 4 back to 2: again, until nobody misreads it. Then the exit, a dark box: the final version goes with your form. With a cross: practice answers are never kept.'><rect x='2' y='10' width='62' height='56' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><text x='33' y='26' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>DRAFT</text><text x='33' y='39' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>your</text><text x='33' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>questions</text><circle cx='4' cy='10' r='6.6' fill='#9c3322'/><text x='4' y='13.2' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><path d='M65 38 L70.3 38' fill='none' stroke='#9c3322' stroke-width='1 div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-chat'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Know what an expert adviser may and may not do, and ask for help the right way.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>What an adviser may and may not do</span><span class='ld' aria-hidden='true'></span><span class='pn'>41</span></li><li><span class='it'>Finding one, and asking</span><span class='ld' aria-hidden='true'></span><span class='pn'>42</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-chat'/></svg>FOLIO 10</p><h2>What an adviser may and may not do</h2><figure class='plate'><div class='pl'><span>PLATE XXXII</span><span>Two lanes</span></div><svg class='fig' viewBox='0 0 320 85' role='img' aria-label='Two lanes. An adviser may, with a check: ask guiding questions, give general feedback, suggest resources, help with research steps. An adviser may not, with a cross: write your question, write or fix your work, tell you what to do, find sources for you. Role of Expert Advisers, course description, page 55. Checked September 25, 2026.'><rect x='2' y='2' width='156' height='66' rx='3' fill='#fbf6ea' stroke='#245e55' stroke-width='1.3'/><path d='M8 11.4 L11 14.2 L16 7.8' fill='none' stroke='#245e55' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='21' y='14.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>AN ADVISER MAY</text><text x='9' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>ask guiding questions</text><text x='9' y='41.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>give general feedback</text><text x='9' y='53' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>suggest resources</text><text x='9' y='64.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>help with research steps</text><rect x='162' y='2' width='156' height='66' rx='3' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/><path d='M168 7 L176 15 M176 7 L168 15' fill='none' stroke='#9c3322' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><text x='181' y='14.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>AN ADVISER MAY NOT</text><text x='169' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>write your question</text><text x='169' y='41.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>write or fix your work</text><text x='169' y='53' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>tell you what to do</text><text x='169' y='64.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'>find sources for you</text><text x='2' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Role of Expert Advisers, course description, page 55. Checked September 25, 2026.</text></svg><figcaption><b>NOTE</b>You start every conversation. Advisers do not help before you ask.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; EXPERT ADVISER</div><p><em lang='es' class='esw'>asesor experto</em> &middot; An adult expert in your field or method. Optional.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; NEXT STEP</div><p>Allowed? A: your adviser asks, &quot;What would a survey miss?&quot; B: your adviser rewrites item 4.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>A only. B is writing your work.</p></div></div><div class='num'>&middot; 41 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Finding one, and asking</h3><p class='small'>Start inside the building: a teacher who knows your field or your method. A graduate student can also help.</p><div class='card2 wait' style='margin-top:1.2cqw'><div class='k'>WAITING ON A ROOM 63 DECISION</div><p>Outside advisers only after I approve them. Write through your school email, with me copied. Meet only at school or by school video.</p></div><figure class='plate'><div class='pl'><span>PLATE XXXIII</span><span>The first message</span></div><svg class='fig' viewBox='0 0 320 130' role='img' aria-label='A simple drawing of a school email, not the real screen, with five numbered parts. 1: to, your adviser. 2: copy, Mr. Portela, dashed, waiting on a Room 63 decision. 3: your name, and that you are an AP Research student at Mater Academy Charter High. 4: your question, and one question for them. 5: attached, the College Board rules for advisers.'><rect x='3' y='3' width='314' height='124' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='312' y='15' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='end'>A simple drawing, not the real screen.</text><path d='M3 20 L317 20' fill='transparent' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round'/><circle cx='13' cy='31' r='6.6' fill='#9c3322' e'></span><span class='pn'>45</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-loop'/></svg>FOLIO 11</p><h2>Peer review of a proposal</h2><p class='small'>On draft day, a classmate checks the chain on page <button type='button' class='pj' data-jump='14' aria-label='Go to page 11'>11</button>:</p><table class='stages narrow1 tight'><thead><tr><th></th><th>REVIEWERS ASK</th></tr></thead><tbody><tr><th>1</th><td>Does the method answer the question?</td></tr><tr><th>2</th><td>Could I repeat the steps?</td></tr><tr><th>3</th><td>Is the gap shown with sources?</td></tr><tr><th>4</th><td>Is any question unsafe?</td></tr></tbody></table><p class='small'>Give three compliments and three suggestions. Ask; do not rewrite. The author records each suggestion, taken or not, and why, in the feedback table: The Process and Reflection Portfolio, page 22.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT &middot; FIRST STEP</div><p>Fair suggestion? A: &quot;Change your question to this one.&quot; B: &quot;Your steps do not say how many riders. How many?&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>B. It asks a question. A writes the author&#39;s work.</p></div></div><div class='num'>&middot; 43 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE PROPOSAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>My feedback, and what to do with it</h3><figure class='plate'><div class='pl'><span>PLATE XXXIV</span><span>Feedback to signature</span></div><svg class='fig' viewBox='0 0 320 157' role='i
