.ttab.here,.ttab.left.here{background:linear-gradient(90deg,#b48a3f,#f1d58e 55%,#c79c4c);color:#142e25;border-color:#f1d58e;box-shadow:inset 0 0 0 2px rgba(20,46,37,.35),2px 2px 5px -2px rgba(0,0,0,.6)}
.ttab.here:hover{color:#0b1a15}
.ttab:focus-visible{outline:3px solid #fbe9b4;outline-offset:2px}
.panel:has(.pick){top:5.5%;bottom:5.5%;padding:5cqw 6.5cqw;font-size:4.2cqw;line-height:1.28}
.panel:has(.pick) .kept{margin-bottom:1.4cqw}
.panel:has(.pick) .who{font-size:clamp(5.2cqw,calc(9.5cqw - var(--nl,10) * .14cqw),7.6cqw);line-height:1.06;margin-bottom:1.6cqw;text-wrap:balance}
.panel:has(.pick) .meta{margin-bottom:2.4cqw;font-size:3.1cqw;letter-spacing:.04em;text-wrap:balance}
.panel:has(.pick) .box{font-size:4cqw;line-height:1.28;padding:1.8cqw 2.6cqw;margin:0 0 2cqw}
.panel:has(.pick) p.small{font-size:max(11px,3.5cqw);line-height:1.3;text-wrap:balance}
.panel .pick{width:100%;margin:0 0 3cqw}
.panel .drawers{grid-template-columns:repeat(4,1fr);gap:1.6cqw;padding:0;background:none;border:0;box-shadow:none}
.panel .drw{min-height:9.5cqw!important;display:grid;place-items:center;background:linear-gradient(180deg,#fbf6e8,#efe3c6);border:1.5px solid #b8903f;border-radius:3px;padding:1.1cqw .6cqw;box-shadow:0 .5cqw 0 -.1cqw rgba(110,80,30,.3)}
.panel .drw .holder{background:none;border:0;padding:.3cqw 0;color:#142e25;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:3.8cqw}
.panel .drw .pull{display:none}
.panel .drw:hover{border-color:#1d4436}
.panel .drw[aria-pressed=true]{background:linear-gradient(180deg,#235342,#18382c);border-color:#b48a3f;transform:translateY(-.8cqw);box-shadow:inset 0 0 0 .45cqw #142e25,inset 0 0 0 .65cqw rgba(236,208,138,.6),0 1.4cqw 1.2cqw -.8cqw rgba(0,0,0,.45)}
.panel .drw[aria-pressed=true] .holder{background:none;color:#ecd08a}
.panel .drw:focus-visible{outline:3px solid #1d4436;outline-offset:2px}
.pb-B .panel .drw,.pb-C .panel .drw,.pb-D .panel .drw{--pbh:max(9.5cqw,min(calc(var(--tap,44px) * 1.05),15.4cqw))}
.pb-B .stage.narrow:not(.single) .panel .drw,.pb-C .stage.narrow:not(.single) .panel .drw,.pb-D .stage.narrow:not(.single) .panel .drw{--pbh:12cqw}
.pb-B .panel:has(.pick) .meta,.pb-C .panel:has(.pick) .meta,.pb-D .panel:has(.pick) .meta{letter-spacing:.03em;text-wrap:balance}
.pb-B .panel .holder::first-letter,.pb-C .panel .holder::first-letter,.pb-D .panel .holder::first-letter{font-size:.6em}
.pb-B .panel .pick{width:auto;margin:0 -2.4cqw 3cqw}
.pb-B .panel .drawers{grid-template-columns:5.2cqw repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:1.5cqw 1.3cqw!important;padding:0!important;background:none!important;border:0!important;box-shadow:none!important}
.pb-B .panel .drawers::before,.pb-B .panel .drawers::after{grid-column:1;display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-weight:700;font-size:max(10px,2.6cqw);letter-spacing:.1em;line-height:1;color:#ecd08a;background:linear-gradient(90deg,#3a0b10 0,#6d1b22 34%,#7c232a 70%,#5a141a 100%);border:1px solid #b48a3f;border-radius:.8cqw;box-shadow:inset 0 0 0 .3cqw #4a1016,inset 0 0 0 .45cqw rgba(236,208,138,.5)}
.pb-B .panel .drawers::before{content:"A DAY";grid-row:1}
.pb-B .panel .drawers::after{content:"B DAY";grid-row:2}
.pb-B .panel .drw{min-height:var(--pbh)!important;grid-template-rows:auto auto;align-content:center;row-gap:.5cqw;padding:.6cqw .3cqw!important;border-radius:.8cqw;background:linear-gradient(180deg,#fdf9ee,#efe3c6);border:1.5px solid #b8903f;box-shadow:inset 0 0 0 .35cqw #fdf9ee,inset 0 0 0 .5cqw rgba(184,144,63,.45),0 .5cqw 0 -.1cqw rgba(110,80,30,.3)}
.pb-B .panel .drw .holder{font-size:5.2cqw;line-height:1;padding:0;color:#4a1016}
.pb-B .panel .drw::after{content:attr(data-c);font-family:var(--body);font-style:italic;font-weight:700;font-size:max(11px,3.3cqw);line-height:1;color:#5b3a1e}
.pb-B .panel .drw:hover{border-color:#6d1b22}
.pb-B .panel .drw[aria-pressed=true]{transform:translateY(-.6cqw);background:linear-gradient(180deg,#7c232a,#5a141a);border-color:#b48a3f;box-shadow:inset 0 0 0 .4cqw #4a1016,inset 0 0 0 .6cqw rgba(236,208,138,.6),0 1.4cqw 1.2cqw -.8cqw rgba(0,0,0,.45)}
.pb-B .panel .drw[aria-pressed=true] .holder{color:#ecd08a}
.pb-B .panel .drw[aria-pressed=true]::after{color:#f6e3b4}
</style>

TEST</div><p>Could you have written this with every tool closed? If not, it is not yours yet.</p><p class='small' style='margin-top:.6cqw'>The Research Log, page 60</p></div><p class='small fill'>This manual gives the College Board&#39;s policy, then Room 63&#39;s rules, then cases to practice on.</p></div><div class='num'>&middot; 3 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What a chatbot is</h3><p>A chatbot predicts likely words. It does not know facts the way a source does.</p><table class='stages'><thead><tr><th style='width:45%'>IT CAN</th><th><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-warn'/></svg>IT CAN ALSO</th></tr></thead><tbody><tr><th>Explain an idea in simpler words.</th><td>Explain it wrong, with confidence.</td></tr><tr><th>Suggest search words.</th><td>Invent a source that does not exist.</td></tr><tr><th>Point out a grammar error.</th><td>Change your meaning while it fixes it.</td></tr><tr><th>Summarize a text.</th><td>Leave out the part that matters.</td></tr></tbody></table><svg class='fig' viewBox='0 0 320 55' role='img' aria-label='A lead, not a source, in three steps. First, a tool says something: a fact, a quote, a title, or a number. It is not a source. Second, that is a lead: a clue that shows where to look. Third, the source: you find it, open it, and read it. Cite this one.'><g class='pop' style='transition-delay:0.15s'><rect x='4' y='2' width='96' height='37' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='10' y='13.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>A TOOL SAYS</text><text x='10' y='25' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>a fact, a quote,</text><text x='10' y='35.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>a title, a number</text><path d='M6 44 L13 51 M13 44 L6 51' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='18' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>not a source</text><path d='M101 20.5 L111 20.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M107.5 22.5 L111 20.5 L107.5 18.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></g><g class='pop' style='transition-delay:0.45s'><rect x='112' y='2' width='96' height='37' rx='3' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.2'/><text x='118' y='13.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>A LEAD</text><text x='118' y='25' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>a clue that shows</text><text x='118' y='35.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>where to look</text><path d='M209 20.5 L219 20.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M215.5 22.5 L219 20.5 L215.5 18.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></g><g class='pop' style='transition-delay:0.75s'><rect x='220' y='2' width='96' height='37' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><text x='226' y='13.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>THE SOURCE</text><text x='226' y='25' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55'>you find it, open</text><text x='226' y='35.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55'>it, and read it</text><path d='M222 48.4 L225 51.2 L230 44.8' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='234' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#245e55'>cite this one</text></g></svg><p class='small fill'>Everything a tool says is a lead to check, never a source to cite.</p></div><div class='num'>&middot; 4 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","label":"Folio 1","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>How a chatbot picks a word</h2><figure class='plate'><div class='pl'><span>PLATE I</span><span>Next-word prediction</span></div><svg class='fig' viewBox='0 0 320 310.5' role='img' aria-label='A made-up case. The prompt: The bench has a bar in the middle to. A longer bar means a more likely next word. No numbers: a made-up picture of more and less likely. Five bars show possible next words, longest to shortest: stop, keep, divide, help, protect. The tool picked stop: a likely word. Likely is not the same as true. A kind of prediction runs in each of these four kinds of tool: a chatbot; a writing helper that suggests new words; a summary on top of search results, or in a database; a tool that makes slides, pictures, or charts. The College Board rule covers every one. Definition: College Board course descriptions. Checked September 25, 2026.'><text x='8' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>PROMPT</text><text x='312' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text><text x='8' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>The bench has a bar in the middle to</text><text x='8' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>A longer bar means a more likely next word.</text><text x='70' y='73' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#245e55' text-anchor='end'>stop</text><rect x='78' y='62' width='166' height='14' rx='2' fill='#245e55' stroke='#245e55' stroke-width='0.8'/><text x='70' y='91' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='end'>keep</text><rect x='78' y='80' width='76' height='14' rx='2' fill='#e8c878' stroke='#1f3a5a' stroke-width='0.8'/><text x='70' y='109' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='end'>divide</text><rect x='78' y='98' width='50' height='14' rx='2' fill='#e8c878' stroke='#1f3a5a' stroke-width='0.8'/><text x='70' y='127' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='end'>help</text><rect x='78' y='116' width='29' height='14' rx='2' fill='#e8c878' stroke='#1f3a5a' stroke-width='0.8'/><text x='70' y='145' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='end'>protect</text><rect x='78' y='134' width='18' height='14' rx='2' fill='#e8c878' stroke='#1f3a5a' stroke-width='0.8'/><text x='178' y='119' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>No numbers: a made-up picture</text><text x='178' y='132' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>of more and less likely.</text><text x='250' y='68' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>picked:</text><text x='250' y='81' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>a likely word</text><text x='8' y='166' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#9c3322'>Likely is not the same as true.</text><path d='M8 175 H312' stroke='#1f3a5a' stroke-width='0.8'/><text x='8' y='189' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>A KIND OF PREDICTION RUNS IN EACH OF THESE</text><rect x='6' y='195' width='152' height='32' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><use href='#i-bot' x='11' y='202.5' width='17' height='17' color='#1f3a5a'/><text x='33' y='215' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>a chatbot</text><rect x='162' y='195' width='152' height='32' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><use href='#i-tool' x='167' y='202.5' width='17' height='17' color='#1f3a5a'/><text x='189' y='208.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>a writing helper that</text><text x='189' y='220' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>suggests new words</text><rect x='6' y='230' width='152' height='32' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><use href='#i-search' x='11' y='237.5' width='17' height='17' color='#1f3a5a'/><text x='33' y='243.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>a summary on top of search</text><text x='33' y='255' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>results, or in a database</text><rect x='162' y='230' width='152' height='32' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><use href='#i-picture' x='167' y='237.5' width='17' height='17' color='#1f3a5a'/><text x='189' y='243.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>a tool that makes slides,</text><text x='189' y='255' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>pictures, or charts</text><text x='8' y='280' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>The College Board rule covers every one.</text><text x='8' y='294' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>DEFINITION College Board course descriptions.</text><text x='8' y='305.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>ILLUSTRATIVE</b>A chatbot predicts likely words; it does not look facts up the way a source does.</figcaption></figure></div><div class='num'>&middot; 5 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>2</div><div class='ch-title'>The four allowed uses</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-check'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Name the four uses, where each stops, and what a tool may do at each stage.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>The four allowed uses</span><span class='ld' aria-hidden='true'></span><span class='pn'>6</span></li><li><span class='it'>What a tool may and may not do</span><span class='ld' aria-hidden='true'></span><span class='pn'>7</span></li><li><span class='it'>Stage by stage, continued</span><span class='ld' aria-hidden='true'></span><span class='pn'>8</span></li><li><span class='it'>Where each use stops</span><span class='ld' aria-hidden='true'></span><span class='pn'>9</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-check'/></svg>FOLIO 2</p><h2>The four allowed uses</h2><p>The College Board names four ways you may use a tool that writes.</p><table class='stages'><thead><tr><th style='width:30%'>USE</th><th style='width:33%'>EXAMPLE</th><th>THE LINE</th></tr></thead><tbody><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-compass'/></svg>1 Explore topics</th><td>Ask for angles on hostile architecture.</td><td>It writes your question or thesis.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-search'/></svg>2 Start a search</th><td>Ask for names, then read each one.</td><td>Its list goes in your log unopened.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-book'/></svg>3 Check understanding</th><td>After you read, ask if you understood.</td><td>Its summary replaces the reading.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-abc'/></svg>4 Grammar and tone</th><td>Ask it to point out errors.</td><td>It rewrites your sentence.</td></tr></tbody></table><p class='small fill'>College Board policy, checked September 25, 2026.</p></div><div class='num'>&middot; 6 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What a tool may and may not do</h3><figure class='plate'><div class='pl'><span>PLATE II</span><span>Stage by stage, part 1</span></div><svg class='fig' viewBox='0 0 320 273' role='img' aria-label='A stage map, part 1, before you write, for both courses. For each stage: what you may do with a tool that writes, and what you may not do. 1, explore a topic. You may: see the debates, the subtopics, and what is widely known. ' stroke='#9c3322' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='27' y='255.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>THE LINE</text><text x='88' y='255.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>it rewrites the sentence.</text></g><text x='4' y='268' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>The three steps: how we run each use in Room 63.</text><text x='4' y='283' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>SOURCE College Board phase table.</text><text x='4' y='294.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>YOU, TOOL, YOU</b>In Room 63, the tool sits in the middle: never first, never last.</figcaption></figure></div><div class='num'>&middot; 9 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>3</div><div class='ch-title'>Only you can do this</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-bulb'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Name the three parts of the work no tool may do.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Three things only you can do</span><span class='ld' aria-hidden='true'></span><span class='pn'>10</span></li><li><span class='it'>Three pillars</span><span class='ld' aria-hidden='true'></span><span class='pn'>11</span></li><li><span class='it'>Why the line is there</span><span class='ld' aria-hidden='true'></span><span class='pn'>12</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bulb'/></svg>FOLIO 3</p><h2>Three things only you can do</h2><p>The same policy says three parts of the work must be yours.</p><div class='card2 ' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-eye'/></svg>1 \u00b7 READ THE SOURCES</div><p>Read primary and secondary sources directly, not a summary of them.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-link'/></svg>2 \u00b7 ANALYZE AND CONNECT</div><p>Analyze the evidence and connect it yourself.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-pen'/></svg>3 \u00b7 CHOOSE YOUR WORDS</div><p>Choose how to say it, in writing and when you present.</p></div><p class='small fill'>Tools may never write or create the work for you.</p></div><div class='num'>&middot; 10 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"paper","label":"Folio 3","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Three pillars</h2><figure class='plate'><div class='pl'><span>PLATE V</span><span>What stays yours</span></div><svg class='fig' viewBox='0 0 320 190' role='img' aria-label='Three pillars under one roof line, each marked you. Read the sources, directly: you. Analyze and connect the evidence: you. Choose your words, written and spoken: you. The base says: no tool writes or creates the work. Each pillar has its sign: an eye for reading, linked circles for connecting, a pen for your words.'><path d='M12 40 H104 V150 H12 Z' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><path d='M8 40 H108 L58 22 Z' fill='#1f3a5a'/><text x='58' y='70' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>READ</text><text x='58' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>the sources,</text><text x='58' y='103' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>directly</text><text x='58' y='136' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>YOU</text><path d='M114 40 H206 V150 H114 Z' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><path d='M110 40 H210 L160 22 Z' fill='#1f3a5a'/><text x='160' y='70' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>ANALYZE</text><text x='160' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>and connect</text><text x='160' y='103' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>the evidence</text><text x='160' y='136' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>YOU</text><path d='M216 40 H308 V150 H216 Z' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/><path d='M212 40 H312 L262 22 Z' fill='#1f3a5a'/><text x='262' y='70' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>CHOOSE</text><text x='262' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>your words,</text><text x='262' y='103' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>written and</text><text x='262' y='116' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>spoken</text><text x='262' y='136' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>YOU</text><use href='#i-eye' x='50' y='45' width='16' height='16' color='#1f3a5a'/><use href='#i-link' x='152' y='45' width='16' height='16' color='#1f3a5a'/><use href='#i-pen' x='254' y='45' width='16' height='16' color='#1f3a5a'/><rect x='6' y='150' width='308' height='8' fill='#1f3a5a'/><text x='160' y='180' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='700' fill='#9c3322' text-anchor='middle'>No tool writes or creates the work</text></svg><figcaption><b>POLICY</b>The College Board policy names these three as the student&#39;s own work.</figcaption></figure></div><div class='num'>&middot; 11 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Why the line is there</h3><p>AP Capstone scores your thinking: how you read, weigh, connect, and argue. A tool that does those things erases the part that is scored.</p><figure class='plate'><div class='pl'><span>PLATE VI</span><span>What the scorer sees</span></div><svg class='fig' viewBox='0 0 320 158' role='img' aria-label='A pair of panels. Left, with a check: you did the work. Your reading, in how you use sources. Your analysis, in how you connect them. Your voice, in how you say it. The scorer sees you. Right, with a cross: a tool did it. Its reading, its analysis, its voice, each marked with the tool sign and not yours to score. The scored part is gone.'><rect x='4' y='2' width='152' height='18' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><path d='M9 10.4 L12 13.2 L17 6.8' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='21' y='14.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>YOU DID THE WORK</text><rect x='164' y='2' width='152' height='18' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><path d='M170 7 L177 14 M177 7 L170 14' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='182' y='14.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>A TOOL DID IT</text><rect x='4' y='26' width='152' height='34' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><use href='#i-eye' x='9' y='35' width='16' height='16' color='#1f3a5a'/><text x='31' y='40' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>YOUR READING</text><text x='31' y='53' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>in how you use sources</text><rect x='164' y='26' width='152' height='34' rx='3' fill='#fbf6ea' stroke='#4a3f31' stroke-width='0.8'/><use href='#i-tool' x='169' y='35' width='16' height='16' color='#4a3f31'/><text x='191' y='40' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>ITS READING</text><text x='191' y='53' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>not yours to score</text><rect x='4' y='64' width='152' height='34' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><use href='#i-link' x='9' y='73' width='16' height='16' color='#1f3a5a'/><text x='31' y='78' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>YOUR ANALYSIS</text><text x='31' y='91' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>in how you connect them</text><rect x='164' y='64' width='152' height='34' rx='3' fill='#fbf6ea' stroke='#4a3f31' stroke-width='0.8'/><use href='#i-tool' x='169' y='73' width='16' height='16' color='#4a3f31'/><text x='191' y='78' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>ITS ANALYSIS</text><text x='191' y='91' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>not yours to score</text><rect x='4' y='102' width='152' height='34' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><use href='#i-pen' x='9' y='111' width='16' height='16' color='#1f3a5a'/><text x='31' y='116' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>YOUR VOICE</text><text x='31' y='129' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>in how you say it</text><rect x='164' y='102' width='152' height='34' rx='3' fill='#fbf6ea' stroke='#4a3f31' stroke-width='0.8'/><use href='#i-tool' x='169' y='111' width='16' height='16' color='#4a3f31'/><text x='191' y='116' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>ITS VOICE</text><text x='191' y='129' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31'>not yours to score</text><text x='4' y='152' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#245e55'>The scorer sees you.</text><text x='164' y='152' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>The scored part is gone.</text></svg><figcaption><b>YOURS</b>Only your own work can show your reading, your analysis, and your voice.</figcaption></figure><p class='small fill'>The skill you build now is the skill you use in college, with or without tools.</p></div><div class='num'>&middot; 12 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>4</div><div class='ch-title'>Better prompts</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-bot'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Write a prompt that supports your learning instead of skipping it.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Support or shortcut?</span><span class='ld' aria-hidden='true'></span><span class='pn'>13</span></li><li><span class='it'>Prompts that keep you thinking</span><span class='ld' aria-hidden='true'></span><span class='pn'>14</span></li><li><span class='it'>Fix the prompt</span><span class='ld' aria-hidden='true'></span><span class='pn'>15</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bot'/></svg>FOLIO 4</p><h2>Support or shortcut?</h2><table class='stages'><thead><tr><th style='width:50%'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-check'/></svg>SUPPORTS YOUR LEARNING</th><th><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-cross'/></svg>SKIPS YOUR LEARNING</th></tr></thead><tbody><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-compass'/></svg>Three angles on school start times?</th><td>Write my research question.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-search'/></svg>Who studies bench design? I will read their work.</th><td>List five sources I can log unread.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-book'/></svg>Did I get its main claim right?</th><td>Summarize it so I can skip it.</td></tr><tr><th><svg class='ic sm' aria-hidden='true'><use href='#i-abc'/></svg>Point out errors. Do not rewrite.</th><td>Make my paragraph sound better.</td></tr></tbody></table><p class='small fill'>Support prompts leave the work to you.</p></div><div class='num'>&middot; 13 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Prompts that keep you thinking</h3><figure class='plate'><div class='pl'><span>PLATE VII</span><span>A prompt in three parts</span></div><svg class='fig' viewBox='0 0 320 163' role='img' aria-label='A prompt card, a made-up source, in three numbered parts. Part 1, your work first: I read Chen and Diaz. Here is what I think this says: they found dividers on 38 of every 100 benches. Part 2, one ask, such as a check, a question, names to look up, or a pointer: What did I miss? Part 3, what the tool must not do: Do not summarize the study or rewrite my sentence.'><rect x='4' y='4' width='312' height='96' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='14' y='20' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>YOUR PROMPT</text><text x='308' y='20' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up source</text><circle cx='16' cy='34' r='6.5' fill='#9c3322'/><text x='16' y='37.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='30' y='38' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>I read Chen and Diaz. Here is what I think this says:</text><text x='30' y='55' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>they found dividers on 38 of every 100 benches.</text><circle cx='16' cy='68' r='6.5' fill='#9c3322'/><text x='16' y='71.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='30' y='72' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>What did I miss?</text><circle cx='16' cy='85' r='6.5' fill='#9c3322'/><text x='16' y='88.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='30' y='89' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a'>Do not summarize the study or rewrite my sentence.</text><circle cx='12' cy='114' r='6.5' fill='#9c3322'/><text x='12' y='117.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text><text x='24' y='118' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Your work first: what you read, and what you think it says.</text><circle cx='12' cy='131' r='6.5' fill='#9c3322'/><text x='12' y='134.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text><text x='24' y='135' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Then one ask: a check, a question, names to look up, or a pointer.</text><circle cx='12' cy='148' r='6.5' fill='#9c3322'/><text x='12' y='151.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3</text><text x='24' y='152' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Last: what the tool must not do.</text></svg><figcaption><b>ASK FOR</b>A check, not a summary; names to look up, not a list to log.</figcaption></figure><p style='margin-top:.6cqw'>The short check: <em>Here is what I think this says. What did I miss?</em></p><p class='small fill'>End every prompt with what the tool must not do.</p></div><div class='num'>&middot; 14 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Fix the prompt</h3><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>Fix this prompt: <em>Write a paragraph about hostile architecture.</em></p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>One fix: What are three stakeholders in hostile architecture, and what might each want? Then write the paragraph yourself.</p></div><div class='card2 try' style='margin-top:1.4cqw'><div class='k'>TRY IT</div><p>Fix this prompt: <em>Find me sources on bus stops.</em></p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.8cqw'>One fix: Which search words and databases would find studies on bus stop design? Then search and open the sources yourself.</p></div></div><div class='num'>&middot; 15 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>5</div><div class='ch-title'>Check what tools say</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-search'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Test a source, a quote, or a number a tool gave you.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Tools can be wrong</span><span class='ld' aria-hidden='true'></span><span class='pn'>16</span></li><li><span class='it'>Check a source a tool gave you</span><span class='ld' aria-hidden='true'></span><span class='pn'>17</span></li><li><span class='it'>Check a quote or a number</span><span class='ld' aria-hidden='true'></span><span class='pn'>18</span></li><li><span class='it'>The verification flowchart</span><span class='ld' aria-hidden='true'></span><span class='pn'>19</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-search'/></svg>FOLIO 5</p><h2>Tools can be wrong</h2><p>A chatbot can sound certain and still be wrong. <svg class='ic sm' aria-hidden='true'><use href='#i-warn'/></svg>Three errors are common.</p><div class='card2 weak' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-ghost'/></svg>INVENTED SOURCES</div><p>Titles, authors, and journals that do not exist.</p></div><div class='card2 weak' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-quote'/></svg>INVENTED QUOTES</div><p>Words no real person said.</p></div><div class='card2 weak' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-chart'/></svg>WRONG NUMBERS</div><p>Statistics that are made up, old, or from a different place.</p></div><p class='small fill'><svg class='ic sm' aria-hidden='true'><use href='#i-zero'/></svg>A made-up source in your work scores 0.</p></div><div class='num'>&middot; 16 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Check a source a tool gave you</h3><table class='stages'><thead><tr><th>STEP</th><th>DO THIS</th></tr></thead><tbody><tr><th>1</th><td>Search the exact title, in quotation marks, in Google Scholar or a library database.</td></tr><tr><th>2</th><td>Find the journal, book, or site that published it.</td></tr><tr><th>3</th><td>Open it and read it.</td></tr><tr><th>4</th><td>Check the author and the year.</td></tr><tr><th>5</th><td>Cannot find it? It does not exist for you. It stays out.</td></tr></tbody></table><p class='small fill'>Only a source you opened and read goes in the log.</p></div><div class='num'>&middot; 17 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Check a quote or a number</h3><p>Find it in the original source, on its page, in its context.</p><div class='card2 good' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-check'/></svg>FOUND IT</div><p>Cite the original, not the tool. Note the page.</p></div><div class='card2 weak' style='margin-top:1.4cqw'><div class='k'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-cross'/></svg>CANNOT FIND IT</div><p>Do not use it. A quote or number you cannot trace is not evidence.</p></div><figure class='plate'><div class='pl'><span>PLATE VIII</span><span>How far to trust its list</span></div><svg class='fig' viewBox='0 0 320 90.5' role='img' aria-label='A scale from trust less to trust more. At the trust less end: a general chatbot can list sources that do not exist. At the trust more end: a database&#39;s own search tool draws from real records. Either way: find it, open it, read it. Source: College Board phase table, finding sources. Checked September 25, 2026.'><text x='6' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>TRUST LESS</text><text x='314' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55' text-anchor='end'>TRUST MORE</text><path d='M80 6 H240' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M90 6 L80 6' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M83.5 4 L80 6 L83.5 8' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M230 6 L240 6' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M236.5 8 L240 6 L236.5 4' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><rect x='4' y='16' width='152' height='30' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><path d='M9 20 L16 27 M16 20 L9 27' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='20' y='27' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>A general chatbot can list</text><text x='9' y='40' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322'>sources that do not exist.</text><rect x='164' y='16' width='152' height='30' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><path d='M169 23.9 L171.7 26.3 L176 20.7' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='180' y='27' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55'>A database&#39;s own search</text><text x='169' y='40' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55'>tool draws from real records.</text><text x='4' y='61' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Either way: find it, open it, read it.</text><text x='4' y='75' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>SOURCE College Board phase table, finding</text><text x='4' y='86.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>sources. Checked September 25, 2026.</text></svg><figcaption><b>NOT A SOURCE</b>A tool is never the source you cite.</figcaption></figure><p class='small fill'>Lateral reading works here too: leave the page and check in new tabs.</p></div><div class='num'>&middot; 18 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","label":"Folio 5","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>The verification flowchart</h2><figure class='plate'><div class='pl'><span>PLATE IX</span><span>Source, quote, or number</span></div><svg class='fig' viewBox='0 0 320 296.5' role='img' aria-label='A decision tree. A tool gives you a source. Search the exact title, in quotation marks. Found it? No: it stays out. Yes: open it, read it, check the author and year. Then: does it say what the tool said? No: the claim stays out. Yes: log it. Cite the original, not the tool. The no branches are dashed arrows with a cross; the yes branches are solid, and the last box has a check. Source: College Board phase table, finding and reading sources. Checked September 25, 2026.'><rect x='70' y='2' width='180' height='26' rx='13' fill='#16294a' stroke='#b8903f' stroke-width='1.2'/><text x='160' y='19' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#f3e3bd' text-anchor='middle'>A tool gives you a source</text><path d='M160 28 L160 40' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M157.5 35.7 L160 40 L162.5 35.7' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='50' y='40' width='220' height='24' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='160' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Search the exact title, in quotation marks</text><path d='M160 64 L160 74' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M157.5 69.7 L160 74 L162.5 69.7' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M160 74 L234 96 L160 118 L86 96Z' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/><text x='160' y='100' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Found it?</text><path d='M234 96 L256 96' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-dasharray='3 2'/><path d='M250 96 L256 96' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M252.5 98 L256 96 L252.5 94' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><text x='245' y='91' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>no</text><rect x='256' y='79' width='62' height='34' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><path d='M261 84 L267 90 M267 84 L261 90' fill='none' stroke='#9c3322' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='270' y='94' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>It stays</text><text x='270' y='105' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>out.</text><path d='M160 118 L160 132' fill='none' stroke='#245e55' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M157.5 127.7 L160 132 L162.5 127.7' fill='none' stroke='#245e55' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='168' y='129' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>yes</text><rect x='50' y='132' width='220' height='24' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='160' y='148' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Open it, read it, check the author and year</text><path d='M160 156 L160 168' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M157.5 163.7 L160 168 L162.5 163.7' fill='none' stroke='#1f3a5a' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M160 168 L234 194 L160 220 L86 194Z' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.3'/><text x='160' y='192' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Does it say what</text><text x='160' y='204' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>the tool said?</text><path d='M234 194 L256 194' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-dasharray='3 2'/><path d='M250 194 L256 194' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M252.5 196 L256 194 L252.5 192' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><text x='245' y='189' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>no</text><rect x='256' y='177' width='62' height='34' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><path d='M261 182 L267 188 M267 182 L261 188' fill='none' stroke='#9c3322' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='270' y='192' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>The claim</text><text x='270' y='203' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>stays out.</text><path d='M160 220 L160 234' fill='none' stroke='#245e55' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M157.5 229.7 L160 234 L162.5 229.7' fill='none' stroke='#245e55' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='168' y='231' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>yes</text><rect x='40' y='234' width='240' height='28' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.4'/><path d='M48 248.4 L51 251.2 L56 244.8' fill='none' stroke='#245e55' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/><text x='164' y='252' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#245e55' text-anchor='middle'>Log it. Cite the original, not the tool.</text><text x='4' y='280' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>SOURCE College Board phase table, finding and</text><text x='4' y='291.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>reading sources. Checked September 25, 2026.</text></svg><figcaption><b>SAME PATH</b>A quote or a number follows the same path: find it on its page, in its context, or leave it out.</figcaption></figure></div><div class='num'>&middot; 19 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>6</div><div class='ch-title'>Grammar, not rewriting</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-abc'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Tell a grammar check from a rewrite.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Checking, not rewriting</span><span class='ld' aria-hidden='true'></span><span class='pn'>20</span></li><li><span class='it'>The rewording rule</span><span class='ld' aria-hidden='true'></span><span class='pn'>21</span></li><li><span class='it'>Checking versus rewriting</span><span class='ld' aria-hidden='true'></span><span class='pn'>22</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-abc'/></svg>FOLIO 6</p><h2>Checking, not rewriting</h2><p>A tool may check your grammar and tone. It may not rewrite your words.</p><table class='stages'><thead><tr><th style='width:50%'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-check'/></svg>CHECKING, ALLOWED</th><th><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-cross'/></svg>REWRITING, NOT ALLOWED</th></tr></thead><tbody><tr><th>A tool underlines a comma error. You fix it.</th><td>You accept its new version of the sentence.</td></tr><tr><th>A tool says a sentence is unclear. You rewrite it.</th><td>You ask it to make the paragraph clearer.</td></tr><tr><th>A tool flags a spelling error. You fix it.</th><td>You ask it to make you sound smarter.</td></tr></tbody></table><p class='small fill'>If the words changed and you did not choose them, it was a rewrite.</p></div><div class='num'>&middot; 20 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The rewording rule</h3><div class='card2 good' style='margin-top:1.4cqw'><div class='k'>THE WORK</div><p>Rewording a source in your own words is the work, and it is yours to do.</p></div><div class='card2 weak' style='margin-top:1.4cqw'><div class='k'>NOT ALLOWED</div><p>A machine rewording your sentences, or a source&#39;s sentences, for you.</p></div><div class='card2 ' style='margin-top:1.4cqw'><div class='k'>SUMMARIES</div><p>Help with one hard word or passage, after you read: allowed. A summary that stands in for reading: not allowed, from any tool, Gemini Notebook too.</p></div><p class='small fill'>The test again: could you have written it with every tool closed?</p></div><div class='num'>&middot; 21 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","label":"Folio 6","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Checking versus rewriting</h2><figure class='plate'><div class='pl'><span>PLATE X</span><span>Three kinds of help</span></div><svg class='fig' viewBox='0 0 320 266.5' role='img' aria-label='Three edits of one sentence, a made-up case: Benches have bars, they move people along. 1, a grammar check, allowed: the tool marks a comma splice; you fix it: Benches have bars; they move people along. 2, a note on tone, allowed: the tool says this sounds casual; you decide, and you write the new words yourself. 3, a rewrite, not allowed: your sentence is crossed out and replaced by the tool&#39;s words, Anti-loitering design displaces unhoused residents. Its words, not yours. Source: College Board phase table, revising a paper. Checked September 25, 2026.'><text x='314' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text><text x='6' y='29' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>1 A GRAMMAR CHECK</text><rect x='222' y='18' width='94' height='17' rx='2' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><path d='M227 26.9 L230 29.7 L235 23.3' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='239' y='30.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>ALLOWED</text><text x='6' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='12.5' font-weight='700' fill='#1f3a5a'>Benches have bars, they move people along.</text><path d='M70 54 q3 3 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='126' y='64' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>the tool: comma splice?</text><text x='6' y='80' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>You fix it: Benches have bars; they move people along.</text><path d='M6 92 H314' stroke='#1f3a5a' stroke-width='0.8'/><text x='6' y='109' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>2 A NOTE ON TONE</text><rect x='222' y='98' width='94' height='17' rx='2' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/><path d='M227 106.9 L230 109.7 L235 103.3' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='239' y='110.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>ALLOWED</text><text x='6' y='130' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>the tool: This sounds casual.</text><text x='6' y='146' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>You decide, and you write the new ='M92 221 L98 221' fill='none' stroke='#1f3a5a' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><path d='M95 222.8 L98 221 L95 219.2' fill='none' stroke='#1f3a5a' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='100' y='212.8' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>one member skips credit,</text><text x='100' y='224.8' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>makes up a source, or</text><text x='100' y='236.8' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>breaks the tool rule</text><path d='M212 221 L218 221' fill='none' stroke='#9c3322' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><path d='M215 222.8 L218 221 L215 219.2' fill='none' stroke='#9c3322' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><rect x='220' y='200' width='96' height='42' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><use href='#i-zero' x='222' y='213.5' width='15' height='15' color='#9c3322'/><text x='239' y='212.8' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>the whole team</text><text x='239' y='224.8' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>scores 0 on the</text><text x='239' y='236.8' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>team presentation</text><text x='4' y='256' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Review: the College Board can also ask for your notes and drafts.</text><text x='4' y='274' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>SOURCE AP course descriptions; AP Capstone</text><text x='4' y='285.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Diploma Program Policies; AP Digital</text><text x='4' y='297' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Portfolio Teacher User Guide, Summer 2026.</text><text x='4' y='308.5' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>NOT SURE?</b>Ask me before, not after.</figcaption></figure></div></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What a checkpoint sounds like</h3><p>A checkpoint is a short talk about your work. There are no trick questions.</p><table class='stages'><thead><tr><th style='width:58%'><svg class='ic sm' aria-hidden='true' style='color:inherit'><use href='#i-question'/></svg>I MAY ASK</th><th>YOUR LOG ANSWERS IT</th></tr></thead><tbody><tr><th>Where did you find this source, and how?</th><td>Lines 2 and 3</td></tr><tr><th>What does it argue, in your own words?</th><td>Line 4</td></tr><tr><th>Why did your question change here?</th><td>Your version line</td></tr><tr><th>Which source would you cut, and why?</th><td>Line 6</td></tr><tr><th>What would someone who disagrees say?</th><td>Line 4 of a source that disagrees</td></tr></tbody></table><p class='small fill'>Your log answers most of these before I ask. The six lines: The Research Log, Folio 3. The version line: The Research Log, page 50.</p></div><div class='num'>&middot; 25 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Protect your work: five habits</h3><figure class='plate'><div class='pl'><span>PLATE XIII</span><span>The paper trail</span></div><svg class='fig' viewBox='0 0 320 268' role='img' aria-label='Five habits, each with a sign. Draft in one Google Doc. Its version history shows your writing grow. Keep the log current. Dates show when you found each source. Cite as you go. No source gets lost between notes and draft. Keep notes and drafts. They show the steps, not only the end. Put in only words you wrote. A quote needs credit. Tool words stay out, cited or not. Two version histories, a made-up case. First: many small saves over five weeks, drawn as fifteen small marks along a bar marked week 1 to week 5; your writing grows. Second: one big paste the night before, drawn as one long mark at the end of the bar; nothing shows your work.'><use href='#i-history' x='4' y='4' width='16' height='16' color='#1f3a5a'/><text x='26' y='15' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Draft in one Google Doc.</text><text x='26' y='28' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Its version history shows your writing grow.</text><use href='#i-cal' x='4' y='35' width='16' height='16' color='#1f3a5a'/><text x='26' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Keep the log current.</text><text x='26' y='59' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Dates show when you found each source.</text><use href='#i-quote' x='4' y='66' width='16' height='16' color='#1f3a5a'/><text x='26' y='77' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Cite as you go.</text><text x='26' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>No source gets lost between notes and draft.</text><use href='#i-folder' x='4' y='97' width='16' height='16' color='#1f3a5a'/><text x='26' y='108' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Keep notes and drafts.</text><text x='26' y='121' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>They show the steps, not only the end.</text><use href='#i-pen' x='4' y='128' width='16' height='16' color='#1f3a5a'/><text x='26' y='139' font-family='Cormorant Garamond,Georgia,serif' font-size='11.5' font-weight='700' fill='#1f3a5a'>Put in only words you wrote.</text><text x='26' y='152' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>A quote needs credit. Tool words stay out, cited or not.</text><path d='M4 163 H316' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='4' y='177' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>TWO VERSION HISTORIES</text><text x='316' y='177' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='400' fill='#4a3f31' text-anchor='end'>A made-up case</text><rect x='4' y='185' width='312' height='14' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><rect class='pop' style='transition-delay:0.10s' x='10.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.18s' x='30.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.26s' x='51.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.34s' x='71.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.42s' x='92.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.50s' x='112.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.58s' x='133.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.66s' x='153.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.74s' x='174.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.82s' x='194.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.90s' x='215.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:0.98s' x='235.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:1.06s' x='256.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:1.14s' x='276.5' y='188' width='6' height='8' rx='1' fill='#245e55'/><rect class='pop' style='transition-delay:1.22s' x='297.0' y='188' width='6' height='8' rx='1' fill='#245e55'/><text x='35.2' y='209' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='middle'>week 1</text><text x='97.6' y='209' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='middle'>week 2</text><path d='M66.4 199 V202' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='160' y='209' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='middle'>week 3</text><path d='M128.8 199 V202' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='222.4' y='209' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='middle'>week 4</text><path d='M191.2 199 V202' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='284.8' y='209' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='400' fill='#4a3f31' text-anchor='middle'>week 5</text><path d='M253.6 199 V202' fill='none' stroke='#1f3a5a' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><path d='M4 219.8 L6.7 222.3 L11 216.7' fill='none' stroke='#245e55' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='15' y='223' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#245e55'>Many small saves over five weeks: your writing grows.</text><rect x='4' y='234' width='312' height='14' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><rect class='pop' style='transition-delay:1.40s' x='276' y='236' width='38' height='10' rx='1' fill='#9c3322'/><path d='M4 254 L11 261 M11 254 L4 261' fill='none' stroke='#9c3322' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='15' y='261' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>One big paste the night before: nothing shows your work.</text></svg><figcaption><b>THE RULE</b>Work that is yours is easy to show.</figcaption></figure><p class='small fill' style='margin-top:.6cqw'>Words a tool wrote never go in your final work, cited or not. A tool may draft a citation you check<span class='R'>, or chart data you collected</span>.</p></div><div class='num'>&middot; 26 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"board chapter","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>8</div><div class='ch-title'>Allowed or not?</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-scale'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Judge ten cases, then one of your own, and explain each call.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Allowed or not?</span><span class='ld' aria-hidden='true'></span><span class='pn'>27</span></li><li><span class='it'>Cases 4 to 7</span><span class='ld' aria-hidden='true'></span><span class='pn'>28</span></li><li><span class='it'>Cases 8 to 10</span><span class='ld' aria-hidden='true'></span><span class='pn'>29</span></li><li><span class='it'>Your own case</span><span class='ld' aria-hidden='true'></span><span class='pn'>30</span></li><li><span class='it'>The manual on one page</span><span class='ld' aria-hidden='true'></span><span class='pn'>31</span></li><li><span class='it'>Every sign in this book</span><span class='ld' aria-hidden='true'></span><span class='pn'>32</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-scale'/></svg>FOLIO 8</p><h2>Allowed or not?</h2><p>Decide each case, then tap to check.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 1</div><p>You ask a chatbot for five angles on school start times, pick one, and search the databases yourself.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Allowed. Exploring topics, then your own search.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 2</div><p>You ask a chatbot for five sources and log them without opening them.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. Sources must be read directly, and they may not exist.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 3</div><p>After reading a hard study, you ask whether your summary of its main finding is right.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Allowed. Checking your understanding.</p></div></div><div class='num'>&middot; 27 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Cases 4 to 7</h3><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 4</div><p>You paste in your paragraph and keep the chatbot&#39;s new version.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. It rewrote your words.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 5</div><p>A grammar tool marks a comma error, and you fix it.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Allowed. Checking grammar.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 6</div><p>You ask a tool to summarize an article so you can skip it.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. The summary replaces the reading.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 7</div><p>You ask for search words on bench design, then search Google Scholar.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Allowed. Starting a search.</p></div></div><div class='num'>&middot; 28 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Cases 8 to 10</h3><div class='S'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 8</div><p>Your oral defense is next week. You ask a tool for answers to practice.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. Preparing for the oral defense has no acceptable use.</p></div></div><div class='R'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 8</div><p>You paste your survey results into a tool and ask what they show.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. Your data has no acceptable use: no tool may summarize or explain it.</p></div></div><div class='P'><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 8</div><p>Your oral defense is next week. You ask a tool for answers to practice.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. Preparing for the oral defense has no acceptable use.</p></div></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 9</div><p>You ask a tool to turn your outline into paragraphs.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Not allowed. The writing must be yours.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT \u00b7 CASE 10</div><p>You ask for a counterargument you missed, then find and read a real source that makes it.</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' style='margin-top:.6cqw'>Allowed, because the source you cite is one you found and read.</p></div><p class='small fill'>The pattern: a tool can point you somewhere. The reading, the thinking, and the words are yours.</p></div><div class='num'>&middot; 29 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","label":"Folio 8","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE AI MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h
