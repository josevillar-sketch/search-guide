t='700' fill='#1f3a5a'>WORDS IN THE PAPER</text>\n<rect x='204' y='82' width='48' height='10' rx='0' fill='#245e55'/>\n<rect x='252' y='82' width='24' height='10' rx='0' fill='#f6e4df' stroke='#9c3322' stroke-width='1'/>\n<line x1='12' y1='92' x2='300' y2='92' stroke='#1f3a5a' stroke-width='1.2'/>\n<line x1='12' y1='92' x2='12' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='12' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>0</text>\n<line x1='60' y1='92' x2='60' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='60' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>1,000</text>\n<line x1='108' y1='92' x2='108' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='108' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>2,000</text>\n<line x1='156' y1='92' x2='156' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='156' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>3,000</text>\n<line x1='204' y1='92' x2='204' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='204' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>4,000</text>\n<line x1='252' y1='92' x2='252' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='252' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>5,000</text>\n<line x1='300' y1='92' x2='300' y2='96' stroke='#1f3a5a' stroke-width='1'/>\n<text x='300' y='105' font-family='Space Mono,Courier New,monospace' font-size='8.5' font-weight='400' fill='#4a3f31' text-anchor='middle'>6,000</text>\n<line x1='276' y1='70' x2='276' y2='94' stroke='#9c3322' stroke-width='1.6'/>\n<path d='M279 71 L285 77 M285 71 L279 77' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='318' y='67' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='end'>readers stop at 5,500</text>\n<text x='201' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55' text-anchor='end'>the paper: 4,000 to 5,000</text>\n<text x='264' y='117' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>over the limit</text>\n<text x='4' y='129' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>AP Research course description; 2025 Chief Reader Report.</text>\n<text x='4' y='140' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>Checked September 25, 2026.</text></svg><figcaption><b>TWO TASKS</b>The talk runs 15 to 20 minutes, then three or four questions.</figcaption></figure><ol class='parts' style='display:grid;grid-template-columns:1fr 1fr;column-gap:7cqw;margin-top:.4cqw!important'><li class='rise d1'>Introduction and literature review</li><li class='rise d2'>Method, process, or approach</li><li class='rise d3'>Results, product, or findings</li><li class='rise d4'>Discussion, analysis, or evaluation</li><li class='rise d5'>Conclusion and future directions</li><li class='rise d6'>Bibliography</li></ol></div><div class='num'>&middot; 23 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 8","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-doc'/></svg>FOLIO 8</p><h2>Anatomy of a first page</h2><figure class='plate'><div class='pl'><span>PLATE XXII</span><span>A first page</span></div><div class='mock'><div style='display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:max(9px,2.2cqw);margin:-1cqw 0 .8cqw'><span style='color:#9c3322'>NO NAMES <span class='callout pop d6'>6</span></span><span style='color:#1f3a5a'>A made-up case</span></div><div class='mt'>Later Bells: School Start Times and Ninth Grade Sleep in One District <span class='callout pop d1'>1</span></div><div class='mh'>Introduction and Literature Review <span class='callout pop d2'>2</span></div><div class='ml s'></div><div class='mc'>... sleep loss worsens memory (Author, 2021). <span class='callout pop d3'>3</span></div><div class='ml'></div><div class='mg'>Studies of later starts report averages; none compares bus riders with students driven. <span class='callout pop d4'>4</span></div><div class='mh'>Method <span class='callout pop d5'>5</span></div><div class='ml s'></div></div><figcaption><b>1</b>keywords, colon, subtitle <b>2</b>headings name the parts <b>3</b>a citation for every borrowed idea <b>4</b>the gap sentence ends the review <b>5</b>the method, defended, with its ethics steps <b>6</b>no name, school, teacher, or adviser</figcaption></figure><p class='small' style='margin:0'><b>Before you submit:</b> &quot;remove any references to your name, school, and teacher&quot; (AP Research course description).</p></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 8","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-doc'/></svg>FOLIO 8</p><h2>The five scores</h2><p>Readers give one overall score from 1 to 5. The step from 2 to 3 is the step from reporting to arguing.</p><figure class='plate'><div class='pl'><span>PLATE XXIII</span><span>The score ladder</span></div><svg class='fig' viewBox='0 0 320 220' role='img' aria-label='A score ladder from 1 at the bottom to 5 at the top. 1: Report on Existing Knowledge. 2: Report on Existing Knowledge with Simplistic Use of a Research Method. Between 2 and 3, an arrow: from reporting to arguing. 3: Ineffectual Argument for a New Understanding. 4: Well-Supported, Articulate Argument Conveying a New Understanding. 5: Rich Analysis of a New Understanding Addressing a Gap in the Research Base. What moves a paper up. To 3: a new understanding and a reasonably replicable method. To 4: it explains how the topic addresses a gap, and it defends the method. To 5: it explains the limits and the implications for the community of practice. Titles: 2026 AP Research Academic Paper scoring guidelines. One score for the whole paper. Read AND and OR in each row. Checked September 25, 2026.'><rect x='22' y='4' width='296' height='30' rx='3' fill='#16294a'/>\n<circle cx='11' cy='19' r='8' fill='#9c3322'/><text x='11' y='22.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>5</text>\n<text x='30' y='17' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#e8c878'>Rich Analysis of a New Understanding</text>\n<text x='30' y='29.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#e8c878'>Addressing a Gap in the Research Base</text>\n<rect x='36' y='38' width='282' height='30' rx='3' fill='#1f3a5a'/>\n<circle cx='25' cy='53' r='8' fill='#9c3322'/><text x='25' y='56.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4</text>\n<text x='44' y='51' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#f3e3bd'>Well-Supported, Articulate Argument</text>\n<text x='44' y='63.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#f3e3bd'>Conveying a New Understanding</text>\n<rect x='50' y='72' width='268' height='30' rx='3' fill='#1f
