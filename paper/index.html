v class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'><svg aria-hidden='true' style='width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.55em;color:#d6ad55'><use href='#i-question'/></svg>FOLIO</div><div class='ch-num'>1</div><div class='ch-title'>The question</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='kt ic poster' viewBox='0 0 240 42' role='img' aria-label='A question mark drops onto the end of the sentence'><text x='102' y='30' font-family='Fraunces,Georgia,serif' font-size='12' font-weight='700' fill='#e8c878' text-anchor='middle'>WHAT DO YOU WANT TO KNOW</text><text class='ki' style='--y:-40;--s:1.8;transition-delay:1.0s;animation-delay:1.0s' x='214' y='30' font-family='Fraunces,Georgia,serif' font-size='22' font-weight='700' fill='#e8c878' text-anchor='middle'>?</text></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Turn a topic into a question that your evidence can answer, and say why it matters.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>From topic to question</span><span class='ld' aria-hidden='true'></span><span class='pn'>3</span></li><li><span class='it'>The question sentence</span><span class='ld' aria-hidden='true'></span><span class='pn'>4</span></li><li><span class='it'>Research is a loop</span><span class='ld' aria-hidden='true'></span><span class='pn'>5</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 1","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-question'/></svg>FOLIO 1</p><h2>From topic to question</h2><p>A topic is a subject. A paper needs a question that ends in a question mark and that your evidence can answer.</p><figure class='plate'><div class='pl'><span>PLATE I</span><span>Five stages</span></div><svg class='fig' viewBox='0 0 320 193' role='img' aria-label='Five stages, read down; each stage narrows the one above. Stage I, topic, what interests you: adolescent sleep. Stage II, problem, what does not make sense: students report short sleep. Stage III, gap, what scholars leave open: studies report average gains, not who gains. Stage IV, question, what your evidence answers: who gains sleep from a later start, bus riders or students driven? Stage V, significance, what readers gain: the board can plan buses, not only bells. A made-up case.'><rect x='225.6' y='0' width='92.4' height='13' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='0.9'/><text x='229.6' y='9.6' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>A made-up case</text>\n<rect x='2' y='17' width='150' height='30' rx='3' fill='#1f3a5a'/>\n<rect x='2' y='17' width='24' height='30' rx='3' fill='#16294a'/>\n<text x='14' y='36' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>I</text>\n<text x='31' y='29.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd'>TOPIC</text>\n<text x='31' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' font-style='italic'>what interests you</text>\n<text x='160' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Adolescent sleep</text>\n<path d='M77 47.5 L77 52.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M75.5 49.9 L77 52.5 L78.5 49.9' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='2' y='53' width='150' height='30' rx='3' fill='#1f3a5a'/>\n<rect x='2' y='53' width='24' height='30' rx='3' fill='#16294a'/>\n<text x='14' y='72' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>II</text>\n<text x='31' y='65.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd'>PROBLEM</text>\n<text x='31' y='78' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' font-style='italic'>what does not make sense</text>\n<text x='160' y='72' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Students report short sleep</text>\n<path d='M77 83.5 L77 88.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M75.5 85.9 L77 88.5 L78.5 85.9' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='2' y='89' width='150' height='30' rx='3' fill='#1f3a5a'/>\n<rect x='2' y='89' width='24' height='30' rx='3' fill='#16294a'/>\n<text x='14' y='108' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>III</text>\n<text x='31' y='101.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd'>GAP</text>\n<text x='31' y='114' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' font-style='italic'>what scholars leave open</text>\n<text x='160' y='101.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Studies report average gains,</text>\n<text x='160' y='114.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>not who gains</text>\n<path d='M77 119.5 L77 124.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M75.5 121.9 L77 124.5 L78.5 121.9' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='2' y='125' width='150' height='30' rx='3' fill='#1f3a5a'/>\n<rect x='2' y='125' width='24' height='30' rx='3' fill='#16294a'/>\n<text x='14' y='144' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>IV</text>\n<text x='31' y='137.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd'>QUESTION</text>\n<text x='31' y='150' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' font-style='italic'>what your evidence answers</text>\n<text x='160' y='137.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>Who gains sleep from a later start:</text>\n<text x='160' y='150.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>bus riders or students driven?</text>\n<path d='M77 155.5 L77 160.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M75.5 157.9 L77 160.5 L78.5 157.9' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='2' y='161' width='150' height='30' rx='3' fill='#16294a'/>\n<rect x='2' y='161' width='24' height='30' rx='3' fill='#0f1d36'/>\n<text x='14' y='180' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>V</text>\n<text x='31' y='173.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878'>SIGNIFICANCE</text>\n<text x='31' y='186' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' font-style='italic'>what readers gain</text>\n<text x='160' y='173.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>The board can plan buses,</text>\n<text x='160' y='186.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>not only bells</text></svg><figcaption><b>READ DOWN</b>Each stage narrows the one above.</figcaption></figure></div><div class='num'>&middot; 3 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 1","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-question'/></svg>FOLIO 1</p><h2>The question sentence</h2><div class='nb'><div><span class='callout' aria-hidden='true' style='margin-right:1.6cqw;vertical-align:.5cqw'>1</span>I am studying <b>school start times</b></div><div><span class='callout' aria-hidden='true' style='margin-right:1.6cqw;vertical-align:.5cqw'>2</span>because I want to find out <b>whether a later start changes sleep</b></div><div><span class='callout' aria-hidden='true' style='margin-right:1.6cqw;vertical-align:.5cqw'>3</span>so that readers understand <b>what the change costs and gains</b>.</div></div><figure class='plate'><div class='pl'><span>PLATE II</span><span>Narrow it</span></div><svg class='fig' viewBox='0 0 320 132' role='img' aria-label='A mind map narrows school start times four ways. Who: ninth graders. Where: one district. When: the year before and after the change. What: minutes of sleep. Scores 4 and 5 ask for clear and narrow parameters (2026 scoring guidelines, checked September 25, 2026). A made-up case.'><ellipse cx='160' cy='67' rx='62' ry='17' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/>\n<text x='160' y='71.5' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a' text-anchor='middle'>school start times</text>\n<path d='M112 57 Q 94 36 80 30' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M208 57 Q 226 36 240 30' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M112 77 Q 96 94 84 98' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M208 77 Q 224 94 236 98' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='52' y='13' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>WHO</text>\n<text x='52' y='28' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a' text-anchor='middle'>ninth graders</text>\n<text x='268' y='13' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>WHERE</text>\n<text x='268' y='28' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a' text-anchor='middle'>one district</text>\n<text x='58' y='101' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>WHEN</text>\n<text x='58' y='115' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a' text-anchor='middle'>the year before</text>\n<text x='58' y='128' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a' text-anchor='middle'>and after the change</text>\n<text x='262' y='101' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>WHAT</text>\n<text x='262' y='115' font-family='Patrick Hand,cursive' font-size='12.5' font-weight='400' fill='#1f2a5a' text-anchor='middle'>minutes of sleep</text>\n<text x='160' y='9' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>Scores 4 and 5 ask for</text>\n<text x='160' y='19.5' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>clear and narrow parameters</text>\n<text x='160' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>(2026 scoring guidelines,</text>\n<text x='160' y='40.5' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='middle'>checked September 25, 2026)</text>\n<rect x='118' y='114' width='92.4' height='13' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='0.9'/><text x='122' y='123.6' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a'>A made-up case</text></svg><figcaption><b>SCOPE</b><span class='callout'>1</span>topic <span class='callout'>2</span>question <span class='callout'>3</span>why it matters to readers. Sentence formula after Booth, Colomb, and Williams.</figcaption></figure></div><div class='num'>&middot; 4 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 1","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-question'/></svg>FOLIO 1</p><h2>Research is a loop</h2><p>Research runs in a loop, not a line. Most good questions change at least once.</p><figure class='plate'><div class='pl'><span>PLATE III</span><span>The research cycle</span></div><svg class='fig' viewBox='0 0 320 211' role='img' aria-label='A cycle of six steps: question, what you ask; search, databases and log; read, synthesize; method, fit to question; evidence, what you found; claim, what you argue; then back to revise the question. One arrow leaves the cycle to write: the loop stops. The paper states one question, early, and keeps it. Source: 2025 Chief Reader Report. Checked September 25, 2026.'><circle cx='116' cy='102' r='76' fill='none' stroke='#b9a987' stroke-width='0.8'/>\n<path d='M72.4 39.7 A 76 76 0 0 0 67.1 43.8' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M68.9 39.1 L67.1 43.8 L72.1 42.9' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M42.6 82.3 A 76 76 0 0 0 41.9 119.1' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M38.5 115.4 L41.9 119.1 L43.4 114.3' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M65.1 158.5 A 76 76 0 0 0 70.3 162.7' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M65.3 162.1 L70.3 162.7 L68.3 158.1' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M159.6 164.3 A 76 76 0 0 0 164.9 160.2' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M163.1 164.9 L164.9 160.2 L159.9 161.1' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M189.4 121.7 A 76 76 0 0 0 190.1 84.9' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M193.5 88.6 L190.1 84.9 L188.6 89.7' fill='none' stroke='#1f3a5a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M166.9 45.5 A 76 76 0 0 0 161.7 41.3' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M166.7 41.9 L161.7 41.3 L163.7 45.9' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='76' y='11' width='80' height='30' rx='15' fill='#16294a' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='116' y='24' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>QUESTION</text>\n<text x='116' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#f3e3bd' text-anchor='middle'>what you ask</text>\n<rect x='10.2' y='49' width='80' height='30' rx='15' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='50.2' y='62' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SEARCH</text>\n<text x='50.2' y='74' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>databases, log</text>\n<rect x='10.2' y='125' width='80' height='30' rx='15' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='50.2' y='138' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>READ</text>\n<text x='50.2' y='150' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>synthesize</text>\n<rect x='76' y='163' width='80' height='30' rx='15' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='116' y='176' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>METHOD</text>\n<text x='116' y='188' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>fit to question</text>\n<rect x='141.8' y='125' width='80' height='30' rx='15' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='181.8' y='138' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>EVIDENCE</text>\n<text x='181.8' y='150' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>what you found</text>\n<rect x='141.8' y='49' width='80' height='30' rx='15' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='181.8' y='62' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>CLAIM</text>\n<text x='181.8' y='74' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='middle'>what you argue</text>\n<text x='116' y='99' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle'>revise the</text>\n<text x='116' y='114' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle'>question</text>\n<path d='M221.8 60 h8 v-5 l9 9 l-9 9 v-5 h-8 z' fill='#245e55'/>\n<rect x='234' y='30' width='84' height='104' rx='3' fill='#16294a'/>\n<text x='276' y='47' font-family='Space Mono,Courier New,monospace' font-size='11' font-weight='700' fill='#e8c878' text-anchor='middle'>WRITE</text>\n<text x='276' y='65' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>The loop stops.</text>\n<text x='276' y='78.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>The paper states</text>\n<text x='276' y='92' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>one question,</text>\n<text x='276' y='105.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>early, and</text>\n<text x='276' y='119' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>keeps it.</text>\n<text x='4' y='207' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>2025 Chief Reader Report. Checked September 25, 2026.</text></svg><figcaption><b>GO AROUND</b>When the evidence changes your question, write the new version and the date in your log.</figcaption></figure></div><div class='num'>&middot; 5 &middot;</div><div class='shade'></div>"},{"cls": Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>ORAL VOICE</text>\n<text x='278' y='31' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>TIME</text>\n<text x='20' y='54' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>Critic A</text>\n<text x='118' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>dead from start</text>\n<text x='198' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle'>silent</text>\n<text x='278' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>circular</text>\n<line x1='16' y1='64' x2='316' y2='64' stroke='#b9a987' stroke-width='0.8'/>\n<text x='20' y='82' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>Critic B</text>\n<text x='118' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>dies midway</text>\n<text x='198' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>central</text>\n<text x='278' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#9c3322' text-anchor='middle'>silent</text>\n<line x1='16' y1='92' x2='316' y2='92' stroke='#b9a987' stroke-width='0.8'/>\n<text x='20' y='110' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>Critic C</text>\n<text x='118' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>dead from start</text>\n<text x='198' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>central</text>\n<text x='278' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31' text-anchor='middle'>broken</text>\n<line x1='16' y1='120' x2='316' y2='120' stroke='#b9a987' stroke-width='0.8'/>\n<rect x='14' y='40' width='304' height='24' rx='3' fill='none' stroke='#9c3322' stroke-width='1.5'/>\n<circle cx='7' cy='52' r='7' fill='#9c3322'/><text x='7' y='55.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text>\n<rect x='78' y='16' width='80' height='106' rx='3' fill='none' stroke='#245e55' stroke-width='1.8'/>\n<circle cx='118' cy='12' r='7' fill='#9c3322'/><text x='118' y='15.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text>\n<circle cx='7' cy='136' r='7' fill='#9c3322'/><text x='7' y='139.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1</text>\n<path d='M21 131 L29 139 M29 131 L21 139' fill='none' stroke='#9c3322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='35' y='140' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>ACROSS A ROW: author by author</text>\n<text x='35' y='155' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='600' fill='#4a3f31'>A says... B says... C says...: a list, not a synthesis.</text>\n<circle cx='7' cy='172' r='7' fill='#9c3322'/><text x='7' y='175.4' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2</text>\n<path d='M21 171.4 L24 174.2 L29 167.8' fill='none' stroke='#245e55' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='35' y='176' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245 d,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>how often</text>\n<text x='223.5' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>it happens</text>\n<line x1='194.5' y1='48' x2='252.5' y2='48' stroke='#9c3322' stroke-width='1.6' stroke-dasharray='4 3'/>\n<rect x='194.5' y='53' width='58' height='47' rx='2' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/>\n<text x='223.5' y='67' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>what an</text>\n<text x='223.5' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>experience</text>\n<text x='223.5' y='93' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>is like</text>\n<text x='223.5' y='115' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Interviews</text>\n<text x='287' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>what the</text>\n<text x='287' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>author meant</text>\n<line x1='258' y1='48' x2='316' y2='48' stroke='#9c3322' stroke-width='1.6' stroke-dasharray='4 3'/>\n<rect x='258' y='53' width='58' height='47' rx='2' fill='#e7f0ec' stroke='#245e55' stroke-width='1.2'/>\n<text x='287' y='67' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>a reading</text>\n<text x='287' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>others</text>\n<text x='287' y='93' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>can test</text>\n<text x='287' y='115' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Close</text>\n<text x='287' y='127' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>reading</text></svg><figcaption><b>CEILING</b>Write your claim under the line for your method.</figcaption></figure><div class='box'><svg class='ic sm' aria-hidden='true'><use href='#i-shield'/></svg><b>Approval first.</b> Your teacher reviews every study with people before you collect data. More than minimal risk: no approval (AP Research course description).</div></div><div class='num'>&middot; 9 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","label":"Folio 4","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'><svg aria-hidden='true' style='width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.55em;color:#d6ad55'><use href='#i-bubble'/></svg>FOLIO</div><div class='ch-num'>4</div><div class='ch-title'>The argument</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='kt ic poster' viewBox='0 0 240 42' role='img' aria-label='Claim, reason, and evidence drop into place'><text class='ki' style='--y:-40;transition-delay:0.6s;animation-delay:0.6s' x='38' y='30' font-family='Fraunces,Georgia,serif' font-size='13' font-weight='700' fill='#e8c878' text-anchor='middle'>REASON</text><text class='ki' style='--y:-40;transition-delay:0.2s;animation-delay:0.2s' x='120' y='30' font-family='Fraunces,Georgia,serif' font-size='20' font-weight='700' fill='#e8c878' text-anchor='middle'>CLAIM</text><text class='ki' style='--y:-40;transition-delay:1.0s;animation-delay:1.0s' x='204' y='30' font-family='Fraunces,Georgia,serif' font-size='13' font-weight='700' fill='#e8c878' text-anchor='middle'>EVIDENCE</text></svg><div class='ch-target'><div class='k'>BY THE END</div><p>State a claim a reader could dispute, support it, and answer the strongest objection.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>A claim someone could dispute</span><span class='ld' aria-hidden='true'></span><span class='pn'>10</span></li><li><span class='it'>The parts of an argument</span><span class='ld' aria-hidden='true'></span><span class='pn'>11</span></li><li><span class='it'>Anatomy of a paragraph</span><span class='ld' aria-hidden='true'></span><span class='pn'>12</span></li><li><span class='it'>The shape of the paper</span><span class='ld' aria-hidden='true'></span><span class='pn'>13</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 4","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bubble'/></svg>FOLIO 4</p><h2>A claim someone could dispute</h2><p>A thesis is a claim your paper argues, not a fact.</p><div class='case'><p><b>Descriptive:</b> This paper examines sleep and school start times.</p><span class='stamp no pop d1'>NOT YET</span></div><div class='case'><p><b>Analytical:</b> Later starts may lengthen sleep by shifting bedtimes.</p><span class='stamp no pop d2'>CLOSER</span></div><div class='case'><p><b>Arguable:</b> In this district, the later start adds sleep only for students who ride the bus.</p><span class='stamp yes pop d3'>READY</span></div><div class='box' style='margin-top:1.4cqw'><svg class='ic sm' aria-hidden='true'><use href='#i-question'/></svg><b>The so-what test.</b> Ask &quot;So what?&quot; No answer? Tie your thesis to a question the field cares about.</div><p class='small fill'>The examples are invented.</p></div><div class='num'>&middot; 10 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 4","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bubble'/></svg>FOLIO 4</p><h2>The parts of an argument</h2><p>Do not skip the warrant: why the evidence supports the claim.</p><figure class='plate'><div class='pl'><span>PLATE VIII</span><span>The Toulmin model</span></div><svg class='fig' viewBox='0 0 320 138' role='img' aria-label='The Toulmin model, six parts. Grounds, the evidence, lead by an arrow to the claim, your thesis. On the arrow, a qualifier: largely. Under the arrow, the warrant: why the evidence supports the claim. Beside the warrant, backing: support for the warrant. Under the claim, the rebuttal, in three moves: 1 name it, 2 grant it, 3 answer it. After Stephen Toulmin, The Uses of Argument, 1958.'><rect x='4' y='30' width='92' height='40' rx='3' fill='#e7f0ec' stroke='#245e55' stroke-width='1.5'/>\n<text x='50' y='46' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55' text-anchor='middle'>GROUNDS</text>\n<text x='50' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>the evidence</text>\n<path d='M96 50 L222 50' fill='none' stroke='#1f3a5a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M216.8 53 L222 50 L216.8 47' fill='none' stroke='#1f3a5a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='94' y='5' width='132' height='21' rx='10.5' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1'/>\n<text x='160' y='19' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>QUALIFIER: largely</text>\n<rect x='224' y='30' width='92' height='40' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.8'/>\n<text x='270' y='46' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>CLAIM</text>\n<text x='270' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31' text-anchor='middle'>your thesis</text>\n<line x1='170' y1='50' x2='170' y2='78' stroke='#1f3a5a' stroke-width='1.1'/>\n<rect x='108' y='78' width='124' height='44' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.3'/>\n<text x='170' y='92' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>WARRANT</text>\n<text x='170' y='105' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>why the evidence</text>\n<text x='170' y='117' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>supports the claim</text>\n<line x1='102' y1='100' x2='108' y2='100' stroke='#1f3a5a' stroke-width='1.1'/>\n<rect x='4' y='78' width='98' height='44' rx='3' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.1'/>\n<text x='53' y='92' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>BACKING</text>\n<text x='53' y='105' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>support for</text>\n<text x='53' y='117' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>the warrant</text>\n<line x1='277' y1='70' x2='277' y2='78' stroke='#9c3322' stroke-width='1.1'/>\n<rect x='238' y='78' width='78' height='48' rx='3' fill='#fbf6ea' stroke='#9c3322' stroke-width='1.4'/>\n<text x='277' y='90' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>REBUTTAL</text>\n<text x='246' y='102' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>1</text>\n<text x='256' y='102' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>name it</text>\n<text x='246' y='113' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>2</text>\n<text x='256' y='113' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>grant it</text>\n<text x='246' y='124' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>3</text>\n<text x='256' y='124' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31'>answer it</text>\n<text x='4' y='134' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>After Stephen Toulmin, The Uses of Argument, 1958.</text></svg><figcaption><b>SIX PARTS</b>Find each part in your own draft.</figcaption></figure><ol><li>Give <b>reasons</b>, then <b>evidence</b> a reader can check.</li><li>Name the strongest <b>objection</b>, grant what is true, then answer it.</li></ol></div><div class='num'>&middot; 11 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 4","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bubble'/></svg>FOLIO 4</p><h2>Anatomy of a paragraph</h2><figure class='plate'><div class='pl'><span>PLATE IX</span><span>A body paragraph</span></div><div class='anno'><div class='seg rise d1' style='--c:#1f3a5a'><i>M</i>The later start helped only students who ride the bus.</div><div class='seg rise d2' style='--c:#245e55'><i>E</i>Bus riders gained 38 minutes of sleep; students driven gained 4 (Table 2).</div><div class='seg rise d3' style='--c:#9c3322'><i>A</i>The bus pickup moves with the bell; a parent&#39;s work hours do not.</div><div class='seg rise d4' style='--c:#4a3f31'><i>L</i><span style='font-family:var(--hand);color:#1f2a5a'>______________</span> You write the link to your thesis.</div><span style='position:absolute;right:2cqw;bottom:1.4cqw;font-family:var(--mono);font-weight:700;font-size:max(9px,2.2cqw);color:#1f3a5a;border:1px solid #1f3a5a;border-radius:2px;padding:0 .8cqw;background:#fbf6ea;transform:rotate(.4deg)'>A made-up case</span></div><svg class='fig' viewBox='0 0 320 27' role='img' aria-label='Two bars: the analysis bar is at least as long as the evidence bar.'><text x='0' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>EVIDENCE</text>\n<rect x='64' y='2' width='80' height='9' rx='1' fill='#245e55'/>\n<text x='0' y='24' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>ANALYSIS</text>\n<rect x='64' y='16' width='140' height='9' rx='1' fill='#9c3322'/>\n<text x='212' y='24' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>at least as long</text></svg><figcaption><b>M E A L</b>Main idea, Evidence, Analysis, Link. You write the L.</figcaption></figure><p class='small fill'>A paragraph without the A is a summary. A paragraph without the L floats free of the thesis.</p></div><div class='num'>&middot; 12 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 4","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-bubble'/></svg>FOLIO 4</p><h2>The shape of the paper</h2><figure class='plate'><div class='pl'><span>PLATE X</span><span>The hourglass</span></div><svg class='fig' viewBox='0 0 320 213' role='img' aria-label='An hourglass of the six parts. Introduction and literature review: wide to narrow, field, gap, question. Method, process, or approach: how you made the evidence. Results, product, or findings: what you found. These two form the narrow middle. Discussion, analysis, or evaluation: narrow to wide, what it means. Conclusion and future directions, the widest band: limits, implications, next studies. Bibliography, the base: every source cited and consulted. Parts: AP Research course description. Checked September 25, 2026.'><polygon points='2,2 318,2 260,36 60,36' fill='#1f3a5a'/>\n<text x='160' y='15' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>INTRODUCTION AND LITERATURE REVIEW</text>\n<text x='160' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#f3e3bd' text-anchor='middle' font-style='italic'>wide to narrow: field, gap, question</text>\n<rect x='60' y='40' width='200' height='29' rx='0' fill='#245e55'/>\n<text x='160' y='52' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>METHOD, PROCESS, OR APPROACH</text>\n<text x='160' y='65' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#f3e3bd' text-anchor='middle' font-style='italic'>how you made the evidence</text>\n<rect x='60' y='72' width='200' height='29' rx='0' fill='#245e55'/>\n<text x='160' y='84' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>RESULTS, PRODUCT, OR FINDINGS</text>\n<text x='160' y='97' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#f3e3bd' text-anchor='middle' font-style='italic'>what you found</text>\n<polygon points='60,108 260,108 310,142 10,142' fill='#1f3a5a'/>\n<text x='160' y='122' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#f3e3bd' text-anchor='middle'>DISCUSSION, ANALYSIS, OR EVALUATION</text>\n<text x='160' y='136' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#f3e3bd' text-anchor='middle' font-style='italic'>narrow to wide: what it means</text>\n<rect x='2' y='146' width='316' height='30' rx='0' fill='#16294a'/>\n<text x='160' y='158' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878' text-anchor='middle'>CONCLUSION AND FUTURE DIRECTIONS</text>\n<text x='160' y='172' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#f3e3bd' text-anchor='middle' font-style='italic'>widest: limits, implications, next studies</text>\n<rect x='2' y='180' width='316' height='17' rx='0' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.2'/>\n<text x='160' y='192' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>BIBLIOGRAPHY: every source cited and consulted</text>\n<text x='4' y='209' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>Parts: AP Research course description. Checked September 25, 2026.</text></svg><figcaption><b>SHAPE</b>Narrow to your question, then widen. Humanities papers follow the claim, not fixed headings, but keep this shape.</figcaption></figure></div><div class='num'>&middot; 13 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","label":"Folio 5","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'><svg aria-hidden='true' style='width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.55em;color:#d6ad55'><use href='#i-chart'/></svg>FOLIO</div><div class='ch-num'>5</div><div class='ch-title'>Results and discussion</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='kt ic poster' viewBox='0 0 240 42' AD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-chart'/></svg>FOLIO 5</p><h2>The calibration chain</h2><p>The verb is the last link in a chain that starts with your method.</p><figure class='plate'><div class='pl'><span>PLATE XIII</span><span>Evidence to verb</span></div><svg class='fig' viewBox='0 0 320 208' role='img' aria-label='Evidence to verb, in three rows. One interview or one letter carries one case and earns suggests. Several sources that agree carry a consistent pattern and earn indicates. Direct or repeated evidence carries a finding and earns shows. The verb shapes grow and fill as the evidence gets stronger: an outline, then a tint, then solid. An arrow: stronger evidence earns a stronger verb. Correlation never earns causes. Source: 2025 Chief Reader Report. Checked September 25, 2026.'><text x='4' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>EVIDENCE YOU HAVE</text>\n<text x='122' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>IT CAN CARRY</text>\n<text x='242' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31'>YOUR VERB</text>\n<rect x='4' y='22' width='104' height='34' rx='2' fill='#fffdf6' stroke='#4a3f31' stroke-width='1'/>\n<text x='10' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31'>One interview,</text>\n<text x='10' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#4a3f31'>one letter</text>\n<path d='M109 39 L119 39' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/><path d='M116 40.8 L119 39 L116 37.2' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/>\n<rect x='122' y='22' width='106' height='34' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/>\n< 322' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='22' y='189' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>Correlation never earns causes.</text>\n<text x='4' y='204' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='600' fill='#4a3f31'>Source: 2025 Chief Reader Report. Checked September 25, 2026.</text></svg><figcaption><b>CHECK</b>The 2025 Chief Reader Report flags claims larger than the data.</figcaption></figure></div><div class='num'>&middot; 16 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","label":"Folio 6","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'><svg aria-hidden='true' style='width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.55em;color:#d6ad55'><use href='#i-search'/></svg>FOLIO</div><div class='ch-num'>6</div><div class='ch-title'>Sources and citation</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='kt ic poster' viewBox='0 0 240 42' role='img' aria-label='Open every source'><text class='ki' style='--x:40;transition-delay:0.2s;animation-delay:0.2s' x='48' y='30' font-family='Fraunces,Georgia,serif' font-size='18' font-weight='700' fill='#e8c878' text-anchor='middle'>OPEN</text><text class='ki' style='--y:-30;transition-delay:0.5s;animation-delay:0.5s' x='120' y='30' font-family='Fraunces,Georgia,serif' font-size='18' font-weight='700' fill='#e8c878' text-anchor='middle'>EVERY</text><text class='ki' style='--x:-40;transition-delay:0.8s;animation-delay:0.8s' x='196' y='30' font-family='Fraunces,Georgia,serif' font-size='18' font-weight='700' fill='#e8c878' text-anchor='middle'>SOURCE</text></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Search like a librarian, judge a source by what others say about it, and credit it exactly.</p></div>  1 260 16.4Z' fill='#245e55'/><circle cx='250' cy='36' r='22' fill='none' stroke='#1d1812' stroke-width='1.2'/><circle cx='270' cy='36' r='22' fill='none' stroke='#1d1812' stroke-width='1.2'/><text x='260' y='76' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1d1812' text-anchor='middle'>NOT cuts</text></svg><figcaption><b>JOIN</b>Put synonyms inside OR, then join ideas with AND. Use NOT last: it drops good records too.</figcaption></figure><div class='nb'><div>sleep AND (\"start time\" OR \"school schedule\")</div><div>adolescen* finds adolescent, adolescents, adolescence</div></div><svg class='fig' viewBox='0 0 320 62' role='img' aria-label='Chain citations. One strong source sits on a time line that runs from older to newer. Its bibliography points back to older sources. Its Cited by list points forward to newer sources.' style='width:94%;margin:1cqw auto .4cqw'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>CHAIN CITATIONS</text>\n<rect x='118' y='15' width='84' height='29' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.4'/>\n<text x='160' y='27' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>ONE STRONG</text>\n<text x='160' y='39' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SOURCE</text>\n<rect x='12' y='18' width='28' height='18' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<rect x='280' y='18' width='28' height='18' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<rect x='18' y='22.2' width='28' height='18' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<rect x='274' y='22.2' width='28' height='18' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/>\n<path d='M116 29.5 L50 29.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M53.9 27.2 L50 29.5 L53.9 31.8' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<path d='M204 29.5 L270 29.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M266.1 31.8 L270 29.5 L266.1 27.2' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='83' y='24.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>its bibliography</text>\n<text x='83' y='41' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>points back</text>\n<text x='237' y='24.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>its Cited by list</text>\n<text x='237' y='41' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='middle'>points forward</text>\n<path d='M8 48 L312 48' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/><path d='M308.5 50 L312 48 L308.5 46' fill='none' stroke='#1f3a5a' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/>\n<text x='8' y='58.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>OLDER</text>\n<text x='160' y='58.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>TIME</text>\n<text x='304' y='58.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>NEWER</text></svg></div><div class='num'>&middot; 17 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 6","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-search'/></svg>FOLIO 6</p><h2>Judge, then quote</h2><figure class='plate'><div class='pl'><span>PLATE XV</span><span>The four moves</span></div><div class='fourm' role='group' aria-label='Four moves, in order: stop, investigate, find, trace.'><div class='pop d1'><svg class='ic' aria-hidden='true'><use href='#i-question'/></svg><b>STOP</b><span>Do you know this source?</span></div><div class='pop d2'><svg class='ic' aria-hidden='true'><use href='#i-search'/></svg><b>INVESTIGATE</b><span>Who made it, and why?</span></div><div class='pop d3'><svg class='ic' aria-hidden='true'><use href='#i-search'/></svg><b>FIND</b><span>What do better sources say?</span></div><div class='pop d4'><svg class='ic' aria-hidden='true'><use href='#i-box'/></svg><b>TRACE</b><span>Go to the original.</span></div></div><figcaption><b>LATERAL</b>Moves after Mike Caulfield. The Research Log, Folio 7, uses Stop, Leave, Search, Decide.</figcaption></figure><div class='sand'><div class='rise d2'><b>INTRODUCE</b> Mike Caulfield observes that fact checkers</div><div class='rise d3 q'><b>QUOTE</b> \"open up many tabs in their browser\"</div><div class='rise d4'><b>EXPLAIN</b> They judge a site by what other sites say about it.</div></div><p class='small' style='margin:0'>Quote: Mike Caulfield, Web Literacy for Student Fact-Checkers, 2017. Checked September 25, 2026.</p></div><div class='num'>&middot; 18 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 6","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-search'/></svg>FOLIO 6</p><h2>Anatomy of a citation</h2><figure class='plate'><div class='pl'><span>PLATE XVI</span><span>Three styles</span></div><svg class='fig' viewBox='0 0 320 177' role='img' aria-label='Five parts of a citation, each with a number: 1 author, 2 date, 3 title, 4 container, 5 volume and pages. Modern Language Association 9 puts them in the order 1, 3, 4, 5, 2, 5; in text: (Howard 790). American Psychological Association 7: 1, 2, 3, 4, 5; in text: (Howard, 1995). Chicago 18, notes and bibliography: 1, 3, 4, 5, 2, 5; in text: a numbered footnote. Example source: Rebecca Moore Howard, College English, 1995.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>FIVE PARTS, EACH WITH A NUMBER</text>\n<rect x='2' y='17' width='18' height='16' rx='2' fill='#16294a'/><text x='11' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#f3e3bd' text-anchor='middle'>1</text>\n<text x='24' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>author</text>\n<rect x='58' y='17' width='18' height='16' rx='2' fill='#9c3322'/><text x='67' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>2</text>\n<text x='80' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>date</text>\n<rect x='106' y='17' width='18' height='16' rx='2' fill='#245e55'/><text x='115' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<text x='128' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>title</text>\n<rect x='152' y='17' width='18' height='16' rx='2' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2'/><text x='161' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>4</text>\n<text x='174' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>container</text>\n<rect x='226' y='17' width='18' height='16' rx='2' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.2'/><text x='235' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>5</text>\n<text x='248' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>volume, pages</text>\n<text x='4' y='52' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>MODERN LANGUAGE ASSOCIATION 9</text>\n<rect x='4' y='58' width='24' height='18' rx='2' fill='#16294a'/><text x='16' y='70.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#f3e3bd' text-anchor='middle'>1</text>\n<rect x='31' y='58' width='24' height='18' rx='2' fill='#245e55'/><text x='43' y='70.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<rect x='58' y='58' width='24' height='18' rx='2' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2'/><text x='70' y='70.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>4</text>\n<rect x='85' y='58' width='24' height='18' rx='2' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.2'/><text x='97' y='70.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>5</text>\n<rect x='112' y='58' width='24' height='18' rx='2' fill='#9c3322'/><text x='124' y='70.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>2</text>\n<rect x='139' y='58' width='24' height='18' rx='2' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.2'/><text x='151' y='70.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>5</text>\n<text x='172' y='67' font-family='Cormorant Garamond,Georgia,serif' font- ' y='138' width='24' height='18' rx='2' fill='#16294a'/><text x='16' y='150.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#f3e3bd' text-anchor='middle'>1</text>\n<rect x='31' y='138' width='24' height='18' rx='2' fill='#245e55'/><text x='43' y='150.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>3</text>\n<rect x='58' y='138' width='24' height='18' rx='2' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2'/><text x='70' y='150.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>4</text>\n<rect x='85' y='138' width='24' height='18' rx='2' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.2'/><text x='97' y='150.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>5</text>\n<rect x='112' y='138' width='24' height='18' rx='2' fill='#9c3322'/><text x='124' y='150.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#fbf6ea' text-anchor='middle'>2</text>\n<rect x='139' y='138' width='24' height='18' rx='2' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1.2'/><text x='151' y='150.8' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#4a3f31' text-anchor='middle'>5</text>\n<text x='172' y='147' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>in text:</text>\n<text x='208' y='147' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>a numbered footnote</text>\n<text x='4' y='173' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31'>Example source: Rebecca Moore Howard, College English, 1995.</text></svg><figcaption><b>WATCH THE DATE</b>Part 2, the date, moves to second place in American Psychological Association style. Your discipline chooses the style.</figcaption></figure><p class='small'>Full examples of each style: The Research Manual, Folio 12.</p></div><div class='num'>&middot; 19 &middot;</div><div class='shade'></div>"},{"cls":"board chapter","label":"Folio 7","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'><svg aria-hidden='true' style='width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.55em;color:#d6ad55'><use href='#i-pen'/></svg>FOLIO</div><div class='ch-num'>7</div><div class='ch-title'>Clear prose</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='kt ic poster' viewBox='0 0 240 42' role='img' aria-label='The word just is crushed, and say it slides left'><text class='ko' style='--sx:1;--sy:0;transition-delay:0.8s;animation-delay:0.8s' x='80' y='30' font-family='Fraunces,Georgia,serif' font-size='20' font-weight='700' fill='#e8c878' text-anchor='middle'>JUST</text><text class='km' style='--x:-36;--y:0;transition-delay:1.3s;animation-delay:1.3s' x='156' y='30' font-family='Fraunces,Georgia,serif' font-size='20' font-weight='700' fill='#e8c878' text-anchor='middle'>SAY IT</text></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Put the actor in the subject and the action in the verb, then revise from the argument down to the word.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Cut, then punctuate</span><span class='ld' aria-hidden='true'></span><span class='pn'>20</span></li><li><span class='it'>Who did it?</span><span class='ld' aria-hidden='true'></span><span class='pn'>21</span></li><li><span class='it'>The red pen</span><span class='ld' aria-hidden='true'></span><span class='pn'>22</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 7","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 7</p><h2>Cut, then punctuate</h2><figure class='plate'><div class='pl'><span>PLATE XVII</span><span>Cut the filler</span></div><svg class='kt ic' viewBox='0 0 420 28' role='img' aria-label='The results are very clearly just really important loses four filler words and closes up'><text x='4' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>The</text><text x='36' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>results</text><text x='100' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>are</text><text class='ko' style='--sx:1;--sy:0;transition-delay:0.2s;animation-delay:0.2s' x='132' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#9c3322'>very</text><text class='ko' style='--sx:1;--sy:0;transition-delay:0.45s;animation-delay:0.45s' x='172' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#9c3322'>clearly</text><text class='ko' style='--sx:1;--sy:0;transition-delay:0.7s;animation-delay:0.7s' x='236' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#9c3322'>just</text><text class='ko' style='--sx:1;--sy:0;transition-delay:0.95s;animation-delay:0.95s' x='276' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#9c3322'>really</text><text class='km' style='--x:-200;--y:0;transition-delay:1.4s;animation-delay:1.4s' x='332' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>important.</text></svg><figcaption><b>CUT</b>Very, really, and just add length, not meaning. The claim does not change.</figcaption></figure><figure class='plate'><div class='pl'><span>PLATE XVIII</span><span>Mark the breaks</span></div><svg class='kt ic' viewBox='0 0 300 52' role='img' aria-label='A run-on sentence: the archive was closed we returned in March the letters were there. A semicolon goes after closed. A period ends March, and a capital The starts the last part: The archive was closed; we returned in March. The letters were there.'><text x='4' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>The</text><text x='36' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>archive</text><text x='100' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>was</text><text x='132' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>closed</text><text class='km' style='--x:8;--y:0;transition-delay:0.5s;animation-delay:0.5s' x='188' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>we</text><text class='km' style='--x:8;--y:0;transition-delay:0.5s;animation-delay:0.5s' x='212' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>returned</text><text class='ki' style='--y:-24;--s:1.6;transition-delay:0.8s;animation-delay:0.8s' x='180' y='20' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#9c3322'>;</text><text x='4' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>in</text><text x='28' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>March</text><text class='km' style='--x:8;--y:0;transition-delay:1.2s;animation-delay:1.2s' x='108' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>letters</text><text class='km' style='--x:8;--y:0;transition-delay:1.2s;animation-delay:1.2s' x='172' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>were</text><text class='km' style='--x:8;--y:0;transition-delay:1.2s;animation-delay:1.2s' x='220' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>there</text><text class='ko' style='--sx:1;--sy:1;transition-delay:1.5s;animation-delay:1.5s' x='76' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>the</text><text class='ki' style='transition-delay:1.7s;animation-delay:1.7s' x='84' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#245e55'>The</text><text class='ki' style='--y:-24;--s:1.6;transition-delay:1.5s;animation-delay:1.5s' x='68' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#9c3322'>.</text><text class='ki' style='--y:-24;--s:1.6;transition-delay:2.0s;animation-delay:2.0s' x='268' y='44' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#9c3322'>.</text></svg><figcaption><b>PUNCTUATE</b>A run-on makes the reader find the breaks. Punctuation finds them for the reader.</figcaption></figure></div><div class='num'>&middot; 20 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 7","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 7</p><h2>Who did it?</h2><figure class='plate'><div class='pl'><span>PLATE XIX</span><span>Passive to active</span></div><svg class='kt ic' viewBox='0 0 320 104' role='img' aria-label='Passive: the samples were excluded by the team. Under it: the samples, acted on; were excluded, the action; the team, who acts, comes last. The words were and by are struck out. An arrow moves the one who acts to the front. Active: the team excluded the samples. Under it: the team, who acts; excluded, the action; the samples, acted on.'><text x='4' y='12' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>PASSIVE</text>\n<text x='4' y='32' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#4a3f31'>The samples</text>\n<text x='100' y='32' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#4a3f31'>were</text>\n<text x='140' y='32' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#4a3f31'>excluded</text>\n<text x='212' y='32' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#4a3f31'>by</text>\n<text x='236' y='32' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#4a3f31'>the team.</text>\n<line class='ks' style='transition-delay:0.4s;animation-delay:0.4s' x1='98' y1='28' x2='132' y2='28' stroke='#9c3322' stroke-width='2'/>\n<line class='ks' style='transition-delay:0.6s;animation-delay:0.6s' x1='210' y1='28' x2='228' y2='28' stroke='#9c3322' stroke-width='2'/>\n<path d='M4 35 V38 H91.5 V35' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='47.7' y='48' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>ACTED ON</text>\n<path d='M100 35 V38 H203.6 V35' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='151.8' y='48' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>THE ACTION</text>\n<path d='M236 35 V38 H303.6 V35' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='269.8' y='48' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>WHO ACTS: last</text>\n<g class='ki' style='transition-delay:1.4s;animation-delay:1.4s'><path d='M262 52 Q150 58 60 66' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M63.7 63.4 L60 66 L64.1 67.9' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/></g>\n<text class='ki' style='transition-delay:1.4s;animation-delay:1.4s' x='4' y='64' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>ACTIVE</text>\n<text class='ki' style='--x:232;--y:-52;transition-delay:0.8s;animation-delay:0.8s' x='4' y='84' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#245e55'>The team</text>\n<text class='ki' style='--x:64;--y:-52;transition-delay:0.95s;animation-delay:0.95s' x='76' y='84' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#245e55'>excluded</text>\n<text class='ki' style='--x:-144;--y:-52;transition-delay:1.1s;animation-delay:1.1s' x='148' y='84' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#245e55'>the samples.</text>\n<g class='ki' style='transition-delay:1.4s;animation-delay:1.4s'><path d='M4 87 V90 H67.6 V87' fill='none' stroke='#245e55' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='35.8' y='100' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55' text-anchor='middle'>WHO ACTS</text></g>\n<g class='ki' style='transition-delay:1.4s;animation-delay:1.4s'><path d='M76 87 V90 H139.6 V87' fill='none' stroke='#245e55' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='107.8' y='100' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55' text-anchor='middle'>THE ACTION</text></g>\n<g class='ki' style='transition-delay:1.4s;animation-delay:1.4s'><path d='M148 87 V90 H239.4 V87' fill='none' stroke='#245e55' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='193.7' y='100' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55' text-anchor='middle'>ACTED ON</text></g></svg><figcaption><b>FLIP</b>Put the person or thing that acts in the subject. The reader then sees who did what.</figcaption></figure><p>Which verb fits your evidence? The calibration chain, page 16.</p></div><div class='num'>&middot; 21 &middot;</div><div class='shade'></div>"},{"cls":"paper","label":"Folio 7","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>WRITING THE PAPER</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-pen'/></svg>FOLIO 7</p><h2>The red pen</h2><figure class='plate'><div class='pl'><span>PLATE XX</span><span>A live edit</span></div><svg class='kt ic' viewBox='0 0 364 168' role='img' aria-label='A live edit in three marks. Mark 1, filler: It is important to note that is struck out. Mark 2, a buried verb: made a rejection of becomes rejected. Mark 3, an empty ending: which was very clear is cut, and a period ends the sentence. The clean sentence: The poet rejected the colonial model in her later work.'><text x='4' y='32' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>It is important to note that the poet</text><line class='ks' style='transition-delay:0.4s;animation-delay:0.4s' x1='4' y1='28' x2='239' y2='28' stroke='#9c3322' stroke-width='2'/><g class='ki' style='--s:.4;transition-delay:0.9s;animation-delay:0.9s'><g transform='translate(352 28)'><circle r='8' fill='#9c3322'/><text y='3.6' font-family='Space Mono,Courier New,monospace' font-size='10.0' font-weight='700' fill='#fff' text-anchor='middle'>1</text></g></g><text x='4' y='68' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>made a rejection of the colonial model</text><line class='ks' style='transition-delay:1.0s;animation-delay:1.0s' x1='4' y1='64' x2='164' y2='64' stroke='#9c3322' stroke-width='2'/><text class='ki' style='--y:-6;transition-delay:1.2999999999999998s;animation-delay:1.2999999999999998s' x='80.0' y='54' font-family='Patrick Hand,cursive' font-size='17' font-weight='400' fill='#9c3322' text-anchor='middle'>rejected</text><g class='ki' style='--s:.4;transition-delay:1.5s;animation-delay:1.5s'><g transform='translate(352 64)'><circle r='8' fill='#9c3322'/><text y='3.6' font-family='Space Mono,Courier New,monospace' font-size='10.0' font-weight='700' fill='#fff' text-anchor='middle'>2</text></g></g><text x='4' y='104' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='400' fill='#1d1812'>in her later work, which was very clear.</text><line class='ks' style='transition-delay:1.6s;animation-delay:1.6s' x1='147' y1='100' x2='339' y2='100' stroke='#9c3322' stroke-width='2'/><text class='ki' style='--y:-6;transition-delay:1.9s;animation-delay:1.9s' x='142' y='90' font-family='Patrick Hand,cursive' font-size='17' font-weight='400' fill='#9c3322'>.</text><g class='ki' style='--s:.4;transition-delay:2.1s;animation-delay:2.1s'><g transform='translate(352 100)'><circle r='8' fill='#9c3322'/><text y='3.6' font-family='Space Mono,Courier New,monospace' font-size='10.0' font-weight='700' fill='#fff' text-anchor='middle'>3</text></g></g><line x1='4' y1='124' x2='346' y2='124' stroke='#b9a987' stroke-width='.8'/><text class='ki' style='--y:8;transition-delay:2.4s;animation-delay:2.4s' x='4' y='144' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700' fill='#245e55'>The poet rejected the colonial model</text><text class='ki' style='--y:8;transition-delay:2.6s;animation-delay:2.6s' x='4' y='162' font-family='Space Mono,Courier New,monospace' font-size='13' font-weight='700'
