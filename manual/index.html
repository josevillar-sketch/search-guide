er New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WRITE </text><use href='#i-pen' x='290' y='8' width='20' height='20' style='color:#9c3322'/><text x='224' y='40' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>What you </text><text x='224' y='52' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>remember, in your </text><text x='224' y='64' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>words. </text></g><g class='pop d4'><rect x='4' y='84' width='98' height='66' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='15' cy='95' r='6.6' fill='#9c3322'/><text x='15' y='98.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='26' y='99' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>CHECK </text><use href='#i-test' x='76' y='88' width='20' height='20' style='color:#9c3322'/><text x='10' y='120' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Against the </text><text x='10' y='132' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>original. Same </text><text x='10' y='144' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>meaning? </text></g><g class='pop d5'><rect x='111' y='84' width='98' height='66' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='122' cy='95' r='6.6' fill='#9c3322'/><text x='122' y='98.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>5 </text><text x='133' y='99' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>QUOTE </text><use href='#i-quote' x='183' y='88' width='20' height='20' style='color:#9c3322'/><text x='117' y='120' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Kept exact words? </text><text x='117' y='132' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Quotation marks. </text></g><g class='pop d6'><rect x='218' y='84' width='98' height='66' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='229' cy='95' r='6.6' fill='#9c3322'/><text x='229' y='98.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>6 </text><text x='240' y='99' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>PAGE </text><rect x='290' y='89' width='17' height='21' rx='1' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><text x='298.5' y='106' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>12 </text><text x='224' y='120' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Write the page </text><text x='224' y='132' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>number. </text></g><path d='M102 37 L110 37' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M105.7 39.5 L110 37 L105.7 34.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M209 37 L217 37' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M212.7 39.5 L217 37 L212.7 34.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M102 117 L110 117' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M105.7 119.5 L110 117 L105.7 114.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M209 117 L217 117' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M212.7 119.5 L217 117 L212.7 114.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M267.0 70 L267.0 77 L53.0 77 L53.0 83' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M53 78 L53 83' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M50.5 78.7 L53 83 L55.5 78.7' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg><figcaption><b>COVER IT FIRST</b>Write from memory, then check.</figcaption></figure><p class='small fill'>Never paste a source's words into your draft. Type a quote yourself, in quotation marks, and check it against the source.</p></div><div class='num'>&middot; 51 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Quote, paraphrase, or summary?</h3><p>You can use a source three ways. All three need a citation.</p><figure class='plate'><div class='pl'><span>PLATE XXIX</span><span>Three ways</span></div><svg class='fig' viewBox='0 0 320 156' role='img' aria-label='A long bar is one part of a source. Under it, three ways to use it, each ending with a citation. Quote: the exact words, in quotation marks; one exact slice of the part, with quotation marks at both ends. Paraphrase: one idea, in your own words and your own sentence; a bar that says your words. Summary: the main idea of a whole part, much shorter; a short bar, shorter than the whole part.'><rect x='134' y='6' width='182' height='16' rx='2' fill='#f3e3bd' stroke='#4a3f31' stroke-width='1'/><text x='225' y='17.8' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>ONE PART OF A SOURCE </text><text x='4' y='42' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>QUOTE </text><text x='4' y='55' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The exact words, in </text><text x='4' y='67' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>quotation marks. </text><path d='M200 23 L200 40' fill='none' stroke='#4a3f31' stroke-width='0.7' stroke-linecap='round' stroke-linejoin='round'/><path d='M236 23 L236 40' fill='none' stroke='#4a3f31' stroke-width='0.7' stroke-linecap='round' stroke-linejoin='round'/><rect x='200' y='40' width='36' height='12' rx='2' fill='#245e55'/><text x='197' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='700' fill='#1f3a5a' text-anchor='end'>&quot; </text><text x='239' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='13' font-weight='700' fill='#1f3a5a'>&quot; </text><rect x='248' y='39.5' width='50' height='13' rx='6' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='0.9'/><text x='273' y='49.2' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>citation </text><text x='4' y='84' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>PARAPHRASE </text><text x='4' y='97' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>One idea, in your own words </text><text x='4' y='109' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>and your own sentence. </text><rect x='150' y='82' width='72' height='12' rx='2' fill='#fffdf6' stroke='#245e55' stroke-width='1.4'/><text x='186' y='91.6' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55' text-anchor='middle'>your words </text><rect x='228' y='81.5' width='50' height='13' rx='6' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='0.9'/><text x='253' y='91.2' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>citation </text><text x='4' y='126' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>SUMMARY </text><text x='4' y='139' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The main idea of a whole </text><text x='4' y='151' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>part, much shorter. </text><rect x='134' y='124' width='42' height='12' rx='2' fill='#16294a'/><rect x='182' y='123.5' width='50' height='13' rx='6' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='0.9'/><text x='207' y='133.2' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>citation </text><text x='316' y='150' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' text-anchor='end' font-style='italic'>shorter than the whole part </text></svg><figcaption><b>ALL THREE</b>Each one ends with a citation.</figcaption></figure><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>NOT A MACHINE</div><p>A machine may not reword a source for you. The AI Manual, Folio 6, explains why.</p></div><p class='small fill'>Your words, your sentence, and still a citation.</p></div><div class='num'>&middot; 52 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Too close, or your own?</h3><div class='card2 ' style='margin:0'><div class='k'>THE SOURCE SAYS &middot; A MADE-UP SOURCE</div><p>Dividers appeared on 38 of every 100 shopping-street benches.</p></div><div class='twocol' style='margin-top:1cqw'><div class='card2 weak'><div class='k'><svg class='ki' aria-hidden='true'><use href='#i-warn'/></svg>TOO CLOSE</div><p><span class='same'>Dividers</span> showed up <span class='same'>on 38 of</span> each <span class='same'>100 shopping-street benches.</span><br><span class='small'>Same sentence, a few words swapped.</span></p></div><div class='card2 good'><div class='k'>YOUR OWN</div><p>More than a third of the benches on shopping streets had dividers (Chen and Diaz 47).</p></div></div><p class='small' style='margin:.8cqw 0 0'>Underlined: the same words as the source.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>Is this too close? &quot;On shopping streets, 38 of every 100 benches had dividers.&quot;</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Too close: the same words in a new order. A number can stay. The words around it must be yours.</p></div></div><div class='num'>&middot; 53 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A summary is not reading</h3><p>Gemini Notebook is on in your school account. Its old name is NotebookLM. It can turn an article into a summary or an audio overview.</p><div class='twocol' style='margin-top:1cqw'><div class='card2 good'><div class='k'>ALLOWED, AFTER YOU READ</div><p>Ask what a hard word, sentence, or passage means.</p></div><div class='card2 weak'><div class='k'>NOT ALLOWED</div><p>A summary in place of the source. Asking it for quotes. Asking it to compare or connect your sources. Its summary in your log or paper.</p></div></div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>THE ORDER</div><p>Read it. Write line 4 yourself. Then ask, if you still need to.</p></div><p class='small fill'>A summary that a database writes for you: same rule. More: The AI Manual, Folios 2, 3, and 6. Checked September 2026.</p></div><div class='num'>&middot; 54 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Log it: where each line comes from</h3><figure class='plate'><div class='pl'><span>PLATE XXX</span><span>Into your log</span></div><svg class='fig' viewBox='0 0 320 147' role='img' aria-label='Your log entry, six lines, left blank, and where each line comes from. 1, date: see The Research Log, Folio 3. 2, source: author, title, year, where you found it. 3, how I found it: your exact search words and the site. 4, what it argues: your own reading, in one sentence. 5, perspective or method: see The Research Log, Folio 6. 6, still serves? yes or no, and why.'><text x='4' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>YOUR LOG ENTRY </text><text x='146' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>WHERE IT COMES FROM </text><rect x='4' y='15' width='124' height='129' rx='2' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><path d='M8 38 L124 38' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='11' y='31.5' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>1 </text><text x='24' y='31.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>date </text><path d='M144 28 L131 28' fill='none' stroke='#4a3f31' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M134 26.2 L131 28 L134 29.8' fill='none' stroke='#4a3f31' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='147' y='31.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' font-style='italic'>see The Research Log, Folio 3 </text><path d='M8 59 L124 59' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='11' y='52.5' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>2 </text><text x='24' y='52.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>source </text><path d='M144 49 L131 49' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M134 47.2 L131 49 L134 50.8' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='147' y='52.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>author, title, year, where you found it </text><path d='M8 80 L124 80' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='11' y='73.5' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>3 </text><text x='24' y='73.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>how I found it </text><path d='M144 70 L131 70' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M134 68.2 L131 70 L134 71.8' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='147' y='73.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>your exact search words and the site </text><path d='M8 101 L124 101' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='11' y='94.5' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>4 </text><text x='24' y='94.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>what it argues </text><path d='M144 91 L131 91' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M134 89.2 L131 91 L134 92.8' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='147' y='94.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>your own reading, in one sentence </text><path d='M8 122 L124 122' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='11' y='115.5' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>5 </text><text x='24' y='115.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>perspective or method </text><path d='M144 112 L131 112' fill='none' stroke='#4a3f31' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M134 110.2 L131 112 L134 113.8' fill='none' stroke='#4a3f31' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='147' y='115.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' font-style='italic'>see The Research Log, Folio 6 </text><path d='M8 143 L124 143' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><text x='11' y='136.5' font-family='Space Mono,Courier New,monospace' font-size='10.5' font-weight='700' fill='#1f3a5a'>6 </text><text x='24' y='136.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>still serves? </text><path d='M144 133 L131 133' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M134 131.2 L131 133 L134 134.8' fill='none' stroke='#9c3322' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='147' y='136.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>yes or no, and why </text></svg><figcaption><b>SAME DAY</b>Fill every line the day you read it.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>THE FULL CITATION</div><p>Line 2 is short. The full citation goes in your list of sources, the same day. Folio 12.</p></div><p class='small fill'>Read it, then dropped it? It still gets an entry.</p></div><div class='num'>&middot; 55 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"board chapter","label":"Folio 12","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>12</div><div class='ch-title'>Cite it</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-quote'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Name a source in your sentence, and cite it in one style, checked.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Name the source in your sentence</span><span class='ld' aria-hidden='true'></span><span class='pn'>56</span></li><li><span class='it'>Names in your sentence, or in parentheses?</span><span class='ld' aria-hidden='true'></span><span class='pn'>57</span></li><li><span class='it'>Four parts, two places</span><span class='ld' aria-hidden='true'></span><span class='pn'>58</span></li><li><span class='it'>One style, all the way through</span><span class='ld' aria-hidden='true'></span><span class='pn'>59</span></li><li><span class='it'>MLA 9, piece by piece</span><span class='ld' aria-hidden='true'></span><span class='pn'>60</span></li><li><span class='it'>APA 7, piece by piece</span><span class='ld' aria-hidden='true'></span><span class='pn'>61</span></li><li><span class='it'>Your list of sources</span><span class='ld' aria-hidden='true'></span><span class='pn'>62</span></li><li><span class='it'>Check the citation a tool made</span><span class='ld' aria-hidden='true'></span><span class='pn'>63</span></li><li><span class='it'>From log entry to annotation</span><span class='ld' aria-hidden='true'></span><span class='pn'>64</span></li><li><span class='it'>One annotation, filled</span><span class='ld' aria-hidden='true'></span><span class='pn'>65</span></li><li><span class='it'>Quote Spanish in an English paper</span><span class='ld' aria-hidden='true'></span><span class='pn'>66</span></li><li><span class='it'><span class='S'>Sources you are given</span><span class='R'>Cite it out loud, too</span><span class='P'>Sources for your course</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>67</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-quote'/></svg>FOLIO 12</p><h2>Name the source in your sentence</h2><p>Readers check whether your sentence shows why a source is credible.</p><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'><svg class='ki' aria-hidden='true'><use href='#i-cross'/></svg>WEAK</div><p>John Doe, a journalist, explains that bench bars work.<br><span class='small'>The College Board&#39;s own weak example starts this way. It names a job, not a reason to trust.</span></p></div><figure class='plate'><div class='pl'><span>PLATE XXXI</span><span>Why trust them?</span></div><svg class='fig' viewBox='0 0 320 99' role='img' aria-label='Strong: a made-up source. The sentence, pulled apart. Who: Chen and Diaz. What they did: who counted 400 benches. Where it was published: for the journal Street Design Quarterly. What they found: found dividers on 38 of every 100 shopping-street benches, 47 in parentheses.'><text x='4' y='11.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>STRONG </text><text x='316' y='11' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='end'>A MADE-UP SOURCE </text><rect x='4' y='17' width='312' height='78' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='10' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>who </text><text x='112' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>Chen and Diaz,</tspan> </text><path d='M8 36 L312 36' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='10' y='46.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>what they did </text><text x='112' y='46.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>who counted 400 benches</tspan> </text><path d='M8 52.5 L312 52.5' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='10' y='63' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>where it was published </text><text x='112' y='63' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>for the journal </tspan><tspan fill='#4a3f31' font-weight='600' font-style='italic' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>Street Design Quarterly</tspan><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>,</tspan> </text><path d='M8 69 L312 69' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='10' y='79.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>what they found </text><text x='112' y='79.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>found dividers on 38 of every 100</tspan> </text><text x='112' y='92' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>shopping-street benches (47).</tspan> </text></svg><figcaption><b>SAY WHO</b>Then what they did, and where it was published.</figcaption></figure></div><div class='num'>&middot; 56 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Names in your sentence, or in parentheses?</h3><p>Name the authors in your sentence, or put them in the citation. Not both.</p><table class='stages'><thead><tr><th>STYLE</th><th>IN YOUR SENTENCE</th><th>IN PARENTHESES</th></tr></thead><tbody><tr><th>MLA</th><td>Chen and Diaz found... (47).</td><td>...on shopping streets (Chen and Diaz 47).</td></tr><tr><th>APA</th><td>Chen and Diaz (2020) found...</td><td>...on shopping streets (Chen &amp; Diaz, 2020).</td></tr></tbody></table><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>APA: WORD OR SIGN?</div><p>In your sentence, write the word &quot;and.&quot; Use &quot;&amp;&quot; only inside parentheses. Quoting? Add the page: (Chen &amp; Diaz, 2020, p. 47).</p></div><p class='small fill'>A made-up source.</p></div><div class='num'>&middot; 57 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Four parts, two places</h3><p>Every citation needs the author or group, the title, where it was published, and the date. The College Board's scoring guidelines name these four.</p><figure class='plate'><div class='pl'><span>PLATE XXXII</span><span>One source, two places</span></div><svg class='fig' viewBox='0 0 320 129' role='img' aria-label='A made-up source in two places. 1, in your sentence: dividers on 38 of every 100 benches, then the short citation, Chen and Diaz 47, in parentheses. An arrow goes down: the same first word, Chen. 2, in your list of sources, the entry pulled apart into its four parts: author or group, Chen, David, and Rosa Diaz; title, Counting Hostile Design; where published, Street Design Quarterly; date, 2020. More pieces go in, too: the volume, number, and pages, page 60.'><rect x='4' y='2' width='312' height='34' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='13' cy='12' r='6.6' fill='#9c3322'/><text x='13' y='15.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='24' y='15.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>IN YOUR SENTENCE </text><text x='310' y='14' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='end'>A MADE-UP SOURCE </text><text x='12' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>...dividers on 38 of every 100 benches </text><rect x='174.8' y='20' width='95.3' height='13.5' rx='2' fill='none' stroke='#9c3322' stroke-width='1.3'/><text x='177.8' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322'>(Chen and Diaz 47). </text><path d='M192.7 34 L192.7 51' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M190.2 46.7 L192.7 51 L195.2 46.7' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='186.7' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' text-anchor='end' font-style='italic'>the same first word: Chen </text><rect x='4' y='51' width='312' height='76' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='13' cy='61' r='6.6' fill='#9c3322'/><text x='13' y='64.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='24' y='64.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>IN YOUR LIST OF SOURCES </text><text x='12' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#9c3322'><tspan fill='#9c3322' font-weight='700'>Chen</tspan><tspan fill='#4a3f31' font-weight='600'>, David, and Rosa Diaz.</tspan> </text><text x='308' y='80' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>AUTHOR OR GROUP </text><path d='M10 84.5 L310 84.5' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='12' y='94' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>&quot;Counting Hostile Design.&quot; </text><text x='308' y='94' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>TITLE </text><path d='M10 98.5 L310 98.5' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='12' y='108' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-style='italic'>Street Design Quarterly</tspan><tspan fill='#4a3f31' font-weight='600'>,</tspan> </text><text x='308' y='108' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>WHERE PUBLISHED </text><path d='M10 112.5 L310 112.5' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='12' y='122' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='600' fill='#4a3f31'>2020. </text><text x='44' y='122' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>More pieces go in, too: page 60. </text><text x='308' y='122' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>DATE </text></svg><figcaption><b>TWO PLACES</b>Every source you name is on your list.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>A citation reads: &quot;Counting Hostile Design.&quot; <em>Street Design Quarterly</em>, 2020. Which part is missing?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>The authors: Chen and Diaz.</p></div></div><div class='num'>&middot; 58 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>One style, all the way through</h3><p>A citation style is a set of rules for naming sources. The College Board does not choose one for you. It asks for one style, used the same way every time.</p><table class='stages'><thead><tr><th>STYLE</th><th>USED MOST IN</th><th>EDITION</th></tr></thead><tbody><tr><th>MLA</th><td>Literature and languages.</td><td>9th, 2021.</td></tr><tr><th>APA</th><td>Psychology, education, and social sciences.</td><td>7th.</td></tr><tr><th>Chicago</th><td>History.</td><td>18th, 2024.</td></tr></tbody></table><div class='card2 S' style='margin-top:1.2cqw'><div class='k'>AP SEMINAR</div><p>Any style works if it is consistent and complete.</p></div><div class='card2 R' style='margin-top:1.2cqw'><div class='k'>AP RESEARCH</div><p>Use the style of your field. Not sure which? Ask me.</p></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see the note for your course. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div><p class='small fill'>Style guides: <a href='https://style.mla.org' target='_blank' rel='noopener'>MLA Style Center</a> for MLA, <a href='https://owl.purdue.edu' target='_blank' rel='noopener'>Purdue OWL</a> for APA.</p></div><div class='num'>&middot; 59 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>MLA 9, piece by piece</h3><p>Skip any piece your source does not have.</p><figure class='plate'><div class='pl'><span>PLATE XXXIII</span><span>Nine slots</span></div><svg class='fig' viewBox='0 0 320 142 eight='30' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='10' y='109' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>TITLE </text><text x='78' y='109' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>Counting hostile design.</tspan> </text><circle cx='84' cy='118' r='6.6' fill='#9c3322'/><text x='84' y='121.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='95' y='121.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>A capital only on the first word and names. </text><rect x='4' y='129' width='312' height='30' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><text x='10' y='142' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>SOURCE </text><text x='78' y='142' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600' font-style='italic' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>Street Design Quarterly, 12</tspan><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>(3), 44-61.</tspan> </text><text x='78' y='154.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#4a3f31' font-style='italic'>The journal and volume in italics. </text><text x='4' y='170' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>Last, the doi.org link, if the source has one. </text></svg><figcaption><b>THREE CHANGES</b>The numbers mark what differs from the other style.</figcaption></figure><p>Initials, not first names. The year comes right after the names. In the article title, only the first word and names get capitals. No doi.org link, and found in EBSCO or Gale? End with the pages.</p><p class='small fill'>In parentheses: (Chen &amp; Diaz, 2020). Names in your sentence? Page <button type='button' class='pj' data-jump='70' aria-label='Go to page 57'>57</button>.</p></div><div class='num'>&middot; 61 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your list of sources</h3><p>The list goes on its own page, at the end.</p><figure class='plate'><div class='pl'><span>PLATE XXXV</span><span>Two lists</span></div><svg class='fig' viewBox='0 0 320 171' role='img' aria-label='Two list pages side by side, with made-up sources. Left, Modern Language Association style, titled Works Cited: Chen, David, and Rosa Diaz, &quot;Counting Hostile...&quot;; then Ortiz, Maya, &quot;Who Is the Bench For?&quot; City... Right, American Psychological Association style, titled References: Chen, D., and Diaz, R. (2020), Counting hostile...; then Ortiz, M. (2021), Who is the bench for? City... On both, the entries go A to Z by the first word, usually the author&#39;s last name: Chen, then Ortiz. The first line of each entry starts at the left edge; indent at each arrow: every line after the first. Made-up sources. Only the first words of each entry are shown.'><rect x='4' y='4' width='152' height='96' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.3'/><text x='80' y='20' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>Works Cited </text><text x='14' y='38' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Chen, David, and Rosa </text><text x='32' y='53' font-family='Cormorant Garamond,Georgia,serif' font-size='10.  code opens it.</p></div><p class='small fill'>Every source you name in a sentence must be on the list.</p></div><div class='num'>&middot; 62 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Check the citation a tool made</h3><p><a href='https://mybib.com' target='_blank' rel='noopener'>MyBib</a>, <a href='https://zbib.org' target='_blank' rel='noopener'>ZoteroBib</a>, and a database's Cite button can draft a citation. The College Board allows a draft. It does not allow skipping the check.</p><figure class='plate'><div class='pl'><span>PLATE XXXVI</span><span>Check it against the page</span></div><svg class='fig' viewBox='0 0 320 156' role='img' aria-label='A made-up source and a made-up draft a tool made, part by part. The names: the first page says David Chen and Rosa Diaz; the draft says Chen, D., and Dias, R.: wrong. The year: 2020 on the first page; 2021 in the draft: wrong. The title: Counting Hostile Design; counting hostile design: same. The journal: Street Design Quarterly in both: same. Volume, issue, pages: Volume 12, Issue 3, pages 44 to 61; 12, issue 3, 44 to 61: same. Fix the draft from the first page, not from memory.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>THE FIRST PAGE </text><text x='156' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>THE TOOL&#39;S DRAFT </text><rect x='4' y='16' width='312' height='17' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1'/><text x='9' y='28.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>David Chen and Rosa Diaz </text><text x='156' y='28.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Chen, D., &amp; Dias, R. </text><text x='311' y='28.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='end'>wrong </text><rect x='4' y='36' width='312' height='17' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1'/><text x='9' y='48.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>2020 </text><text x='156' y='48.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>(2021). </text><text x='311' y='48.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' text-anchor='end'>wrong </text><rect x='4' y='56' width='312' height='17' rx='3' fill='#fffdf6' stroke='#245e55' stroke-width='1'/><text x='9' y='68.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Counting Hostile Design </text><text x='156' y='68.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Counting hostile design. </text><text x='311' y='68.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55' text-anchor='end'>same </text><rect x='4' y='76' width='312' height='17' rx='3' fill='#fffdf6' stroke='#245e55' stroke-width='1'/><text x='9' y='88.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' font-style='italic'>Street Design Quarterly </text><text x='156' y='88.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31' font-style='italic'>Street Design Quarterly, </text><text x='311' y='88.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55' text-anchor='end'>same </text><rect x='4' y='96' width='312' height='29' rx='3' fill='#fffdf6' stroke='#245e55' stroke-width='1'/><text x='9' y='108.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Volume 12, Issue 3, </text><text x='9' y='120.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Pages 44-61 </text><text x='156' y='108.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>12(3), 44-61. </text><text x='311' y='108.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#245e55' text-anchor='end'>same </text><text x='4' y='138' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>Fix the draft from the first page, not from memory. </text><text x='4' y='151' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>A made-up source and a made-up draft. </text></svg><figcaption><b>CHECK</b>Every part of the draft, against the first page.</figcaption></figure><p class='small'>Then tap the doi.org link: does it open this source? Check the style you chose: MLA 9, APA 7, or Chicago 18. Google Docs gives MLA 8.</p><p class='small fill'>A piece is wrong? The Research Log, Folio 7, shows the fix.</p></div><div class='num'>&middot; 63 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>From log entry to annotation</h3><p>An annotated bibliography lists your sources. Under each citation goes a short paragraph in three parts.</p><div class='S'><figure class='plate'><div class='pl'><span>PLATE XXXVII</span><span>From your log</span></div><svg class='fig' viewBox='0 0 320 169' role='img' aria-label='For AP Seminar. Left, the six lines of your log entry, left blank: 1, date. 2, source. 3, how I found it. 4, what it argues. 5, perspective it holds. 6, still serves? Right, the three parts of an annotation. Arrows run from lines 4 and 5  shopping streets as on home streets.</td></tr><tr><th>Evaluation</th><td>The steps are clear, so another person could repeat them. The count covers one year, and it shows how many, not why.</td></tr><tr><th>Connection</th><td>My study can count the same features in Hialeah.</td></tr></tbody></table></div><div class='num'>&middot; 65 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Quote Spanish in an English paper</h3><p>You may read a source in Spanish and use it in English. The translation is your work.</p><figure class='plate'><div class='pl'><span>PLATE XXXVIII</span><span>Spanish first, then yours</span></div><svg class='fig' viewBox='0 0 320 118' role='img' aria-label='Three layers, from a made-up source. 1, Spanish, copied exactly, handwritten in your notes: Las bancas con divisiones aparecieron en las calles comerciales. Page 12. 2, yours, your English, handwritten under it: Benches with dividers showed up on shopping streets. 3, in your paper, quote it: your English in quotation marks, then the citation, Ramos 12; my translation.'><rect x='4' y='2' width='312' height='36' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.1'/><circle cx='14' cy='12.5' r='6.6' fill='#9c3322'/><text x='14' y='15.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='25' y='16' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>SPANISH </text><text x='10' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' font-style='italic'>copied exactly </text><text x='92' y='16.5' font-family='Patrick Hand,cursive' font-size='13' font-weight='400' fill='#1f2a5a'>Las bancas con divisiones aparecieron </text><text x='92' y='31.5' font-  (Ramos 12; my translation) </text><text x='310' y='73' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='end'>A MADE-UP SOURCE </text></svg><figcaption><b>THREE LAYERS</b>The English is yours, and the citation says so.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>A DICTIONARY CAN HELP</div><p>The English you quote must be your own. Check every word against the Spanish.</p></div><p class='small fill'>MLA, from the MLA Style Center. Using APA? Ask me. A made-up citation.</p></div><div class='num'>&middot; 66 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><span class='S'>Sources you are given</span><span class='R'>Cite it out loud, too</span><span class='P'>Sources for your course</span></h3><div class='S'><div class='card2 ' style='margin:0'><div class='k'>SOURCES YOU ARE GIVEN</div><p>Stimulus texts and exam sources are sources too. For the written argument, your question must relate to a theme that links at least two stimulus texts. Your argument must use at least one. Cite each one like any other source.</p></div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>ON THE EXAM</div><p>Call a source Source A, or use its author's name.</p></div></div><div class='R'><div class='card2 ' style='margin:0'><div class='k'>IN YOUR PAPER</div><p>Each source goes in two places: in your sentence and in your bibliography.</p></div></div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'><svg class='ki' aria-hidden='true'><use href='#i-mic'/></svg>IN A PRESENTATION</div><p>Say or show the source of every piece of evidence, out loud or on the slide. Every presentation needs this.</p></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see the note for your course. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div></div><div class='num'>&middot; 67 &middot;</div><div class='shade'></div>","label":"Folio 12"},{"cls":"board chapter","label":"Folio 13","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>13</div><div class='ch-title'>When a door will not open</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-lock'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Know the three moves when a login, a card, or a link will not work.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>When a door will not open</span><span class='ld' aria-hidden='true'></span><span class='pn'>68</span></li><li><span class='it'>Locked out: accounts</span><span class='ld' aria-hidden='true'></span><span class='pn'>69</span></li><li><span class='it'>Locked out: library and iPad</span><span class='ld' aria-hidden='true'></span><span class='pn'>70</span></li><li><span class='it'>A school iPad, five facts</span><span class='ld' aria-hidden='true'></span><span class='pn'>71</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-lock'/></svg>FOLIO 13</p><h2>When a door will not open</h2><p>Every locked door gets the same three moves.</p><figure class='plate'><div class='pl'><span>PLATE XXXIX</span><span>Every locked door</span></div><svg class='fig' viewBox='0 0 320 115.5' role='img' aria-label='A locked door gets three moves ='num'>&middot; 68 &middot;</div><div class='shade'></div>","label":"Folio 13"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Locked out: accounts</h3><table class='stages'><thead><tr><th>IT SAYS OR DOES</th><th>WHY</th><th>WHAT YOU DO</th></tr></thead><tbody><tr><th>My AP will not take the code.</th><td>It is the Google Classroom code.</td><td>Use the six-character AP code.</td></tr><tr><th>The wrong course comes up.</th><td>The code is for another period.</td><td>Do not tap Yes. See me next class.</td></tr><tr><th>You forgot your College Board password.</th><td>It happens.</td><td>On the sign-in page, tap the help link for a lost password.</td></tr><tr><th>You have two College Board accounts.</th><td>You made a new one.</td><td>Call the College Board: 866-315-6068.</td></tr><tr><th>Your school Google account is locked.</th><td>A password problem.</td><td>See me next class. I can reset it.</td></tr></tbody></table></div><div class='num'>&middot; 69 &middot;</div><div class='shade'></div>","label":"Folio 13"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Locked out: library and iPad</h3><table class='stages'><thead><tr><th>IT SAYS OR DOES</th><th>WHY</th><th>WHAT YOU DO</th></tr></thead><tbody><tr><th>The card form says you must be 16.</th><td>You are 15 or younger.</td><td>Go to a branch with a parent or guardian.</td></tr><tr><th>Your card or PIN does not work.</th><td>A wrong PIN, an old card, or over 20 dollars owed.</td><td>New PIN: page <button type='button' class='pj' data-jump='14' aria-label='Go to page 11'>11</button>. Or email CustomerCare@mdpls.org.</td></tr><tr><th>You tap a link and nothing opens.</th><td>Safari blocked a pop-up.</td><td>If the iPad lets you: Settings, Apps, Safari. Turn off Block Pop-ups. Turn it back on after.</td></tr><tr><th>A page says the site is blocked.</th><td>The school filter.</td><td>Try another site in Folio 4.</td></tr></tbody></table><p class='small fill'>Checked September 24, 2026.</p></div><div class='num'>&middot; 70 &middot;</div><div class='shade'></div>","label":"Folio 13"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A school iPad, five facts</h3><figure class='plate'><div class='pl'><span>PLATE XL</span><span>The next student</span></div><svg class='fig' viewBox='0 0 320 131' role='img' aria-label='A loop of four stops. 1, the cart: take an iPad. 2, the cover of this book: check the name and period; type yours. 3, Safari: Libby, EBSCO, Gale, and the free databases are websites. 4, sign out: of every site, when you finish. A line goes back to the cart: back to the cart; a cart iPad goes to someone else next.'><rect x='4' y='4' width='74' height='95' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='14' cy='14' r='6.6' fill='#9c3322'/><text x='14' y='17.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='9' y='32' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>THE CART </text><text x='9' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Take an iPad. </text><path d='M78 14 L83 14' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><path d='M80 15.8 L83 14 L80 12.2' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><rect x='83.3' y='4' width='74' height='95' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='93.3' cy='14' r='6.6' fill='#9c3322'/><text x='93.3' y='17.3' font-family='Space Mono,Courier New,mono t. A cart iPad goes to someone else next. </text></svg><figcaption><b>THE LOOP</b>Leave nothing of yours on the iPad.</figcaption></figure><p class='small'>In Libby, tap Menu, then Reset Everything.</p><p><strong>Turn it sideways for maps.</strong> The NOAA flood viewer is built for landscape.</p><p><strong>Cite in the browser.</strong> The Google Docs citation tool works only on a computer. Use MyBib or ZoteroBib.</p><p class='small fill'>Nothing opens when you tap? Page <button type='button' class='pj' data-jump='84' aria-label='Go to page 70'>70</button>.</p></div><div class='num'>&middot; 71 &middot;</div><div class='shade'></div>","label":"Folio 13"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Five sources, checked</h3><div class='form' data-form='five'><div class='fhead'><span>FIVE SOURCES</span><span>TAP WHAT IS TRUE</span></div><table class='grid5'><thead><tr><th>SOURCE</th><th>FOUND</th><th>OPENED</th><th>READ</th><th>LOGGED</th><th>CITED</th></tr></thead><tbody><tr><th>1</th><td><button type='button' class='tick' aria-pressed='false' aria-label='Source 1, found'><span class='bx' aria-hidden='true'></span></button></td><td><button type='button' class='tick' aria-pressed='false' aria-label='Source 1, opened'><span class='bx' aria-hidden='true'></span></button></td><td><button type='button' class='tick' aria-pressed='false' aria-label='Source 1, read'><span class='bx' aria-hidden='true'></span></button></td><td><button type='button' class='tick' aria-pressed='false' aria-label='Source 1, logged'><span class='bx' aria-hidden='true'></span></button></td><td><button type='button' class='tick' aria-pressed='false' aria-label='Source 1, cited'><span class='bx' aria-hidden='true'></span></button></td></tr><tr><th>2</th><td><button type='button' class='tick' aria-pressed='false' aria-label='Source 2, found'><span class='bx' aria-hidden='true'></s l":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><svg class='hi' aria-hidden='true'><use href='#i-warn'/></svg>Words that fool you</h3><p>Some English words look like Spanish words but mean something else.</p><table class='stages'><thead><tr><th>ENGLISH</th><th>IN SPANISH</th><th>NOT</th></tr></thead><tbody><tr><th>library</th><td><span lang='es'>biblioteca</span></td><td><span lang='es'>librer&iacute;a</span>, a bookstore</td></tr><tr><th>journal</th><td><span lang='es'>revista acad&eacute;mica</span></td><td><span lang='es'>diario</span>, a newspaper or a diary</td></tr><tr><th>to record</th><td><span lang='es'>anotar, registrar</span></td><td><span lang='es'>recordar</span>, to remember</td></tr><tr><th>index</th><td><span lang='es'>&iacute;ndice alfab&eacute;tico</span></td><td><span lang='es'>&iacute;ndice</span> alone, which often means the contents</td></tr><tr><th>archive</th><td><span lang='es'>archivo hist&oacute;rico</span></td><td><span lang='es'>archivo</span> alone can mean a computer file</td></tr><tr><th>folio</th><td><span lang='es'>cap&iacute;tulo</span>, in this book</td><td>a sheet of paper</td></tr></tbody></table><p class='small fill'>Most research words do match: <span lang='es'>fuente, art&iacute;culo, evidencia, m&eacute;todo</span>.</p></div><div class='num'>&middot; 73 &middot;</div><div class='shade'></div>","label":"Words that fool you"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Words in this book</h2><p class='small'>Each word in English and Spanish, with the page that teaches it. Tap the page to go there. A heritage-language dictionary is welcome for any other word.</p><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-doc'/></svg><strong>Abstract</strong><em lang='es'>resumen</em></div><p>A short summary the authors wrote. It is not the article.</p><button type='button' class='gtag' data-jump='18' aria-label='Go to page 14'>Page 14</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>Annotated bibliography</strong><em lang='es'>bibliograf&iacute;a anotada</em></div><p>A list of sources, each with a short paragraph about it.</p><button type='button' class='gtag' data-jump='77' aria-label='Go to page 64'>Page 64</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-box'/></svg><strong>Archive</strong><em lang='es'>archivo hist&oacute;rico</em></div><p>A collection of primary sources, kept and described by experts.</p><button type='button' class='gtag' data-jump='42' aria-label='Go to page 33'>Page 33</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>Citation</strong><em lang='es'>referencia</em></div><p>The author, title, publisher, and date that point to a source.</p><button type='button' class='gtag' data-jump='71' aria-label='Go to page 58'>Page 58</button></div></div><div class='num'>&middot; 74 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/></svg><strong>Container</strong><em lang='es'>contenedor</em></div><p>The larger thing that holds a source, like a journal.</p><button type='button' class='gtag' data-jump='73' aria-label='Go to page 60'>Page 60</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-search'/></svg><strong>Database</strong><em lang='es'>base de datos</em></div><p>A search site for articles. It shows who wrote each one, where, and when.</p><button type='button' class='gtag' data-jump='8' aria-label='Go to page 6'>Page 6</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-web'/></svg><strong>Digital object identifier</strong><em lang='es'>identificador de objeto digital</em></div><p>A lasting code for an article, printed as DOI. It starts with 10 and a dot.</p><button type='button' class='gtag' data-jump='75' aria-label='Go to page 62'>Page 62</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-compass'/></svg><strong>Finding aid</strong><em lang='es'>instrumento de descripci&oacute;n</em></div><p>The guide to one archive collection: who made it, and what is in it.</p><button type='button' class='gtag' data-jump='43' aria-label='Go to page 34'>Page 34</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/></svg><strong>Full text</strong><em lang='es'>texto completo</em></div><p>The whole article, not only the abstract.</p><button type='button' class='gtag' data-jump='18' aria-label='Go to page 14'>Page 14</button></div></div><div class='num'>&middot; 75 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-gap'/></svg><strong>Gap</strong><em lang='es'>vac&iacute;o</em></div><p>What studies have not looked at yet. A new study can start there.</p><button type='button' class='gtag' data-jump='33' aria-label='Go to page 26, AP Research'>Page 26<br><span class='gc'>AP Research</span></button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>In-text citation</strong><em lang='es'>cita en el texto</em></div><p>The short citation in your sentence, like (Chen and Diaz 47).</p><button type='button' class='gtag' data-jump='70' aria-label='Go to page 57'>Page 57</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/></svg><strong>Journal</strong><em lang='es'>revista acad&eacute;mica</em></div><p>A magazine for experts. Its articles report studies and make arguments.</p><button type='button' class='gtag' data-jump='7' aria-label='Go to page 5'>Page 5</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-search'/></svg><strong>Lateral reading</strong><em lang='es'>lectura lateral</em></div><p>Leaving a page to check it in new tabs.</p><button type='button' class='gtag' data-jump='55' aria-label='Go to page 44'>Page 44</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-chart'/></svg><strong>Margin of error</strong><em lang='es'>margen de error</em></div><p>How far off an estimate from a sample may be.</p><button type='button' class='gtag' data-jump='51' aria-label='Go to page 41'>Page 41</button></div></div><div class='num'>&middot; 76 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-chat'/></svg><strong>Oral history</strong><em lang='es'>historia oral</em></div><p>A recorded interview about the past. A primary source.</p><button type='button' class='gtag' data-jump='45' aria-label='Go to page 36'>Page 36</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-pen'/></svg><strong>Paraphrase</strong><em lang='es'>par&aacute;frasis</em></div><p>One idea from a source, in your own words, with a citation.</p><button type='button' class='gtag' data-jump='64' aria-label='Go to page 52'>Page 52</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/></svg><strong>Peer-reviewed</strong><em lang='es'>revisado por pares</em></div><p>Checked by other experts before it was published.</p><button type='button' class='gtag' data-jump='8' aria-label='Go to page 6'>Page 6</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-box'/></svg><strong>Primary source</strong><em lang='es'>fuente primaria</em></div><p>An original source: a study with its own data, an interview, a letter.</p><button type='button' class='gtag' data-jump='41' aria-label='Go to page 32'>Page 32</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-quote'/></svg><strong>Quotation</strong><em lang='es'>cita textual</em></div><p>The exact words, in quotation marks, with a citation.</p><button type='button' class='gtag' data-jump='64' aria-label='Go to page 52'>Page 52</button></div></div><div class='num'>&middot; 77 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Words in this book, continued</h3><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-link'/></svg><strong>Relevant</strong><em lang='es'>pertinente</em></div><p>It helps answer your question, not only your topic.</p><button type='button' class='gtag' data-jump='56' aria-label='Go to page 45'>Page 45</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-link'/></svg><strong>Secondary source</strong><em lang='es'>fuente secundaria</em></div><p>Writing that explains or judges primary sources.</p><button type='button' class='gtag' data-jump='41' aria-label='Go to page 32'>Page 32</button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-book'/></svg><strong>Stimulus text</strong><em lang='es'>texto de est&iacute;mulo</em></div><p>A source the College Board gives you for a task or the exam.</p><button type='button' class='gtag' data-jump='80' aria-label='Go to page 67, AP Seminar'>Page 67<br><span class='gc'>AP Seminar</span></button></div><div class='wrow'><div class='wt'><svg class='gi' aria-hidden='true'><use href='#i-search'/></svg><strong>Subject term</strong><em lang='es'>descriptor</em></div><p>The word a database uses for a topic, every time.</p><button type='button' class='gtag' data-jump='27' aria-label='Go to page 21'>Page 21</button></div></div><div class='num'>&middot; 78 &middot;</div><div class='shade'></div>","label":"Words in this book"},{"cls":"endpaper","html":"<div class='panel'><div class='kept'>THE LAST PAGE</div><div class='who' style='font-size:7.4cqw'>Read the source itself. Then log it, and cite it.</div><div class='meta' style='margin-top:3cqw'>Kept in Room 63<br>AP Capstone, Mater Academy<br>2026-27</div>{{TILDE}}<button type='button' class='loopbtn' data-jump='2'>Back to the contents</button></div><div class='shade'></div>","label":"The last page"},{"cls":"endpaper marbled","html":"<div class='shade'></div>","label":"Endpaper"},{"cls":"board lthr","html":"<svg class=\"A-art\" viewBox=\"0 0 720 1000\" preserveAspectRatio=\"none\" aria-hidden=\"true\" focusable=\"false\"><g filter=\"url(#A-grain)\"><rect class=\"A-leather\" width=\"720\" height=\"1000\"/><g filter=\"url(#A-recess)\"><ellipse class=\"A-onlay\" cx=\"360\" cy=\"500\" rx=\"150\" ry=\"112\"/></g></g><rect width=\"720\" height=\"1000\" fill=\"url(#A-vig)\"/><rect width=\"720\" height=\"1000\" fill=\"url(#A-sheen)\"/><rect width=\"22\" height=\"1000\" fill=\"url(#A-hinge)\" transform=\"translate(720 0) scale(-1 1)\"/><g filter=\"url(#A-gilt)\"><rect width=\"720\" height=\"100
