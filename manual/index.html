t-weight='700' font-size='22' fill='#9c3322'>63</text></svg><div class='kept'>THIS MANUAL BELONGS TO</div><div class='who' style='--nl:{{NLEN}}'>{{NAME}}</div><div class='meta'>{{META}}</div><div class='pick'><div class='drawers' role='group' aria-label='Your period'>{{DRAWERS}}</div></div><div class='box'>Where sources live, how to get in, and how to use what you find. Stuck at a login? Folio 13 shows what to do.</div><p class='small' style='margin:0'>Turn the page with the arrows, a tap on the page edge, or a drag of the corner.</p><p class='small' style='margin:1.4cqw 0 0'>Room 63 &middot; Mr. Portela &middot; AP Capstone &middot; 2026-27</p></div><div class='shade'></div>","label":"Kept by"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>Contents</h2><p class='small'>Tap a line to open that folio. New here? Start on page <button type='button' class='pj' data-jump='4' aria-label='Go to page 3'>3</button>.</p><div class='tochead'><span>FOLIO</span><span>PAGE</span></div><ul class='toc'><li><button type='button' data-jump='6'><span class='rn'>1</span><span class='tt'><span class='tl'>Where sources live</span><span class='ld' aria-hidden='true'></span><span class='pn'>5</span></span><span class='sb'>libraries, databases, archives, your course</span></button></li><li><button type='button' data-jump='11'><span class='rn'>2</span><span class='tt'><span class='tl'>Your library card</span><span class='ld' aria-hidden='true'></span><span class='pn'>9</span></span><span class='sb'>the Miami-Dade card, Libby</span></button></li><li><button type='button' data-jump='15'><span class='rn'>3</span><span class='tt'><span class='tl'>EBSCO and Gale</span><span class='ld' aria-hidden='true'></span><span class='pn'>12</span></span><span class='sb'>My AP, the AP Digital Portfolio</span></button></li><li><button type='button' data-jump='19'><span class='rn'>4</span><span class='tt'><span class='tl'>Free article databases</span><span class='ld' aria-hidden='true'></span><span class='pn'>15</span></span><span class='sb'>Google Scholar, CORE, ERIC, PubMed</span></button></li><li><button type='button' data-jump='25'><span class='rn'>5</span><span class='tt'><span class='tl'>Search words that work</span><span class='ld' aria-hidden='true'></span><span class='pn'>20</span></span><span class='sb'>the six rules, subject terms</span></button></li><li><button type='button' data-jump='30'><span class='rn'>6</span><span class='tt'><span class='tl'>Fix a search</span><span class='ld' aria-hidden='true'></span><span class='pn'>24</span></span><span class='sb'>too many, too few, other views</span></button></li><li><button type='button' data-jump='36'><span class='rn'>7</span><span class='tt'><span class='tl'>Books and ebooks</span><span class='ld' aria-hidden='true'></span><span class='pn'>29</span></span><span class='sb'>catalogs, free ebooks, one chapter</span></button></li></ul></div><div class='num'>&middot; 1 &middot;</div><div class='shade'></div>","label":"Contents"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Contents, continued</h3><div class='tochead'><span>FOLIO</span><span>PAGE</span></div><ul class='toc'><li><button type='button' data-jump='40'><span class='rn'>8</span><span class='tt'><span class='tl'>Archives</span><span class='ld' aria-hidden='true'></span><span class='pn'>32</span></span><span class='sb'>primary sources, finding aids</span></button></li><li><button type='button' data-jump='48'><span class='rn'>9</span><span class='tt'><span class='tl'>Numbers and data</span><span class='ld' aria-hidden='true'></span><span class='pn'>39</span></span><span class='sb'>labels, samples, margins</span></button></li><li><button type='button' data-jump='54'><span class='rn'>10</span><span class='tt'><span class='tl'>Check it</span><span class='ld' aria-hidden='true'></span><span class='pn'>44</span></span><span class='sb'>credible, relevant, scholarly</span></button></li><li><button type='button' data-jump='60'><span class='rn'>11</span><span class='tt'><span class='tl'>Read it and log it</span><span class='ld' aria-hidden='true'></span><span class='pn'>49</span></span><span class='sb'>read it, take notes, log it</span></button></li><li><button type='button' data-jump='68'><span class='rn'>12</span><span class='tt'><span class='tl'>Cite it</span><span class='ld' aria-hidden='true'></span><span class='pn'>56</span></span><span class='sb'>MLA 9, APA 7, annotations</span></button></li><li><button type='button' data-jump='81'><span class='rn'>13</span><span class='tt'><span class='tl'>When a door will not open</span><span class='ld' aria-hidden='true'></span><span class='pn'>68</span></span><span class='sb'>logins, cards, iPads</span></button></li></ul><div class='skey' style='margin-top:.6cqw'><svg class='fig' viewBox='0 0 320 91' role='img' aria-label='Signs in this book. A cross: weak, or not allowed. A warning triangle: a common mistake. A clipboard with checks: run the checks on your work. A flag: a date the College Board sets. A circle arrow: revise and try again. A shield: ethics review and permission. A microphone: speak out loud. A round number badge: a numbered note on a drawing, read in order. Handwriting, like my notes: words a student writes. A YES or NO box: the answer for a made-up case. A letter in a small square: a made-up outlet. A dark navy box: the goal or the last step. The tag A MADE-UP CASE: invented to show the idea; never for your own work. Tap a drawing to see it large.'><text x='4' y='10.5' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#9c3322'>SIGNS IN THIS BOOK </text><use href='#i-cross' x='4' y='13' width='12.5' height='12.5' style='color:#9c3322'/><text x='21' y='23' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>weak, or not allowed </text><use href='#i-warn' x='111' y='13' width='12.5' height='12.5' style='color:#9c3322'/><text x='128' y='23' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>a common mistake </text><use href='#i-test' x='216' y='13' width='12.5' height='12.5' style='color:#1f3a5a'/><text x='233' y='23' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>run the checks </text><use href='#i-flag' x='4' y='26' width='12.5' height='12.5' style='color:#9c3322'/><text x='21' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>a College Board date </text><use href='#i-loop' x='111' y='26' width='12.5' height='12.5' style='color:#1f3a5a'/><text x='128' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>revise, try again </text><use href='#i-shield' x='216' y='26' width='12.5' height='12.5' style='color:#1f3a5a'/><text x='233' y='36' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>ethics review </text><use href='#i-mic' x='4' y='39' width='12.5' height='12.5' style='color:#1f3a5a'/><text x='21' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>speak out loud </text><circle cx='117' cy='45.4' r='5.6' fill='#9c3322'/><text x='117' y='48.6' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='128' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>read in order </text><text x='216' y='49' font-family='Patrick Hand,cursive' font-size='12' font-weight='400' fill='#1f2a5a'>my notes </text><text x='262.3' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>you write it </text><rect x='4' y='52' width='24' height='12' rx='2' fill='#245e55'/><text x='16' y='61' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle'>YES </text><text x='32' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>the answer </text><rect x='111' y='51.5' width='12.5' height='12.5' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='117.2' y='61' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#1f3a5a' text-anchor='middle'>A </text><text x='128' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>a made-up outlet </text><rect x='216' y='52' width='14' height='11.5' rx='2' fill='#16294a'/><text x='233' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>goal or last step </text><text x='4' y='75' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31'>A MADE-UP CASE </text><text x='100.7' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a'>invented to show the idea; never for your own work. </text><text x='4' y='88' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a' font-style='italic'>Tap a drawing to see it large. </text></svg></div></div><div class='num'>&middot; 2 &middot;</div><div class='shade'></div>","label":"Contents"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h2>From a topic to five sources</h2><p>Do these steps in order.</p><table class='stages'><thead><tr><th>STEP</th><th>DO THIS</th><th>PAGE</th></tr></thead><tbody><tr><th>1<svg class='ti tn' aria-hidden='true'><use href='#i-search'/></svg></th><td>Turn your topic into search words.</td><td><button type='button' class='pj' data-jump='26' aria-label='Go to page 20'>20</button></td></tr><tr><th>2<svg class='ti tn' aria-hidden='true'><use href='#i-search'/></svg></th><td>Search a free database tonight.</td><td><button type='button' class='pj' data-jump='20' aria-label='Go to page 15'>15</button></td></tr><tr><th>3<svg class='ti tn' aria-hidden='true'><use href='#i-book'/></svg></th><td>Open the whole text.</td><td><button type='button' class='pj' data-jump='23' aria-label='Go to page 18'>18</button></td></tr><tr><th>4<svg class='ti tn' aria-hidden='true'><use href='#i-test'/></svg></th><td>Check it: credible and relevant?</td><td><button type='button' class='pj' data-jump='55' aria-label='Go to page 44'>44</button></td></tr><tr><th>5<svg class='ti tn' aria-hidden='true'><use href='#i-eye'/></svg></th><td>Read it. Log it the same day.</td><td><button type='button' class='pj' data-jump='61' aria-label='Go to page 49'>49</button></td></tr><tr><th>6<svg class='ti tn' aria-hidden='true'><use href='#i-quote'/></svg></th><td>Cite it: four parts, two places.</td><td><button type='button' class='pj' data-jump='71' aria-label='Go to page 58'>58</button></td></tr></tbody></table><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>FIVE TIMES</div><p>Do steps 2 to 6 for each source. More sources: page <button type='button' class='pj' data-jump='22' aria-label='Go to page 17'>17</button>. After five, tap the boxes on page <button type='button' class='pj' data-jump='86' aria-label='Go to page 72'>72</button>.</p></div><p class='small fill'>Sources in this book are for practice. Find your own for your task.</p></div><div class='num'>&middot; 3 &middot;</div><div class='shade'></div>","label":"Start here"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Find it fast</h3><p>Tap your problem. The page opens.</p><div class='tochead'><spa ine x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-compass'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Name the places sources live, the key that opens each one, and what your course asks.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Where sources live</span><span class='ld' aria-hidden='true'></span><span class='pn'>5</span></li><li><span class='it'>A database is not Google</span><span class='ld' aria-hidden='true'></span><span class='pn'>6</span></li><li><span class='it'>Your keys</span><span class='ld' aria-hidden='true'></span><span class='pn'>7</span></li><li><span class='it'>What your course asks of your sources</span><span class='ld' aria-hidden='true'></span><span class='pn'>8</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-compass'/></svg>FOLIO 1</p><h2>Where sources live</h2><p>A <strong>source</strong> is anything you use as evidence: a book, an article, a document, a set of numbers.</p><table class='stages'><thead><tr><th>PLACE</th><th>WHAT IS THERE</th><th>THE KEY</th></tr></thead><tbody><tr><th><svg class='ti' aria-hidden='true'><use href='#i-book'/></svg>Library</th><td>Books, ebooks, and newspapers.</td><td>A library card.</td></tr><tr><th><svg class='ti' aria-hidden='true'><use href='#i-search'/></svg>Article database</th><td>Articles by experts, in journals.</td><td>Your My AP class, a library card, or none.</td></tr><tr><th><svg class='ti' aria-hidden='true'><use href='#i-box'/></svg>Archive</th><td>Old letters, photos, maps, and newspapers.</td><td>Most are free online.</td></tr></tbody></table><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; JOURNAL &middot; <span lang='es'>revista acad&eacute;mica</span></div><p>A magazine for experts. Its articles report studies and make arguments.</p></div></div><div class='num'>&middot; 5 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A database is not Google</h3><figure class='plate'><div class='pl'><span>PLATE I</span><span>Same search, two lists</span></div><svg class='fig' viewBox='0 0 320 146' role='img' aria-label='The same search, bench dividers, in two places. A simple drawing, not the real screen, with made-up results. Google: it guesses what you meant. An ad, Buy outdoor benches; a blog, Why I hate new benches; news, County adds bench bars; a video, Benches, explained. Ranked by popularity. A database: it searches for your words. Two articles, Counting Hostile Design, and Who Is the Bench For?, each with its author, journal, and year. Each: author, journal, date.'><text x='4' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>GOOGLE </text><rect x='4' y='15' width='152' height='16' rx='8' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><use href='#i-search' x='9' y='18' width='10' height='10' style='color:#1f3a5a'/><text x='23' y='26.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>bench dividers </text><text x='4' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>It guesses what you meant. </text><text x='164' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>A DATABASE </text><rect x='164' y='15' width='152' height='16' rx='8' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1'/><use href='#i-search' x='169' y='18' width='10' height='10' style='color:#1f3a5a'/><text x='183' y='26.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>bench dividers </text><text x='164' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#245e55' font-style='italic'>It searches for your words. </text><rect x='4' y='49' width='152' height='15' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.8'/><text x='9' y='60' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>AD </text><text x='50' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Buy outdoor benches </text><rect x='4' y='66' width='152' height='15' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.8'/><text x='9' y='77' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>BLOG </text><text x='50' y='77' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Why I hate new benches </text><rect x='4' y='83' width='152' height='15' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.8'/><text x='9' y='94' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>NEWS </text><text x='50' y='94' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>County adds bench bars </text><rect x='4' y='100' width='152' height='15' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.8'/><text x='9' y='111' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>VIDEO </text><text x='50' y='111' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Benches, explained </text><rect x='164' y='49' width='152' height='32' rx='2' fill='#fffdf6' stroke='#245e55' stroke-width='1'/><text x='169' y='61' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Counting Hostile Design </text><text x='169' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#245e55' font-style='italic'>author \u00b7 journal \u00b7 year </text><rect x='164' y='83' width='152' height='32' rx='2' fill='#fffdf6' stroke='#245e55' stroke-width='1'/><text x='169' y='95' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Who Is the Bench For? </text><text x='169' y='109' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#245e55' font-style='italic'>author \u00b7 journal \u00b7 year </text><text x='4' y='128' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>Ranked by popularity. </text><text x='164' y='128' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#245e55' font-style='italic'>Each: author, journal, date. </text><text x='4' y='142' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>A simple drawing, not the real screen. Made-up results. </text></svg><figcaption><b>LOOK AT THE LIST</b>A database shows you who, where, and when.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; PEER-REVIEWED &middot; <span lang='es'>revisado por pares</span></div><p>Other experts checked the article before it was published. A database can show you only peer-reviewed articles.</p></div><p class='small fill'>Feels worse for ten minutes. Then it feels much better.</p></div><div class='num'>&middot; 6 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Your keys</h3><figure class='plate'><div class='pl'><span>PLATE II</span><span>Four keys</span></div><svg class='fig' viewBox='0 0 320 150' role='img' aria-label='Four keys, each on a tag with the doors it opens. The Miami-Dade library card opens Gale, newspapers, and Libby ebooks; get it: Folio 2. A College Board account, joined to your class, opens EBSCO, inside the AP Digital Portfolio; get it: Folio 3. The school Google account, Colegia, opens your Docs and Google Classroom; you have it. No key at all opens Google Scholar, CORE, ERIC, PubMed, and HathiTrust; Folios 4 and 7.'><rect x='4' y='4' width='154' height='69' rx='5' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='12' y='17' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Miami-Dade library card </text><text x='12' y='31' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Gale, newspapers, and Libby </text><text x='12' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>ebooks. </text><text x='12' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' font-style='italic'>Get it: Folio 2. </text><rect x='162' y='4' width='154' height='69' rx='5' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='170' y='17' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>College Board account, joined </text><text x='170' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>to your class </text><text x='170' y='43' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>EBSCO, inside the AP Digital </text><text x='170' y='55' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Portfolio. </text><text x='170' y='68' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' font-style='italic'>Get it: Folio 3. </text><rect x='4' y='77' width='154' height='69' rx='5' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='12' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>School Google account </text><text x='12' y='102' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>(Colegia) </text><text x='12' y='116' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Your Docs and Google </text><text x='12' y='128' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Classroom. </text><text x='12' y='141' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' font-style='italic'>You have it. </text><rect x='162' y='77' width='154' height='69' rx='5' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='170' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>No key at all </text><text x='170' y='104' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Google Scholar, CORE, ERIC, </text><text x='170' y='116' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>PubMed, and HathiTrust. </text><text x='170' y='129' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#9c3322' font-style='italic'>Folios 4 and 7. </text></svg><figcaption><b>KEYS</b>Pick the key before you try the door.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>Which key opens EBSCO?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Your College Board account, after you join your class in My AP.</p></div></div><div class='num'>&middot; 7 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What your course asks of your sources</h3><div class='S'><p>The College Board scores how you choose and use sources. Readers look for this, from the 2025 scoring guidelines.</p><table class='stages'><thead><tr><th>TASK</th><th>WHAT READERS LOOK FOR</th></tr></thead><tbody><tr><th>Research report, in the team project</th><td>A wide variety of sources. Credible academic sources. You show why each one is credible and relevant.</td></tr><tr><th>Written argument</th><td>At least one stimulus text, used in your argument. Evidence from scholarly work.</td></tr><tr><th>Both</th><td>Every source cited, in your sentences and in your list.</td></tr></tbody></table></div><div class='R'><p>The College Board scores how you choose and use sources. This is what it asks for.</p><table class='stages'><thead><tr><th>WHEN</th><th>WHAT YOU NEED</th></tr></thead><tbody><tr><th><svg class='ti tb' aria-hidden='true'><use href='#i-flag'/></svg>By November 30</th><td>Three key studies and the gap they leave, on your Inquiry Proposal Form.</td></tr><tr><th>All year</th><td>An annotated bibliography of the sources important to your work, in your Process and Reflection Portfolio.</td></tr><tr><th>The paper</th><td>Scholarly works with different views, the gap your study fills, and one citation style.</td></tr></tbody></table></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see what your course asks. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div></div><div class='num'>&middot; 8 &middot;</div><div class='shade'></div>","label":"Folio 1"},{"cls":"board chapter","label":"Folio 2","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>2</div><div class='ch-title'>Your library card</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-card'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Get a Miami-Dade library card, know what it opens, and use Libby on an iPad.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Get your library card</span><span class='ld' aria-hidden='true'></span><span class='pn'>9</span></li><li><span class='it'>What your card opens</span><span class='ld' aria-hidden='true'></span><span class='pn'>10</span></li><li><span class='it'>Libby on a school iPad</span><span class='ld' aria-hidden='true'></span><span class='pn'>11</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-card'/></svg>FOLIO 2</p><h2>Get your library card</h2><p class='small'>The card is free. People who live in Hialeah can get one.</p><table class='stages'><thead><tr><th>YOUR AGE</th><th>HOW TO GET IT</th></tr></thead><tbody><tr><th>16 or older</th><td>Apply online at <a href='https://card.mdpls.org' target='_blank' rel='noopener'>card.mdpls.org</a>, or at any branch.</td></tr><tr><th>15 or younger</th><td>Go to a branch with a parent or guardian. The online form will not take you.</td></tr></tbody></table><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>BRING</div><p>Your school ID, and mail from the last two months with your name and address. The names must match. No mail in your name? Ask the branch.</p></div><p class='small'><strong>PICK A PIN:</strong> four numbers you will remember.</p><p class='small fill'>Checked September 24, 2026. Door stuck? Folio 13.</p></div><div class='num'>&middot; 9 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>What your card opens</h3><table class='stages wide1'><thead><tr><th>DATABASE</th><th>USE IT FOR</th></tr></thead><tbody><tr><th>Gale OneFile: High School Edition</th><td>Magazines, newspapers, and reference books for high school.</td></tr><tr><th>Informe Acad&eacute;mico</th><td>Articles in Spanish.</td></tr><tr><th>NewsBank: Miami Herald and El Nuevo Herald</th><td>Local news, past and present.</td></tr><tr><th>The New York Times and The Wall Street Journal</th><td>National news.</td></tr></tbody></table><p class='small'>Gale asks for your card number. Libby also asks for your PIN.</p><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NO INTERNET AT HOME?</div><p>The library lends Wi-Fi hotspots and Chromebooks for 30 days, free with your card.</p></div><p class='small fill'>Start at <a href='https://mdpls.org/databases/databases.asp' target='_blank' rel='noopener'>mdpls.org, Learning and Training</a>. Checked September 24, 2026. Door stuck? Folio 13.</p></div><div class='num'>&middot; 10 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Libby on a school iPad</h3><table class='stages'><thead><tr><th>STEP</th><th>DO THIS</th></tr></thead><tbody><tr><th>1</th><td>Open <a href='https://libbyapp.com/library/mdpls' target='_blank' rel='noopener'>libbyapp.com/library/mdpls</a> in Safari.</td></tr><tr><th>2</th><td>Sign in with your card number and your PIN.</td></tr><tr><th>3</th><td>Search your topic. Borrow an ebook or an audiobook.</td></tr><tr><th>4</th><td>Done? Tap Menu, then Reset Everything. The next student will not see your card.</td></tr></tbody></table><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>CARD NUMBER</div><p>On the back of your card, under the barcode, or in the email from the library.</p></div><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>FORGOT YOUR PIN?</div><p>At mdpls.org, tap Log In, then Forgot your PIN/password. A link goes to the email on your card.</p></div></div><div class='num'>&middot; 11 &middot;</div><div class='shade'></div>","label":"Folio 2"},{"cls":"board chapter","label":"Folio 3","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>3</div><div class='ch-title'>EBSCO and Gale</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-people'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Join your class in My AP, open EBSCO, and choose between EBSCO and Gale.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Join your class in My AP</span><span class='ld' aria-hidden='true'></span><span class='pn'>12</span></li><li><span class='it'>EBSCO, free from the College Board</span><span class='ld' aria-hidden='true'></span><span class='pn'>13</span></li><li><span class='it'>EBSCO or Gale?</span><span class='ld' aria-hidden='true'></span><span class='pn'>14</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-people'/></svg>FOLIO 3</p><h2>Join your class in M 2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>Your topic is new to you. EBSCO or Gale first?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Gale. It is written for high school. Then move to EBSCO.</p></div></div><div class='num'>&middot; 14 &middot;</div><div class='shade'></div>","label":"Folio 3"},{"cls":"board chapter","label":"Folio 4","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>4</div><div class='ch-title'>Free article databases</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-web'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Search four free databases, follow one source to more, and open a locked article.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Free databases</span><span class='ld' aria-hidden='true'></span><span class='pn'>15</span></li><li><span class='it'>Google Scholar, three tools</span><span class='ld' aria-hidden='true'></span><span class='pn'>16</span></li><li><span class='it'>One good source leads to more</span><span class='ld' aria-hidden='true'></span><span class='pn'>17</span></li><li><span class='it'>Found it, but it is locked</span><span class='ld' aria-hidden='true'></span><span class='pn'>18</span></li><li><span class='it'>Which database fits?</span><span class='ld' aria-hidden='true'></span><span class='pn'>19</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-web'/></svg>FOLIO 4</p><h2>Free databases</h2><table class='stages'><thead><tr><th>DATABASE</th><th>BEST FOR</th><th>TIP</th></tr></thead><tbody><tr><th><a href='https://scholar.google.com' target='_blank' rel='noopener'>Google Scholar</a></th><td>Any topic.</td><td>Next page.</td></tr><tr><th><a href='https://core.ac.uk' target='_blank' rel='noopener'>CORE</a></th><td>Papers that are free to read.</td><td>Search by topic words.</td></tr><tr><th><a href='https://eric.ed.gov' target='_blank' rel='noopener'>ERIC</a></th><td>Schools and education.</td><td>Check &quot;Peer reviewed only&quot; and &quot;Full text available on ERIC.&quot;</td></tr><tr><th><a href='https://pubmed.ncbi.nlm.nih.gov' target='_blank' rel='noopener'>PubMed</a></th><td>Health and medicine.</td><td>Use the &quot;Free full text&quot; filter.</td></tr></tbody></table><p class='small fill'>All four are free. None needs an account to search. Tap a name to open it. Checked September 2026.</p></div><div class='num'>&middot; 15 &middot;</div><div class='shade'></div>","label":"Folio 4"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Google Scholar, three tools</h3><figure class='plate'><div class='pl'><span>PLATE V</span><span>One result, three tools</span></div><svg class='fig' viewBox='0 0 320 129' role='img' aria-label='A made-up result in Google Scholar: the title, Counting Hostile Design; Chen and Diaz, Street Design Quarterly, 2020. Under it, three links. 1, Cited by 12: newer papers that used it. 2, Related articles: papers like this one. 3, All versions: other copies; one may be free. 4, at the right, a PDF mark: a free copy. A simple drawing, not the real screen. Next page: Cited by, step by step.'><text x='316' y='11' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='end'>A MADE-UP RESULT </text><rect x='4' y='16' width='3 UAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>One good source leads to more</h3><p>Every good source points to others.</p><figure class='plate'><div class='pl'><span>PLATE VI</span><span>Back, forward, sideways</span></div><svg class='fig' viewBox='0 0 320 149' role='img' aria-label='One good source in the middle, Chen and Diaz, 2020, a made-up source. Back, to the left: the reference list at the end, older sources it used; names that come up again and again are the key voices. Forward, to the right: Cited by, in Google Scholar, newer sources that used it; they show how others answered it. A time arrow runs from older on the left to newer on the right. Below a line, sideways: the footnotes in a Wikipedia article. Sources to open.'><rect x='4' y='4' width='98' height='92' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='12' y='18' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>BACK </text><text x='12' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>The reference list at </text><text x='12' y='43.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>the end: older </text><text x='12' y='55' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>sources it used. </text><text x='12' y='66.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>Names that come up </text><text x='12' y='78' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>again and again are </text><text x='12' y='89.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>the key voices. </text><rect x='114' y='22' width='92' height='56' rx='4' fill='#16294a'/><text x='160' y='38' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#e8c878' text-anchor='middle'>One good source </text><text x='160' y='52' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>Chen and Diaz, 2020 </text><text x='160' y='67' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#f3e3bd' text-anchor='middle' font-style='italic'>A made-up source </text><rect x='218' y='4' width='98' height='92' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='226' y='18' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>FORWARD </text><text x='226' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>Cited by, in Google </text><text x='226' y='43.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>Scholar: newer </text><text x='226' y='55' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>sources that used it. </text><text x='226' y='66.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>They show how </text><text x='226' y='78' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>others answered it. </text><path d='M113 50 L103 50' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M107.3 47.5 L103 50 L107.3 52.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M207 50 L217 50' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M212.7 52.5 L217 50 L212.7 47.5' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M142 106 L10 106' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M14.3 10 list: the database&#39;s own words: Subjects: Floods; Urban drainage; Canals; Florida.'><text x='316' y='9' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='end'>A MADE-UP RECORD </text><circle cx='11' cy='17.4' r='6.6' fill='#9c3322'/><text x='11' y='20.7' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='22' y='21' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'><tspan fill='#1f3a5a' font-weight='700'>Stormwater and Canal Flooding in South Florida</tspan> </text><text x='22' y='33' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>The title: the expert&#39;s name for your topic. </text><circle cx='11' cy='46.4' r='6.6' fill='#9c3322'/><text x='11' y='49.7' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='22' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'><tspan fill='#1f3a5a' font-weight='700' text-decoration='underline'>Canal</tspan><tspan fill='#4a3f31' font-weight='600'> </tspan><tspan fill='#1f3a5a' font-weight='700' text-decoration='underline'>stormwater</tspan><tspan fill='#4a3f31' font-weight='600'> rose. </tspan><tspan fill='#1f3a5a' font-weight='700' text-decoration='underline'>Stormwater</tspan><tspan fill='#4a3f31' font-weight='600'> rose most by narrow </tspan><tspan fill='#1f3a5a' font-weight='700' text-decoration='underline'>canals</tspan><tspan fill='#4a3f31' font-weight='600'>.</tspan> </text><text x='22' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>The abstract: words used two or more times. </text><circle cx='11' cy='75.4' r='6.6' fill='#9c3322'/><text x='11' y='78.7' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='22' y='79' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'><tspan fill='#4a3f31' font-weight='600'>Subjects: Floods; Urban drainage; Canals; Florida</tspan> </text><text x='22' y='91' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>The subject list: the database&#39;s own words. </text></svg><figcaption><b>BORROW</b>Use them in your next search.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; SUBJECT TERM &middot; <span lang='es'>descriptor</span></div><p>The word a database uses for a topic, every time. ERIC calls them Descriptors.</p></div><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>In ERIC, chronic absenteeism kept showing one Descriptor. Which one? What is the next search?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Attendance. Next: attendance AND Florida. ERIC, September 24, 2026.</p></div></div><div class='num'>&middot; 21 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The six rules</h3><table class='stages'><thead><tr><th>RULE</th><th>WHAT IT DOES</th><th>EXAMPLE</th></tr></thead><tbody><tr class='tier'><th colspan='3'>FIRST STEP</th></tr><tr><th>AND</th><td>Narrows: both words.</td><td>social media AND anxiety</td></tr><tr><th>&quot; &quot;</th><td>Keeps a phrase together.</td><td>&quot;sea level rise&quot;</td></tr><tr class='tier'><th colspan='3'>NEXT STEP</th></tr><tr><th>OR</th><td>Widens: either word.</td><td>teens OR adolescents</td></tr><tr class='tier'><th colspan='3'>GOING FURTHER</th></tr><tr><th>NOT</th><td>Leaves a word out.</td><td>dolphins NOT Miami</td></tr><tr><th>*</th><td>Finds word endings.</td><td>adolescen*</td></tr><tr><th>( )</th><td>Groups words.</td><td>(teens OR youth) AND sleep</td></tr></tbody></table><p class='small fill'>Type AND, OR, NOT in capitals. Google and Google Scholar take quotation marks. In both, use a minus sign for NOT: dolphins -Miami. The * does not work there.</p></div><div class='num'>&middot; 22 &middot;</div><div class='shade'></div>","label":"Folio 5"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>The rules in pictures</h3><figure class='plate'><div class='pl'><span>PLATE X</span><span>What the database gives you</span></div><svg class='fig' viewBox='0 0 320 152' role='img' aria-label='Three pairs of circles, A and B. The dark part is what the database gives you. AND: A is social media, B is anxiety. Only the overlap is dark, so you get both words. OR: A is teens, B is adolescents. Both circles are dark, so you get either word. NOT: A is dolphins, B is Miami. Circle A is dark except where it overlaps B, so you get A, not B.'><path d='M56 25.3 A24 24 0 0 1 56 62.7 A24 24 0 0 1 56 25.3 Z' fill='#245e55'/><circle cx='41' cy='44' r='24' fill='none' stroke='#1f3a5a' stroke-width='1.6'/><circle cx='71' cy='44' r='24' fill='none' stroke='#1f3a5a' stroke-width='1.6'/><text x='28' y='14' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>A </text><text x='84' y='14' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>B </text><text x='56' y='88' font-family='Space Mono,Courier New,monospace' font-size='12' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AND </text><text x='56' y='102' font-family='Cormorant Garamond,Georgia,serif' font-size='1 xt><text x='79' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a' text-anchor='middle'>363 results </text><path d='M8 40 L150 40 L106 66 L52 66 Z' fill='#f3e3bd' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='79' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>AND &quot;high school&quot; </text><rect x='44' y='68' width='70' height='32' rx='4' fill='#16294a'/><text x='79' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='12' font-weight='700' fill='#e8c878' text-anchor='middle'>122 </text><text x='79' y='95' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd' text-anchor='middle'>results </text><text x='4' y='114' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>ERIC, counted September 24, 2026. </text><path d='M170 8 L170 22' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M167.5 17.7 L170 22 L172.5 17.7' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='178' y='18' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>TOO MANY: NARROW </text><text x='166' y='32' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Add a place or a group: AND </text><text x='166' y='44' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Miami. Or turn on a filter. </text><path d='M170 70 L170 56' fill='none' stroke='#245e55' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M172.5 60.3 L170 56 L167.5 60.3' fill='none' stroke='#245e55' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='178' y='66' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#245e55'>TOO FEW: WIDEN </text><text x='166' y='80' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Take out the place. Add OR </text><text x='166' y='92' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>words. Or try another database. </text><text x='166' y='107' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' font-style='italic'>A good list: one you can read </text><text x='166' y='119' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' font-style='italic'>title by title. </text></svg><figcaption><b>NARROW OR WIDEN</b>Change one thing, then count again.</figcaption></figure><table class='stages'><thead><tr><th>WHERE</th><th>A FILTER TO TRY</th></tr></thead><tbody><tr><th>ERIC</th><td>Peer reviewed only.</td></tr><tr><th>PubMed</th><td>Free full text.</td></tr><tr><th>Google Scholar</th><td>Since a year, or Sort by date.</td></tr></tbody></table><p class='small fill'>The counts are real. Counted September 24, 2026.</p></div><div class='num'>&middot; 24 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Find the other views</h3><p>One search often finds one side. Look for the others.</p><figure class='plate'><div class='pl'><span>PLATE XIII</span><span>Other views</span></div><svg class='fig' viewBox='0 0 320 142' role='img' aria-label='A tree from one ERIC search: cell phone or smartphone, and school, and ban: 27 results. Three branches. Add a stakeholder, AND parents: 7. Swap: the other side&#39;s words for school AND ban, classroom AND benefits: 79, a second view. Dead end: AND critics or opposition; articles rarely use those words: 0. ERIC, counted September 24, 2026. The numbers are results.'><rect x='4' y='4' width='312' height='20' rx='4' fill='#16294a'/><text x='12' y='18' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#f3e3bd'><tspan fill='#e8c878' font-weight='700' font-family='Space Mono,Courier New,monospace' font-size='10'>ERIC: </tspan><tspan fill='#f3e3bd' font-weight='700' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5'>(&quot;cell phone&quot; OR smartphone) AND school AND ban: </tspan><tspan fill='#e8c878' font-weight='700' font-family='Cormorant Garamond,Georgia,serif' font-size='11'>27</tspan> </text><path d='M12 24 L12 32' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><rect x='22' y='32' width='294' height='20' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='30' y='45.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>ADD </text><text x='98' y='45.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>A stakeholder: AND parents. </text><text x='308' y='45.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='end'>7 </text><rect x='22' y='56' width='294' height='32' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='30' y='69.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>SWAP </text><text x='98' y='69.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The other side&#39;s words for school AND </text><text x='98' y='81.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>ban: classroom AND benefits. </text><text x='308' y='69.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='end'>79: a </text><text x='308' y='81.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='end'>second view </text><rect x='22' y='92' width='294' height='32' rx='4' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><text x='30' y='105.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>DEAD END </text><text x='98' y='105.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>AND (critics OR opposition). Articles </text><text x='98' y='117.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>rarely use those words. </text><text x='308' y='105.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' text-anchor='end'>0 </text><path d='M12 32 L12 102' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M12 42 L21 42' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 44 L21 42 L17.5 40' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M12 66 L21 66' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 68 L21 66 L17.5 64' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M12 102 L21 102' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 104 L21 102 L17.5 100' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='4' y='137' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>ERIC, counted September 24, 2026. The numbers are results. </text></svg><figcaption><b>BRANCH</b>Change the words to find the other side.</figcaption></figure><p class='small'>Read titles too: &quot;From Ban to Balance&quot; is a second view.</p><div class='card2 S' style='margin-top:1.2cqw'><div class='k'>AP SEMINAR</div><p>Views can agree, extend, limit, or contradict each other. Find a range.</p></div><div class='card2 R' style='margin-top:1.2cqw'><div class='k'>AP RESEARCH</div><p>Swap ban for a method word: school AND survey, 231. Studies that disagree can point to a gap.</p></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see the note for your course. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div><p class='small fill'>Counted September 24, 2026.</p></div><div class='num'>&middot; 25 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><span class='S'>Search by lens</span><span class='R'>Find the key studies and the gap</span><span class='P'>Search for your course</span></h3><div class='S'><p>In the team project, you research one lens, approach, or range of views. Put it in your search words.</p><table class='stages'><thead><tr><th>LENS</th><th>ADD A WORD</th><th>EXAMPLE</th></tr></thead><tbody><tr><th>Economic</th><td>cost</td><td>&quot;school start times&quot; AND cost</td></tr><tr><th>Ethical</th><td>fairness</td><td>&quot;school start times&quot; AND fairness</td></tr><tr><th>Scientific</th><td>sleep</td><td>&quot;school start times&quot; AND sleep</td></tr><tr><th>Political</th><td>policy</td><td>&quot;school start times&quot; AND policy</td></tr></tbody></table><p class='small'>The eight lenses: cultural and social, artistic and philosophical, political and historical, environmental, economic, scientific, futuristic, ethical.</p></div><div class='R'><p>Your proposal needs three key studies and the gap they leave.</p><table class='stages'><thead><tr><th>STEP</th><th>DO THIS</th></tr></thead><tbody><tr><th>1</th><td>Search your topic with the word review. In PubMed, use the Review filter.</td></tr><tr><th>2</th><td>Open the review's reference list. Which studies does it name most?</td></tr><tr><th>3</th><td>Read their Limitations and Future Directions parts.</td></tr><tr><th>4</th><td>Sort by date. Is the question still open?</td></tr><tr><th>5</th><td>Write the gap in one sentence: No study has looked at ___ in ___.</td></tr></tbody></table></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see your course's search. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div></div><div class='num'>&middot; 26 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Sources in Spanish</h3><p>Many Miami sources are in Spanish. They count. Search them with Spanish words.</p><table class='stages'><thead><tr><th>SOURCE</th><th>WHAT IS THERE</th><th>THE KEY</th></tr></thead><tbody><tr><th>Informe Acad&eacute;mico</th><td>Articles in Spanish.</td><td>Library card.</td></tr><tr><th>El Nuevo Herald, in NewsBank</th><td>Miami news in Spanish.</td><td>Library card.</td></tr><tr><th><a href='https://www.loc.gov/resource/sn82001257/1961-07-16/ed-1/' target='_blank' rel='noopener'><em>Diario las Am&eacute;ricas</em></a></th><td>Old issues of a Miami daily paper, 1953 to 1963, in Chronicling America. In Spanish, with an English last page until August 1958.</td><td>None.</td></tr><tr><th><a href='https://redalyc.org' target='_blank' rel='noopener'>Redalyc</a></th><td>Free journals from Latin America, Spain, and Portugal.</td><td>None.</td></tr></tbody></table><p class='small fill'>Quoting ect x='4' y='134' width='312' height='30' rx='3' fill='#16294a'/><circle cx='14' cy='149' r='6.6' fill='#9c3322'/><text x='14' y='152.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>6 </text><text x='25' y='146.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#f3e3bd'>Still stuck? Bring your Research Log and your </text><text x='25' y='158.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#f3e3bd'>search words to class. </text></g></svg><figcaption><b>ONE AT A TIME</b>Try a step, search again, then go on.</figcaption></figure><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>Zero results for &quot;school start times in Hialeah.&quot; What do you change?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Take off the quotation marks. Still zero? Change Hialeah to Florida.</p></div></div><div class='num'>&middot; 28 &middot;</div><div class='shade'></div>","label":"Folio 6"},{"cls":"board chapter","label":"Folio 7","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>7</div><div class='ch-title'>Books and ebooks</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-book'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Find a book, read it for free, and use only the chapter you need.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Find a book</span><span class='ld' aria-hidden='true'></span><span class='pn'>29</span></li><li><span class='it'>Free books online, no card</span><span class='ld' aria-hidden='true'></span><span class='pn'>30</span></li><li><span class='it'>Use a book without reading all of it</span><span class='ld' aria-hidden='true'></span><span class='pn'>31</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-book'/></svg>FOLIO 7</p><h2>Find a book</h2><table class='stages'><thead><tr><th>WHERE</th><th>WHAT YOU GET</th></tr></thead><tbody><tr><th>Miami-Dade library catalog</th><td>Books at every branch. Put one on hold with your card.</td></tr><tr><th><a href='https://search.worldcat.org' target='_blank' rel='noopener'>WorldCat</a></th><td>The libraries near you that own the book.</td></tr><tr><th>Libby</th><td>Ebooks and audiobooks, with a Miami-Dade card. An ebook counts as a book.</td></tr><tr><th><a href='https://ebook.yourcloudlibrary.com' target='_blank' rel='noopener'>cloudLibrary</a></th><td>Ebooks and audiobooks, with a City of Hialeah card. That card does not open Gale or Libby.</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>Find one book on your topic in WorldCat. Which library near you owns it?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Search the title. WorldCat lists libraries by distance from you.</p></div></div><div class='num'>&middot; 29 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Free books online, no card</h3><table class='stages'><thead><tr><th>SITE</th><th>WHAT IS FREE</th></tr></thead><tbody><tr><th><a href='https://openlibrary.org' target='_blank' rel='noopener' ont-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Bibliography: more sources. </text><text x='22' y='184' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#1f3a5a' font-style='italic'>In Spanish, the index is the \u00edndice alfab\u00e9tico. </text></svg><figcaption><b>MOST BOOKS</b>Use the parts in the order of the numbers.</figcaption></figure><p class='small fill'>In an ebook, the search box works like the index. Write down the pages you read.</p></div><div class='num'>&middot; 31 &middot;</div><div class='shade'></div>","label":"Folio 7"},{"cls":"board chapter","label":"Folio 8","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>8</div><div class='ch-title'>Archives</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-box'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Tell a primary source from a secondary one, search an archive, and record what you find.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Primary or secondary?</span><span class='ld' aria-hidden='true'></span><span class='pn'>32</span></li><li><span class='it'>Archives to start with</span><span class='ld' aria-hidden='true'></span><span class='pn'>33</span></li><li><span class='it'>How an archive is sorted</span><span class='ld' aria-hidden='true'></span><span class='pn'>34</span></li><li><span class='it'>Search an archive</span><span class='ld' aria-hidden='true'></span><span class='pn'>35</span></li><li><span class='it'>Oral histories</span><span class='ld' aria-hidden='true'></span><span class='pn'>36</span></li><li><span class='it'>Log and cite an archive item</span><span class='ld' aria-hidden='true'></span><span class='pn'>37</span></li><li><span class='it'>Miami archives, in person</span><span class='ld' aria-hidden='true'></span><span class='pn'>38</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-box'/></svg>FOLIO 8</p><h2>Primary or secondary?</h2><table class='stages'><thead><tr><th>KIND</th><th>WHAT IT IS</th></tr></thead><tbody><tr><th>Primary</th><td>An original source: a study with its own data, a data set, an interview, an artifact, an old letter.</td></tr><tr><th>Secondary</th><td>Writing that explains or judges primary sources: a textbook, a review of studies.</td></tr></tbody></table><p>A journal article can be either. A study that reports its own count is primary. An article that argues about other studies is secondary.</p><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>A historian's 1998 book on the 1962 flights from Cuba, in an archive. Primary or secondary?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Secondary. It explains other sources. Old or archived does not mean primary.</p></div></div><div class='num'>&middot; 32 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Archives to start with</h3><div class='card2 ' style='margin:0 0 1cqw'><div class='k'>ARCHIVE &middot; <span lang='es'>archivo hist&oacute;rico</span></div><p>A collection of primary sources, kept and described by experts.</p></div><table class='stages'><thead><tr><th>ARCHIVE</th><th>WHAT IS THERE</th></tr></thead><tbody><tr><th><a href='https://www.loc.gov/collections/chronicling-america/' target='_blank' rel='noopener'>Chronicling America</a></th><td>Library of Congress. Old United States newspapers, up to 1963.</td></tr><tr><th><a href='https://dp.la/primary-source-sets' target='_blank' rel='noopener'>Digital Public Library of America</a></th><td>Source sets, like Cuban immigration after 1959.</td></tr><tr><th><a href='https://floridamemory.com' target='_blank' rel='noopener'>Florida Memory</a></th><td>More than 200,000 Florida photos, plus maps and audio.</td></tr><tr><th><a href='https://library.miami.edu/chc/digitalcollections.html' target='_blank' rel='noopener'>Cuban Heritage Collection</a></th><td>University of Miami. Cuban photos, postcards, and exile interviews.</td></tr><tr><th><a href='https://museumofmiami.org/collections/research-the-collection/' target='_blank' rel='noopener'>Museum of Miami</a></th><td>Miami history. It used to be HistoryMiami.</td></tr></tbody></table><p class='small fill'>Checked September 24, 2026.</p></div><div class='num'>&middot; 33 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>How an archive is sorted</h3><p>An archive sorts its papers in levels, from big to small.</p><figure class='plate'><div class='pl'><span>PLATE XVI</span><span>Big to small</span></div><svg class='fig' viewBox='0 0 320 164' role='img' aria-label='Four boxes, one inside the next, from big to small, under the finding aid, the guide on top that says what is inside. Collection: everything from one person, family, or group. Series: papers of one kind. Folder: a few items, inside a box. Item: one thing. Made-up example: a family&#39;s papers, their letters, letters from 1961, one letter.'><rect x='4' y='15' width='312' height='20' rx='3' fill='#16294a'/><text x='12' y='29' font-family='Cormorant Garamond,Georgia,serif'
