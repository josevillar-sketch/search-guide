 font-size='11.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>S </text><text x='4' y='49' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>A search for REFUGEES misses this page. Try other spellings, too. </text><text x='4' y='61' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>A made-up headline and a made-up misreading. </text></svg><figcaption><b>CHRONICLING AMERICA</b>A machine read the old pages. No one fixed its mistakes.</figcaption></figure><table class='stages wide1'><thead><tr><th>SEARCH THE WAY THEY WROTE</th><th>WHY</th></tr></thead><tbody><tr><th>Use the words of the time.</th><td>Papers from the 1960s say &quot;Cuban refugees.&quot;</td></tr><tr><th>Use the place names of the time.</th><td>Towns and streets change names.</td></tr><tr><th>Search in Spanish, too.</th><td>Miami had daily papers in Spanish. Try Am&eacute;ricas and Americas.</td></tr><tr><th>Narrow by date and place.</th><td>If the site lets you.</td></tr></tbody></table><p class='small fill'>Nothing found? Browse the collection instead.</p></div><div class='num'>&middot; 35 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Oral histories</h3><p>An oral history is a recorded interview about the past. It is a primary source. It is also memory, told years later.</p><figure class='plate'><div class='pl'><span>PLATE XVIII</span><span>Two dates</span></div><svg class='fig' viewBox='0 0 320 95' role='img' aria-label='A time line. 1961, it happened: a square. 2005, they spoke: a triangle. Today: a diamond. A bracket over the years between 1961 and 2005 says memory, told years later. Write who speaks, and both dates. Check names and dates against a second source. Quote it and cite it. Do not repost the video. A made-up case: events in 1961, told in 2005.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>1961: IT HAPPENED </text><text x='196' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>2005: THEY SPOKE </text><text x='316' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>TODAY </text><path d='M10 22 L310 22' fill='none' stroke='#4a3f31' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><rect x='25' y='17' width='10' height='10' rx='0' fill='#1f3a5a'/><path d='M196 16 L202 27 L190 27 Z' fill='#1f3a5a' stroke='#1f3a5a' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><rect x='292' y='18' width='8' height='8' fill='#9c3322' transform='rotate(45 296 22)'/><path d='M30 30 L30 35 L196 35 L196 30' fill='none' stroke='#9c3322' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/><text x='113' y='48' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>memory, told years later </text><text x='4' y='65' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Write who speaks, and both dates. Check names and dates </text><text x='4' y='77' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>against a second source. Quote it and cite it. Do not repost the video. </text><text x='4' y='91' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>A made-up case: events in 1961, told in 2005. </text></svg><figcaption><b>USE IT WELL</b>An oral history is a source, and a memory.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>START HERE</div><p><a href='https://digitalcollections.library.miami.edu/digital/collection/chc5212' target='_blank' rel='noopener'>Luis J. Botifoll Oral History Project</a>, Cuban Heritage Collection: videos of Cuban exiles, some with transcripts. Most are in Spanish.</p></div><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'><svg class='ki' aria-hidden='true'><use href='#i-shield'/></svg>YOUR OWN INTERVIEW</div><p>That is primary research. I review your plan for ethics before you record anyone.</p></div></div><div class='num'>&middot; 36 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Log and cite an archive item</h3><table class='stages'><thead><tr><th>WRITE DOWN</th><th>EXAMPLE</th></tr></thead><tbody><tr><th>Who made it</th><td>No name? Skip it.</td></tr><tr><th>The title</th><td>The headline of the article.</td></tr><tr><th>The paper, the date, and the page</th><td><em>Diario las Am&eacute;ricas</em>, 16 July 1961, p. 1.</td></tr><tr><th>The archive</th><td>Chronicling America, Library of Congress.</td></tr><tr><th>The web address of that page</th><td>www.loc.gov/resource/sn82001257/1961-07-16/ed-1/?sp=1</td></tr><tr><th>Box or folder</th><td>Only if the archive gives a number.</td></tr></tbody></table><p class='small fill'>Write these the day you open it. An archive's own citation can be wrong: check it. Page gone? Try <a href='https://web.archive.org' target='_blank' rel='noopener'>web.archive.org</a>.</p></div><div class='num'>&middot; 37 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Miami archives, in person</h3><table class='stages'><thead><tr><th>ARCHIVE</th><th>HOW TO ASK</th></tr></thead><tbody><tr><th>Miami-Dade Main Library, Special Collections</th><td>specialcollections@mdpls.org. Cuban oral histories. 17,500 Romer photos of Miami; many are online.</td></tr><tr><th>Cuban Heritage Collection, University of Miami</th><td>chc@miami.edu, at least 7 days ahead. Ask for items with an Aeon account.</td></tr><tr><th>Museum of Miami</th><td>archives@museumofmiami.org. By appointment, Wednesday to Friday, noon to 4.</td></tr></tbody></table><div class='card2 good' style='margin-top:1.2cqw'><div class='k'>FIRST</div><p>Ask me. Then email the archive your question and the collection you want. Ask what you may bring: some rooms allow pencils only.</p></div><p class='small fill'>Most archive work is online. Some papers are only in a reading room. Checked September 24, 2026.</p></div><div class='num'>&middot; 38 &middot;</div><div class='shade'></div>","label":"Folio 8"},{"cls":"board chapter","label":"Folio 9","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>9</div><div class='ch-title'>Numbers and data</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-chart'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Find a trusted number, read its label, and say where it came from.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Numbers you can trust</span><span class='ld' aria-hidden='true'></span><span class='pn'>39</span></li><li><span class='it'>Read the label first</span><span class='ld' aria-hidden='true'></span><span class='pn'>40</span></li><li><span class='it'>A sample and its margin of error</span><span class='ld' aria-hidden='true'></span><span class='pn'>41</span></li><li><span class='it'>One number, four questions</span><span class='ld' aria-hidden='true'></span><span class='pn'>42</span></li><li><span class='it'><span class='S'>Use a number in your argument</span><span class='R'>Someone else's data for your study</span><span class='P'>Numbers for your course</span></span><span class='ld' aria-hidden='true'></span><span class='pn'>43</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-chart'/></svg>FOLIO 9</p><h2>Numbers you can trust</h2><table class='stages'><thead><tr><th>SOURCE</th><th>WHAT IS THERE</th></tr></thead><tbody><tr><th><a href='https://census.gov/quickfacts/fact/table/hialeahcityflorida/PST045224' target='_blank' rel='noopener'>Census QuickFacts</a></th><td>Facts about a city. Hialeah: about 230,968 people (estimate, July 1, 2025).</td></tr><tr><th><a href='https://coast.noaa.gov/slr' target='_blank' rel='noopener'>NOAA Sea Level Rise Viewer</a></th><td>Flood maps as the sea rises. Turn the iPad sideways.</td></tr><tr><th><a href='https://gis-mdc.opendata.arcgis.com' target='_blank' rel='noopener'>Miami-Dade County Open Data</a></th><td>County data you can download.</td></tr><tr><th><a href='https://data.worldbank.org' target='_blank' rel='noopener'>World Bank Open Data</a></th><td>Numbers for every country.</td></tr></tbody></table><p class='small fill'>Checked September 24, 2026.</p></div><div class='num'>&middot; 39 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Read the label first</h3><p>A number comes with a label. Read all of it before you use the number.</p><figure class='plate'><div class='pl'><span>PLATE XIX</span><span>Read all of it</span></div><svg class='fig' viewBox='0 0 320 169' role='img' aria-label='Census QuickFacts, Hialeah. The whole label: Median households income (in 2024 dollars), 2020-2024: 55,594 dollars. Pulled apart: 1, median: the middle value; half are above it, half below. 2, in 2024 dollars: the units, dollars at their 2024 value. 3, 2020 to 2024: survey answers from five years, put together. 4, 55,594 dollars: the number; copy all of the label, not only this. S in place of a number: it did not meet the standards to publish. Census QuickFacts, checked September 24, 2026. The label is printed as the site words it.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>CENSUS QUICKFACTS, HIALEAH </text><rect x='4' y='17' width='312' height='21' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='10' y='31.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>Median households income (in 2024 dollars), 2020-2024: $55,594 </text><circle cx='11' cy='50.5' r='6.6' fill='#9c3322'/><text x='11' y='53.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='22' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Median </text><text x='116' y='54' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The middle value. Half are above it, half </text><text x='116' y='66' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>below. </text><path d='M4 74 L316 74' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><circle cx='11' cy='79.5' r='6.6' fill='#9c3322'/><text x='11' y='82.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='22' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>(in 2024 dollars) </text><text x='116' y='83' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The units: dollars, at their 2024 value. </text><path d='M4 91 L316 91' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><circle cx='11' cy='96.5' r='6.6' fill='#9c3322'/><text x='11' y='99.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='22' y='100' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>2020-2024 </text><text x='116' y='100' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Survey answers from five years, put together. </text><path d='M4 108 L316 108' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><circle cx='11' cy='113.5' r='6.6' fill='#9c3322'/><text x='11' y='116.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='22' y='117' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>$55,594 </text><text x='116' y='117' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The number. Copy all of the label, not only </text><text x='116' y='129' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>this. </text><path d='M4 137 L316 137' fill='none' stroke='#4a3f31' stroke-width='0.6' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='1 2'/><text x='4' y='149' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'><tspan fill='#1f3a5a' font-weight='700' font-family='Space Mono,Courier New,monospace' font-size='10'>S </tspan><tspan fill='#4a3f31' font-weight='600' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5'>in place of a number: it did not meet the standards to publish.</tspan> </text><text x='4' y='164' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>Census QuickFacts, checked September 24, 2026. The label is printed as the site words it. </text></svg><figcaption><b>THE LABEL</b>Each part changes what the number means.</figcaption></figure><p class='small fill'>Copy the whole label into your log, not only $55,594. Checked September 24, 2026.</p></div><div class='num'>&middot; 40 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>A sample and its margin of error</h3><p>Most numbers about people come from a sample: some people answer for everyone. So the number is an estimate. The margin of error says how far off it may be.</p><figure class='plate'><div class='pl'><span>PLATE XX</span><span>Two ranges</span></div><svg class='fig' viewBox='0 0 320 150' role='img' aria-label='A number line of median household income, from 52,000 to 60,000 dollars. Top row, a square: Hialeah, 2020 to 2024: 55,594 dollars, plus or minus 1,624, so a range from 53,970 to 57,218 dollars. Second row, a diamond: a made-up smaller group. Fewer people answered, so its range is wider: a dashed range from about 53,500 to 59,500 dollars. A shaded band marks the overlap of the two ranges. Ranges overlap: you cannot yet say one is bigger. Top row: Census QuickFacts, checked September 24, 2026.'><rect x='6' y='5' width='8' height='8' rx='0' fill='#1f3a5a'/><text x='20' y='13' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#1f3a5a'><tspan fill='#1f3a5a' font-weight='700' font-family='Space Mono,Courier New,monospace' font-size='10'>HIALEAH, 2020 TO 2024: </tspan><tspan fill='#1f3a5a' font-weight='700' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5'>$55,594, plus or minus $1,624</tspan> </text><rect x='6' y='22' width='8' height='8' fill='#9c3322' transform='rotate(45 10 26)'/><text x='20' y='30' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>A MADE-UP SMALLER GROUP </text><text x='20' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' font-style='italic'>Fewer people answered, so its range is wider. </text><rect x='93' y='47' width='113.7' height='44' rx='0' fill='#f3e3bd'/><text x='149.8' y='57' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>OVERLAP </text><path d='M93 69 L206.6 69' fill='none' stroke='#1f3a5a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M93 63 L93 75' fill='none' stroke='#1f3a5a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M206.6 63 L206.6 75' fill='none' stroke='#1f3a5a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><rect x='145.8' y='65' width='8' height='8' rx='0' fill='#1f3a5a'/><text x='88' y='72.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>$53,970 </text><text x='211.6' y='72.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#1f3a5a'>$57,218 </text><path d='M76.5 83 L286.5 83' fill='none' stroke='#9c3322' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='5 3'/><path d='M76.5 77 L76.5 89' fill='none' stroke='#9c3322' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M286.5 77 L286.5 89' fill='none' stroke='#9c3322' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><rect x='177.5' y='79' width='8' height='8' fill='#9c3322' transform='rotate(45 181.5 83)'/><path d='M24 97 L304 97' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><path d='M24 94 L24 100' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='24' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='middle'>$52,000 </text><path d='M94 94 L94 100' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='94' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='middle'>$54,000 </text><path d='M164 94 L164 100' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='164' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='middle'>$56,000 </text><path d='M234 94 L234 100' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='234' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='middle'>$58,000 </text><path d='M304 94 L304 100' fill='none' stroke='#4a3f31' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'/><text x='304' y='110' font-family='Cormorant Garamond,Georgia,serif' font-size='9' font-weight='700' fill='#4a3f31' text-anchor='middle'>$60,000 </text><rect x='8' y='115' width='304' height='18' rx='3' fill='#16294a'/><text x='160' y='128' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#f3e3bd' text-anchor='middle'>Ranges overlap: you cannot yet say one is bigger. </text><text x='8' y='145' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>Top row: Census QuickFacts, checked September 24, 2026. </text></svg><figcaption><b>READ THE BARS</b>Each bar is a range.</figcaption></figure><p><strong>Ranges overlap?</strong> You cannot yet say one is bigger.</p><p class='small fill'>Census margins use 90 percent confidence. Many polls use 95. Write down the level. Find a margin at <a href='https://data.census.gov' target='_blank' rel='noopener'>data.census.gov</a>.</p></div><div class='num'>&middot; 41 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>One number, four questions</h3><table class='stages'><thead><tr><th>ASK</th><th>WHY</th></tr></thead><tbody><tr><th>Who collected it?</th><td>A government office, a university, or a company with something to sell?</td></tr><tr><th>When?</th><td>Find the year. An old number can mislead.</td></tr><tr><th>How?</th><td>A count of everyone, or a sample? How many, and how chosen?</td></tr><tr><th>In what units?</th><td>People, percent, or dollars? For which year?</td></tr></tbody></table><div class='card2 try' style='margin-top:1.2cqw'><div class='k'>TRY IT</div><p>A site says most Hialeah teens sleep five hours. No source, no year. Use it?</p><p class='small ans' role='button' tabindex='0' aria-label='Show the answer' aria-expanded='false' style='margin-top:.6cqw'>Not yet. It gives only the units, hours. Who collected it, when, and how are missing.</p></div></div><div class='num'>&middot; 42 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3><span class='S'>Use a number in your argument</span><span class='R'>Someone else's data for your study</span><span class='P'>Numbers for your course</span></h3><div class='S'><p>A number in your argument needs its source in the same sentence.</p><div class='twocol' style='margin-top:1cqw'><div class='card2 weak'><div class='k'>WEAK</div><p>Many Hialeah families earn little.<br>No source, no number, no year.</p></div><div class='card2 good'><div class='k'>STRONG</div><p>The Census Bureau puts Hialeah's median household income at $55,594, for 2020 to 2024.</p></div></div><p class='small fill'>Say who collected it, and when. Then add your citation.</p></div><div class='R'><p>Someone else's data can be your study's data, if you analyze it in a new way. Repeating their numbers is not a study. Talk to me first.</p><table class='stages'><thead><tr><th>NAME THESE</th><th>FOR EXAMPLE</th></tr></thead><tbody><tr><th>1 The data set</th><td>Who collected it, when, and how.</td></tr><tr><th>2 Your variable</th><td>And its units.</td></tr><tr><th>3 Terms of use</th><td>An account? A credit line?</td></tr><tr><th>4 One limit</th><td>What the data cannot tell you.</td></tr></tbody></table><div class='card2 weak' style='margin-top:1.2cqw'><div class='k'>TOOLS THAT WRITE</div><p>No tool that writes may produce, summarize, or interpret your data. It may chart only data you collected and put together yourself.</p></div></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see how numbers work in your course. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div></div><div class='num'>&middot; 43 &middot;</div><div class='shade'></div>","label":"Folio 9"},{"cls":"board chapter","label":"Folio 10","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>10</div><div class='ch-title'>Check it</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-test'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Check a source before you trust it: credible, relevant, and scholarly.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>Check before you trust</span><span class='ld' aria-hidden='true'></span><span class='pn'>44</span></li><li><span class='it'>Is it relevant?</span><span class='ld' aria-hidden='true'></span><span class='pn'>45</span></li><li><span class='it'>Scholarly or popular?</span><span class='ld' aria-hidden='true'></span><span class='pn'>46</span></li><li><span class='it'>Ad, retracted, or a post?</span><span class='ld' aria-hidden='true'></span><span class='pn'>47</span></li><li><span class='it'>Where does a news outlet stand?</span><span class='ld' aria-hidden='true'></span><span class='pn'>48</span></li></ul></div></div></div><div class='num ch-pn'>&middot; x &middot;</div><div class='shade'></div>"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><p class='folio'><svg class='femb' aria-hidden='true'><use href='#i-test'/></svg>FOLIO 10</p><h2>Check before you trust</h2><p>A made-up case: a site called Teen Sleep Facts says most teens sleep five hours.</p><figure class='plate'><div class='pl'><span>PLATE XXI</span><span>Four tabs</span></div><svg class='fig' viewBox='0 0 320 91' role='img' aria-label='Four tabs, left to right. 1, stop: Teen Sleep Facts, a made-up site. Before you read, ask who made this. 2, leave: open a new tab. 3, search: the site&#39;s name, plus the word about. 4, decide: a mattress company runs it. It sells something. Drop it, or check more.'><path d='M4 20 L4 6 Q4 2 9 2 L89 2 Q94 2 94 6 L94 20' fill='#16294a' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='15' cy='11.5' r='6.6' fill='#9c3322'/><text x='15' y='14.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='25' y='15.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878'>STOP </text><rect x='4' y='20' width='90' height='68' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='10' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Teen Sleep Facts, </text><text x='10' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>a made-up site. </text><text x='10' y='58' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Before you read, </text><text x='10' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>ask who made </text><text x='10' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>this. </text><path d='M94 20 L94 6 Q94 2 99 2 L151 2 Q156 2 156 6 L156 20' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='105' cy='11.5' r='6.6' fill='#9c3322'/><text x='105' y='14.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='115' y='15.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>LEAVE </text><rect x='94' y='20' width='62' height='68' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='100' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Open a </text><text x='100' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>new tab. </text><path d='M156 20 L156 6 Q156 2 161 2 L221 2 Q226 2 226 6 L226 20' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='167' cy='11.5' r='6.6' fill='#9c3322'/><text x='167' y='14.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='177' y='15.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>SEARCH </text><rect x='156' y='20' width='70' height='68' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='162' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The site&#39;s </text><text x='162' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>name, plus </text><text x='162' y='58' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>the word </text><text x='162' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>about. </text><path d='M226 20 L226 6 Q226 2 231 2 L311 2 Q316 2 316 6 L316 20' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='237' cy='11.5' r='6.6' fill='#9c3322'/><text x='237' y='14.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='247' y='15.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>DECIDE </text><rect x='226' y='20' width='90' height='68' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='232' y='34' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>A mattress </text><text x='232' y='46' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>company runs it. </text><text x='232' y='58' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>It sells something. </text><text x='232' y='70' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Drop it, or check </text><text x='232' y='82' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>more. </text></svg><figcaption><b>ACROSS</b>Check the site in new tabs, not on the site.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>NEW WORD &middot; LATERAL READING &middot; <span lang='es'>lectura lateral</span></div><p>Leaving a page to check it in new tabs. The Research Log, Folio 7, teaches the four steps.</p></div><p class='small fill'>To check one claim, try <a href='https://toolbox.google.com/factcheck/explorer' target='_blank' rel='noopener'>Google Fact Check Explorer</a>.</p></div><div class='num'>&middot; 44 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Is it relevant?</h3><p>A source can be true and still not help you. Relevant means it helps answer your question.</p><figure class='plate'><div class='pl'><span>PLATE XXII</span><span>Three questions</span></div><svg class='fig' viewBox='0 0 320 241.5' role='img' aria-label='A made-up case. Your topic: bench dividers at Miami bus stops. The source: a 1985 study of park bench shapes in Paris. Three questions, where to look, and this source&#39;s answer. 1, is it about my topic, or only near it? Look at the title and the abstract. Yes: benches with dividers. 2, does it match my place, group, or time? Look at who was studied, where, and when. No: Paris, 1985. 3, does it answer part of my question? Look at the conclusion. No: shapes only, not who uses them. Two NO answers: drop it, and find another.'><rect x='4' y='2' width='312' height='42' rx='3' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.1'/><text x='10' y='14' font-family='Space Mono,Courier New,monospace' font-size='9' font-weight='700' fill='#4a3f31'>A MADE-UP CASE </text><text x='10' y='26' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Your topic: bench dividers at Miami bus stops. </text><text x='10' y='38' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>The source: a 1985 study of park bench shapes in Paris. </text><text x='4' y='57' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>ASK </text><text x='146' y='57' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>LOOK AT </text><text x='238' y='57' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>THIS SOURCE </text><rect x='4' y='62' width='312' height='53' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.9'/><circle cx='12' cy='71' r='5.8' fill='#9c3322'/><text x='12' y='74.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='21' y='74.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Is it about my topic, or </text><text x='21' y='86.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>only near it? </text><text x='146' y='74.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The title and the </text><text x='146' y='86.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>abstract. </text><rect x='236' y='65.5' width='30' height='13' rx='2' fill='#245e55'/><text x='251' y='75' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>YES </text><text x='238' y='90' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>Benches with </text><text x='238' y='101.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>dividers. </text><rect x='4' y='118' width='312' height='41.5' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.9'/><circle cx='12' cy='127' r='5.8' fill='#9c3322'/><text x='12' y='130.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='21' y='130.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Does it match my place, </text><text x='21' y='142.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>group, or time? </text><text x='146' y='130.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Who was studied, </text><text x='146' y='142.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>where, and when. </text><rect x='236' y='121.5' width='30' height='13' rx='2' fill='#9c3322'/><text x='251' y='131' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>NO </text><text x='238' y='146' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>Paris, 1985. </text><rect x='4' y='162.5' width='312' height='53' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='0.9'/><circle cx='12' cy='171.5' r='5.8' fill='#9c3322'/><text x='12' y='174.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='21' y='175' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Does it answer part of my </text><text x='21' y='187' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>question? </text><text x='146' y='175' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The conclusion. </text><rect x='236' y='166' width='30' height='13' rx='2' fill='#9c3322'/><text x='251' y='175.5' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>NO </text><text x='238' y='190.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>Shapes only, not </text><text x='238' y='202' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31' font-style='italic'>who uses them. </text><rect x='4' y='219.5' width='312' height='19' rx='3' fill='#f6e4df' stroke='#9c3322' stroke-width='1.2'/><text x='160' y='233' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#9c3322' text-anchor='middle'>Two NO answers: drop it, and find another. </text></svg><figcaption><b>RELEVANT?</b>Ask all three before you keep a source.</figcaption></figure><p class='small fill'>The College Board scores relevance and credibility together. Check both.</p></div><div class='num'>&middot; 45 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Scholarly or popular?</h3><figure class='plate'><div class='pl'><span>PLATE XXIII</span><span>Scholarly or popular?</span></div><svg class='fig' viewBox='0 0 320 152' role='img' aria-label='Two page drawings, each with five numbered marks. Scholarly: 1, at the top, an abstract. 2, the author: a researcher, with a school or lab named. 3, inside: methods, data, and charts. 4, at the end: a long reference list. 5, peer reviewed: yes; in ERIC, Peer reviewed only finds these. Popular: 1, at the top, a headline and a photo, drawn as a crossed box. 2, a reporter, or no name. 3, stories and quotes. 4, few sources, or none. 5, peer reviewed: no.'><text x='80' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>SCHOLARLY </text><rect x='4' y='16' width='152' height='132' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='15' cy='26.5' r='6.6' fill='#9c3322'/><text x='15' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><rect x='24' y='19' width='124' height='15' rx='2' fill='#f3e3bd' stroke='#4a3f31' stroke-width='1'/><text x='30' y='30' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>ABSTRACT </text><circle cx='15' cy='43.5' r='6.6' fill='#9c3322'/><text x='15' y='46.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='26' y='47' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>A researcher, with a </text><text x='26' y='59' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>school or lab named </text><circle cx='15' cy='72.5' r='6.6' fill='#9c3322'/><text x='15' y='75.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='26' y='76' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Methods, data, </text><text x='26' y='88' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>and charts </text><circle cx='15' cy='101.5' r='6.6' fill='#9c3322'/><text x='15' y='104.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='26' y='105' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>A long reference list </text><circle cx='15' cy='118.5' r='6.6' fill='#9c3322'/><text x='15' y='121.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>5 </text><text x='26' y='122' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Peer reviewed: yes. </text><text x='26' y='134' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>ERIC: Peer reviewed only. </text><text x='240' y='10' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>POPULAR </text><rect x='164' y='16' width='152' height='132' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='175' cy='26.5' r='6.6' fill='#9c3322'/><text x='175' y='29.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='186' y='30' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>A headline </text><rect x='268' y='19' width='40' height='22' rx='1' fill='#fbf6ea' stroke='#4a3f31' stroke-width='1'/><path d='M268 19 L308 41' fill='none' stroke='#4a3f31' stroke-width='0.9' stroke-linecap='round' stroke-linejoin='round'/><path d='M308 19 L268 41' fill='none' stroke='#4a3f31' stroke-width='0.9' stroke-linecap='round' stroke-linejoin='round'/><text x='186' y='42' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>and a photo </text><circle cx='175' cy='56.5' r='6.6' fill='#9c3322'/><text x='175' y='59.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>2 </text><text x='186' y='60' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>A reporter, or no name </text><circle cx='175' cy='73.5' r='6.6' fill='#9c3322'/><text x='175' y='76.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='186' y='77' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Stories and quotes </text><circle cx='175' cy='90.5' r='6.6' fill='#9c3322'/><text x='175' y='93.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='186' y='94' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Few sources, or none </text><circle cx='175' cy='107.5' r='6.6' fill='#9c3322'/><text x='175' y='110.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>5 </text><text x='186' y='111' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Peer reviewed: no. </text></svg><figcaption><b>THE LOOK</b>Top, author, inside, end: the same five marks on each page.</figcaption></figure><div class='card2 S' style='margin-top:1.2cqw'><div class='k'>AP SEMINAR</div><p>The top score for your research report asks for mostly academic sources. News is good for local facts.</p></div><div class='card2 R' style='margin-top:1.2cqw'><div class='k'>AP RESEARCH</div><p>Your three key studies should be scholarly. A history study may show no data.</p></div><div class='card2 P' style='margin-top:1.2cqw'><div class='k'>PICK YOUR PERIOD</div><p>Pick your period inside the cover to see the note for your course. <button type='button' class='pj' data-jump='0'>Go to the cover</button></p></div><p class='small fill'>A journal you found only on Google? Ask me before you trust it.</p></div><div class='num'>&middot; 46 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Ad, retracted, or a post?</h3><p>Check these three before you trust them.</p><figure class='plate'><div class='pl'><span>PLATE XXIV</span><span>Small words, big change</span></div><svg class='fig' viewBox='0 0 320 139' role='img' aria-label='Two drawings. An ad: a made-up headline, Five Snacks That Help You Study, with a small tag that says Sponsored, circled. Ad, Advertisement, Sponsored, or Presented by, near the headline: a company made it to sell. Retracted: a made-up article title, Bench Bars Make Streets Safer, with a band across it that says Retracted. The journal took the article back. It is not evidence now. Line 6 of your log: no. A made-up headline and a made-up title.'><text x='4' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>AN AD </text><text x='164' y='11' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#9c3322'>RETRACTED </text><rect x='4' y='16' width='152' height='52' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><rect x='12' y='21' width='58' height='14' rx='2' fill='#fbf6ea' stroke='#4a3f31' stroke-width='0.9'/><text x='41' y='31.5' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='middle'>Sponsored </text><ellipse cx='41' cy='28.5' rx='36' ry='11' fill='none' stroke='#9c3322' stroke-width='1.5'/><text x='12' y='50' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>Five Snacks That </text><text x='12' y='62' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>Help You Study </text><rect x='164' y='16' width='152' height='52' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='172' y='29' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>Bench Bars Make </text><text x='172' y='41' font-family='Cormorant Garamond,Georgia,serif' font-size='11' font-weight='700' fill='#1f3a5a'>Streets Safer </text><g transform='rotate(-4 240 55)'><rect x='176' y='47' width='128' height='16' rx='2' fill='#9c3322'/><text x='240' y='59' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#fbf6ea' text-anchor='middle'>RETRACTED </text></g><text x='4' y='84' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>Ad, Advertisement, Sponsored, </text><text x='4' y='96' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>or Presented by, near the </text><text x='4' y='108' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>headline: a company made it to </text><text x='4' y='120' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>sell. </text><text x='164' y='84' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The journal took the article back. </text><text x='164' y='96' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>It is not evidence now. Line 6 of </text><text x='164' y='108' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>your log: no. </text><text x='4' y='134' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' font-style='italic'>A made-up headline and a made-up title. </text></svg><figcaption><b>LOOK SMALL</b>The mark is small. It changes everything.</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>A POST OR A VIDEO</div><p>A TikTok can point to a claim. Go upstream: find the study or report it came from, and read that.</p></div><p class='small fill'>More red flags: The Research Log, Folio 7.</p></div><div class='num'>&middot; 47 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Where does a news outlet stand?</h3><div class='twocol' style='margin-top:1cqw'><div class='card2 good'><div class='k'>ALLSIDES</div><p>Shows one news story from the left, the center, and the right, side by side. <a href='https://allsides.com' target='_blank' rel='noopener'>allsides.com</a></p></div><div class='card2 good'><div class='k'>AD FONTES MEDIA</div><p>Rates news outlets on bias and on reliability. Five free searches a day.</p></div></div><figure class='plate' style='margin-top:2.6cqw'><div class='pl'><span>PLATE XXV</span><span>Two scales</span></div><svg class='fig' viewBox='0 0 320 93' role='img' aria-label='Two scales for a news outlet. Across: leans left, center, leans right. Up: more reliable; down: less reliable. Four made-up outlets, each a letter in a small square. A leans left and sits high: more reliable. B leans left and sits low: less reliable. C is at the center and sits high: more reliable. D leans right and sits low: less reliable. Where it leans does not tell you if you can trust it.'><rect x='66' y='4' width='246' height='52' rx='2' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1'/><path d='M189 4 L189 56' fill='none' stroke='#b9a987' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/><path d='M189 63 L312 63' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M308.5 65 L312 63 L308.5 61' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M189 63 L66 63' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M69.5 61 L66 63 L69.5 65' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='66' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>leans left </text><text x='189' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='middle'>center </text><text x='312' y='75' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a' text-anchor='end'>leans right </text><path d='M56 56 L56 4' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M58 7.5 L56 4 L54 7.5' fill='none' stroke='#1f3a5a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/><text x='4' y='12' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>more </text><text x='4' y='23' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>reliable </text><text x='4' y='45' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>less </text><text x='4' y='56' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>reliable </text><rect x='85' y='10' width='14' height='14' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='92' y='20.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>A </text><rect x='117' y='37' width='14' height='14' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='124' y='47.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>B </text><rect x='196' y='10' width='14' height='14' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='203' y='20.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>C </text><rect x='279' y='37' width='14' height='14' rx='1.5' fill='#fbf6ea' stroke='#1f3a5a' stroke-width='1.2'/><text x='286' y='47.6' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='middle'>D </text><text x='4' y='89' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322'>Where it leans does not tell you if you can trust it. </text><text x='316' y='89' font-family='Cormorant Garamond,Georgia,serif' font-size='9.5' font-weight='600' fill='#4a3f31' text-anchor='end' font-style='italic'>Made-up outlets. </text></svg><figcaption><b>ASK BOTH</b>Where does it lean? Can you trust it?</figcaption></figure><div class='card2 ' style='margin-top:1.2cqw'><div class='k'>CHECK THE CHECKERS</div><p>Both are companies that sell services. Ask who rates the raters, too.</p></div></div><div class='num'>&middot; 48 &middot;</div><div class='shade'></div>","label":"Folio 10"},{"cls":"board chapter","label":"Folio 11","html":"<div class='chap'>{{GOLD}}<div class='ch-in'><div class='ch-top'>FOLIO</div><div class='ch-num'>11</div><div class='ch-title'>Read it and log it</div><svg class='ch-rule' viewBox='0 0 120 12' aria-hidden='true'><line x1='4' y1='6' x2='48' y2='6'/><path d='M60 1 l5 5 -5 5 -5 -5z'/><line x1='72' y1='6' x2='116' y2='6'/></svg><svg class='ch-icon' aria-hidden='true'><use href='#i-eye'/></svg><div class='ch-target'><div class='k'>BY THE END</div><p>Read a source in the right order, take notes in your own words, and log it the same day.</p></div><div class='ch-inside'><div class='k'>INSIDE</div><ul><li><span class='it'>One source, start to finish</span><span class='ld' aria-hidden='true'></span><span class='pn'>49</span></li><li><span class='it'>Read a study in this order</span><span class='ld' aria-hidden='true'></span><span class='pn'>50</span></li><li><span class='it'>Notes in your own words</span><span clas .6' fill='#9c3322'/><text x='15' y='96.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='26' y='97' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>LOG </text><text x='10' y='111' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The six lines, in </text><text x='10' y='123' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>your notebook, </text><text x='10' y='135' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>today. </text><rect x='112' y='82' width='96' height='62' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='123' cy='93' r='6.6' fill='#9c3322'/><text x='123' y='96.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>5 </text><text x='134' y='97' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a'>CITE </text><text x='118' y='111' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>The full citation, </text><text x='118' y='123' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>one style, in your </text><text x='118' y='135' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='600' fill='#4a3f31'>list. </text><rect x='220' y='82' width='96' height='62' rx='4' fill='#16294a'/><circle cx='231' cy='93' r='6.6' fill='#9c3322'/><text x='231' y='96.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>6 </text><text x='242' y='97' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#e8c878'>CHECK </text><text x='226' y='111' font-family='Cormorant G ='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M4.5 39.9 L3.5 35 L-0.2 38.3' fill='none' stroke='#9c3322' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='160' y='170' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#9c3322' text-anchor='middle' font-style='italic'>Then the next source: five sources, five times through. </text></svg><figcaption><b>ONE AT A TIME</b>Finish one source before you start the next.</figcaption></figure><p class='small fill'>Five sources means five times through. Skip no step.</p></div><div class='num'>&middot; 49 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Read a study in this order</h3><p>Do not read a study from top to bottom. Read the outside first, then the middle.</p><figure class='plate'><div class='pl'><span>PLATE XXVII</span><span>Outside first</span></div><svg class='fig' viewBox='0 0 320 174' role='img' aria-label='The six parts of a study, top to bottom, in the order they are printed, each with a number for the order you read it. Outside: title and abstract, read first: is it about my question? Introduction, second: the question, and why it matters. Middle, shaded: methods, fifth: what they did. Results, tables and charts, fourth: the numbers. Outside: discussion and conclusion, third: what they found, and what it means. References, sixth: your next sources.'><rect x='66' y='4' width='140' height='25' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='73' y='20.2' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Title and abstract </text><circle cx='218' cy='16.5' r='6.6' fill='#9c3322'/><text x='218' y='19.8' font-family='Space Mono,Courier New,monospace' font-size= o,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>4 </text><text x='230' y='104' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>The numbers. </text><rect x='66' y='116' width='140' height='25' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='73' y='132.2' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>Discussion and conclusion </text><circle cx='218' cy='128.5' r='6.6' fill='#9c3322'/><text x='218' y='131.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>3 </text><text x='230' y='126.4' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>What they found, </text><text x='230' y='137.6' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>and what it means. </text><rect x='66' y='144' width='140' height='25' rx='3' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><text x='73' y='160.2' font-family='Cormorant Garamond,Georgia,serif' font-size='10.5' font-weight='700' fill='#1f3a5a'>References </text><circle cx='218' cy='156.5' r='6.6' fill='#9c3322'/><text x='218' y='159.8' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>6 </text><text x='230' y='160' font-family='Cormorant Garamond,Georgia,serif' font-size='10' font-weight='600' fill='#4a3f31'>Your next sources. </text><path d='M61 6 L61 55' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='56' y='33.9' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>OUTSIDE </text><path d='M61 62 L61 111' fill='none' stroke='#4a3f31' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='56' y='89.9' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#4a3f31' text-anchor='end'>MIDDLE </text><path d='M61 118 L61 167' fill='none' stroke='#1f3a5a' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/><text x='56' y='145.9' font-family='Space Mono,Courier New,monospace' font-size='10' font-weight='700' fill='#1f3a5a' text-anchor='end'>OUTSIDE </text></svg><figcaption><b>READ BY NUMBER</b>The middle parts are shaded. In AP Research, read Methods closely.</figcaption></figure><p class='small fill'>FIRST STEP: read parts 1 and 3. Off topic? Pick another result. No Methods part? It is an argument: read its first and last paragraphs.</p></div><div class='num'>&middot; 50 &middot;</div><div class='shade'></div>","label":"Folio 11"},{"cls":"paper","html":"<div class='grainlayer grain'></div><div class='pg'><div class='head'><span>THE RESEARCH MANUAL</span><span>{{SHORT}}{{PHEAD}}</span></div><h3>Notes in your own words</h3><p>Copying sentences is not taking notes. Do this for each part you want to use.</p><figure class='plate'><div class='pl'><span>PLATE XXVIII</span><span>One note, six steps</span></div><svg class='fig' viewBox='0 0 320 153' role='img' aria-label='Six steps for one part of a source, in two rows, each with a small picture. 1, read: read the part twice; two eyes. 2, cover: switch tabs, or turn the page; a sheet over the page. 3, write: what you remember, in your words; a pen. 4, check: against the original; same meaning? a clipboard with checks. 5, quote: kept exact words? quotation marks. 6, page: write the page number; a page with the number 12.'><g class='pop d1'><rect x='4' y='4' width='98' height='66' rx='4' fill='#fffdf6' stroke='#1f3a5a' stroke-width='1.2'/><circle cx='15' cy='15' r='6.6' fill='#9c3322'/><text x='15' y='18.3' font-family='Space Mono,Courier New,monospace' font-size='9.5' font-weight='700' fill='#ffffff' text-anchor='middle'>1 </text><text x='26' y='19' font-family='Space Mono,Courier New,monospace'
