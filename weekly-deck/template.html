<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>__TITLE__</title><style>
/*FONTS*/
/* Room 63 weekly deck. Shell structure follows the Room 63 weekly sites of November 2 and 9 (day tabs, route and jump controls, timer, Sources and Library panels).
   Look: DESIGN.md of the Room 63 Search Guide. Paper ceiling for this deck is #f6efd8. */
:root{
--paper:#f6efd8;--paper-2:#f3ead6;--ground:#ece4d2;--ink:#1d1812;--ink-soft:#4a3f31;--hair:#c9b996;--edge:#7d6a45;--brass-text:#6d4f14;--brass:#d6ad55;--pine:#245e55;--on-pine:#fbf7ee;--oxide:#9c3322;
--night:#07201b;--night-card:#0f2a25;--night-card-2:#15392f;--night-ink:#f3ead6;--night-soft:#c9bb9c;--night-hair:#2f5a50;--night-edge:#b8995a;--night-brass:#e2b964;--night-pine:#7fd1c0;--night-focus:#f0c56a;
--fd:Fraunces,Georgia,'Times New Roman',serif;--fb:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;--fm:'Space Mono','Courier New',ui-monospace,monospace;
--zoom:1;--u:clamp(8px,min(.85vw,1.5vh),18px);
--t-title:clamp(28px,min(3.4vw,6vh),78px);--t-body:clamp(18px,min(1.95vw,3.5vh),44px);--t-label:clamp(16px,min(1.05vw,1.9vh),24px);
color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--night-ink)}
body{font-family:var(--fb);font-weight:400;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;font-variant-numeric:lining-nums}
::selection{background:var(--brass);color:var(--ink)}
a{color:var(--night-pine);text-underline-offset:.18em}
button,select{font:700 16px var(--fm);min-height:44px;min-width:44px;background:var(--night-card);color:var(--night-ink);border:1.5px solid var(--night-edge);border-radius:6px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation}
select{display:inline-block}
button:hover,select:hover{border-color:var(--night-brass)}
button:focus-visible,select:focus-visible,a:focus-visible,#main:focus-visible{outline:3px solid var(--night-focus);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.primary{background:var(--brass);color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--night-edge)}
button.primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--night-edge)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* header */
header#bar{flex:none;min-height:68px;padding:10px 2vw;display:flex;gap:10px;align-items:center;background:var(--night-card);border-bottom:1px solid var(--night-hair)}
#brand{font:700 16px var(--fm);letter-spacing:.08em;color:var(--night-brass);white-space:nowrap;margin-right:6px}
#days{display:flex;gap:6px}
#days button{flex-direction:column;gap:0;line-height:1.15;padding:4px 12px;font-size:16px}
#days button span{font-weight:400;font-size:16px;color:var(--night-soft)}
#days button[aria-pressed=true]{background:var(--night-card-2);border-color:var(--night-brass);color:var(--night-brass);box-shadow:inset 0 -4px 0 var(--night-brass)}
#route{margin-left:auto;max-width:280px}
/* stage */
#main{flex:1 1 auto;min-height:0;padding:14px 2.2vw 16px;overflow:auto;position:relative}
#content{height:100%}
/* footer controls */
footer#controls{flex:none;min-height:72px;padding:10px 2vw;display:flex;gap:10px;align-items:center;background:var(--night-card);border-top:1px solid var(--night-hair)}
#progress{font:700 18px var(--fm);color:var(--night-ink);min-width:150px}
#timer{font:700 30px var(--fm);color:var(--night-brass);min-width:110px;text-align:center;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px}
#timer.warn{background:var(--night-brass);color:var(--night)}
#timer.done{background:var(--oxide);color:var(--on-pine)}
#jump{max-width:360px;margin-left:auto}
/* ===== slides ===== */
.slide{position:relative;height:100%;min-height:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--night-edge);padding:calc(var(--u)*3.4) calc(var(--u)*7.4) calc(var(--u)*6.8) calc(var(--u)*5.6);display:flex;flex-direction:column;overflow:hidden}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*1.25);background:var(--pine);border-radius:4px 0 0 4px}
.slide .seal{position:absolute;top:calc(var(--u)*2);right:calc(var(--u)*2.2);width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);color:var(--ink)}
.slide .seal svg{width:100%;height:100%;display:block}
.slide .seal text{font-family:var(--fd);font-weight:900;fill:currentColor}
.slide h2,.slide h1{font-family:var(--fd);font-weight:700;font-size:calc(var(--t-title)*var(--zoom));line-height:1.06;letter-spacing:-.01em;margin:0;max-width:24ch;text-wrap:balance}
.slide .rule{height:calc(var(--u)*.42);min-height:4px;background:var(--brass);margin:calc(var(--u)*1.3) 0 calc(var(--u)*.35);border:0}
.slide .hairline{height:1px;background:var(--hair);margin:0 0 calc(var(--u)*1.2)}
.slide .slug{font:700 calc(var(--t-label)*var(--zoom))/1.35 var(--fm);letter-spacing:.06em;color:var(--brass-text);margin:0 0 calc(var(--u)*1.2)}
.slide .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
.lines{list-style:none;margin:0;padding:0;max-width:50ch}
.lines li{font-size:calc(var(--t-body)*var(--zoom));line-height:1.3;padding:.42em 0;border-bottom:1px solid var(--hair);text-wrap:pretty}
.lines li:last-child{border-bottom:0}
.statement .lines li{font-family:var(--fd);font-weight:600;font-size:calc(var(--t-body)*1.45*var(--zoom));line-height:1.2;border:0;max-width:26ch}
.deckfoot{font:400 calc(var(--t-label)*var(--zoom))/1.4 var(--fm);color:var(--ink-soft);margin:calc(var(--u)*1) 0 0}
.source{font:400 calc(var(--t-label)*var(--zoom))/1.45 var(--fm);color:var(--ink);background:var(--paper-2);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:.6em .9em;margin:calc(var(--u)*1.2) 0 0;max-width:110ch}
.source b{font-weight:700;color:var(--brass-text);letter-spacing:.06em}
.sfoot{position:absolute;left:calc(var(--u)*5.6);right:calc(var(--u)*2.4);bottom:calc(var(--u)*1.5);display:flex;justify-content:space-between;gap:1em;font:700 calc(var(--t-label)*var(--zoom))/1.3 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);border-top:1px solid var(--hair);padding-top:.55em}
.sfoot span:last-child{white-space:nowrap}
/* night: cover and section openers */
.slide.night{background:var(--night);color:var(--night-ink);border-color:var(--night-edge);box-shadow:6px 6px 0 var(--night-card-2)}
.slide.night::after{content:"";position:absolute;left:calc(var(--u)*1.25);top:0;bottom:0;width:2px;background:var(--night-edge)}
.slide.night .seal{color:var(--night-brass)}
.slide.night .rule{background:var(--night-brass)}
.slide.night .slug{color:var(--night-brass)}
.slide.night .lines li{border-color:var(--night-hair)}
.slide.night .deckfoot,.slide.night .sfoot{color:var(--night-soft);border-color:var(--night-hair)}
.slide.cover h1{font-size:calc(var(--t-title)*1.4*var(--zoom));font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.slide.cover .sub,.slide.opener .sub{font-family:var(--fd);font-weight:500;font-size:calc(var(--t-title)*.72*var(--zoom));color:var(--night-brass);margin:calc(var(--u)*.6) 0 0;line-height:1.15}
.slide.cover .lines li{font-size:calc(var(--t-body)*.86*var(--zoom))}
.slide.opener .body{justify-content:flex-end}
.slide.opener h1{font-size:calc(var(--t-title)*1.3*var(--zoom));font-weight:900}
.slide.opener .when{font:700 calc(var(--t-body)*.8*var(--zoom))/1.4 var(--fm);color:var(--night-ink);margin:0}
/* pair: two deck slides side by side */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.4);flex:1 1 auto;min-height:0;align-content:center}
.pair section{border:1px solid var(--hair);border-top:4px solid var(--brass);background:var(--paper-2);border-radius:0 0 6px 6px;padding:calc(var(--u)*1.4) calc(var(--u)*1.6)}
.pair h3{font:700 calc(var(--t-title)*.6*var(--zoom))/1.1 var(--fd);margin:0 0 calc(var(--u)*.8)}
.pair .lines li{font-size:calc(var(--t-body)*.84*var(--zoom))}
/* guest */
.guest{display:grid;grid-template-columns:minmax(0,30%) 1fr;gap:calc(var(--u)*3.2);align-items:center;flex:1 1 auto}
.plate{aspect-ratio:1;background:var(--brass);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:900 calc(var(--t-title)*2.1*var(--zoom))/1 var(--fd);letter-spacing:.02em;max-height:52vh}
.guest .aff{font-size:calc(var(--t-body)*1.05*var(--zoom));font-weight:700;line-height:1.25;margin:0 0 .5em;max-width:40ch}
.guest .topic{font-size:calc(var(--t-body)*var(--zoom));font-style:italic;line-height:1.3;margin:0 0 .7em;max-width:44ch}
.guest .when{font:700 calc(var(--t-body)*.86*var(--zoom))/1.35 var(--fm);color:var(--brass-text);margin:0;border-top:1px solid var(--hair);padding-top:.5em}
/* cards: practice tiers and absent work */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*1.6);flex:1 1 auto;min-height:0;align-content:center}
.tier{background:var(--paper-2);border:1.5px solid var(--edge);border-radius:6px;padding:calc(var(--u)*1.2) calc(var(--u)*1.3);display:flex;flex-direction:column}
.tier h3{font:700 calc(var(--t-title)*.5*var(--zoom))/1.1 var(--fd);margin:0 0 .3em}
.tier .lines li{font-size:calc(var(--t-body)*.74*var(--zoom));padding:.3em 0}
.tags{list-style:none;margin:auto 0 0;padding:.6em 0 0;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:.35em .8em;font:700 calc(var(--t-label)*.9*var(--zoom))/1.35 var(--fm);color:var(--brass-text)}
.tags li{white-space:normal}
.absent .lines li{font-size:calc(var(--t-body)*.86*var(--zoom))}
.note{border:1.5px solid var(--oxide);border-radius:6px;padding:.5em .8em;font-size:calc(var(--t-body)*.72*var(--zoom));margin:calc(var(--u)*1) 0 0;max-width:60ch;color:var(--ink)}
.mats{list-style:none;margin:calc(var(--u)*1) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.4em 1.2em;font:400 calc(var(--t-label)*var(--zoom))/1.4 var(--fm)}
.mats a{color:var(--pine)}
/* day home (night) */
.home{max-width:1500px;margin:0 auto;padding:calc(var(--u)*2) calc(var(--u)*1)}
.home h1{font:900 clamp(32px,min(4.6vw,8vh),96px)/1.02 var(--fd);text-transform:uppercase;margin:0;letter-spacing:.01em}
.home .rule{height:5px;background:var(--night-brass);margin:16px 0 10px;max-width:640px}
.home .slug{font:700 clamp(16px,1.2vw,24px)/1.4 var(--fm);letter-spacing:.06em;color:var(--night-brass);margin:0 0 24px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:0 0 28px}
.choice{display:flex;flex-direction:column;gap:6px;padding:20px 20px 22px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--night-edge);text-decoration:none;min-height:44px}
.choice:hover{box-shadow:6px 6px 0 var(--night-brass)}
.choice b{font:700 clamp(24px,2vw,40px)/1.1 var(--fd)}
.choice .c{font:700 clamp(16px,1vw,20px)/1.4 var(--fm);color:var(--brass-text);letter-spacing:.04em}
.choice .l{font-size:clamp(18px,1.3vw,26px);line-height:1.3}
.choice .g{font-size:clamp(16px,1.05vw,21px);line-height:1.35;border-top:1px solid var(--hair);padding-top:8px;margin-top:4px}
.homenote{background:var(--night-card);border-top:1px solid var(--night-hair);border-bottom:1px solid var(--night-hair);padding:14px 18px;margin:0 0 16px;font-size:clamp(17px,1.15vw,24px);line-height:1.45;max-width:110ch}
.homenote b{font-family:var(--fm);color:var(--night-brass);letter-spacing:.05em}
.fricard{max-width:900px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--night-edge);padding:28px 32px 28px 44px;position:relative}
.fricard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--pine);border-radius:4px 0 0 4px}
.fricard h2{font:700 clamp(28px,3vw,60px)/1.1 var(--fd);margin:0}
.fricard .rule{background:var(--brass);max-width:none}
.fricard p{font-size:clamp(20px,2vw,40px);margin:.35em 0}
/* panels */
.panel{position:fixed;inset:4vh 4vw;background:var(--night-card);color:var(--night-ink);border:2px solid var(--night-brass);border-radius:6px;padding:0 28px 28px;overflow:auto;z-index:30;box-shadow:0 0 0 100vmax rgba(7,32,27,.86)}
.panel[hidden]{display:none}
.phead{position:sticky;top:0;background:var(--night-card);display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:18px 0 12px;border-bottom:1px solid var(--night-hair);z-index:1}
.phead h2{font:700 30px var(--fd);margin:0 auto 0 0}
.panel h3{font:700 24px var(--fd);color:var(--night-brass);margin:26px 0 8px}
.panel p,.panel li{font-size:19px;line-height:1.45}
.plist{list-style:none;padding:0;margin:0}
.plist li{padding:10px 0;border-bottom:1px solid var(--night-hair)}
.plist a{font-size:19px}
.meta{display:block;font:400 16px/1.5 var(--fm);color:var(--night-soft)}
.ag{list-style:none;padding:0;margin:8px 0 0}
.ag li{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--night-hair)}
.ag li.now{background:var(--night-card-2)}
.ag .t{font:700 17px var(--fm);color:var(--night-brass);font-variant-numeric:tabular-nums}
.ag .k{font:700 16px var(--fm);color:var(--night-soft);text-transform:uppercase;letter-spacing:.05em}
.ag button{min-height:44px;font-size:16px}
.ltabs{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.ltabs button[aria-selected=true]{border-color:var(--night-brass);color:var(--night-brass);box-shadow:inset 0 -4px 0 var(--night-brass)}
#blk{position:fixed;inset:0;background:#000;z-index:50;cursor:none}
#blk[hidden]{display:none}
#print{display:none}
#nl-badge-frame{display:none!important}
/* ===== phone and tablet ===== */
@media (max-width:900px){
 body{overflow:hidden}
 header#bar{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,44px);gap:6px;padding:6px 8px}
 #brand,#full,.btxt{display:none}
 #days{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
 #days button{min-width:0;padding:2px 2px;font-size:16px}
 #days button span{font-size:16px}
 #route{max-width:none;width:100%;min-width:0;margin:0}
 header#bar button{padding:0;justify-content:center}
 #main{padding:10px 10px 14px;overflow:auto}
 #content{height:auto;min-height:100%}
 .slide{height:auto;min-height:100%;padding:20px 16px 16px 26px;overflow:visible;box-shadow:4px 4px 0 var(--night-edge);--zoom:1!important}
 .slide::before{width:10px}
 .slide.night::after{left:10px}
 .slide .seal{width:44px;height:44px;top:12px;right:12px}
 .slide h2,.slide h1{padding-right:50px;font-size:28px}
 .slide.cover h1,.slide.opener h1{font-size:36px}
 .slide.cover .sub,.slide.opener .sub{font-size:24px}
 .slide .rule{margin:12px 0 6px}
 .slide .slug,.deckfoot,.source,.mats,.tags,.sfoot{font-size:16px}
 .lines li,.pair .lines li,.tier .lines li,.absent .lines li,.slide.cover .lines li{font-size:19px}
 .statement .lines li{font-size:24px}
 .note,.guest .topic{font-size:18px}
 .guest .aff{font-size:20px}
 .guest .when,.slide.opener .when{font-size:17px}
 .slide .body{justify-content:flex-start}
 .pair,.tiers,.guest{display:flex;flex-direction:column;gap:14px}
 .pair h3,.tier h3{font-size:22px}
 .plate{width:120px;font-size:52px;box-shadow:4px 4px 0 var(--ink)}
 .sfoot{position:static;margin-top:18px;flex-wrap:wrap}
 .home h1{font-size:34px}
 .choices{grid-template-columns:1fr;gap:14px}
 .choice b{font-size:26px}
 footer#controls{display:grid;grid-template-columns:auto 1fr 44px 44px;grid-template-rows:auto auto;gap:6px;padding:6px 8px}
 #progress{min-width:0;font-size:16px}
 #timer{font-size:22px;min-width:0}
 #jump{grid-column:1/3;max-width:none;width:100%;min-width:0;margin:0}
 #prev,#next{grid-row:2;padding:0 10px}
 #prev{grid-column:3/4}#next{grid-column:4/5}
 footer#controls #prev .btxt,footer#controls #next .btxt{display:none}
 .panel{inset:2vh 2vw;padding:0 14px 18px}
 .phead h2{font-size:24px}
 .ag li{grid-template-columns:1fr;gap:2px}
 .panel p,.panel li,.plist a{font-size:17px}
}
@media (max-width:900px) and (min-width:600px){.choices{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== print: one slide per landscape page, lights on ===== */
@media print{
 @page{size:13.333in 7.5in;margin:0}
 html,body{height:auto;overflow:visible;background:#fff;display:block}
 header#bar,#main,footer#controls,.panel,#blk{display:none!important}
 #print{display:block}
 #print .slide{width:13.333in;height:7.5in;min-height:0;break-after:page;page-break-after:always;border:0;border-radius:0;box-shadow:none;background:#fff;color:var(--ink);
  --u:9pt;--t-title:34pt;--t-body:19pt;--t-label:10.5pt;--zoom:1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print .slide.night{background:#fff;color:var(--ink)}
 #print .slide.night::after{background:var(--edge)}
 #print .slide.night .seal,#print .slide.night .sub,#print .slide.night .slug{color:var(--brass-text)}
 #print .slide.night .rule{background:var(--brass)}
 #print .slide.night .lines li{border-color:var(--hair)}
 #print .slide.night .deckfoot,#print .slide.night .sfoot,#print .slide.night .when{color:var(--ink-soft);border-color:var(--hair)}
 #print .pair section,#print .tier,#print .source{background:#fff}
 #print .home,#print .home *{color:var(--ink)!important}
 #print .home .homenote{background:#fff;border-color:var(--hair)}
}
</style></head><body>
<header id="bar"><span id="brand">ROOM 63</span><nav id="days" aria-label="Choose a day"></nav><select id="route" aria-label="Choose period"></select>
<button id="home" aria-label="Periods"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="btxt">Periods</span></button>
<button id="agbtn" aria-label="Agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="btxt">Agenda</span></button>
<button id="resbtn" aria-label="Sources"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="btxt">Sources</span></button>
<button id="libbtn" aria-label="Library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg><span class="btxt">Library</span></button>
<button id="full" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span class="btxt" id="fulltxt">Full screen</span></button>
</header>
<main id="main" tabindex="-1"><h1 class="vh">Room 63 class slides</h1><div id="content"></div></main>
<footer id="controls"><span id="progress"></span><span id="timer" role="timer" aria-label="Activity timer">00:00</span>
<button id="play" aria-label="Start timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg><span class="btxt" id="playtxt">Start</span></button>

<script id="deckdata" type="application/json">__DATA__</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('deckdata').textContent);
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=D.days, dayBy=id=>DAYS.find(d=>d.id===id);
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const clock=m=>{let h=Math.floor(m/60)%24,mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return {h:h+':'+String(mm).padStart(2,'0'),ap}};
const range=(a,b)=>{const x=clock(a),y=clock(b);return x.ap===y.ap?`${x.h}-${y.h} ${y.ap}`:`${x.h} ${x.ap}-${y.h} ${y.ap}`};
const bell=p=>{const b=D.bells[String(p)];return b?range(toMin(b[0]),toMin(b[1])):''};
const SEAL='<div class="seal" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="32" y="41" text-anchor="middle" font-size="24">63</text></svg></div>';
// routes: flatten segments into steps
const ROUTES=D.routes.map(r=>{const steps=[];let t=toMin(D.bells[String(r.period)][0]);r.segments.forEach((s,si)=>s.steps.forEach(st=>{steps.push({...st,seg:si,type:s.type,label:s.label,start:t,end:t+(st.minutes||0)});t+=st.minutes||0}));return {...r,id:r.day+'-p'+r.period,steps}});
const routeBy=(day,p)=>ROUTES.find(r=>r.day===day&&r.period===p);
const dayRoutes=day=>ROUTES.filter(r=>r.day===day).sort((a,b)=>a.period-b.period);
let cur={day:DAYS[0].id,route:null,i:0};
function lines(arr){return '<ul class="lines">'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function cite(id){const r=D.readings[id];if(!r)return '';return `<p class="source"><b>READING</b> ${esc(r.before)}<i>${esc(r.book)}</i>${esc(r.after)} ${esc(r.note)}</p>`}
function mats(r){const m=[...(D.materials.all||[]),...(D.materials[r.course]||[]),...(D.materials['P'+r.period]||[])];return m}
function foot(r,i,extra){const d=dayBy(r.day);const n=i===0?'Opening':String(i);return `<footer class="sfoot"><span>${esc(D.week.brand)} · ${esc(d.name.slice(0,3))} ${esc(d.date.replace('November','Nov'))} · P${r.period} ${esc(r.course)} · ${esc(bell(r.period))}${extra?' · '+esc(extra):''}</span><span>${esc(n)} / ${r.steps.length-1}</span></footer>`}
function tierCard(id,r){const p=D.practice[id];const rows=(p.rubric_rows||[]).join('; ');return `<section class="tier"><h3>${esc(p.tier[0].toUpperCase()+p.tier.slice(1))}</h3>${lines(p.lines)}<ul class="tags" aria-label="Tags"><li>Task: ${esc(p.task)}</li><li>Rubric: ${esc(rows)}</li><li>${esc(p.minutes)} min</li><li>DOK ${esc(p.dok)}</li></ul></section>`}
function slideHTML(r,i){
 const st=r.steps[i],d=dayBy(r.day);
 if(st.slide==='@practice'){return `<article class="slide card" aria-roledescription="slide">${SEAL}<h2>Practice: choose your tier</h2><div class="rule"></div><p class="slug">CORE · SUPPORTED · EXTENSION</p><div class="tiers">${(r.practice||[]).map(id=>tierCard(id,r)).join('')}</div>${foot(r,i)}</article>`}
 if(st.slide==='@absent'){const a=D.absent[r.absent]||{lines:[]};const ml=mats(r);return `<article class="slide card absent" aria-roledescription="slide">${SEAL}<h2>Absent work</h2><div class="rule"></div><p class="slug">SAME TASK AS CLASS · ${esc(d.name.toUpperCase())} · P${r.period}</p><div class="body">${lines(a.lines)}${a.guest_note?`<p class="note">${esc(a.guest_note)}</p>`:''}${a.reading?cite(a.reading):''}${ml.length?`<ul class="mats">${ml.map(m=>`<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a></li>`).join('')}</ul>`:''}</div>${foot(r,i)}</article>`}
 const s=D.slides[st.slide];if(!s)return '<article class="slide">Missing slide '+esc(st.slide)+'</article>';
 if(s.kind==='cover'){return `<article class="slide night cover" aria-roledescription="slide">${SEAL}<h1>${esc(s.title)}</h1>${s.subtitle?`<p class="sub">${esc(s.subtitle)}</p>`:''}<div class="rule"></div><div class="body">${lines(s.body)}${s.footer?`<p class="deckfoot">${esc(s.footer)}</p>`:''}</div>${foot(r,i)}</article>`}
 if(s.kind==='opener'){return `<article class="slide night opener" aria-roledescription="slide">${SEAL}<div class="body"><h1>${esc(s.title)}</h1><p class="sub">${esc(s.subtitle||'')}</p><div class="rule"></div><p class="when">${esc(d.name)}, ${esc(d.date)} · Period ${r.period} · ${esc(bell(r.period))}</p></div>${foot(r,i)}</article>`}
 if(s.kind==='guest'){const g=D.guests[s.guest];return `<article class="slide guestslide" aria-roledescription="slide">${SEAL}<h2>${esc(g.name)}</h2><div class="rule"></div><p class="slug">GUEST · ${esc((g.mode||'').toUpperCase())}</p><div class="guest"><div class="plate" aria-hidden="true">${esc(g.initials||'')}</div><div><p class="aff">${esc(g.affiliation)}</p><p class="topic">${esc(g.topic)}</p><p class="when">${esc(d.name)}, ${esc(d.date)} · ${esc(g.when)}${g.language?'<br>'+esc(g.language):''}</p></div></div>${foot(r,i)}</article>`}
 if(s.kind==='pair'){const a=D.slides[s.pair[0]],b=D.slides[s.pair[1]];const part=x=>`<section><h3>${esc(x.title)}</h3>${lines(x.body)}${x.footer?`<p class="deckfoot">${esc(x.footer)}</p>`:''}</section>`;return `<article class="slide pairslide" aria-roledescription="slide">${SEAL}<h2 class="vh">${esc(a.title)} and ${esc(b.title)}</h2><div class="pair">${part(a)}${part(b)}</div>${foot(r,i)}</article>`}
 const statement=s.body.length===1&&s.body[0].length<140;
 return `<article class="slide content${statement?' statement':''}" aria-roledescription="slide">${SEAL}<h2>${esc(s.title)}</h2><div class="rule"></div><div class="body">${lines(s.body)}${s.reading?cite(s.reading):''}</div>${s.footer?`<p class="deckfoot">${esc(s.footer)}</p>`:''}${foot(r,i)}</article>`;
}
function stepTitle(r,i){const st=r.steps[i];if(st.slide==='@practice')return 'Practice tiers';if(st.slide==='@absent')return 'Absent work';const s=D.slides[st.slide];if(s.kind==='guest')return 'Guest: '+D.guests[s.guest].name;if(s.kind==='pair')return D.slides[s.pair[0]].title+' + '+D.slides[s.pair[1]].title;return s.title}
function homeHTML(day){const d=dayBy(day);const rr=dayRoutes(day);
 let h=`<div class="home"><h1>${esc(d.name)}, ${esc(d.date)}</h1><div class="rule"></div><p class="slug">${esc(d.letter)} DAY · ${rr.length?'CHOOSE YOUR PERIOD':'NO CLASS ROUTES TODAY'}</p>`;
 if(d.card){h+=`<div class="fricard">${SEAL.replace('class="seal"','class="seal" style="position:absolute;top:16px;right:18px;width:56px;height:56px"')}<h2>${esc(d.card.title)}</h2><div class="rule"></div>${d.card.lines.map(x=>'<p>'+esc(x)+'</p>').join('')}</div>`}
 if(rr.length){h+='<div class="choices">'+rr.map(r=>`<a class="choice" href="#${r.day}/P${r.period}-0"><b>Period ${r.period}</b><span class="c">${esc(r.course)} · ${esc(bell(r.period))}</span><span class="l">${esc(r.label)}</span>${r.guest?`<span class="g">Guest: ${esc(D.guests[r.guest].name)}, ${esc(D.guests[r.guest].when)}</span>`:''}</a>`).join('')+'</div>'}
 const reads=[...new Set(rr.flatMap(r=>r.steps.map(st=>D.slides[st.slide]&&D.slides[st.slide].reading).filter(Boolean)))];
 reads.forEach(id=>{const x=D.readings[id];h+=`<p class="homenote"><b>READING</b> ${esc(x.before)}<i>${esc(x.book)}</i>${esc(x.after)} ${esc(x.note)}</p>`});
 return h+'</div>'}
function setTabs(){document.querySelectorAll('#days button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.day===cur.day)));const rr=dayRoutes(cur.day);$('route').innerHTML='<option value="">Choose period</option>'+rr.map(r=>`<option value="${r.period}">P${r.period} ${esc(r.course.replace('AP ',''))}</option>`).join('');$('route').value=cur.route?String(cur.route.period):''}
function go(hash,replace){const m=(hash||'').match(/^#?([a-z]{3})(?:\/p(\d)-(\d+))?\/?$/i);let day=m&&dayBy(m[1].toLowerCase())?m[1].toLowerCase():DAYS[0].id;let r=m&&m[2]?routeBy(day,Number(m[2])):null;if(r){show(r,Math.max(0,Math.min(Number(m[3]||0),r.steps.length-1)))}else home(day)}
function setHash(h){if(location.hash!==h)history.replaceState(null,'',h)}
function home(day){stop();cur={day,route:null,i:0};setTabs();$('content').innerHTML=homeHTML(day);$('progress').textContent='Choose period';$('jump').innerHTML='<option>Slide</option>';['prev','next','play','reset','jump','agbtn'].forEach(k=>$(k).disabled=true);remain=0;timerText();setHash('#'+day);document.title=D.week.brand+' | '+D.week.title+' | '+dayBy(day).name;renderPrint();$('main').scrollTop=0}
function show(r,i){stop();cur={day:r.day,route:r,i};setTabs();$('content').innerHTML=slideHTML(r,i);const st=r.steps[i];
 $('progress').textContent=`P${r.period} · ${i} / ${r.steps.length-1} · ends ${clock(st.end).h}`;
 $('jump').innerHTML=r.steps.map((s,j)=>`<option value="${j}"${j===i?' selected':''}>${j}. ${esc(stepTitle(r,j))}</option>`).join('');
 $('prev').disabled=i===0;$('next').disabled=i===r.steps.length-1;$('play').disabled=!st.minutes;$('reset').disabled=!st.minutes;$('jump').disabled=false;$('agbtn').disabled=false;
 tload();fit();$('main').scrollTop=0;setHash(`#${r.day}/P${r.period}-${i}`);document.title=`${D.week.brand} | ${dayBy(r.day).name} P${r.period} | ${stepTitle(r,i)}`;say(stepTitle(r,i)+'. Slide '+i+' of '+(r.steps.length-1));renderPrint();if(!$('agenda').hidden)agenda()}
function advance(n){if(!cur.route)return;const j=cur.i+n;if(j>=0&&j<cur.route.steps.length)show(cur.route,j)}
function fit(){const st=document.documentElement.style;st.setProperty('--zoom',1);if(!matchMedia('(min-width:901px)').matches)return;const sl=document.querySelector('#content .slide');if(!sl)return;const over=()=>sl.scrollHeight>sl.clientHeight+1||[...sl.querySelectorAll('.lines,.tiers,.pair,.guest')].some(e=>e.scrollHeight>e.clientHeight+1);let z=1;while(over()&&z>0.78){z=Math.round(z*100-2)/100;st.setProperty('--zoom',z)}}
// timer
let T={},remain=0,running=false,tick=null,endAt=0;try{T=JSON.parse(sessionStorage.getItem('r63-week-timer')||'{}')||{}}catch(_){T={}}
const tkey=()=>cur.route?D.week.id+'/'+cur.route.id+'/'+cur.i:'';const plan=()=>cur.route?(cur.route.steps[cur.i].minutes||0)*60:0;const left=()=>Math.max(0,Math.ceil((endAt-Date.now())/1000));
function tsave(){const k=tkey();if(!k)return;T[k]=running?{end:endAt}:{left:remain};try{sessionStorage.setItem('r63-week-timer',JSON.stringify(T))}catch(_){}}
function timerText(){const t=$('timer');t.textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');t.classList.toggle('warn',running&&remain>0&&remain<=60);t.classList.toggle('done',cur.route&&plan()>0&&remain===0);$('playtxt').textContent=running?'Pause':'Start';$('play').setAttribute('aria-label',running?'Pause timer':'Start timer')}
function run(){endAt=Date.now()+remain*1000;running=true;tsave();clearInterval(tick);tick=setInterval(()=>{const r=left();if(r===remain)return;if(remain>60&&r<=60&&r>0)say('One minute left');remain=r;if(!remain){stop();say('Time is up')}timerText()},250);timerText()}
function stop(){if(running)remain=left();clearInterval(tick);running=false;tsave();timerText()}
function tload(){const t=T[tkey()];remain=plan();if(t&&t.end){endAt=t.end;remain=left();if(remain>0){run();return}}else if(t&&typeof t.left==='number')remain=t.left;timerText()}
function say(t){const l=$('srlive');l.textContent='';setTimeout(()=>{l.textContent=t},60)}
// panels
let lastFocus=null;function openPanel(id){['agenda','res','lib'].forEach(k=>$(k).hidden=k!==id);lastFocus=document.activeElement;['bar','main','controls'].forEach(k=>$(k).inert=true);$(id).hidden=false;$(id).querySelector('.close').focus()}
function closePanels(){['agenda','res','lib'].forEach(k=>$(k).hidden=true);['bar','main','controls'].forEach(k=>$(k).inert=false);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function agenda(){const r=cur.route;if(!r)return;const segs=r.segments.map((s,si)=>{const st=r.steps.filter(x=>x.seg===si);const first=r.steps.indexOf(st[0]);return {s,first,a:st[0].start,b:st[st.length-1].end}});
 $('agbody').innerHTML=`<p>${esc(dayBy(r.day).name)}, ${esc(dayBy(r.day).date)} · Period ${r.period} · ${esc(r.course)} · ${esc(bell(r.period))}</p><ul class="ag">`+segs.map(x=>`<li class="${cur.i>=x.first&&r.steps[cur.i].seg===r.steps[x.first].seg?'now':''}"><span class="t">${x.b>x.a?esc(range(x.a,x.b)):'Any time'}</span><span>${esc(x.s.label)} <span class="k">${esc(x.s.type)}</span></span><button data-step="${x.first}">Go</button></li>`).join('')+'</ul>';
 $('agbody').querySelectorAll('button[data-step]').forEach(b=>b.onclick=()=>{closePanels();show(r,Number(b.dataset.step))})}
function resources(){const r=cur.route;let h='';const rr=r?[r]:dayRoutes(cur.day);
 const reads=[...new Set(ROUTES.flatMap(x=>x.steps.map(st=>D.slides[st.slide]&&D.slides[st.slide].reading).filter(Boolean)))];
 h+='<h3>Readings this week</h3><ul class="plist">'+reads.map(id=>{const x=D.readings[id];return `<li>${esc(x.before)}<i>${esc(x.book)}</i>${esc(x.after)} <span class="meta">${esc(x.note)}</span></li>`}).join('')+'</ul>';
 h+='<h3>'+(r?'Materials for P'+r.period:'Materials')+'</h3><ul class="plist">';const seen=new Set();rr.forEach(x=>mats(x).forEach(m=>{if(seen.has(m.url))return;seen.add(m.url);h+=`<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a></li>`}));h+='</ul>';
 h+='<h3>Absent work</h3><ul class="plist">'+rr.map(x=>`<li><a href="#${x.day}/P${x.period}-${x.steps.length-1}" class="pl">${esc(dayBy(x.day).name)} P${x.period}: absent work</a></li>`).join('')+'</ul>';
 const tasks=new Set(rr.flatMap(x=>(x.practice||[]).map(id=>D.practice[id].task)));tasks.forEach(t=>{const rb=D.rubric_rows&&D.rubric_rows[t];if(!rb)return;h+=`<h3>${esc(t)}: rubric rows used on the practice cards</h3><ul class="plist">`+Object.entries(rb.rows).map(([k,v])=>`<li><b>${esc(k)}.</b> ${esc(v)}</li>`).join('')+`</ul><p class="meta">${esc(rb.source)}</p>`});
 $('resbody').innerHTML=h;$('resbody').querySelectorAll('a.pl').forEach(a=>a.onclick=()=>closePanels())}
function library(){const tabs=[...Object.entries(D.guests).map(([id,g])=>({id,label:g.name,g})),...(D.library||[])];const tl=$('lib').querySelector('.ltabs');
 tl.innerHTML=tabs.map((t,k)=>`<button role="tab" id="lt-${esc(t.id)}" aria-controls="lp-${esc(t.id)}" aria-selected="${k===0}">${esc(t.label)}</button>`).join('');
 $('libbody').innerHTML=tabs.map((t,k)=>{let b='';if(t.g){const g=t.g;const rr=ROUTES.filter(r=>r.guest===t.id);b=`<h3>${esc(g.name)}</h3><p>${esc(g.affiliation)}</p><p>${esc(g.topic)}</p><p class="meta">${rr.map(r=>esc(dayBy(r.day).name)+', '+esc(dayBy(r.day).date)+' · P'+r.period+' '+esc(r.course)).join('; ')} · ${esc(g.when)}${g.language?' · '+esc(g.language):''}</p>`+(g.links&&g.links.length?'<ul class="plist">'+g.links.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join('')+'</ul>':'<p class="meta">No public page linked yet.</p>')}else{b=`<h3>${esc(t.label)}</h3>${t.intro?'<p>'+esc(t.intro)+'</p>':''}<ul class="plist">`+t.items.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>${l.note?'<span class="meta">'+esc(l.note)+'</span>':''}</li>`).join('')+'</ul>'}return `<div role="tabpanel" id="lp-${esc(t.id)}" aria-labelledby="lt-${esc(t.id)}"${k?' hidden':''}>${b}</div>`}).join('');
 tl.querySelectorAll('button').forEach(b=>b.onclick=()=>{tl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('libbody').querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!=='lp-'+b.id.slice(3));$('lib').scrollTop=0})}
function renderPrint(){const p=$('print');if(cur.route){p.innerHTML=cur.route.steps.map((_,j)=>slideHTML(cur.route,j)).join('')}else{p.innerHTML='<article class="slide">'+homeHTML(cur.day)+'</article>'}}
// wire up
$('days').innerHTML=DAYS.map(d=>`<button data-day="${d.id}" aria-pressed="false">${esc(d.name.slice(0,3))} <span>${esc(d.date.split(' ').pop())}</span></button>`).join('');
document.querySelectorAll('#days button').forEach(b=>b.onclick=()=>home(b.dataset.day));
$('route').onchange=e=>{const v=e.target.value;if(v)show(routeBy(cur.day,Number(v)),0)};
$('jump').onchange=e=>{if(cur.route)show(cur.route,Number(e.target.value))};
$('prev').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);
$('play').onclick=()=>{if(!cur.route)return;if(running){stop();return}if(remain<=0)remain=plan();run()};
$('reset').onclick=()=>{stop();remain=plan();tsave();timerText()};
$('home').onclick=()=>home(cur.day);
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};
document.addEventListener('fullscreenchange',()=>{$('fulltxt').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});
$('agbtn').onclick=()=>{agenda();openPanel('agenda')};$('resbtn').onclick=()=>{resources();openPanel('res')};$('libbtn').onclick=()=>openPanel('lib');
document.querySelectorAll('.panel .close').forEach(b=>b.onclick=closePanels);
$('blk').onclick=()=>{$('blk').hidden=true};
window.addEventListener('hashchange',()=>go(location.hash));
window.addEventListener('keydown',e=>{const open=['agenda','res','lib'].find(k=>!$(k).hidden);
 if(open){if(e.key==='Escape'){e.preventDefault();closePanels();return}if(e.key==='Tab'){const f=[...$(open).querySelectorAll('button,a[href]')].filter(x=>x.offsetParent);const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}if(e.target.getAttribute&&e.target.getAttribute('role')==='tab'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const t=[...$(open).querySelectorAll('[role=tab]')];const x=t[(t.indexOf(e.target)+(e.key==='ArrowRight'?1:-1)+t.length)%t.length];x.focus();x.click()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const tag=e.target.tagName;if(tag==='SELECT'&&['PageDown','PageUp'].includes(e.key)){e.preventDefault();e.target.blur();advance(e.key==='PageDown'?1:-1);return}
 if(['INPUT','SELECT','TEXTAREA'].includes(tag)||e.target.isContentEditable)return;
 if(tag==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();advance(1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();advance(-1)}
 else if(e.key==='Home'){e.preventDefault();home(cur.day)}
